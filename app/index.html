<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अभ्यास — flashcards</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Navigation in the top left corner, the mark in the top right.  During
     practice the exercise should dominate, so the branding is small and out
     of the way rather than centred over the card. -->
<div class="topbar">
  <button id="nav" class="navbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer">
    <span class="bars" aria-hidden="true"></span>
    <span id="nav-label">lists</span>
    <span class="nav-caret" aria-hidden="true"></span>
  </button>
  <!-- The whole logo lockup, exactly as the project's own artwork sets it —
       no separately hand-set wordmark beside it. -->
  <div class="brand">
    <!--logo-->
  </div>
</div>

<!-- What the list is, and how the round is going.  Wraps to two lines only
     where it has to. -->
<div class="statusbar">
  <div class="stage" id="stage"></div>
  <div class="tally" id="tally">
    <span><b id="t-left">0</b>left</span>
    <span><b id="t-knew">0</b>learned</span>
    <span class="miss"><b id="t-miss">0</b>missed</span>
  </div>
</div>
<button id="pile" class="pilebtn" hidden></button>

<div class="panel">
  <div class="card" id="card" tabindex="0" role="button" aria-label="Show meaning">
    <div class="seen-before" id="relearn" hidden>second look</div>
    <div class="dn" id="dn">…</div>
    <div class="iast" id="iast"></div>
    <div class="choices" id="choices" role="group" aria-label="Choose the answer" hidden></div>
    <div class="seq" id="seq" hidden>
      <div class="built" id="built" role="group" aria-label="The sentence you are building"></div>
      <div class="bank" id="bank" role="group" aria-label="Pieces to choose from"></div>
    </div>
    <div class="rule"></div>
    <div class="back" aria-live="polite">
      <div class="gloss" id="gloss"></div>
      <!-- The transliteration of the answer, when the answer is the
           Devanagari.  Its own line on the card: it used to be folded into
           the annotation below, where toggling IAST looked like it was
           editing the grammar. -->
      <div class="iast-back" id="iast-back"></div>
      <div class="tag" id="tag"></div>
      <div class="src" id="src"></div>
    </div>
  </div>

  <div class="review" id="review">
    <h2 id="r-title">Round finished</h2>
    <div class="score" id="r-score"></div>
    <div id="r-list"></div>
  </div>

  <div class="board" id="reviewpanel">
    <h2>Review</h2>
    <div class="score" id="rp-sub"></div>
    <div class="note" id="rp-note"></div>
  </div>

  <div class="board" id="trouble">
    <h2>Trouble cards</h2>
    <div class="score" id="t-sub"></div>
    <div class="note" id="t-note"></div>
    <div id="t-list"></div>
  </div>

  <div class="board" id="board">
    <h2>Scoreboard</h2>
    <div class="mastery" id="b-mastery" hidden>
      <span class="m-label">review mastery</span>
      <span class="m-pct" id="b-mpct"></span>
      <span class="m-sub" id="b-msub"></span>
    </div>
    <div class="score" id="b-sub"></div>
    <div id="b-list"></div>
  </div>
</div>

<div class="actions" id="grade" hidden>
  <button id="miss" class="miss">Didn't know it</button>
  <button id="knew" class="primary">Knew it</button>
</div>

<!-- A choice or sequence card grades itself from what was tapped, so it needs
     one button where a reveal card needs two. -->
<div class="actions" id="graded-next" hidden>
  <button id="g-next" class="primary">Next</button>
</div>

<!-- Assembling is done entirely by tapping: no dragging, no typing. -->
<div class="actions" id="seq-actions" hidden>
  <button id="s-back">Back</button>
  <button id="s-reset">Reset</button>
  <button id="s-check" class="primary">Check</button>
</div>

<div class="actions" id="panel-back" hidden>
  <button id="p-back">Back to the cards</button>
</div>

<div class="actions" id="rp-actions" hidden>
  <button id="rp-draw" class="primary"></button>
</div>

<div class="actions" id="t-actions" hidden>
  <button id="t-drill" class="primary">Practise these</button>
  <button id="t-copy">Copy the list</button>
</div>

<div class="actions" id="after" hidden>
  <button id="again-missed" class="primary">Practise these again</button>
  <button id="restart">Whole deck again</button>
  <button id="share">Share score</button>
</div>

<!-- Below the card, centred: these change how a card is shown, so they
     belong under the thing they change rather than above it. -->
<div class="controls" id="controls">
  <button id="dir" title="Tap to reverse"><span class="swap" aria-hidden="true">⇄</span><span id="dir-label">word → meaning</span></button>
  <label class="check" for="iast-on"><input type="checkbox" id="iast-on" checked> IAST</label>
</div>

<div class="keys" id="keys">tap / space — flip · 1 — didn't know · 2 — knew it</div>

<!-- Navigation: the five course tracks, each expanding to its lessons and
     their decks, with review, trouble and the scoreboard alongside.  A left
     drawer rather than a fixed sidebar — this page is used on a phone. -->
<div class="dveil" id="dveil" hidden></div>
<nav class="drawer" id="drawer" role="dialog" aria-modal="true"
     aria-label="Lists and progress" hidden>
  <div class="dr-top">
    <button id="dr-close" class="dr-x" aria-label="Close">×</button>
  </div>

  <div class="dr-prog" id="dr-prog">
    <span class="dp-label">course progress</span>
    <span class="dp-pct" id="dp-pct"></span>
    <span class="dp-sub" id="dp-sub"></span>
    <span class="bar"><i id="dp-bar"></i></span>
  </div>

  <div class="dr-modes">
    <button id="dr-board" class="dr-mode board">
      <span class="dm-name">Scoreboard</span>
      <span class="dm-sub" id="dm-board">best scores</span>
    </button>
    <button id="dr-review" class="dr-mode">
      <span class="dm-name">Review</span>
      <span class="dm-sub" id="dm-review">proof of mastery</span>
    </button>
    <button id="dr-trouble" class="dr-mode">
      <span class="dm-name">Trouble cards</span>
      <span class="dm-sub" id="dm-trouble">repeat offenders</span>
    </button>
  </div>

  <div class="dr-tracks" id="dr-tracks"></div>
</nav>

<div class="validate" id="validate"></div>

<div class="pop" id="pop" role="dialog" aria-label="What this annotation means" hidden></div>

<div class="veil" id="veil" hidden></div>
<div class="ask" id="ask" role="alertdialog" aria-modal="true" aria-labelledby="ask-msg" hidden>
  <p id="ask-msg"></p>
  <div class="ask-btns">
    <button id="ask-no">Keep going</button>
    <button id="ask-yes" class="primary">Leave it</button>
  </div>
</div>

<!-- Practice data, inlined by scripts/build.js from every lesson's practice.json.
     Empty here so this file still opens directly for layout work. -->
<script id="practice" type="application/json">{"lessons":[]}</script>

<script src="app.js"></script>
</body>
</html>
