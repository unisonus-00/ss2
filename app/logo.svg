  <circle cx="20" cy="10.4" r="1.7" fill="currentColor" stroke="none"/>
  <path d="M15.2 14.1 Q20 17.5 24.8 14.1" stroke-width="1.3"/>
  <path d="M24.6 19.3 Q26 24.4 22.4 30.6" stroke-width="1.2"/>
  <path d="M20.6 19.3h4M18.4 22.1h5.8M16.1 24.9h7.1M14.2 27.7h8.4M12.9 30.6h9.5"
        stroke-width="1.3"/>
