<!-- The Abhyāsaḥ mark, reduced for a ~32px slot: the seated figure and the
     stepped path, inside its ring.  Drawn rather than embedded so it stays
     one small piece of text in the distributable, scales on any screen, and
     takes its colour from the palette through currentColor. -->
