<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अभ्यास — flashcards</title>
<style>
  :root {
    /* This page paints its own dark ground and puts a deliberately light,
       palm-leaf card on top of it.  Without a declared scheme Chrome and
       Brave treat it as a light page they are free to auto-darken, and they
       repaint that card a muddy olive with inverted text.  Declaring the
       scheme opts the page out: the colours below are already the dark
       design, and nothing should second-guess them. */
    color-scheme: dark;
    --ground: #241f19;
    --leaf: #e9dcbe;
    --leaf-edge: #cdbb95;
    --ink: #322a20;
    --kumkuma: #a5341f;
    --faded: #7d705c;
    /* right answers.  kumkuma already means wrong everywhere on this page,
       so correctness gets the other pigment on the same shelf. */
    --patra: #4f6137;
  }
  * { box-sizing: border-box; }
  /* a class rule with display: outranks the UA's [hidden] rule — force it back */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--ground); color: var(--leaf);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
                 "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
    display: flex; flex-direction: column; align-items: center;
    padding: .9rem 1rem 3rem;
  }
  /* Everything above the card shares the card's width, so the brand, the
     selector and the caption all line up on its left edge. */
  .topbar, .statusbar, .controls { width: 100%; max-width: 440px; }
  /* Navigation left, mark right, on one row.  The list name is what the row
     is for, so it takes the space that is left and the brand never shrinks. */
  .topbar { display: flex; align-items: center; justify-content: space-between;
            gap: .6rem; margin-bottom: .5rem; }

  /* Present, but secondary to the exercise: about a fifth of the height the
     centred header took, and never in the way of the card.  One image now —
     the project's own logo lockup, wordmark and ring together — rather than
     a hand-set wordmark beside a cropped mark. */
  .brand { flex: none; }
  .brand-logo { display: block; height: 30px; width: auto; opacity: .92; }
  /* On a phone the bar is not wide enough for the full-size lockup and the
     longest list name, and the list name is what the bar is for.  Shrinking
     the lockup buys back the room rather than dropping any part of it — it
     is one image now, so there is no "mark alone" to fall back to. */
  @media (max-width: 400px) { .brand-logo { height: 22px; } }
  @media (max-width: 360px) { .brand-logo { height: 17px; } }

  /* the deck's descriptor on the left, the round's state on the right */
  .statusbar { display: flex; align-items: baseline; justify-content: space-between;
               gap: .3rem .9rem; flex-wrap: wrap; margin-bottom: .8rem; }
  /* The selector, left-aligned with the card.  It is a way in to the drawer,
     not a title, so it is a row control rather than a boxed imitation of the
     dropdown it replaced — the border would only add height here. */
  .navbtn {
    display: inline-flex; align-items: center; gap: .5rem;
    min-width: 0; flex: 0 1 auto; min-height: 44px; padding: .35rem .4rem .35rem 0;
    background: transparent; color: var(--leaf);
    border: 0; border-radius: 2px;
    font-family: inherit; font-size: .95rem; text-align: left; cursor: pointer;
  }
  .navbtn:hover { color: var(--leaf); }
  .navbtn:hover .bars, .navbtn:hover .nav-caret { border-color: var(--leaf); }
  #nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-caret {
    width: 5px; height: 5px; flex: none; margin-left: .05rem;
    border-right: 1px solid var(--faded); border-bottom: 1px solid var(--faded);
    transform: rotate(-45deg);
  }
  /* drawn rather than typed: a ☰ glyph is missing from some Devanagari-first
     font stacks, and this page ships no font of its own */
  .bars { width: 15px; height: 11px; flex: none; position: relative; }
  .bars, .bars::before, .bars::after {
    border-top: 1px solid var(--faded);
  }
  .bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; }
  .bars::before { top: 4px; }
  .bars::after { top: 9px; }

  /* Running tally, on one line: it is status, and it used to be three
     stacked blocks taller than the selector beside it. */
  .tally {
    display: flex; gap: .7rem; flex: none;
    font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faded);
  }
  .tally b { font-size: .95rem; font-weight: 500; letter-spacing: 0;
             text-transform: none; color: var(--leaf); margin-right: .25rem; }
  .tally .miss b { color: var(--kumkuma); }

  .panel {
    width: 100%; max-width: 440px;
    background: var(--leaf); color: var(--ink);
    border: 1px solid var(--leaf-edge); border-radius: 3px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    position: relative;
  }
  .card {
    min-height: 250px; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 2rem 1.6rem; cursor: pointer; touch-action: manipulation;
  }
  .card::before, .card::after {
    content: ""; position: absolute; top: 50%; width: 9px; height: 9px;
    border-radius: 50%; background: var(--ground); opacity: .28; transform: translateY(-50%);
  }
  .card::before { left: 14px; }
  .card::after { right: 14px; }
  .dn { font-family: "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
        font-size: 2.5rem; line-height: 1.5; }
  .iast { font-size: 1.3rem; font-style: italic; margin-top: .3rem; }
  .rule { width: 42px; height: 1px; background: var(--leaf-edge); margin-top: 1.1rem; display: none; }
  .card.open .rule { display: block; }
  .back { margin-top: .9rem; display: none; }
  .card.open .back { display: block; }
  .gloss { font-size: 1.1rem; }
  /* the answer's transliteration, under the answer rather than inside the
     annotation below it */
  .iast-back { margin-top: .25rem; font-size: .95rem; font-style: italic;
               color: var(--ink); opacity: .8; }
  .iast-back:empty { display: none; }
  .tag { margin-top: .6rem; font-size: .7rem; letter-spacing: .14em; line-height: 1.9;
         text-transform: uppercase; color: var(--kumkuma); }
  /* where the exercise came from — provenance, not morphology, so it stays
     outside the annotation chip and its popover */
  .src { margin-top: .45rem; font-size: .68rem; font-style: italic;
         letter-spacing: .04em; color: var(--faded); }
  .src:empty { display: none; }
  .seen-before { position: absolute; top: 12px; right: 28px;
                 font-size: .65rem; letter-spacing: .12em; text-transform: uppercase;
                 color: var(--kumkuma); }

  /* ── choice cards ──────────────────────────────────────────
     Same panel, same grading, same trouble list — only the front differs.
     The prompt is a transformation written in IAST, so it does not get the
     Devanagari face or the 2.5rem display size a headword gets. */
  .card.choice { cursor: default; }
  .card.choice .dn {
    font-family: inherit; font-size: 1.25rem; font-style: italic;
    line-height: 1.55; max-width: 22rem;
    /* a prompt may put the English meaning above the Sanskrit frame */
    white-space: pre-line;
  }
  .choices {
    display: flex; flex-direction: column; gap: .5rem;
    margin-top: 1.3rem; width: 100%; max-width: 20rem;
  }
  .opt {
    /* on the leaf, not on the ground — these buttons need the card's palette */
    background: transparent; color: var(--ink);
    border: 1px solid var(--leaf-edge); border-radius: 2px;
    font-family: inherit; font-size: 1.05rem; min-height: 46px;
    padding: .6rem 1rem; cursor: pointer; touch-action: manipulation;
    width: 100%; text-align: center;
  }
  .opt:hover:not(:disabled) { border-color: var(--faded); }
  .opt:focus-visible { outline: 2px solid var(--kumkuma); outline-offset: 2px; }
  .opt:disabled { cursor: default; opacity: 1; }      /* locked, not greyed out */
  .opt.right {
    border-color: var(--patra); color: var(--patra);
    box-shadow: inset 0 0 0 1px var(--patra);
  }
  .opt.wrong {
    border-color: var(--kumkuma); color: var(--kumkuma);
    text-decoration: line-through; text-decoration-thickness: 1px;
  }
  /* A choice note carries rule names and vowel equations — "guṇa · a + i → e"
     — not the terse morphology chips a reveal card shows.  Uppercasing that
     would print IAST vowels as "A + I → E", which is not how anyone writes
     them, and at this size an uppercased ṚḤ hides its own underdots. */
  .card.choice .tag { text-transform: none; letter-spacing: .06em; font-size: .78rem; }

  /* the mark reads without relying on colour alone */
  .opt.right::after  { content: " ✓"; }
  .opt.wrong::after  { content: " ✕"; }

  /* ── sequence cards ────────────────────────────────────────
     Assemble supplied pieces by tapping: chips move from the bank into the
     line above it, and tapping a placed chip sends it back.  No dragging —
     it costs mobile precision, accessibility and state for nothing here. */
  .seq { width: 100%; max-width: 21rem; margin-top: 1.2rem; }
  .built {
    display: flex; flex-wrap: wrap; gap: .4rem;
    justify-content: center; align-items: center;
    min-height: 3.2rem; padding: .5rem;
    border-bottom: 1px solid var(--leaf-edge);
  }
  /* an empty line still has to read as somewhere to put things */
  .built:empty::before {
    content: "tap the pieces below, in order";
    font-size: .78rem; font-style: italic; color: var(--faded);
  }
  .bank {
    display: flex; flex-wrap: wrap; gap: .45rem;
    justify-content: center; margin-top: .9rem; min-height: 2.9rem;
  }
  /* once the answer is checked the bank is empty — collapse it rather than
     leaving a hole between the sentence and its note */
  .bank:empty { min-height: 0; margin-top: 0; }
  .chip {
    background: transparent; color: var(--ink);
    border: 1px solid var(--leaf-edge); border-radius: 2px;
    font-family: inherit; font-size: 1rem; min-height: 44px;
    padding: .5rem .8rem; cursor: pointer; touch-action: manipulation;
  }
  .chip:hover:not(:disabled) { border-color: var(--faded); }
  .chip:focus-visible { outline: 2px solid var(--kumkuma); outline-offset: 2px; }
  .chip:disabled { cursor: default; opacity: 1; }
  .built .chip { border-color: var(--faded); }
  .built .chip.right { border-color: var(--patra); color: var(--patra); }
  .built .chip.wrong { border-color: var(--kumkuma); color: var(--kumkuma); }
  .built .chip.right::after { content: " ✓"; }
  .built .chip.wrong::after { content: " ✕"; }
  /* the answer, spelled out, when the assembly was wrong */
  .card.seq-card .gloss { font-size: 1rem; font-style: italic; }
  .card.seq-card { cursor: default; }
  .card.seq-card .dn {
    font-family: inherit; font-size: 1.15rem; font-style: italic;
    line-height: 1.5; max-width: 22rem;
  }
  .card.seq-card .tag { text-transform: none; letter-spacing: .06em; font-size: .78rem; }

  .actions { display: flex; gap: .7rem; margin-top: 1.4rem; flex-wrap: wrap; justify-content: center; }
  button {
    touch-action: manipulation;
    font-family: inherit; font-size: .95rem; min-height: 44px;
    padding: .6rem 1.3rem; border-radius: 2px; cursor: pointer;
    background: transparent; color: var(--leaf); border: 1px solid var(--faded);
  }
  /* under the card, centred, and quiet: they change how a card is shown
     rather than being part of the exercise */
  .controls { display: flex; gap: .9rem; margin-top: .9rem;
              align-items: center; justify-content: center; flex-wrap: wrap; }
  .controls .check input:disabled { cursor: default; }
  .controls .check:has(input:disabled) { opacity: .45; cursor: default; }
  #dir { font-size: .7rem; letter-spacing: .05em; padding: .3rem .6rem;
         min-height: 36px; color: var(--leaf); }
  #dir .swap { color: var(--faded); margin-right: .4rem; }
  .check { display: inline-flex; align-items: center; gap: .35rem;
           min-height: 36px; padding: 0 .2rem;
           font-size: .7rem; letter-spacing: .05em; color: var(--faded);
           cursor: pointer; user-select: none; }
  .check input { accent-color: var(--kumkuma); width: 15px; height: 15px;
                 cursor: pointer; margin: 0; }
  .check:has(input:checked) { color: var(--leaf); }
  .check input:focus-visible { outline: 2px solid var(--kumkuma); outline-offset: 2px; }
  .pilebtn { margin-bottom: .8rem; font-size: .74rem; min-height: 38px;
             padding: .4rem .9rem;
             color: #e2a08e; border-color: var(--kumkuma); }
  button:disabled { opacity: .45; cursor: default; }

  /* an empty transliteration line shouldn't leave a gap behind */
  .iast:empty { display: none; }

  /* produce direction: the meaning asks, the word answers */
  .mode-produce .dn { font-family: inherit; font-size: 1.45rem; line-height: 1.4; }
  .mode-produce .gloss { font-family: "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
                         font-size: 2rem; line-height: 1.5; }
  /* the produce direction sets the answer in Devanagari, so its
     transliteration takes the display size the front would have given it */
  .mode-produce .iast-back { font-size: 1.2rem; opacity: .85; }
  button.primary { border-color: var(--leaf); }
  button.miss { border-color: var(--kumkuma); color: #e2a08e; }
  /* The two grade buttons carry the same ✕ and ✓ the choice options and the
     sequence chips already use, so the mark means one thing everywhere.  Set
     larger than the 44px minimum: they are hit on every single card, and a
     glyph gives less to aim at than a phrase did. */
  button.grade { min-width: 5.5rem; min-height: 52px; padding: .5rem 1.4rem;
                 font-size: 1.45rem; line-height: 1; }
  button:focus-visible, .card:focus-visible { outline: 2px solid var(--kumkuma); outline-offset: 3px; }
  .stage { font-size: .66rem; letter-spacing: .1em;
           text-transform: uppercase; color: var(--faded); line-height: 1.55; }
  .validate { margin-top: 2.2rem; font-size: .7rem; letter-spacing: .1em;
              color: var(--faded); text-align: center; max-width: 440px; }
  .validate.bad { color: #e2a08e; }
  .skiplist { margin-top: .5rem; font-size: .68rem; text-align: left;
              letter-spacing: 0; line-height: 1.5; }
  .keys { margin-top: .8rem; font-size: .7rem; color: var(--faded); letter-spacing: .08em; }

  /* review screen */
  .review { padding: 1.8rem 1.5rem; display: none; }
  .review h2 { margin: 0 0 .2rem; font-size: 1.2rem; font-weight: 500; }
  .score { font-size: .9rem; color: var(--faded); margin-bottom: 1.3rem; }
  .score b { color: var(--ink); font-weight: 500; }
  .missed-head { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
                 color: var(--kumkuma); border-bottom: 1px solid var(--leaf-edge);
                 padding-bottom: .4rem; margin-bottom: .2rem; }
  .row { padding: .7rem 0; border-bottom: 1px solid rgba(205,187,149,.5); }
  .row:last-child { border-bottom: none; }
  .row .r-dn { font-family: "Noto Serif Devanagari", "Kohinoor Devanagari", serif; font-size: 1.35rem; }
  .row .r-iast { font-style: italic; margin-left: .5rem; }
  .row .r-gloss { display: block; font-size: .95rem; margin-top: .15rem; }
  .row .r-tag { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faded); }
  .clean { font-size: 1rem; padding: .6rem 0 .2rem; }

  /* scoreboard — same shell as the review screen */
  .board { padding: 1.8rem 1.5rem; display: none; }
  .board h2 { margin: 0 0 .2rem; font-size: 1.2rem; font-weight: 500; }
  .brow { display: flex; align-items: baseline; gap: .8rem;
          padding: .55rem 0; border-bottom: 1px solid rgba(205,187,149,.5); }
  .brow:last-child { border-bottom: none; }
  .b-name { flex: 1; font-size: .95rem; }
  .b-stage { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
             color: var(--faded); margin-left: .4rem; }
  .b-score { font-variant-numeric: tabular-nums; font-size: .95rem; }
  .b-pct { font-size: .8rem; color: var(--faded);
           min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .brow.full .b-score, .brow.full .b-pct { color: var(--kumkuma); }

  /* a case name inside the red annotation, tappable for the long version.
     Inherits everything from .tag so it reads as part of the line; the
     negative margin buys a finger-sized hit area without moving anything. */
  /* The whole annotation is one tap target: a phone should not have to hit a
     five-character chip, and the explanation is composite anyway. */
  .tag .ann {
    display: inline; text-align: inherit;
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    color: inherit; background: none; border: 0; border-radius: 0;
    border-bottom: 1px dotted currentColor;
    min-height: 0; cursor: pointer; padding: .1rem .1rem 0; margin: 0 -.1rem;
  }
  .tag .ann[aria-expanded="true"] { border-bottom-style: solid; }
  .tag .ann:focus-visible { outline: 2px solid var(--kumkuma); outline-offset: 1px; }

  /* Asking before a round is thrown away.  Not window.confirm(): an
     in-app browser is free to suppress that, and a suppressed confirm
     reads as false — the deck silently refusing to change. */
  .veil { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); }
  .ask {
    position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(20rem, calc(100vw - 2rem));
    background: var(--leaf); color: var(--ink);
    border: 1px solid var(--leaf-edge); border-radius: 3px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    padding: 1.1rem 1.1rem 1rem; text-align: center;
  }
  .ask p { margin: 0 0 1rem; font-size: .95rem; line-height: 1.5; }
  .ask-btns { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  .ask-btns button { color: var(--ink); border-color: var(--faded); font-size: .9rem; }
  .ask-btns button.primary { border-color: var(--kumkuma); color: var(--kumkuma); }

  /* the annotation popover */
  .pop {
    position: fixed; z-index: 50; width: min(21rem, calc(100vw - 1.4rem));
    background: var(--leaf); color: var(--ink);
    border: 1px solid var(--leaf-edge); border-radius: 3px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    padding: .85rem 1rem 1rem; text-align: left;
    font-size: .82rem; line-height: 1.6;
  }
  .pop { max-height: 74vh; overflow-y: auto; }
  .sec + .sec { border-top: 1px solid var(--leaf-edge); margin-top: .8rem; padding-top: .8rem; }
  .sec-h { margin-bottom: .3rem; }
  .sec-t { font-size: 1.02rem; }
  .sec-e { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
           color: var(--kumkuma); margin-left: .45rem; }
  .sec-b { margin: 0; }
  .sec-eg { margin-top: .5rem; }
  .eg-dn { display: block; font-size: 1.1rem; line-height: 1.5;
           font-family: "Noto Serif Devanagari", "Kohinoor Devanagari", serif; }
  .eg-iast { display: block; font-style: italic; }
  .eg-tr { display: block; color: var(--faded); }


  /* review mastery, at the head of the scoreboard */
  .mastery { padding: .4rem 0 .9rem; margin-bottom: .6rem;
             border-bottom: 1px solid var(--leaf-edge); }
  .m-label { display: block; margin-bottom: .2rem;
             font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
             color: var(--kumkuma); }
  .m-pct { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .m-sub { margin-left: .55rem; font-size: .74rem; color: var(--faded); }

  /* trouble cards — the same shell as the scoreboard */
  .note { font-size: .75rem; line-height: 1.55; color: var(--faded);
          font-style: italic; margin: -.9rem 0 1.1rem; }
  .t-count { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
             color: var(--kumkuma); margin-left: .5rem; }
  /* before there is a figure to show, the line is the sub-text alone */
  .mastery.waiting .m-pct { display: none; }
  .mastery.waiting .m-sub { margin-left: 0; }

  /* ── the drawer ────────────────────────────────────────────
     Track → lesson → deck, plus the modes and the course figure.  A left
     drawer, not a permanent sidebar: on the phone this page is built for,
     a fixed panel would take the space the card needs. */
  .dveil { position: fixed; inset: 0; z-index: 54; background: rgba(0,0,0,.5); }
  .drawer {
    position: fixed; z-index: 55; top: 0; left: 0; bottom: 0;
    width: min(23rem, 90vw); overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #2b251e; border-right: 1px solid var(--faded);
    box-shadow: 6px 0 26px rgba(0,0,0,.45);
    padding: .45rem .85rem 2.5rem;
  }
  .dr-top { display: flex; justify-content: flex-end; }
  .dr-x { background: none; border: 0; color: var(--faded); font-size: 1.6rem;
          line-height: 1; width: 44px; height: 44px; cursor: pointer; padding: 0; }
  .dr-x:hover { color: var(--leaf); }

  /* the course figure, over every card the app carries */
  .dr-prog { display: grid; grid-template-columns: 1fr auto; gap: .15rem .6rem;
             padding: .7rem 0 .8rem; margin-bottom: .5rem;
             border-bottom: 1px solid rgba(125,112,92,.45); }
  .dp-label { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase;
              color: var(--kumkuma); align-self: center; }
  .dp-pct { font-size: 1.5rem; font-variant-numeric: tabular-nums;
            grid-row: span 2; align-self: center; }
  .dp-sub { font-size: .74rem; color: var(--faded); }
  .dr-prog .bar { grid-column: 1 / -1; margin-top: .4rem; }

  /* one progress bar, used at every level */
  .bar { display: block; height: 2px; background: rgba(125,112,92,.4); }
  .bar i { display: block; height: 100%; background: var(--kumkuma); }
  .full > .tr-head .bar i, .full > .ls-head .bar i { background: var(--patra); }

  /* review, trouble and the scoreboard, which used to trail the page */
  .dr-modes { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
  .dr-mode {
    display: block; width: 100%; text-align: left; min-height: 46px;
    padding: .5rem .7rem; border-radius: 2px; cursor: pointer;
    background: transparent; color: var(--leaf);
    border: 1px solid rgba(125,112,92,.55); font-family: inherit;
  }
  .dr-mode:hover { border-color: var(--faded); }
  /* the scoreboard leads, and is the one row drawn in full */
  .dr-mode.board { border-color: var(--kumkuma); }
  .dr-mode.on { border-color: var(--leaf); }
  .dm-name { display: block; font-size: .95rem; }
  .dm-sub { display: block; margin-top: .1rem; font-size: .69rem;
            font-style: italic; color: var(--faded); }

  /* a track: its stage range, its name, what it covers, how much is back */
  .tr { border-bottom: 1px solid rgba(125,112,92,.3); }
  .tr:last-child { border-bottom: none; }
  .tr-head {
    display: grid; width: 100%; text-align: left; cursor: pointer;
    grid-template-columns: 1fr auto; gap: .1rem .6rem;
    grid-template-areas: "name pct" "sub sub" "bar bar";
    background: none; border: 0; font-family: inherit; color: var(--leaf);
    padding: .75rem .2rem .8rem; min-height: 48px;
  }
  .tr-name { grid-area: name; font-size: 1.05rem; }
  .tr-sub { grid-area: sub; font-size: .73rem; font-style: italic;
            line-height: 1.45; color: var(--faded); margin-top: .1rem; }
  .tr-pct { grid-area: pct; align-self: center; font-size: .85rem;
            color: var(--faded); font-variant-numeric: tabular-nums; }
  .tr-head .bar { grid-area: bar; margin-top: .5rem; }
  .tr.full .tr-pct { color: var(--patra); }
  .tr-head[aria-expanded="true"] .tr-name { color: var(--leaf); }
  .tr-body { padding: 0 0 .6rem .55rem; border-left: 1px solid rgba(125,112,92,.3);
             margin-left: .2rem; }

  /* a lesson inside a track */
  .ls-head {
    display: grid; width: 100%; text-align: left; cursor: pointer;
    grid-template-columns: 1fr auto; gap: .1rem .6rem;
    grid-template-areas: "name pct" "sub sub" "bar bar";
    background: none; border: 0; font-family: inherit; color: var(--leaf);
    padding: .5rem .2rem; min-height: 44px;
  }
  .ls-name { grid-area: name; font-size: .9rem; }
  .ls-sub { grid-area: sub; font-size: .66rem; font-style: italic;
            line-height: 1.4; color: var(--faded); margin-top: .05rem; }
  .ls-pct { grid-area: pct; align-self: center; font-size: .78rem;
            color: var(--faded); font-variant-numeric: tabular-nums; }
  .ls-head .bar { grid-area: bar; margin-top: .35rem; }
  /* a lesson is ticked only when every card it holds is back cold */
  .ls.full .ls-pct { color: var(--patra); font-size: .95rem; }
  .ls-body { padding: .1rem 0 .5rem .55rem; }

  /* A list standing in for the level above it — a track that is one list, or a
     lesson that is one — keeps that level's size and indent, and takes the
     current-list outline a deck row gets instead of an expander's caret. */
  .tr-head.leaf, .ls-head.leaf { cursor: pointer; }
  .tr-head.on, .ls-head.on {
    border: 1px solid var(--leaf); border-radius: 2px;
  }
  .ls-head.leaf .ls-sub, .tr-head.leaf .tr-sub { font-style: normal; }

  /* a deck: the row that actually starts a round */
  .dk {
    display: grid; width: 100%; text-align: left; cursor: pointer;
    grid-template-columns: 1fr auto; gap: 0 .6rem;
    grid-template-areas: "name pct" "sub pct";
    background: none; font-family: inherit; color: var(--leaf);
    border: 1px solid transparent; border-radius: 2px;
    padding: .45rem .5rem; min-height: 44px;
  }
  .dk:hover { border-color: rgba(125,112,92,.5); }
  .dk.on { border-color: var(--leaf); }
  .dk-name { grid-area: name; font-size: .86rem; }
  .dk-sub { grid-area: sub; font-size: .66rem; color: var(--faded); }
  .dk-pct { grid-area: pct; align-self: center; font-size: .74rem;
            color: var(--faded); font-variant-numeric: tabular-nums; }
  .dk.full .dk-pct { color: var(--patra); font-size: .9rem; }

  .drawer button:focus-visible { outline: 2px solid var(--kumkuma); outline-offset: 2px; }
</style>
</head>

    <span class="nav-caret" aria-hidden="true"></span>

els","source":"theory · how pratyāhāras work"},{"id":"02-varna-vidya:praty:ac","type":"choice","front":"Expand: ac","options":["all the vowels","all the consonants","i, u, ṛ, ḷ"],"answer":"all the vowels","note":"a, i, u, ṛ, ḷ, e, o, ai, au — nine letters in two","source":"theory · how pratyāhāras work"},{"id":"02-varna-vidya:praty:hal","type":"choice","front":"Expand: hal","options":["all the consonants","all the vowels","the semivowels only"],"answer":"all the consonants","note":"ha, ya, va, ra … through to ha","source":"theory · how pratyāhāras work"},{"id":"02-varna-vidya:praty:an","type":"choice","front":"Expand: aṇ","options":["a, i, u","a, i, u, ṛ, ḷ","e, o"],"answer":"a, i, u","note":"the three basic vowels","source":"theory · how pratyāhāras work"},{"id":"02-varna-vidya:praty:eng","type":"choice","front":"Expand: eṅ","options":["e, o","e, o, ai, au","a, i, u"],"answer":"e, o","note":"the simple compound vowels — ai and au are not included","source":"theory · how pratyāhāras work"},{"id":"02-varna-vidya:praty:which-vowels","type":"choice","front":"Name the pratyāhāra: all the vowels","options":["ac","hal","ik"],"answer":"ac","note":"ac vs hal is the basic vowel/consonant split of the whole system","source":"theory · how pratyāhāras work"},{"id":"02-varna-vidya:praty:rule","type":"choice","front":"A pratyāhāra is formed from:","options":["first sound + a later it-marker, covering everything between","first sound + last sound of the same sūtra","any two sounds that share a place of articulation"],"answer":"first sound + a later it-marker, covering everything between","note":"ādir antyena sahetā · Pāṇini 1.1.71","source":"theory · how pratyāhāras work"}]},{"name":"15 · Varṇa — sounds and articulation","pair":"term → definition","cards":[{"id":"02-varna-vidya:varna:varnah","devanagari":"वर्णः","iast":"varṇaḥ","gloss":"phoneme, letter","note":"prathamā | nom. sg. · m. · stem: varṇa- · a-stem"},{"id":"02-varna-vidya:varna:svarah","devanagari":"स्वरः","iast":"svara :"Join: kavi + indraḥ","options":["kavīndraḥ","kavendraḥ","kavyindraḥ"],"answer":"kavīndraḥ","note":"savarṇadīrgha · i + i → ī · not guṇa, the vowels match","source":"workbook A2"},{"id":"03-sandhi:join:maha-utsavah","type":"choice","front":"Join: mahā + utsavaḥ","options":["mahotsavaḥ","mahautsavaḥ","mahūtsavaḥ"],"answer":"mahotsavaḥ","note":"guṇa · ā + u → o","source":"theory · guṇa examples"},{"id":"03-sandhi:join:maha-rsih","type":"choice","front":"Join: mahā + ṛṣiḥ","options":["maharṣiḥ","mahārṣiḥ","mahaiṛṣiḥ"],"answer":"maharṣiḥ","note":"guṇa · ā + ṛ → ar","source":"theory · guṇa examples"},{"id":"03-sandhi:join:jala-oghah","type":"choice","front":"Join: jala + oghaḥ","options":["jalaughaḥ","jaloghaḥ","jalāghaḥ"],"answer":"jalaughaḥ","note":"vṛddhi · a + o → au","source":"theory · vṛddhi examples"},{"id":"03-sandhi:join:su-agatam","type":"choice","front":"Join: su + āgatam","options":["svāgatam","sāgatam","sūgatam"],"answer":"svāgatam","note":"yan · u + ā → v","source":"workbook A1"},{"id":"03-sandhi:join:sat-cit","type":"choice","front":"Join: sat + cit","options":["sac cit","sat cit","saj cit"],"answer":"sac cit","note":"śchutva · t → c before c","source":"theory · śchutva examples"},{"id":"03-sandhi:join:ramas-sete","type":"choice","front":"Join: rāmas + śete","options":["rāmaś śete","rāmas śete","rāmaṣ śete"],"answer":"rāmaś śete","note":"śchutva · s → ś before ś","source":"theory · śchutva examples"},{"id":"03-sandhi:join:vak-isah","type":"choice","front":"Join: vāk + īśaḥ","options":["vāg īśaḥ","vāk īśaḥ","vāṅ īśaḥ"],"answer":"vāg īśaḥ","note":"jaśtva · k → g before a vowel","source":"theory · jaśtva examples"},{"id":"03-sandhi:join:vak-mayam","type":"choice","front":"Join: vāk + mayam","options":["vāṅ mayam","vāg mayam","vāk mayam"],"answer":"vāṅ mayam","note":"anunāsika · k → ṅ before a nasal","source":"theory · anunāsika examples"},{"id":"03-sandhi:join:sat-mukhah","type":"choice","front":"Join: ṣaṭ + mukhaḥ","options":["ṣaṇ mukhaḥ","ṣaḍ mukhaḥ","ṣaṭ mukhaḥ"],"answer":"ṣaṇ mukhaḥ","note":"anunāsika · ṭ → ṇ before a nasal","source":"theory · anunāsika examples"},{"id":"03-sandhi:join:krsnam-vande","type":"choice","front":"Join: kṛṣṇam + vande","options":["kṛṣṇaṁ vande","kṛṣṇam vande","kṛṣṇan vande"],"answer":"kṛṣṇaṁ vande","note":"anusvāra · final m → ṁ before a consonant","source":"theory · anusvāra examples"},{"id":"03-sandhi:join:ramah-hasati","type":"choice","front":"Join: rāmaḥ + hasati","options":["rāmo hasati","rāmar hasati","rāmas hasati"],"answer":"rāmo hasati","note":"ukārādeśa · aḥ + voiced → o","source":"theory · ukārādeśa examples"},{"id":"03-sandhi:join:ramah-tatra","type":"choice","front":"Join: rāmaḥ + tatra","options":["rāmas tatra","rāmo tatra","rāmar tatra"],"answer":"rāmas tatra","note":"sakārādeśa · ḥ → s before t","source":"theory · sakārādeśa examples"},{"id":"03-sandhi:join:ramah-ca","type":"choice","front":"Join: rāmaḥ + ca","options":["rāmaś ca","rāmas ca","rāmo ca"],"answer":"rāmaś ca","note":"sakārādeśa then śchutva · ḥ → s → ś before c","source":"theory · sakārādeśa examples"},{"id":"03-sandhi:join:munih-agatah","type":"choice","front":"Join: muniḥ + āgataḥ","options":["munir āgataḥ","munio āgataḥ","munis āgataḥ"],"answer":"munir āgataḥ","note":"rephādeśa · iḥ + voiced → r · not aḥ, so not o","source":"theory · rephādeśa examples"}]},{"name":"Splits & rules — practice, take apart and name","cards":[{"id":"03-sandhi:split:gurupadesah","type":"choice","front":"Split: gurūpadeśaḥ","options":["guru + upadeśaḥ","guru + padeśaḥ","gurv + upadeśaḥ"],"answer":"guru + upadeśaḥ","note":"savarṇadīrgha · u + u → ū","source":"workbook A7"},{"id":"03-sandhi:split:jagannathah","type":"choice","front":"Split: jagan nāthaḥ","options":["jagat + nāthaḥ","jagam + nāthaḥ","jagas + nāthaḥ"],"answer":"jagat + nāthaḥ","note":"jaśtva t → d, then anunāsika d → n","source":"workbook B7"},{"id":"03-sandhi:split:vanmayam","type":"choice","front":"Split: vāṅ mayam","options":["vāk + mayam","vāt + mayam","vāp + maya ards":[{"id":"08-sambodhana:voc:siva","type":"choice","front":"Change to vocative: śivaḥ","options":["he śiva!","he śive!","he śivo!"],"answer":"he śiva!","note":"a-stem m. · drop the visarga, keep the -a","source":"workbook A1"},{"id":"08-sambodhana:voc:devi","type":"choice","front":"Change to vocative: devī","options":["he devi!","he devī!","he deve!"],"answer":"he devi!","note":"ī-stem f. · long -ī shortens to -i","source":"workbook A1"},{"id":"08-sambodhana:voc:durga","type":"choice","front":"Change to vocative: durgā","options":["he durge!","he durga!","he durgi!"],"answer":"he durge!","note":"ā-stem f. · -ā becomes -e","source":"workbook A1"},{"id":"08-sambodhana:voc:visnu","type":"choice","front":"Change to vocative: viṣṇuḥ","options":["he viṣṇo!","he viṣṇu!","he viṣṇe!"],"answer":"he viṣṇo!","note":"u-stem m. · -uḥ becomes -o","source":"workbook A1"},{"id":"08-sambodhana:voc:agni","type":"choice","front":"Change to vocative: agniḥ","options":["he agne!","he agno!","he agni!"],"answer":"he agne!","note":"i-stem m. · -iḥ becomes -e · contrast viṣṇo from an u-stem","source":"workbook A1"},{"id":"08-sambodhana:voc:jagadamba","type":"choice","front":"Change to vocative: jagadambā","options":["he jagadambe!","he jagadamba!","he jagadambi!"],"answer":"he jagadambe!","note":"ā-stem f. · a compound behaves as its final member does","source":"workbook A2"},{"id":"08-sambodhana:voc:bhagavan","type":"choice","front":"Change to vocative: bhagavān","options":["he bhagavan!","he bhagavān!","he bhagave!"],"answer":"he bhagavan!","note":"consonant stem · the long ā shortens","source":"workbook A2"},{"id":"08-sambodhana:voc:sundari","type":"choice","front":"Change to vocative: sundarī (devī)","options":["he sundari!","he sundare!","he sundarī!"],"answer":"he sundari!","note":"ī-stem f. · same shortening as devi","source":"workbook A2"},{"id":"08-sambodhana:rule:i-vs-u","type":"choice","front":"Vocative ending of an i-stem:","options":["-e, as agniḥ → agne","-o, as agniḥ → agn ,"iast":"citrakāvyam","gloss":"constrained, figured poetry","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: citrakāvya- · a-stem"},{"id":"27-samasyapurana:avadhana:dharana","devanagari":"धारणा","iast":"dhāraṇā","gloss":"holding in memory","note":"prathamā | nom. sg. · f. · stem: dhāraṇā- · ā-stem"},{"id":"27-samasyapurana:avadhana:katha","devanagari":"कथा","iast":"kathā","gloss":"the narrated story, recalled and answered on afterwards","note":"prathamā | nom. sg. · f. · stem: kathā- · ā-stem · also vācana"},{"id":"27-samasyapurana:avadhana:aprastutaprasangah","devanagari":"अप्रस्तुतप्रसङ्गः","iast":"aprastutaprasaṅgaḥ","gloss":"the irrelevant interruption","note":"prathamā | nom. sg. · m. · stem: aprastutaprasaṅga- · a-stem"},{"id":"27-samasyapurana:avadhana:asukavitvam","devanagari":"आशुकवित्वम्","iast":"āśukavitvam","gloss":"extempore composition","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: āśukavitva- · a-stem"},{"id":"27-samasyapurana:avadhana:ghantagananam","devanagari":"घण्टागणनम्","iast":"ghaṇṭāgaṇanam","gloss":"counting bells while composing","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: ghaṇṭāgaṇana- · a-stem"},{"id":"27-samasyapurana:avadhana:astavadhanam","devanagari":"अष्टावधानम्","iast":"aṣṭāvadhānam","gloss":"all eight at once","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: aṣṭāvadhāna- · a-stem"},{"id":"27-samasyapurana:avadhana:satavadhanam","devanagari":"शतावधानम्","iast":"śatāvadhānam","gloss":"a hundred simultaneous tasks","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: śatāvadhāna- · a-stem"}]}]},{"lesson":"00-overview","stage":0,"label":"Vyākaraṇam","gloss":"Terminology Used Throughout","decks":[{"name":"13 · Vyākaraṇam I — bricks and rules","pair":"term → definition","cards":[{"id":"00-overview:vyakaranam:dhatuh","devanagari":"धातुः","iast":"dhātuḥ","gloss":"verbal root","note":"prathamā | nom. sg. · m. · stem: dhātu- · u-stem"},{"id":"00-overview:vyakaranam:pratyayah","devanagari":"प्रत्ययः","iast":"pratyay "},{"id":"00-overview:vyakaranam:agamah","devanagari":"आगमः","iast":"āgamaḥ","gloss":"augment","note":"prathamā | nom. sg. · m. · stem: āgama- · a-stem"},{"id":"00-overview:vyakaranam:avyayam","devanagari":"अव्ययम्","iast":"avyayam","gloss":"indeclinable","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: avyaya- · a-stem"},{"id":"00-overview:vyakaranam:tin","devanagari":"तिङ्","iast":"tiṅ","gloss":"verbal ending","note":"vs. sup, the noun endings"},{"id":"00-overview:vyakaranam:padam","devanagari":"पदम्","iast":"padam","gloss":"a finished, inflected word","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: pada- · a-stem"},{"id":"00-overview:vyakaranam:sabdah","devanagari":"शब्दः","iast":"śabdaḥ","gloss":"word, sound","note":"prathamā | nom. sg. · m. · stem: śabda- · a-stem"},{"id":"00-overview:vyakaranam:aksaram","devanagari":"अक्षरम्","iast":"akṣaram","gloss":"syllable","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: akṣara- · a-stem"}]},{"name":"13 · Vyākaraṇam II — words and meta-terms","pair":"term → definition","cards":[{"id":"00-overview:vyakaranam:karakam","devanagari":"कारकम्","iast":"kārakam","gloss":"a noun's relation to the action","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: kāraka- · a-stem"},{"id":"00-overview:vyakaranam:nama","devanagari":"नाम","iast":"nāma","gloss":"name; noun","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: nāman- · an-stem"},{"id":"00-overview:vyakaranam:rupam","devanagari":"रूपम्","iast":"rūpam","gloss":"form; a declined shape","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: rūpa- · a-stem"},{"id":"00-overview:vyakaranam:vakyam","devanagari":"वाक्यम्","iast":"vākyam","gloss":"sentence","note":"prathamā/dvitīyā | nom./acc. sg. · n. · stem: vākya- · a-stem"},{"id":"00-overview:vyakaranam:katha","devanagari":"कथा","iast":"kathā","gloss":"story, narrative","note":"prathamā | nom. sg. · f. · stem: kathā- · ā-stem"},{"id":"00-overview:vyakaranam:kriya","devanagari":"क्रिया","iast":"kriyā","gloss":"action; the verb","note":"prathamā | nom. sg. · f. · stem: kriyā- · ā-stem"},{"id":"00-overview:vyakaranam:paryayah","devanagari":"पर्यायः","iast":"paryāyaḥ","gloss":"synonym","note":"prathamā | nom. sg. · m. · stem: paryāya- · a-stem"},{"id":"00-overview:vyakaranam:it","devanagari":"इत्","iast":"it","gloss":"indicatory letter, then deleted","note":"tasya lopaḥ, 1.3.9"},{"id":"00-overview:vyakaranam:pratyaharah","devanagari":"प्रत्याहारः","iast":"pratyāhāraḥ","gloss":"abbreviation spanning the Śiva sūtras","note":"e.g. ac, hal"}]}]}]}</script>

<script>
/* Practice data lives in the <script id="practice" type="application/json">
   block above, inlined by scripts/build.js from every lesson's practice.json.
   Its shape:

     { "lessons": [
         { "lesson": "06-kriya", "stage": 6,
           "decks": [ { "name": "...", "cards": [ … ] } ] } ] }

   Lessons arrive already ordered by curriculum directory, so deck order in
   the picker is the curriculum's own order — the build owns that, not this
   file.  A card carries a stable `id`; every other field is presentation.
   Cards with no `type` are `reveal`, which is what every migrated card is. */
const CARD_TYPES = ["reveal", "choice", "sequence"];

const [DECKS, DECK_STAGE, DECK_LESSON, LESSON_LABEL, LESSON_GLOSS, DECK_PAIR, PARSE] = (() => {
  const decks = {}, stages = {}, lessons = {}, labels = {}, glosses = {}, pairs = {},
        skipped = [];
  const fail = why => [decks, stages, lessons, labels, glosses, pairs,
                       { count: 0, decks: 0, skipped, fatal: why }];

  const src = document.getElementById('practice');
  if (!src) return fail("the <script id=\"practice\"> block is missing");

  let data;
  try { data = JSON.parse(src.textContent); }
  catch (e) { return fail("the practice block is not valid JSON: " + e.message); }

  (data.lessons || []).forEach(L => {
    labels[L.lesson] = L.label || L.lesson;
    glosses[L.lesson] = L.gloss || '';
    (L.decks || []).forEach(d => {
      if (!d.name || !Array.isArray(d.cards) || !d.cards.length) return;
      const cards = d.cards.filter(c => {
        // The build validates far more strictly; this is the last line of
        // defence so one bad card cannot blank the whole page.
        const why = !c.id ? "no id"
          : c.type && !CARD_TYPES.includes(c.type) ? "unknown type " + c.type
          : !c.devanagari && !c.front ? "nothing to show"
          : null;
        if (why) { skipped.push({ id: c.id || "(none)", why, deck: d.name }); return false; }
        return true;
      });
      if (!cards.length) return;
      decks[d.name] = cards;
      stages[d.name] = L.stage;
      lessons[d.name] = L.lesson;
      if (d.pair) pairs[d.name] = d.pair;
    });
  });

  const count = Object.values(decks).reduce((a, b) => a + b.length, 0);
  return [decks, stages, lessons, labels, glosses, pairs,
          { count, decks: Object.keys(decks).length, skipped }];
})();

/* Which list a card came from.  Card objects are made once, per line, so
   object identity is a safe key — and the mixed review needs it to say
   where a missed card came from once the decks are shuffled together. */
const DECK_OF = new Map();
Object.keys(DECKS).forEach(n => DECKS[n].forEach(c => DECK_OF.set(c, n)));

/* ── state ─────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

/* the mixed review: a random draw across every list already finished.
   MIX is the picker value it hides behind — \u00a6 cannot occur in a deck
   header, so it can never collide with a real name. */
const MIX = '\u00a6mix';
const TROUBLE = '\u00a6trouble';
const REVIEW_SIZE = 20;
/* Below this many distinct cards to draw from, a "random" draw is most of
   the pool and proves nothing.  The button stays on show regardless,
   counting up — a feature nobody can see is a feature nobody uses. */
const REVIEW_MIN = 40;

let queue = [];        // cards still to be shown this round
let missed = [];       // cards answered "didn't know" this round
let learned = 0;       // cards retired
let current = null;
let roundSource = null; // the card set this round was built from
let reviewing = false;  // true when the round is a replay of missed cards only
let lastRound = null;   // the round just finished, for the share summary
let deckName = null;    // the list the current round belongs to
let mixed = false;      // true when the round draws across lists, not from one
let trouble = false;    // true when that cross-list round is a trouble drill
let clearedAt = 0;      // the cleared tally as the round began, for the delta

/* remembered across visits: last deck, direction, per-deck best score and
   missed pile.  localStorage may be absent or full — every touch is guarded. */
const STORE_KEY = 'abhyāsaḥ';
/* every name this page has carried, newest first — progress is lifted out
   of the first one still holding it, so a rename never costs a streak */
const OLD_KEYS = ['smṛtiḥ', 'śabdakośa'];
const SAVED = (() => {
  try {
    const cur = localStorage.getItem(STORE_KEY);
    if (cur) return JSON.parse(cur) || {};
    for (const k of OLD_KEYS) {
      const old = localStorage.getItem(k);
      if (!old) continue;
      localStorage.setItem(STORE_KEY, old);
      localStorage.removeItem(k);
      return JSON.parse(old) || {};
    }
    return {};
  } catch (e) { return {}; }
})();
SAVED.decks = SAVED.decks || {};

/* Deck names key SAVED.decks, so renaming one would silently drop its best
   score and its missed pile.  Every rename this app has made is listed here
   and applied once, the same way OLD_KEYS rescues state from an earlier
   storage key.  Never rename a deck without adding a line here. */
const DECK_RENAMES = {
  'Rūpa practice — case and form':               'Practice — case and form',
  /* Both of these targets were later split into chunks of 25 cards or fewer,
     so the score this rescues now names a deck that no longer exists and sits
     inert.  The entries stay: they are the record of what was renamed, and a
     split has no single successor to carry a score onto — see below. */
  'V21 · Deity vibhakti — the eight baseplates': 'Table mastery — the eight baseplates',
  'Kriyā practice — person, tense and mood':     'Practice — person, tense and mood',
  /* The sentence-order sequence decks were removed, not renamed: handing the
     learner every correct word and asking only for the workbook's arrangement
     tested nothing that can be graded honestly. Their scores are deliberately
     left orphaned rather than carried onto different practice. */
  'Sandhi practice — joins and splits':          'Practice — joins and splits',
  'Guṇa practice — agreement':                   'Practice — agreement',
  'Kāraka practice — roles in a sentence':       'Practice — roles in a sentence',
  'Sambodhana practice — direct address':        'Practice — direct address',
  'Pratyāhāra practice — what each covers':      'Practice — pratyāhāras',
  'Samāsa practice — name the compound':         'Practice — name the compound',
  'Suffix practice — kṛt and taddhita':          'Practice — kṛt and taddhita',
  'Chandas practice — scan and name':            'Practice — scan and name',
  'Vṛtta practice — name the metre':             'Practice — name the metre',
  /* "Practice" led every one of these, which told a learner nothing: the word
     is not used consistently enough across the lessons to mean anything on its
     own, and it buried the skill the list actually drills.  The skill leads
     now and "practice" is the descriptor.  Applied in order, so a deck renamed
     twice still finds its way — these run after the entries above. */
  'Practice — pratyāhāras':                        'Pratyāhāras — practice',
  'Practice · joins — combine the two words':      'Joins — practice, combine the two words',
  'Practice · splits & rules — take apart and name': 'Splits & rules — practice, take apart and name',
  'Practice — agreement':                          'Agreement — practice',
  'Practice — case and form':                      'Case and form — practice',
  'Practice — person, tense and mood':             'Person, tense and mood — practice',
  'Practice — roles in a sentence':                'Roles in a sentence — practice',
  'Practice — direct address':                     'Direct address — practice',
  'Practice — kṛt and taddhita':                   'Kṛt and taddhita — practice',
  'Practice — name the compound':                  'Name the compound — practice',
  'Practice — case, form and connector':           'Case, form and connector — practice',
  /* Split straight after this rename into Scan / Name the gaṇa, one skill
     each, so this target no longer exists either — see the split note above. */
  'Practice — scan and name':                      'Scan and name — practice',
  'Practice — name the metre':                     'Name the metre — practice',
};
/* A SPLIT is not a rename and has no entry here.  When a long list is broken
   into chunks, no one chunk is the old deck, so its best score and missed pile
   are deliberately orphaned rather than carried onto practice they were not
   earned on.  Nothing else is lost: mastery and trouble history are keyed by
   card id, and every id survives a split untouched, so lesson and track
   percentages do not move at all. */
Object.entries(DECK_RENAMES).forEach(([from, to]) => {
  if (SAVED.decks[from] && !SAVED.decks[to]) SAVED.decks[to] = SAVED.decks[from];
  delete SAVED.decks[from];
  if (SAVED.deck === from) SAVED.deck = to;
});
SAVED.review = SAVED.review || { runs: 0, right: 0, seen: 0 };   // mixed-review tally
SAVED.trouble = SAVED.trouble || {};       // per-card history, keyed by card
SAVED.cleared = SAVED.cleared || 0;        // cards that have left the trouble list
SAVED.mastered = SAVED.mastered || {};     // card ids answered right on a cold showing
if (SAVED.deck === MIX) delete SAVED.deck;      // the review is no longer a picker choice
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(SAVED)); } catch (e) {}
}
/* A card's stable identity, assigned in practice.json and never derived from
   what the card happens to display.  Before ids existed the key was the
   visible text, so trouble history is lifted across once, below. */
const cardKey = c => c.id;
const deckState = name => SAVED.decks[name] = SAVED.decks[name] || {};

/* \u2500\u2500 saved-progress migration \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   v1 keyed trouble history by devanagari + '\u00a6' + gloss.  Rebuild that key
   for every card we now hold, and move the record onto the card's id.  Runs
   once; a record whose card no longer exists is left where it is rather than
   thrown away, in case a later build brings the card back.

   SAVED.decks is keyed by deck NAME, and deck names did not change in the
   migration, so per-deck best scores need no rescue. */
const SAVED_VERSION = 3;
if ((SAVED.v || 1) < 2) {
  let moved = 0;
  Object.values(DECKS).forEach(cards => cards.forEach(c => {
    if (!c.devanagari || !c.gloss) return;
    const old = c.devanagari + '\u00a6' + c.gloss;
    if (SAVED.trouble[old] && !SAVED.trouble[c.id]) {
      SAVED.trouble[c.id] = SAVED.trouble[old];
      delete SAVED.trouble[old];
      moved++;
    }
  }));
  SAVED.v = 2;                        // this step only — v3 runs below
  save();
  if (moved) console.info("abhy\u0101sa\u1e25: carried " + moved + " trouble records onto stable ids");
}

/* v3 introduced SAVED.mastered, and nothing before it recorded which cards
   came back cold — only how many did, in ds.best.  One case can be resolved
   exactly rather than guessed at: a deck whose best round was perfect had
   every one of its cards right on the first showing, and that is the mastery
   signal itself.  So those decks are seeded and no others.

   The size check matters.  A best score is compared as a ratio, so a perfect
   one may have been set on a smaller version of the deck; seeding from it
   would hand mastery to cards that were never in the round.  Anything
   partial, and anything set on a deck that has since changed size, starts
   from nothing — which is what an unrecorded card honestly is. */
if ((SAVED.v || 1) < 3) {
  let seeded = 0;
  Object.entries(DECKS).forEach(([name, cards]) => {
    const best = (SAVED.decks[name] || {}).best;
    if (!best || best[0] !== best[1] || best[1] !== cards.length) return;
    cards.forEach(c => { if (!SAVED.mastered[c.id]) { SAVED.mastered[c.id] = 1; seeded++; } });
  });
  SAVED.v = SAVED_VERSION;
  save();
  if (seeded) console.info("abhy\u0101sa\u1e25: seeded " + seeded + " mastered cards from perfect rounds");
}

/* ── trouble cards ─────────────────────────────────────────
   A card lands on the list after TROUBLE_WRONG wrong answers and leaves
   after TROUBLE_CLEAR right ones, each in a different session — three
   right answers in one sitting is recognition, not memory.  A wrong
   answer starts that count over: it is still trouble.

   Keyed by card rather than by card-in-a-list, so a word you keep losing
   is one problem however many lists happen to carry it. */
const TROUBLE_WRONG = 3, TROUBLE_CLEAR = 3;
const SESSION = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function markWrong(card) {
  const k = cardKey(card);
  const rec = SAVED.trouble[k] = SAVED.trouble[k] || { w: 0, r: 0, s: "" };
  rec.w++;
  rec.r = 0; rec.s = "";               // the run of clean recalls starts again
  save();
}

function markRight(card) {
  const k = cardKey(card), rec = SAVED.trouble[k];
  if (!rec || rec.w < TROUBLE_WRONG) return;   // only cards on the list count out
  if (rec.s === SESSION) return;               // one credit per session, however many rounds
  rec.s = SESSION;
  if (++rec.r >= TROUBLE_CLEAR) { delete SAVED.trouble[k]; SAVED.cleared++; }
  save();
}

/* The list itself: the worst first, one entry per distinct card. */
function troubleCards() {
  const out = [], seen = new Set();
  Object.keys(DECKS).forEach(n => DECKS[n].forEach(c => {
    const k = cardKey(c), rec = SAVED.trouble[k];
    if (seen.has(k) || !rec || rec.w < TROUBLE_WRONG) return;
    seen.add(k);
    out.push(c);
  }));
  return out.sort((a, b) => SAVED.trouble[cardKey(b)].w - SAVED.trouble[cardKey(a)].w);
}

/* The lists that have been played through to the end at least once.  Only
   these feed the review — there is no point testing what was never learnt. */
const finishedDecks = () => Object.keys(DECKS).filter(n => (SAVED.decks[n] || {}).best);
/* Everything the review can draw on: one entry per distinct card across
   the finished lists.  The same word can sit in more than one list, and
   meeting it twice would waste two of the twenty. */
function reviewPool() {
  const seen = new Map();
  finishedDecks().forEach(n => DECKS[n].forEach(c => {
    const k = cardKey(c);
    if (!seen.has(k)) seen.set(k, c);
  }));
  return [...seen.values()];
}

/* ── mastery ───────────────────────────────────────
   A card is mastered once it has come back right on its FIRST showing in a
   round — the same cold-recall signal a deck's best score is built from, and
   the same one that counts a card out of the trouble list.  A wrong answer
   takes it back: a percentage that could only ever rise would leave a lesson
   ticked long after it had gone, which is not what a tick is for.

   Every kind of round feeds this, review draws and trouble drills included.
   Whether a card came back cold is a fact about the card, not about which
   round it happened to turn up in. */
function markMastered(card) {
  const k = cardKey(card);
  if (SAVED.mastered[k]) return;
  SAVED.mastered[k] = 1; save();
}
function unmarkMastered(card) {
  const k = cardKey(card);
  if (!SAVED.mastered[k]) return;
  delete SAVED.mastered[k]; save();
}

/* ── the five course tracks ─────────────────────────────
   The curriculum's own shape, one level above the numbered lessons.  A stage
   belongs to exactly one track, and the drawer is built from this table and
   nothing else, so the navigation cannot drift from the curriculum.

   Each track is named as the lessons are: the Sanskrit in IAST, with the
   English as its gloss.  Stage ranges are deliberately not among the fields
   — which directory numbers a track spans is how this repository is laid
   out, not something a learner has any use for.

   Pūjā-Vāk, Svara-Vidyā and Avadhāna are the curriculum's own names.
   Bhāṣā-Vidyā and Kāvya-Racanā are not: nothing in the repository names
   those two groupings, so they were coined here to match. Rename them
   freely — this table is the only place either appears.

   Stage 20 is the one place the source diagram is ambiguous: Svara-Vidyā is
   drawn as a track in its own right, yet the poetic track's range is written
   "18–26", which contains it.  Stage 17 is carved out of its neighbouring
   range in exactly the same way, and there it is unambiguous because
   "14–16, 18–26" simply skips it.  Reading 20 the same way — a named track
   lifted out of the range around it — is what the diagram means, so it is
   excluded from the poetic track here rather than counted twice. */
const TRACKS = [
  { id: 'bhasha',   name: 'Bhāṣā-Vidyā',  gloss: 'Language Acquisition',
    has: s => s >= 1 && s <= 13 },
  { id: 'kavya',    name: 'Kāvya-Racanā', gloss: 'Poetic Composition',
    has: s => (s >= 14 && s <= 16) || (s >= 18 && s <= 26 && s !== 20) },
  { id: 'puja',     name: 'Pūjā-Vāk',     gloss: 'Ritual Literacy',
    has: s => s === 17 },
  { id: 'svara',    name: 'Svara-Vidyā',  gloss: 'Vedic Literacy',
    has: s => s === 20 },
  { id: 'avadhana', name: 'Avadhāna',     gloss: 'Attention Under Pressure',
    has: s => s >= 27 && s <= 36 }
];
/* Cross-cutting practice sits outside the stage sequence, so it is not a
   sixth track: it is listed after the five, and belongs to no track's
   percentage.  The five are the course; this is what runs alongside it. */
const CROSS_TRACK = {
  id: 'vyakaranam', name: 'Vyākaraṇam', gloss: 'Formal Grammar'
};
const trackOf = stage => TRACKS.find(t => t.has(stage)) || CROSS_TRACK;

/* Lessons in curriculum order — the order the build handed the decks over —
   each carrying its decks and the distinct cards they hold. */
const DECK_IDS = {};
Object.keys(DECKS).forEach(n => { DECK_IDS[n] = new Set(DECKS[n].map(cardKey)); });

const LESSONS = (() => {
  const by = new Map();
  Object.keys(DECKS).forEach(name => {
    const key = DECK_LESSON[name];
    if (!by.has(key)) by.set(key, {
      lesson: key, stage: DECK_STAGE[name],
      label: LESSON_LABEL[key] || key, decks: [], ids: new Set()
    });
    const L = by.get(key);
    L.decks.push(name);
    DECK_IDS[name].forEach(k => L.ids.add(k));
  });
  return [...by.values()];
})();

/* The drawer's spine: each track that has any practice at all, with its
   lessons and the union of their cards.  A track with no practice yet is
   left out rather than shown as an empty 0% — the drawer navigates what
   exists. */
const TRACK_ROWS = (() => {
  const rows = [];
  [...TRACKS, CROSS_TRACK].forEach(track => {
    const lessons = LESSONS.filter(L => trackOf(L.stage) === track);
    if (!lessons.length) return;
    const ids = new Set();
    lessons.forEach(L => L.ids.forEach(k => ids.add(k)));
    rows.push({ track, lessons, ids });
  });
  return rows;
})();
const ALL_IDS = (() => {
  const s = new Set();
  TRACK_ROWS.forEach(r => r.ids.forEach(k => s.add(k)));
  return s;
})();

/* Progress is mastered cards over cards held, counted from cards the whole
   way up: a track's figure is the union of its lessons' cards, never the
   average of their percentages — that would give a five-card lesson the same
   weight as a hundred-card one.

   Every card the app carries counts towards it.  What is here is curated
   practice plus the paradigm tables the badges ask for whole; reference
   material was never brought in, so there is nothing to filter out and
   nothing to dilute the figure. */
function progressOf(ids) {
  const total = ids.size;
  let done = 0;
  ids.forEach(k => { if (SAVED.mastered[k]) done++; });
  let pct = total ? Math.round(done / total * 100) : 0;
  /* Rounding must not hand out a tick's worth of progress that has not been
     earned, nor swallow the first card of a long list. */
  if (pct === 100 && done < total) pct = 99;
  if (pct === 0 && done > 0) pct = 1;
  return { done, total, pct, full: total > 0 && done === total };
}

/* Two independent settings now:
     DIR  — which way round the card runs: 'reveal' (word → meaning)
            or 'produce' (meaning → word).  One button flips it.
     IAST — whether the transliteration is shown at all.  A checkbox.
   Migrate anyone carrying the old three-way mode: 'script' was
   really "word → meaning with the transliteration off". */
if (SAVED.mode && SAVED.dir === undefined) {
  SAVED.dir  = SAVED.mode === 'produce' ? 'produce' : 'reveal';
  SAVED.iast = SAVED.mode !== 'script';
  delete SAVED.mode;
  save();
}
let DIR  = SAVED.dir === 'produce' ? 'produce' : 'reveal';
let IAST = SAVED.iast !== false;

/* What a reveal card runs between.  Most lists are a word and its meaning,
   but plenty are not: a paradigm cell answers with an analysis, a sandhi rule
   with the result of a join, a gaṇa with its name.  Saying "word → meaning"
   over those was simply wrong, so each list can name its own pair in
   practice.json and both labels are read off that one string.

   A list with no reveal cards at all runs one way by construction — see
   setDirFor, which greys the button rather than labelling it falsely. */
const DEFAULT_PAIR = 'word \u2192 meaning';
const pairOf = name => DECK_PAIR[name] || DEFAULT_PAIR;
/* A cross-list draw has no single pair, so it falls back to the general one. */
const currentPair = () => (mixed || !deckName ? DEFAULT_PAIR : pairOf(deckName));

function dirLabel() {
  const half = currentPair().split(' \u2192 ');
  return DIR === 'produce' ? half[1] + ' \u2192 ' + half[0]
                           : half[0] + ' \u2192 ' + half[1];
}

/* The IAST toggle hides a TRANSLITERATION.  A card whose front carries no
   Devanagari has none to hide: its second line is content in its own right.
   A gaṇa's "laghu guru guru" reads a pattern of marks, it does not
   transliterate one, and hiding it left the card with nothing but the marks.
   So the toggle governs a card only when there is Devanagari to transliterate,
   which is a fact about the card rather than about the list — the vṛtta deck
   holds twelve pattern cards and two ordinary headwords, and each behaves as
   what it is. */
const DEVANAGARI = /[\u0900-\u097F]/;
const transliterates = c => DEVANAGARI.test(c.devanagari || '');
const showIast = c => IAST || !transliterates(c);

/* Both toggles are meaningless on an interactive card: a transformation runs
   one way, and the IAST there *is* the content rather than a gloss of it.
   They are greyed for as long as one is showing, and the direction button
   stops claiming a pair it cannot offer. */
function setToggles(dirOn, iastOn) {
  if (iastOn === undefined) iastOn = dirOn;
  $('dir').disabled = !dirOn;
  $('iast-on').disabled = !iastOn;
  $('dir-label').textContent = dirOn ? dirLabel() : 'one direction only';
  $('dir').setAttribute('aria-label', dirOn
    ? 'Direction: ' + dirLabel() + '. Tap to reverse.'
    : 'This list runs one way, so the direction cannot be reversed.');
  $('iast-on').title = iastOn ? ''
    : 'This card has no Devanagari, so its second line is content rather than '
      + 'a transliteration, and is always shown.';
}

function setDir(d) {
  DIR = d; SAVED.dir = d; save();
  document.body.classList.toggle('mode-produce', d === 'produce');
  setToggles(!$('dir').disabled);
  if (current) paint();
}

function setIast(on) {
  IAST = !!on; SAVED.iast = IAST; save();
  $('iast-on').checked = IAST;
  if (current) paint();
}

/* A deck's full name is its key — it keys DECKS and the saved per-deck
   progress — but it is too long to head a row on a phone.  The short form
   drops the leading number and the "— descriptor" tail, keeping the phrase
   before an "&" if it is still long.  The descriptor is not thrown away:
   DECK_DESC returns it, and the drawer prints it on the row's second line.

   Within a lesson this ordering is load-bearing.  DECK_SHORT displays the
   text before the em dash, which is what puts "Practice" above "Table
   mastery" and "Conjugation mastery" in the drawer. */
const DECK_DESC = name => {
  const m = name.match(/^.*?\s+—\s+(.*)$/);
  return m ? m[1] : "";
};
const DECK_SHORT = name => {
  /* The lesson optgroup now says which stage a deck belongs to, so the deck's
     own leading number is dropped from the display — it buys nothing and
     costs width on a phone.  The VALUE keeps it. */
  const m = name.match(/^((?:V?\d+|S)\s*·\s*)?(.*)$/);
  let t = m[2].split(/\s+—\s+/)[0];
  const room = 26;
  if (t.length > room && t.includes(" & ")) t = t.split(" & ")[0];
  if (t.length > room) t = t.slice(0, room).replace(/\s+\S*$/, "");
  t = t.replace(/[\s,&·—]+$/, "");
  return t || name;
};

/* ── the drawer ─────────────────────────────────────────
   Navigation is track → lesson → deck, opened from the button that names
   the list you are on.  A left drawer rather than a fixed sidebar: this page
   is used on a phone, where a permanent panel would eat the card.

   Everything below the mode buttons is rebuilt each time the drawer opens,
   because every percentage in it can have moved since it was last seen. */
const openTracks = new Set();
const openLessons = new Set();
const drawerOpen = () => !$('drawer').hidden;

const toggleIn = (set, key) => { set.has(key) ? set.delete(key) : set.add(key); };

/* The button where the picker used to be, naming the list in play.  It
   carries the lesson as well as the deck: within a lesson the decks are
   called "Practice" and "Table mastery", so the deck name on its own would
   not say whose practice you are in. */
function syncNav() {
  const label = deckName ? LESSON_LABEL[DECK_LESSON[deckName]] : '';   // the lesson, in IAST
  $('nav-label').textContent =
      deckName === MIX     ? 'mixed review'
    : deckName === TROUBLE ? 'trouble cards'
    : deckName             ? [label, DECK_SHORT(deckName)].filter(Boolean).join(' \u00b7 ')
    :                        'lists';
}

function fillRow(el, parts) {
  Object.entries(parts).forEach(([sel, text]) => {
    const t = el.querySelector(sel);
    if (t) t.textContent = text;
  });
}
const setBar = (el, pct) => { const i = el.querySelector('.bar i'); if (i) i.style.width = pct + '%'; };

/* A level that has one child adds a step without adding information: a track
   with a single lesson repeats itself (Pūjā-Vāk inside Pūjā-Vāk), and a lesson
   with a single list is just that list wearing a second name.  Both are folded
   away here.

   Folded by what exists, never by a list of exceptions — so the level comes
   back on its own the moment a second lesson or a second list does, and the
   curriculum's own shape is still the only thing driving the drawer. */
const soleLesson = row => row.lessons.length === 1 ? row.lessons[0] : null;
const soleDeck   = L   => L.decks.length === 1 ? L.decks[0] : null;
const count = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

/* One row of the drawer.  `cls` is the level it is drawn at, so a list
   standing in for its lesson keeps the lesson's size and indent. */
function rowButton(cls, { name, pct, sub, full, on, bar, title }) {
  const b = document.createElement('button');
  /* a deck row is `.dk`; the two levels above it are `.tr-head` / `.ls-head` */
  b.className = (cls === 'dk' ? 'dk' : cls + '-head') + (on ? ' on' : '');
  b.innerHTML = `<span class="${cls}-name"></span><span class="${cls}-pct"></span>`
              + `<span class="${cls}-sub"></span>` + (bar ? '<span class="bar"><i></i></span>' : '');
  fillRow(b, { ['.' + cls + '-name']: name,
               ['.' + cls + '-pct']: full ? '✓' : pct + '%',
               ['.' + cls + '-sub']: sub });
  if (bar) setBar(b, pct);
  if (title) b.title = title;
  return b;
}

/* A list, drawn at whatever level it has been folded up to. */
function deckRow(name, cls) {
  cls = cls || 'dk';
  const p = progressOf(DECK_IDS[name]);
  const b = rowButton(cls, {
    name: DECK_SHORT(name), pct: p.pct, full: p.full, on: name === deckName,
    bar: cls !== 'dk', title: name,
    sub: [DECK_DESC(name), DECKS[name].length + ' cards'].filter(Boolean).join(' · ')
  });
  b.classList.add('leaf');
  b.addEventListener('click', () => chooseDeck(name));
  return b;
}

function lessonRow(L) {
  const one = soleDeck(L);
  if (one) return deckRow(one, 'ls');       // the lesson IS that list

  const p = progressOf(L.ids), open = openLessons.has(L.lesson);
  const wrap = document.createElement('div');
  wrap.className = 'ls' + (p.full ? ' full' : '');
  const head = rowButton('ls', {
    name: L.label, pct: p.pct, full: p.full, bar: true,
    sub: [LESSON_GLOSS[L.lesson], count(L.decks.length, 'list')].filter(Boolean).join(' · ')
  });
  head.setAttribute('aria-expanded', open ? 'true' : 'false');
  head.addEventListener('click', () => { toggleIn(openLessons, L.lesson); renderDrawer(); });
  wrap.appendChild(head);

  const body = document.createElement('div');
  body.className = 'ls-body';
  body.hidden = !open;
  L.decks.forEach(name => body.appendChild(deckRow(name)));
  wrap.appendChild(body);
  return wrap;
}

function renderDrawer() {
  const all = progressOf(ALL_IDS);
  fillRow(document, { '#dp-pct': all.pct + '%',
                      '#dp-sub': all.done + ' of ' + all.total + ' cards mastered' });
  $('dp-bar').style.width = all.pct + '%';

  const host = $('dr-tracks');
  host.innerHTML = '';
  TRACK_ROWS.forEach(row => {
    const t = row.track, p = progressOf(row.ids), open = openTracks.has(t.id);
    const only = soleLesson(row);
    const onlyDeck = only && soleDeck(only);
    const wrap = document.createElement('div');
    wrap.className = 'tr' + (p.full ? ' full' : '');

    /* A track that comes down to a single list is that list: no heading of
       its own to expand, since there is nothing underneath to reveal. */
    if (onlyDeck) {
      const head = deckRow(onlyDeck, 'tr');
      /* the track's own name and gloss lead.  The list's descriptor is left
         off: at this level it only ever restates the gloss it sits beside. */
      fillRow(head, { '.tr-name': t.name,
        '.tr-sub': t.gloss + ' · ' + DECKS[onlyDeck].length + ' cards' });
      wrap.appendChild(head);
      host.appendChild(wrap);
      return;
    }

    const head = rowButton('tr', {
      name: t.name, pct: p.pct, full: p.full, bar: true,
      /* one lesson: name it here rather than saying "1 lesson" and repeating
         the track's own name on the row below */
      sub: only
        ? (only.label === t.name ? t.gloss : only.label) + ' · ' + count(only.decks.length, 'list')
        : t.gloss + ' · ' + count(row.lessons.length, 'lesson')
    });
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.addEventListener('click', () => { toggleIn(openTracks, t.id); renderDrawer(); });
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'tr-body';
    body.hidden = !open;
    if (only) only.decks.forEach(n => body.appendChild(deckRow(n)));
    else row.lessons.forEach(L => body.appendChild(lessonRow(L)));
    wrap.appendChild(body);
    host.appendChild(wrap);
  });
}

function openDrawer() {
  closePop();
  /* Land on where you are rather than on a wall of shut headings: the track
     and lesson holding the current list are opened on the way in. */
  const L = LESSONS.find(x => x.lesson === DECK_LESSON[deckName]);
  if (L) { openTracks.add(trackOf(L.stage).id); openLessons.add(L.lesson); }
  renderDrawer();
  relabelAll();
  $('dveil').hidden = false;
  $('drawer').hidden = false;
  $('nav').setAttribute('aria-expanded', 'true');
  $('dr-close').focus();
}

function closeDrawer(to) {
  if (!drawerOpen()) return;
  $('dveil').hidden = true;
  $('drawer').hidden = true;
  $('nav').setAttribute('aria-expanded', 'false');
  /* Focus must not be left on a row that is now hidden.  It returns to the
     handle, except when a list was picked: there it goes to the card, so
     space flips it straight away instead of re-opening the drawer. */
  $(to === 'card' ? 'card' : 'nav').focus();
}

/* Picking a list from the drawer, with the same guard the picker carried:
   a round that has been graded is not thrown away without asking. */
async function chooseDeck(name) {
  if (name === deckName && !mixed) { closeDrawer('card'); return; }   // already here
  if (roundInProgress()
      && !await ask('Leave this round? Your progress in it will be lost.', 'Leave it')) return;
  closeDrawer('card');
  loadDeck(name);
}

/* Review, trouble and the scoreboard all open from the drawer, which then
   gets out of the way. */
function openFromDrawer(fn) {
  closeDrawer();
  fn();
}

/* The row is live from the first load whether the mode is or not: a locked
   one opens the panel that says what it is and what unlocks it, exactly as
   the trouble row does with an empty list. */
function syncReviewUI() {
  const pool = reviewPool().length, m = masteryPct();
  /* The figure the mode exists to produce, on the row that opens it — it
     used to be visible only after opening the scoreboard. */
  $('dm-review').textContent =
      pool < REVIEW_MIN ? 'locked \u00b7 ' + pool + ' of ' + REVIEW_MIN + ' cards'
    : m === null        ? 'ready \u00b7 a ' + REVIEW_SIZE + '-card draw'
    :                     m + '% mastery \u00b7 ' + SAVED.review.seen + ' cards drawn';
  $('dr-review').classList.toggle('on', panelOpen === 'reviewpanel');
}

/* ── the review window ──────────────────────────────────────
   What the mode is, whether it can run yet, and the button that runs it. */
function renderReviewPanel() {
  const pool = reviewPool().length, ready = pool >= REVIEW_MIN;
  const lists = finishedDecks().length, s = lists > 1 ? "s" : "";
  $('rp-sub').textContent = ready
    ? "ready \u00b7 drawing from " + pool + " cards across " + lists + " finished list" + s
    : "locked \u00b7 " + pool + " of " + REVIEW_MIN + " cards finished";
  $('rp-note').textContent = REVIEW_SIZE + " cards drawn at random from every list you "
    + "have finished, shuffled out of their decks so nothing is guessable from its "
    + "neighbour. No list's best score changes \u2014 what you know cold feeds the review "
    + "mastery figure on the scoreboard."
    + (ready ? "" : " Unlocks at " + REVIEW_MIN + " unique cards finished.");
  $('rp-actions').hidden = false;
  $('rp-draw').hidden = !ready;
  $('rp-draw').textContent = "Draw " + REVIEW_SIZE
    + (mixed && !trouble ? " more" : " cards");
}

const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ── round control ─────────────────────────────────────── */
function startRound(cards, opt) {
  opt = opt || {};
  closePop();
  if (panelOpen) closePanel();          // never start a round behind a panel
  roundSource = cards;
  reviewing = !!opt.review;
  mixed = !!opt.mixed;
  trouble = !!opt.trouble;
  clearedAt = SAVED.cleared;
  queue = shuffle(cards.map(card => ({ card, missedThisRound: false })));
  missed = []; learned = 0;
  if (trouble)            $('stage').textContent = "trouble cards \u00b7 " + cards.length
                                                 + (reviewing ? " you missed" : " to clear");
  else if (reviewing && mixed) $('stage').textContent = "mixed review \u00b7 " + cards.length + " you missed in the draw";
  else if (reviewing)     $('stage').textContent = "review \u00b7 " + cards.length + " cards you missed";
  $('review').style.display = 'none';
  $('card').style.display = 'flex';
  $('after').hidden = true;
  $('tally').style.visibility = 'visible';
  $('keys').hidden = false;
  next();
}

function loadDeck(name) {
  if (!Object.keys(DECKS).length) {              // nothing parsed — say so instead of dying
    $('dn').textContent = "रिक्तम्";
    $('iast').textContent = "riktam — no cards";
    $('gloss').textContent = PARSE.fatal || "every line was skipped — check the card block";
    $('card').classList.add('open');
    $('tally').style.visibility = 'hidden';
    return;
  }
  /* Called with no name on first load: fall back to the list last used, and
     to the first one in the curriculum if that list is gone. */
  if (!name || !DECKS[name]) name = DECKS[SAVED.deck] ? SAVED.deck : Object.keys(DECKS)[0];
  deckName = name;
  SAVED.deck = name; save();
  mixed = trouble = false;
  relabelAll();
  setToggles(true);            // the new list names its own pair
  $('restart').textContent = "Whole deck again";
  const src = DECKS[name];
  const best = deckState(name).best;
  /* The lesson is named by the selector directly above this line, and a
     stage number — how this repository orders its directories — used to be
     printed here and tells a learner nothing.  So the caption is left with
     what neither of those says. */
  $('stage').textContent = [
    DECK_DESC(name),
    best ? "best " + best[0] + "/" + best[1] : ""
  ].filter(Boolean).join(" · ");
  refreshPile();
  startRound([...src], {});
}

/* ── mixed review ──────────────────────────────────────────
   Every card of every finished list, pooled, shuffled, and the first
   REVIEW_SIZE taken.  A flat draw on purpose: weighting it towards the
   cards you keep missing would flatter the number, and the whole point
   of this mode is to measure what actually stayed. */
/* Drawn round-robin across the finished lists rather than flat across their
   cards, so one large list cannot swamp a session.  That matters now the
   paradigm decks exist: a complete declension table is a hundred-odd cards,
   and a flat draw would make every review mostly that table.

   Still unweighted WITHIN a list — the draw measures what stayed, and
   favouring the cards you keep missing would flatter the number.  Weighted
   practice is what the trouble drill is for.  Exhaustive coverage of a table
   therefore happens across many sessions, not in any one of them. */
function mixCards() {
  const byDeck = new Map();
  reviewPool().forEach(c => {
    const d = DECK_OF.get(c) || '';
    if (!byDeck.has(d)) byDeck.set(d, []);
    byDeck.get(d).push(c);
  });
  const piles = shuffle([...byDeck.values()].map(cs => shuffle(cs)));
  const out = [];
  for (let i = 0; out.length < REVIEW_SIZE; i++) {
    let took = false;
    for (const pile of piles) {
      if (i >= pile.length) continue;
      out.push(pile[i]);
      took = true;
      if (out.length === REVIEW_SIZE) break;
    }
    if (!took) break;                    // every list exhausted
  }
  return out;
}

function startMixedReview() {
  if (reviewPool().length < REVIEW_MIN) return;      // the button is disabled, but still
  const lists = finishedDecks().length;
  const cards = mixCards();
  deckName = MIX;
  relabelAll();
  $('stage').textContent = ["mixed review", cards.length + " cards",
                            lists + " list" + (lists > 1 ? "s" : "")].join(" \u00b7 ");
  $('pile').hidden = true;
  $('restart').textContent = "Draw " + REVIEW_SIZE + " more";
  startRound(cards, { mixed: true });
}

/* ── the trouble drill ──────────────────────────────────────
   A cross-list round like the review, and like it, it keeps no list's
   books.  Unlike it, it never feeds review mastery: these are the cards
   you already know you are losing, so counting them would flatter it. */
function startTroubleDrill() {
  const cards = troubleCards();
  if (!cards.length) return;
  deckName = TROUBLE;
  $('pile').hidden = true;
  $('restart').textContent = "Drill these again";
  startRound(cards, { review: true, mixed: true, trouble: true });
  relabelAll();
}

/* the persisted "missed last time" pile for the current deck */
function pileCards() {
  const src = DECKS[deckName];
  if (!src) return [];                   // the mixed review keeps no pile of its own
  const keys = new Set(deckState(deckName).pile || []);
  return src.filter(c => keys.has(cardKey(c)));
}
function refreshPile() {
  const n = pileCards().length;
  $('pile').hidden = !n;
  if (n) $('pile').textContent = "practise the " + n + " missed last time";
}

function updateTally() {
  $('t-left').textContent = queue.length + (current ? 1 : 0);
  $('t-knew').textContent = learned;
  $('t-miss').textContent = missed.length;
}

  for (const t of TERMS) {

    if (after && LETTER.test(after)) continue;
