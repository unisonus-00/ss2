 Translate into English (5 marks):\n1. asato mā sadgamaya\n2. he devi! mama duḥkhaṃ nāśaya\n3. sarve bhavantu sukhinaḥ\n4. tava kṛpayā sarvam śubham bhavatu\n5. he jagadīśvara! dehi me vivekam\n\n**D2.** Translate into Sanskrit (5 marks):\n1. O Śiva, protect me always\n2. May the Goddess be victorious\n3. Give me peace, give me knowledge\n4. Save me from ignorance\n5. May all beings be happy\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 16: Prārthanā — Workbook (Answers)\n\n## Section A\n**A1.** 1. **pāhi** 2. **dehi** 3. **kuru** 4. **kṣamasva** 5. **śṛṇu**\n**A2.** 1. **pātu** 2. **bhavatu** 3. **jayatu** 4. **rakṣatu** 5. **karotu**\n\n## Section B\n**B1.** 1. **dehi** 2. **kṣamasva** 3. **trāhi** (or pāhi) 4. **naya** 5. **śṛṇu**\n\n**B2.** Sample: dehi me jñānam / dehi me bhaktim / dehi me śāntim / dehi me balam / dehi me muktim\n\n**B3.** Sample: bhayāt trāhi mām / pāpāt rakṣa mām / duḥkhāt trāhi mām / ajñānāt rakṣa mām / saṃsārāt uddhara mām\n\n## Section C\n**C1.** Sample prayer to Devī:\n> he devi! he jagadambe!\n> śṛṇu mama prārthanām.\n> mama pāpaṃ kṣamasva.\n> mama ajñānaṃ nāśaya.\n> dehi me jñānam, dehi me bhaktim.\n> bhayāt trāhi mām, duḥkhāt rakṣa mām.\n> tava pādayoḥ mama manaḥ sthāpaya.\n> tvām eva śaraṇaṃ prapadye.\n\n**C2.** Sample:\n> śivaḥ pātu mama śiraḥ / devī rakṣatu mama hṛdayam\n> gaṇeśaḥ nayatu mama mārgam / sarasvatī bodhayatu mama buddhim\n> sarve devāḥ mama jīvanaṃ maṅgalaṃ kurvantu\n\n## Section D\n**D1.**\n1. Lead me from untruth to truth\n2. O Goddess, destroy my sorrow\n3. May all be happy\n4. By your grace, may all be auspicious\n5. O Lord of the world, give me discrimination\n\n**D2.**\n1. **he śiva! sadā mām pāhi** (or rakṣa mām sadā)\n2. **devī jayatu**\n3. **dehi me śāntim, dehi me jñānam**\n4. **ajñānāt trāhi mām** (or ajñānāt rakṣa mām)\n5. **sarve prāṇinaḥ sukhinaḥ bhavantu** (or sarve bhūtāḥ sukhinaḥ bhavantu)\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 16 Badge: Prārthanāsiddha\n\n**Title:** Prayer Composer\n**Badge:** 🏅 Prārthanāsiddha\n\n## Requirements\n\nWrite and recite an original Sanskrit prayer of 6+ lines using imperatives, vocatives, and at least 3 different vibhaktis.\n\n## How to Demonstrate\n\n**Format:** Voice note + text\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 17 content and grants the **Prārthanāsiddha** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "17-puja-vak", "number": 17, "title": "Puja-Vak", "subtitle": "Sankalpa, Nyasa, Dhyana, Upacara", "files": {"theory": "# Pūjā-Vāk — The Sanskrit of Ritual\n\n## Goal\nUnderstand how Sanskrit actually functions inside a pūjā — not as \"prayers recited in Sanskrit\" but as a precise technology where grammar, mantra-structure, and ritual action are inseparable. Learn to read saṅkalpa, nyāsa, dhyāna-śloka, and āvaraṇa-pūjā as applied Sanskrit grammar.\n\n## Position in the Syllabus\nInsert after Prārthanā (Stage 14). You can now compose original prayers. This stage shows you how the tradition composes its prayers — with exact grammatical and mantric architecture.\n\n## Source Material\nPrimary examples drawn from:\n- Kāmākṣī Navāvaraṇa Pūjā Paddhati (Kāñcī Sampradāya)\n- Śrīvidyā Pūjā Vidhi\n- Nityāṣoḍaśikārṇava (NST)\n- Dīkṣitar's Kamalāmbā Navāvaraṇa Kṛtis\n\n---\n\n## Part 1: The Grammar of Ritual — What Sanskrit Is Doing in a Pūjā\n\nA pūjā is not a devotional freestyle. It is a structured sequence where each Sanskrit utterance performs a specific function. The language is not *describing* worship — it IS the worship. Seven distinct modes of Sanskrit appear in a standard pūjā:\n\n| Mode | Sanskrit Function | Grammar Deployed | Example |\n|------|------------------|-----------------|---------|\n| **Saṅkalpa** | Declaration of intent | Future participle, dative of purpose, locative of time/place | \"I shall perform the worship of X, for the sake of Y, at this time and place\" |\n| **Nyāsa** | Installation of mantras in the body | Dative (\"to this limb\") + mantra + \"namaḥ\" | \"aṅguṣṭhābhyāṃ namaḥ\" — \"salutation to the two thumbs\" |\n| **Dhyāna** | Visualization verse | Accusative (the one visualized), present participles, bahuvrīhi compounds | \"I meditate on [her] who holds X, who sits on Y, who shines like Z\" |\n| **Āvāhana** | Invocation | Imperative or optative, vocative | \"Come, O Devī! Be present here!\" |\n| **Upacāra** | Offering | Dative (\"to X\") + accusative (\"this offering\") + verb of offering | \"śrīlalitāyai namaḥ — gandhaṃ samarpayāmi\" |\n| **Stotra** | Praise | Nominative chains, vocative, varied vibhaktis | Free composition within metrical form |\n| **Visarjana** | Departure | Imperative, optative | \"Go to your own place, O Devī\" |\n\nEach mode has its own grammar. Learning pūjā-Sanskrit means learning when to use which mode.\n\n---\n\n## Part 2: Saṅkalpa — The Grammar of Intent\n\nThe saṅkalpa is the most grammatically precise utterance in the entire pūjā. It declares who is performing what worship, for whom, when, where, and for what purpose. Every word is inflected to carry its exact semantic role.\n\n### Structure\n\nA saṅkalpa typically follows this skeleton:\n\n> [Time — locative] [Place — locative] [Performer — nominative] [Deity — genitive/dative] [Rite — accusative] [Purpose — dative/artham] [Verb — kariṣye/kariṣyāmi]\n\n### Example: Śrīvidyā Pūjā Saṅkalpa\n\n> *asmin śubha-muhūrte, śrīmahātripurasundaryāḥ ārādhanārtham, bhukti-mukti-phalapradaṃ śrīcakra-navāvaraṇa-pūjām ahaṃ kariṣye*\n\n| Word/Phrase | Case | Function |\n|------------|------|----------|\n| asmin śubha-muhūrte | **Saptamī** (locative) | \"At this auspicious moment\" — time |\n| śrīmahātripurasundaryāḥ | **Ṣaṣṭhī** (genitive) | \"Of Śrī Mahātripurasundarī\" — the deity worshipped |\n| ārādhanārtham | **Accusative + artham** | \"For the sake of worship\" — purpose |\n| bhukti-mukti-phalapradaṃ | **Dvitīyā** (accusative) | \"That which bestows the fruits of enjoyment and liberation\" — describing the pūjā |\n| śrīcakra-navāvaraṇa-pūjām | **Dvitīyā** (accusative) | \"The nine-enclosure worship of the Śrīcakra\" — the object of kariṣye |\n| ahaṃ | **Prathamā** (nominative) | \"I\" — the performer |\n| kariṣye | **Verb** (lṛṭ lakāra, first person singular) | \"I shall perform\" — simple future |\n\n### What to Notice\n\n- The saṅkalpa uses **lṛṭ** (simple future) — not loṭ (imperative), not liṅ (optative). The performer is not requesting or hoping. They are *declaring what they will do.* This is the grammar of sovereign intention.\n- The deity appears in **ṣaṣṭhī** (genitive) — \"of Tripurasundarī\" — because the pūjā *belongs to* the deity, not the other way around. The performer serves; the deity possesses.\n- **artham** (purpose) takes a genitive or a compound — ārādhana + artham = \"for the sake of worship.\" This is a standard Sanskrit construction for expressing purpose.\n- Every samāsa in the saṅkalpa is a **tatpuruṣa** or **karmadhāraya** — determinative compounds. Saṅkalpas don't use bahuvrīhi (descriptive) or dvandva (coordinative). The language of intent is precise, not decorative.\n\n---\n\n## Part 3: Nyāsa — Grammar Installed in the Body\n\nNyāsa (\"placing\") is the ritual installation of mantric syllables at specific locations on the body. Grammatically, it deploys the **caturthī** (dative) case systematically — every phrase says \"to [this body-part], namaḥ.\"\n\n### Kara-Nyāsa (Hand Placement)\n\n| Mantra | Body Part (Dative) | Translation |\n|--------|--------------------|-------------|\n| aṃ **aṅguṣṭhābhyāṃ** namaḥ | Two thumbs (dvivacana dative) | \"Salutation to the two thumbs\" |\n| āṃ **tarjanībhyāṃ** namaḥ | Two index fingers | \"Salutation to the two index fingers\" |\n| iṃ **madhyamābhyāṃ** namaḥ | Two middle fingers | \"Salutation to the two middle fingers\" |\n| īṃ **anāmikābhyāṃ** namaḥ | Two ring fingers | \"Salutation to the two ring fingers\" |\n| uṃ **kaniṣṭhikābhyāṃ** namaḥ | Two little fingers | \"Salutation to the two little fingers\" |\n| ūṃ **karatalakarapṛṣṭhābhyāṃ** namaḥ | Palm and back of hand | \"Salutation to palm-and-back\" |\n\n### What to Notice — Grammatically\n\n- Every body-part is in **caturthī dvivacana** (dative dual) — because you have two hands. The suffix **-ābhyām** is the dual dative/instrumental ending. You are literally practicing dvivacana declension during nyāsa.\n- The bīja changes with each placement (aṃ, āṃ, iṃ, īṃ, uṃ, ūṃ) — this is the vowel sequence from the varṇamālā applied systematically to the body. The nyāsa IS the alphabet walking through the fingers.\n- **namaḥ** at the end is an indeclinable (avyaya) functioning as the verb of offering. Every nyāsa sentence is: [bīja] + [body-part in dative] + namaḥ.\n\n### Aṅga-Nyāsa (Limb Placement)\n\n| Mantra | Body Part (Dative) | Grammar Note |\n|--------|--------------------|-------------|\n| hrīṃ **hṛdayāya** namaḥ | Heart (caturthī ekavacana) | hṛdaya + -āya = neuter dative singular |\n| śrīṃ **śirase** svāhā | Head (caturthī) | śiras + -e = neuter s-stem dative |\n| krīṃ **śikhāyai** namaḥ | Tuft (caturthī) | śikhā + -āyai = feminine ā-stem dative |\n| klīṃ **kavacāya** hum | Armor/torso (caturthī) | kavaca + -āya = neuter dative |\n| aiṃ **netratrayāya** vauṣaṭ | Three eyes (caturthī) | netra-traya + -āya = compound neuter dative |\n| sauḥ **astrāya** phaṭ | Weapon (caturthī) | astra + -āya = neuter dative |\n\n### What to Notice\n\n- The seed-syllable changes with each limb and corresponds to the deity's specific bījas (hrīṃ for heart, etc.)\n- The **ending word changes** — namaḥ, svāhā, hum, vauṣaṭ, phaṭ. These are not synonyms. Each is a specific ritual closing with its own function:\n  - **namaḥ** = surrender/offering\n  - **svāhā** = oblation (originally the Vedic offering-call into fire)\n  - **hum** = protection/warding\n  - **vauṣaṭ** = empowerment (Vedic: the call at the moment of offering)\n  - **phaṭ** = dispersal/weapon-deployment\n- The grammar is **always dative** — the body-part is the *recipient* of the mantra. You are giving the mantra to that location. The dative IS the ritual act of installation.\n\n### Mātṛkā-Nyāsa: The Alphabet Installed\n\nIn mātṛkā-nyāsa, all 50 letters of the Sanskrit alphabet are placed on the body — each letter at a specific location, in sequence, using the same dative construction:\n\n| Letters | Body Location | Pattern |\n|---------|--------------|---------|\n| a, ā | Crown (brahmarandhra) | First vowels at the highest point |\n| i, ī | Right eye, left eye | The \"seeing\" vowels |\n| u, ū | Right ear, left ear | The \"hearing\" vowels |\n| ka-varga | Right arm (shoulder to fingertips) | Ākāśa-letters in the creative limb |\n| ca-varga | Right leg (hip to toes) | Vāyu-letters |\n| ṭa-varga | Left leg | Agni-letters |\n| ta-varga | Left arm | Āpas-letters |\n| pa-varga | Torso (navel to throat) | Pṛthivī-letters in the trunk |\n| ya ra la va | Spine and joints | Transitional letters at the joints |\n| śa ṣa sa ha | Heart, navel, mūlādhāra, all-pervading | Heat-letters at the fire-centers |\n\nAfter mātṛkā-nyāsa, the body IS the alphabet. Every subsequent mantra activates the locations where its letters were installed. The mantra plays the body like an instrument.\n\nThis is why nyāsa is performed before every pūjā — it is not a warm-up. It is the *tuning* of the instrument.\n\n---\n\n## Part 4: Dhyāna-Śloka — The Grammar of Seeing\n\nA dhyāna (meditation/visualization) verse describes the deity's form so precisely that the practitioner can *see* it. Grammatically, dhyāna-ślokas are dominated by:\n\n- **Bahuvrīhi compounds** (possessive descriptors): \"she whose eyes are like lotuses,\" \"he whose throat is blue\"\n- **Present participles** (śatṛ/śānac): \"sitting,\" \"holding,\" \"shining\"\n- **Accusative** of the person meditated upon (the object of dhyāyāmi, \"I meditate on\")\n\n### Example: Lalitā Dhyāna from the Kamakshi Paddhati\n\n> *sindūrāruṇa-vigrahāṃ trinayanāṃ māṇikya-mauli-sphurat-*\n> *tārā-nāyaka-śekharāṃ smitamukhīm āpīna-vakṣoruhām*\n\n| Element | Compound | Type | Meaning |\n|---------|----------|------|---------|\n| sindūrāruṇa-vigrahām | sindūra-aruṇa-vigraha + ām | Bahuvrīhi (accusative f.) | \"Her whose form is vermillion-dawn-red\" |\n| trinayanām | tri-nayana + ām | Bahuvrīhi (acc. f.) | \"Her who has three eyes\" |\n| māṇikya-mauli-sphurat-tārā-nāyaka-śekharām | Nested bahuvrīhi | Bahuvrīhi (acc. f.) | \"Her whose crest-jewel is the moon shining from a ruby crown\" |\n| smitamukhīm | smita-mukhī + m | Bahuvrīhi (acc. f.) | \"Her whose face is smiling\" |\n| āpīna-vakṣoruhām | āpīna-vakṣaḥ-ruha + ām | Bahuvrīhi (acc. f.) | \"Her whose breasts are full\" |\n\n### What to Notice\n\nEvery descriptor is a **bahuvrīhi in the accusative feminine** — because the entire verse is the object of \"dhyāyāmi\" (\"I meditate on [her]\"). The dhyāna-śloka is one enormous noun-phrase: a chain of accusative bahuvrīhis all modifying the same unstated \"tām\" (her). The grammar IS the visualization — each compound adds one more detail to the image being constructed in the mind.\n\n---\n\n## Part 5: The Āvaraṇa Bīja System — Grammar of Progressive Revelation\n\nIn the Śrīcakra navāvaraṇa pūjā, each of the nine enclosures has its own bīja. These bījas are not random — they form a grammatical *derivation sequence* where each bīja builds on the previous:\n\n| Āvaraṇa | Bīja | What Changed |\n|----------|------|-------------|\n| 1. Trailokyamohana | **aṃ āṃ sauḥ** | Seed-form: the simplest vowels + śakti-bīja |\n| 2. Sarvāśāparipūraka | **aiṃ klīṃ sauḥ** | Bālā herself enters — the three śakti bījas |\n| 3. Sarvasaṃkṣobhaṇa | **hrīṃ klīṃ sauḥ** | hrīṃ replaces aiṃ — māyā enters |\n| 4. Sarvasaubhāgyadāyaka | **haiṃ hklīṃ hsauḥ** | **ha** prefixed to each bīja — Śiva's breath enters |\n| 5. Sarvārthasādhaka | **hsaiṃ hsklīṃ hssauḥ** | **ha+sa** prefixed — full haṃsa (Śiva+Śakti) permeates |\n| 6. Sarvarakṣākara | **hrīṃ klīṃ bleṃ** | Pattern breaks — bleṃ = grounding, protection |\n| 7. Sarvarogahara | **hrīṃ śrīṃ sauḥ** | klīṃ → śrīṃ: desire becomes fullness |\n| 8. Sarvasiddhiprada | **hsaiṃ hsklīṃ hssauḥ** | Mirrors 5th — haṃsa returns |\n| 9. Sarvānandamaya | **Full Pañcadaśī** | All previous compressions expand into the complete vidyā |\n\n### The Linguistic Principle\n\nThis is **upasarga-like prefixation applied to bījas:**\n\n- Āvaraṇas 1-3: The base bījas establish themselves (aṃ → aiṃ → hrīṃ)\n- Āvaraṇa 4: **h-** prefixes each bīja — Śiva (ha = breath = the last consonant) enters every syllable\n- Āvaraṇa 5: **hs-** prefixes — the full haṃsa (ha + sa = Śiva + Śakti breathing together) permeates\n\nThis is exactly how Sanskrit builds meaning through prefixation: √gam (go) → **ā**-gam (come) → **sam-ā**-gam (come together). The bīja system works the same way: base bīja → h + bīja → hs + bīja. Each prefix deepens the energy.\n\nThe h-infusion means: *what was Śakti alone (aiṃ klīṃ sauḥ = Bālā = Śakti's mantra) now has Śiva breathing into it.* In the Hādī tradition, this reveals what the mūla-vidyā already states (ha is its first syllable). In the Kādī tradition, it compensates for what the Vāgbhava kūṭa withholds (ka leads, not ha).\n\n---\n\n## Part 6: Dīkṣitar's Vibhakti System — Case as Architecture\n\nMuttusvāmi Dīkṣitar composed 11 kṛtis for the Kamalāmbā navāvaraṇa cycle. Each kṛti uses a specific **vibhakti** (grammatical case) that matches the āvaraṇa number:\n\n| Kṛti | Āvaraṇa | Vibhakti | How the Case Functions |\n|------|---------|----------|-----------------------|\n| Dhyāna | (pre-) | Mixed | Setting the scene |\n| 1st āvaraṇa | Bhūpura | **Prathamā** (nominative) | \"Kamalāmbā **sambhavati**\" — she IS, she appears. Pure being. |\n| 2nd āvaraṇa | 16-petal | **Dvitīyā** (accusative) | \"Kamalāmb**ām** bhajare\" — worship HER. She becomes the object. |\n| 3rd āvaraṇa | 8-petal | **Tṛtīyā** (instrumental) | \"Kamalāmb**ayā**\" — BY her, THROUGH her. She becomes the means. |\n| 4th āvaraṇa | 14-triangle | **Caturthī** (dative) | \"Kamalāmb**āyai**\" — FOR her, TO her. She becomes the recipient. |\n| 5th āvaraṇa | 10-triangle (outer) | **Pañcamī** (ablative) | \"Kamalāmb**āyāḥ**\" — FROM her. She becomes the source. |\n| 6th āvaraṇa | 10-triangle (inner) | **Ṣaṣṭhī** (genitive) | \"Kamalāmb**āyāḥ**\" — OF her. She becomes the possessor. |\n| 7th āvaraṇa | 8-triangle | **Saptamī** (locative) | \"Kamalāmb**āyām**\" — IN her. She becomes the field. |\n| 8th āvaraṇa | Inner triangle | **Sambodhana** (vocative) | \"Kamalāmb**ike**!\" — O Kamalāmbikā! Direct address. |\n| 9th āvaraṇa | Bindu | Return to **Prathamā** | Full circle — she IS again, now at the center |\n\n### What This Teaches\n\nDīkṣitar is demonstrating that the eight vibhaktis are not just grammar — they are the **eight possible relationships between the worshipper and the deity:**\n\n1. She IS (identity — nominative)\n2. I worship HER (object — accusative)\n3. Through HER (means — instrumental)\n4. For HER (offering — dative)\n5. From HER (source — ablative)\n6. Of HER (belonging — genitive)\n7. In HER (location — locative)\n8. O! (direct encounter — vocative)\n\nThe pūjā walks the worshipper through all eight relationships, one āvaraṇa at a time. By the bindu (center), you have exhausted every possible grammatical relationship to the deity. There is nothing left but identity — prathamā again.\n\nThis is the most sophisticated integration of grammar and worship in any Indian tradition. Every Sanskrit student should study these kṛtis.\n\n---\n\n## Part 7: Upacāra — The Offering Formula\n\nThe standard offering sentence in pūjā follows a rigid template:\n\n> **[deity in dative] namaḥ — [offering in accusative] samarpayāmi**\n\nExample:\n> *śrīlalitā-mahātripurasundaryai namaḥ — gandhaṃ samarpayāmi*\n> \"Salutation to Śrī Lalitā Mahātripurasundarī — I offer sandalwood paste.\"\n\n| Component | Case | Word | Function |\n|-----------|------|------|----------|\n| śrīlalitā-mahātripurasundaryai | **Caturthī** (dative, f.) | The full name of the deity | Recipient of offering |\n| namaḥ | Indeclinable | \"Salutation\" | Ritually marks the offering |\n| gandham | **Dvitīyā** (accusative, n.) | Sandalwood paste | The thing offered |\n| samarpayāmi | Verb (causative, first person singular, present) | \"I offer/present\" | The act |\n\n### The 16 Upacāras as Sanskrit Vocabulary\n\n| # | Upacāra | Sanskrit | Case in Use |\n|---|---------|----------|-------------|\n| 1 | Invocation | āvāhanam | acc. (\"I perform invocation\") |\n| 2 | Seat | āsanam | acc. (\"I offer a seat\") |\n| 3 | Water for feet | pādyam | acc. |\n| 4 | Water for hands | arghyam | acc. |\n| 5 | Water to sip | ācamanīyam | acc. |\n| 6 | Bath | snānam / abhiṣekam | acc. |\n| 7 | Cloth | vastram | acc. |\n| 8 | Sacred thread | yajñopavītam | acc. |\n| 9 | Sandalwood | gandham / candanam | acc. |\n| 10 | Flowers | puṣpam / puṣpāṇi | acc. (sg. or pl.) |\n| 11 | Incense | dhūpam | acc. |\n| 12 | Lamp | dīpam | acc. |\n| 13 | Food | naivedyam | acc. |\n| 14 | Betel | tāmbūlam | acc. |\n| 15 | Circumambulation | pradakṣiṇam | acc. |\n| 16 | Prostration | namaskāram | acc. |\n\nEvery upacāra word is in the **accusative** — because it is the object being offered. The verb *samarpayāmi* takes an accusative object and a dative recipient. The grammar of offering is: \"I give [this — acc.] to [you — dat.].\"\n\n---\n\n## Summary\n\n| Pūjā Component | Primary Vibhakti | What It Teaches |\n|----------------|-----------------|-----------------|\n| Saṅkalpa | Locative (time/place), Accusative (the rite), Genitive (the deity) | Future tense, purpose-compounds, complete sentence structure |\n| Nyāsa | Dative (recipient of the mantra) | Dative declension across genders, dvivacana, the vowel-sequence |\n| Dhyāna | Accusative (the visualized deity) | Bahuvrīhi compounds, participial adjectives |\n| Upacāra | Dative (deity) + Accusative (offering) | The transitive offering construction |\n| Stotra | All vibhaktis | Free composition, meter, alaṅkāra |\n| Āvaraṇa bījas | (Mantric — beyond grammar) | Prefix-derivation applied to bījas |\n| Dīkṣitar system | One vibhakti per āvaraṇa | The eight cases as eight relationships |\n", "reference": "# Pūjā-Vāk — Reference Guide\n\n## Saṅkalpa Template\n\n```\n[Time — locative]\n[Place — locative]\n[Performer — nominative]\n[Deity — genitive]\n[Purpose — dative / artham compound]\n[Rite — accusative]\n[Verb — kariṣye (lṛṭ, first person)]\n```\n\n### Common Saṅkalpa Vocabulary\n\n| Sanskrit | Meaning | Case Used |\n|----------|---------|-----------|\n| asmin śubha-muhūrte | at this auspicious moment | Saptamī (loc.) |\n| adya | today | Indeclinable |\n| iha | here | Indeclinable |\n| mama | my | Ṣaṣṭhī (gen.) |\n| asmākaṃ | our | Ṣaṣṭhī (gen. pl.) |\n| saha-kuṭumbānām | with family members | Ṣaṣṭhī (gen.) |\n| kṣemārtha | for welfare | Compound + artham |\n| āyur-ārogya-aiśvaryārtha | for longevity, health, prosperity | Compound + artham |\n| bhukti-mukti-phalaprada | bestowing fruits of enjoyment and liberation | Adjective (acc.) |\n| ārādhanārtham | for the sake of worship | Compound + artham |\n| prītyartham | for the sake of pleasure/satisfaction | Compound + artham |\n| pūjāṃ kariṣye | I shall perform the pūjā | Acc. + lṛṭ verb |\n| homaṃ kariṣye | I shall perform the homa | Acc. + lṛṭ verb |\n| japam kariṣye | I shall perform the japa | Acc. + lṛṭ verb |\n\n### Deity Name Dative Forms (for saṅkalpa and upacāra)\n\n| Deity | Stem | Dative Singular |\n|-------|------|----------------|\n| Śiva | śiva- (m.) | śivāya |\n| Viṣṇu | viṣṇu- (m.) | viṣṇave |\n| Gaṇeśa | gaṇeśa- (m.) | gaṇeśāya |\n| Lalitā | lalitā- (f.) | lalitāyai |\n| Tripurasundarī | tripurasundarī- (f.) | tripurasundaryai |\n| Kāmākṣī | kāmākṣī- (f.) | kāmākṣyai |\n| Kālī | kālī- (f.) | kālyai |\n| Durgā | durgā- (f.) | durgāyai |\n| Lakṣmī | lakṣmī- (f.) | lakṣmyai |\n| Sarasvatī | sarasvatī- (f.) | sarasvatyai |\n\n---\n\n## Nyāsa Formulas\n\n### Kara-Nyāsa (Hand Nyāsa)\n\n| Bīja | Body Part | Dative Dual | Closing |\n|------|-----------|-------------|---------|\n| [bīja 1] | Thumbs | aṅguṣṭhābhyāṃ | namaḥ |\n| [bīja 2] | Index fingers | tarjanībhyāṃ | namaḥ |\n| [bīja 3] | Middle fingers | madhyamābhyāṃ | namaḥ |\n| [bīja 4] | Ring fingers | anāmikābhyāṃ | namaḥ |\n| [bīja 5] | Little fingers | kaniṣṭhikābhyāṃ | namaḥ |\n| [bīja 6] | Palm & back | karatalakarapṛṣṭhābhyāṃ | namaḥ |\n\n### Aṅga-Nyāsa (Limb Nyāsa)\n\n| Bīja | Body Part | Dative Singular | Closing |\n|------|-----------|-----------------|---------|\n| [bīja 1] | Heart | hṛdayāya | namaḥ |\n| [bīja 2] | Head | śirase | svāhā |\n| [bīja 3] | Tuft | śikhāyai | vaṣaṭ |\n| [bīja 4] | Armor/torso | kavacāya | huṃ |\n| [bīja 5] | Three eyes | netratrayāya | vauṣaṭ |\n| [bīja 6] | Weapon | astrāya | phaṭ |\n\n### Nyāsa Closing Words\n\n| Word | Function | Origin |\n|------|----------|--------|\n| namaḥ | Surrender/offering | √nam (to bow) |\n| svāhā | Oblation into fire | Vedic offering-call |\n| vaṣaṭ | Empowerment | Vedic: moment of pouring |\n| huṃ | Protection/warding | Tantric seed of wrath/protection |\n| vauṣaṭ | Consecration | Vedic ritual call |\n| phaṭ | Dispersal/weapon | Tantric: bursting, cutting |\n\n---\n\n## Dhyāna-Śloka Grammar Patterns\n\n### Bahuvrīhi Template\n**[modifier]-[body-part/attribute] + ām/am** = \"she/he who has [modifier] [body-part]\"\n\n| Compound | Analysis | Translation |\n|----------|----------|-------------|\n| trinayanām | tri + nayana + ām | \"Her who has three eyes\" |\n| caturbhujam | catur + bhuja + am | \"Him who has four arms\" |\n| sindūrāruṇa-vigrahām | sindūra-aruṇa + vigraha + ām | \"Her whose form is vermillion-red\" |\n| smitamukhīm | smita + mukhī + m | \"Her whose face is smiling\" |\n| nīlakaṇṭham | nīla + kaṇṭha + am | \"Him whose throat is blue\" |\n| padmahastām | padma + hasta + ām | \"Her whose hand holds a lotus\" |\n| jaṭāmukuṭa-maṇḍitam | jaṭā-mukuṭa + maṇḍita + am | \"Him adorned with a crown of matted locks\" |\n\n### Common Dhyāna Verbs\n\n| Verb | Meaning | Usage |\n|------|---------|-------|\n| dhyāyāmi | I meditate on | Takes accusative object |\n| dhyāyet | One should meditate on | Optative, takes accusative |\n| bhāvaye | I contemplate | Takes accusative |\n| smaret | One should remember | Optative, takes accusative |\n| praṇamāmi | I bow to | Takes accusative |\n\n---\n\n## Upacāra Offering Template\n\n```\n[deity — dative] namaḥ — [offering — accusative] samarpayāmi\n```\n\n### The 16 Upacāras\n\n| # | Sanskrit | Meaning | Accusative Form |\n|---|----------|---------|----------------|\n| 1 | āvāhanam | invocation | āvāhanaṃ samarpayāmi |\n| 2 | āsanam | seat | āsanaṃ samarpayāmi |\n| 3 | pādyam | foot-water | pādyaṃ samarpayāmi |\n| 4 | arghyam | hand-water | arghyaṃ samarpayāmi |\n| 5 | ācamanīyam | sipping-water | ācamanīyaṃ samarpayāmi |\n| 6 | snānam | bath | snānaṃ samarpayāmi |\n| 7 | vastram | cloth | vastraṃ samarpayāmi |\n| 8 | yajñopavītam | sacred thread | yajñopavītaṃ samarpayāmi |\n| 9 | gandham | fragrance/paste | gandhaṃ samarpayāmi |\n| 10 | puṣpam | flower(s) | puṣpaṃ samarpayāmi |\n| 11 | dhūpam | incense | dhūpaṃ samarpayāmi |\n| 12 | dīpam | lamp | dīpaṃ samarpayāmi |\n| 13 | naivedyam | food offering | naivedyaṃ samarpayāmi |\n| 14 | tāmbūlam | betel | tāmbūlaṃ samarpayāmi |\n| 15 | pradakṣiṇam | circumambulation | pradakṣiṇaṃ samarpayāmi |\n| 16 | namaskāram | prostration | namaskāraṃ samarpayāmi |\n\n---\n\n## Āvaraṇa Bīja Progression\n\n| # | Āvaraṇa Name | Bīja | Derivation Principle |\n|---|-------------|------|---------------------|\n| 1 | Trailokyamohana | aṃ āṃ sauḥ | Base vowels + śakti-bīja |\n| 2 | Sarvāśāparipūraka | aiṃ klīṃ sauḥ | Bālā mantra (the base triad) |\n| 3 | Sarvasaṃkṣobhaṇa | hrīṃ klīṃ sauḥ | hrīṃ enters (māyā replaces vāk) |\n| 4 | Sarvasaubhāgyadāyaka | haiṃ hklīṃ hsauḥ | h- prefix (Śiva's breath enters each) |\n| 5 | Sarvārthasādhaka | hsaiṃ hsklīṃ hssauḥ | hs- prefix (full haṃsa permeates) |\n| 6 | Sarvarakṣākara | hrīṃ klīṃ bleṃ | Pattern breaks (bleṃ = grounding) |\n| 7 | Sarvarogahara | hrīṃ śrīṃ sauḥ | klīṃ → śrīṃ (desire → fullness) |\n| 8 | Sarvasiddhiprada | hsaiṃ hsklīṃ hssauḥ | Mirrors 5th (haṃsa returns) |\n| 9 | Sarvānandamaya | Full Pañcadaśī | All compressions expand |\n\n### h-infusion = Śiva entering Śakti bījas\n- No prefix = Śakti alone\n- h- = Śiva breathing into each bīja\n- hs- = full haṃsa (Śiva + Śakti) permeating\n\n---\n\n## Dīkṣitar Vibhakti-Āvaraṇa Mapping\n\n| Āvaraṇa | Vibhakti | Kamalāmbā Form | Meaning |\n|----------|----------|----------------|---------|\n| Dhyāna | Mixed | kamalāmbike | (vocative — \"O!\") |\n| 1st (Bhūpura) | Prathamā | kamalāmbā | \"She IS\" |\n| 2nd (16-petal) | Dvitīyā | kamalāmbām | \"Worship HER\" |\n| 3rd (8-petal) | Tṛtīyā | kamalāmbayā | \"BY her\" |\n| 4th (14-triangle) | Caturthī | kamalāmbāyai | \"FOR/TO her\" |\n| 5th (outer 10) | Pañcamī | kamalāmbāyāḥ | \"FROM her\" |\n| 6th (inner 10) | Ṣaṣṭhī | kamalāmbāyāḥ | \"OF her\" |\n| 7th (8-triangle) | Saptamī | kamalāmbāyām | \"IN her\" |\n| 8th (inner triangle) | Sambodhana | kamalāmbike | \"O Kamalāmbikā!\" |\n| 9th (Bindu) | Prathamā | kamalāmbā | Full circle |\n\n### Feminine ā-stem Declension (for reference)\n\n| Vibhakti | Singular | Meaning |\n|----------|----------|---------|\n| Prathamā | -ā | subject / \"she is\" |\n| Dvitīyā | -ām | object / \"her\" |\n| Tṛtīyā | -ayā | instrument / \"by her\" |\n| Caturthī | -āyai | recipient / \"for/to her\" |\n| Pañcamī | -āyāḥ | source / \"from her\" |\n| Ṣaṣṭhī | -āyāḥ | possession / \"of her\" |\n| Saptamī | -āyām | location / \"in her\" |\n| Sambodhana | -e | address / \"O!\" |\n", "workbook-questions": "# Pūjā-Vāk — Workbook (Questions)\n\n## Section A: Saṅkalpa Construction (20 marks)\n\n**A1.** Parse the following saṅkalpa by identifying the vibhakti and function of each element (10 marks):\n\n> *asmin śubha-muhūrte śrīmahākālyāḥ prītyarthaṃ mama saha-kuṭumbānāṃ kṣema-sthairya-vīrya-vijayārthaṃ dakṣiṇakālī-mahāpūjāṃ ahaṃ kariṣye*\n\n| Element | Vibhakti | Function |\n|---------|----------|----------|\n| asmin śubha-muhūrte | ? | ? |\n| śrīmahākālyāḥ | ? | ? |\n| prītyartham | ? | ? |\n| mama | ? | ? |\n| saha-kuṭumbānām | ? | ? |\n| kṣema-sthairya-vīrya-vijayārtham | ? | ? |\n| dakṣiṇakālī-mahāpūjām | ? | ? |\n| aham | ? | ? |\n| kariṣye | ? | ? |\n\n**A2.** Write a complete saṅkalpa for the following situation (10 marks):\n\nYou are performing a Gaṇeśa pūjā on an auspicious day, for the removal of obstacles (vighna-nivṛtti) and the success of a new undertaking (nava-kārya-siddhi), for yourself and your family.\n\nUse the template:\n```\n[Time — locative] [Deity — genitive] [Purpose — artham compound]\n[Beneficiaries — genitive] [Rite — accusative] [Verb — kariṣye]\n```\n\n---\n\n## Section B: Nyāsa Grammar (20 marks)\n\n**B1.** The following kara-nyāsa sequence uses vowel-bījas. Fill in the missing dative dual forms (5 marks):\n\n| Bīja | Body Part | Dative Dual | Closing |\n|------|-----------|-------------|---------|\n| aṃ | thumbs | aṅguṣṭhābhyāṃ | namaḥ |\n| āṃ | index fingers | _____________ | namaḥ |\n| iṃ | middle fingers | madhyamābhyāṃ | namaḥ |\n| īṃ | ring fingers | _____________ | namaḥ |\n| uṃ | little fingers | kaniṣṭhikābhyāṃ | namaḥ |\n| ūṃ | palm and back | _____________ | namaḥ |\n\n**B2.** In aṅga-nyāsa, each limb receives a different closing word. Match each closing word to its function (5 marks):\n\n| Closing Word | Function |\n|-------------|----------|\n| 1. namaḥ | a. Weapon-deployment / dispersal |\n| 2. svāhā | b. Surrender / offering |\n| 3. huṃ | c. Oblation (originally into Vedic fire) |\n| 4. vauṣaṭ | d. Protection / warding |\n| 5. phaṭ | e. Consecration / empowerment |\n\n**B3.** The following aṅga-nyāsa assigns bījas to limbs. Identify the vibhakti and gender of each body-part form (5 marks):\n\n1. hṛdayāya (heart)\n2. śirase (head)\n3. śikhāyai (tuft)\n4. kavacāya (armor/torso)\n5. netratrayāya (three eyes)\n\n**B4.** In mātṛkā-nyāsa, the entire alphabet is placed on the body. The ka-varga (ka, kha, ga, gha, ṅa) is placed on the right arm from shoulder to fingertips. Explain why the ākāśa-letters (kaṇṭhya consonants) are assigned to the *creative limb* (right arm) rather than to the throat (5 marks).\n\n---\n\n## Section C: Dhyāna-Śloka Analysis (20 marks)\n\n**C1.** The following is from the Lalitā dhyāna-śloka. Identify each compound as a bahuvrīhi and translate (10 marks):\n\n1. sindūrāruṇa-vigrahām\n2. trinayanām\n3. māṇikya-mauli-sphurat-tārā-nāyaka-śekharām\n4. smitamukhīm\n5. āpīna-vakṣoruhām\n\nFor each: (a) break the compound, (b) identify the type, (c) give the case ending, (d) translate.\n\n**C2.** All five compounds in C1 end in the accusative feminine. Why? What verb are they all the object of? (5 marks)\n\n**C3.** Write a 2-line dhyāna-śloka for your iṣṭadevatā using at least 3 bahuvrīhi compounds in the accusative. You do not need to observe meter — focus on grammatically correct bahuvrīhi formation (5 marks).\n\n---\n\n## Section D: Upacāra Formulas (15 marks)\n\n**D1.** Complete the following offering formulas by supplying the correct dative form of the deity name (5 marks):\n\n1. śrī-_______ (Śiva) namaḥ — gandhaṃ samarpayāmi\n2. śrī-_______ (Lalitā) namaḥ — puṣpaṃ samarpayāmi\n3. śrī-_______ (Gaṇeśa) namaḥ — naivedyaṃ samarpayāmi\n4. śrī-_______ (Kālī) namaḥ — dīpaṃ samarpayāmi\n5. śrī-_______ (Viṣṇu) namaḥ — dhūpaṃ samarpayāmi\n\n**D2.** A student writes the offering formula as: *śrīśivam namaḥ — gandhaṃ samarpayāmi.* What is wrong? Which vibhakti should the deity name be in, and why? (5 marks)\n\n**D3.** The 16 upacāras are all in the accusative case. Explain why, using the grammar of the verb *samarpayāmi* (5 marks).\n\n---\n\n## Section E: Āvaraṇa Bīja Analysis (15 marks)\n\n**E1.** The āvaraṇa bījas show a progressive \"h-infusion.\" Trace the derivation (5 marks):\n\n| Āvaraṇa | Bīja | What prefix was added? |\n|----------|------|----------------------|\n| 2nd | aiṃ klīṃ sauḥ | (base — no prefix) |\n| 4th | haiṃ hklīṃ hsauḥ | ? |\n| 5th | hsaiṃ hsklīṃ hssauḥ | ? |\n\nWhat does \"ha\" represent in the tantric context? What does the progression from no-prefix → h- → hs- signify?\n\n**E2.** Between the 2nd and 3rd āvaraṇas, aiṃ changes to hrīṃ while klīṃ and sauḥ remain the same. What śakti does aiṃ represent? What śakti does hrīṃ represent? Why does this substitution happen as one moves deeper into the Śrīcakra? (5 marks)\n\n**E3.** The principle of h-infusion in the āvaraṇa bījas is compared to upasarga-prefixation in Sanskrit grammar (e.g., √gam → āgam → samāgam). Explain this analogy: how is adding \"h-\" to a bīja similar to adding an upasarga to a dhātu? (5 marks)\n\n---\n\n## Section F: Dīkṣitar's Vibhakti Architecture (10 marks)\n\n**F1.** Dīkṣitar uses one vibhakti per āvaraṇa across his Kamalāmbā cycle. Give the vibhakti and its meaning for each (8 marks):\n\n| Āvaraṇa | Kamalāmbā form | Vibhakti | Meaning of the relationship |\n|----------|----------------|----------|-----------------------------|\n| 1st | kamalāmbā | ? | ? |\n| 2nd | kamalāmbām | ? | ? |\n| 3rd | kamalāmbayā | ? | ? |\n| 4th | kamalāmbāyai | ? | ? |\n| 5th | kamalāmbāyāḥ | ? | ? |\n| 6th | kamalāmbāyāḥ | ? | ? |\n| 7th | kamalāmbāyām | ? | ? |\n| 8th | kamalāmbike | ? | ? |\n\n**F2.** The 5th and 6th āvaraṇas both show the form \"kamalāmbāyāḥ\" — but one is pañcamī (ablative) and the other is ṣaṣṭhī (genitive). These two cases share the same ending in feminine ā-stems. How would you distinguish \"from her\" (ablative) from \"of her\" (genitive) in context? Give a sentence example for each (2 marks).\n", "workbook-answers": "# Pūjā-Vāk — Workbook (Answers)\n\n## Section A: Saṅkalpa Construction\n\n**A1.**\n\n| Element | Vibhakti | Function |\n|---------|----------|----------|\n| asmin śubha-muhūrte | **Saptamī** (locative) | Time — \"at this auspicious moment\" |\n| śrīmahākālyāḥ | **Ṣaṣṭhī** (genitive) | Deity — \"of Śrī Mahākālī\" (the pūjā belongs to her) |\n| prītyartham | **Accusative + artham** (purpose) | Purpose — \"for the sake of [her] pleasure\" |\n| mama | **Ṣaṣṭhī** (genitive) | Beneficiary — \"my\" / \"of me\" |\n| saha-kuṭumbānām | **Ṣaṣṭhī** (genitive plural) | Beneficiary — \"of [my] family members together\" |\n| kṣema-sthairya-vīrya-vijayārtham | **Accusative + artham** (purpose) | Purpose — \"for the sake of welfare, stability, vigor, and victory\" |\n| dakṣiṇakālī-mahāpūjām | **Dvitīyā** (accusative) | Object — \"the great pūjā of Dakṣiṇakālī\" (what is being performed) |\n| aham | **Prathamā** (nominative) | Subject — \"I\" (the performer) |\n| kariṣye | **lṛṭ lakāra** (simple future, first person singular) | Verb — \"I shall perform\" |\n\n**A2.** Model saṅkalpa:\n\n> *asmin śubha-dine śrīmahāgaṇapateḥ prītyarthaṃ mama saha-kuṭumbānāṃ vighna-nivṛtty-arthaṃ nava-kārya-siddhyarthaṃ ca śrīgaṇeśa-pūjāṃ ahaṃ kariṣye*\n\nKey elements:\n- asmin śubha-dine — \"on this auspicious day\" (saptamī)\n- śrīmahāgaṇapateḥ — \"of Śrī Mahāgaṇapati\" (ṣaṣṭhī of a consonant-stem)\n- prītyartham — \"for the sake of pleasure\" (purpose)\n- mama saha-kuṭumbānām — \"of me together with family\" (ṣaṣṭhī)\n- vighna-nivṛtty-artham — \"for the removal of obstacles\" (purpose compound)\n- nava-kārya-siddhyartham ca — \"and for success in the new undertaking\" (purpose compound)\n- śrīgaṇeśa-pūjām — \"the pūjā of Śrī Gaṇeśa\" (dvitīyā — object)\n- aham kariṣye — \"I shall perform\" (nominative + lṛṭ)\n\n---\n\n## Section B: Nyāsa Grammar\n\n**B1.**\n\n| Bīja | Body Part | Dative Dual |\n|------|-----------|-------------|\n| āṃ | index fingers | **tarjanībhyāṃ** |\n| īṃ | ring fingers | **anāmikābhyāṃ** |\n| ūṃ | palm and back | **karatalakarapṛṣṭhābhyāṃ** |\n\n(All formed with the feminine dative dual ending **-ābhyām**, since these body-part nouns are feminine ā-stems or feminine compound stems.)\n\n**B2.**\n\n1. namaḥ → **b. Surrender / offering**\n2. svāhā → **c. Oblation (originally into Vedic fire)**\n3. huṃ → **d. Protection / warding**\n4. vauṣaṭ → **e. Consecration / empowerment**\n5. phaṭ → **a. Weapon-deployment / dispersal**\n\n**B3.**\n\n1. hṛdayāya → **Caturthī ekavacana, napuṃsakaliṅga** (neuter a-stem dative singular: hṛdaya + -āya)\n2. śirase → **Caturthī ekavacana, napuṃsakaliṅga** (neuter s-stem dative singular: śiras + -e)\n3. śikhāyai → **Caturthī ekavacana, strīliṅga** (feminine ā-stem dative singular: śikhā + -āyai)\n4. kavacāya → **Caturthī ekavacana, napuṃsakaliṅga** (neuter a-stem dative singular: kavaca + -āya)\n5. netratrayāya → **Caturthī ekavacana, napuṃsakaliṅga** (neuter a-stem compound: netra-traya + -āya)\n\n**B4.** In mātṛkā-nyāsa, the letters are not placed at the sthāna where they are *produced* (that is the mouth-geography from Varṇa-Vidyā). They are placed at the body-location where they are *installed as operative forces.* The ka-varga (kaṇṭhya/ākāśa letters) goes to the right arm because:\n\n- The right arm is the *creative/active limb* — the hand that performs yāga, that offers, that gives. Ākāśa (space) is the first element, the womb of manifestation. Placing the space-element letters in the creative limb means: the arm that acts draws its power from the most primal element.\n- The nyāsa system distributes the five vargas across the four limbs + torso to create a *body-yantra.* Each limb becomes one element. This is architecturally different from the mouth-cakra — the mouth maps sound-production; the body-nyāsa maps ritual function.\n- The throat already has its own role in the body-yantra (it falls within the pa-varga/torso zone). Installing ka-varga there would create redundancy and leave the creative limb without mantric charge.\n\n---\n\n## Section C: Dhyāna-Śloka Analysis\n\n**C1.**\n\n1. **sindūrāruṇa-vigrahām**\n   - (a) sindūra (vermillion) + aruṇa (dawn-red) + vigraha (form/body) + -ām\n   - (b) Bahuvrīhi — \"she who possesses a vermillion-red form\" (the compound describes an attribute of the deity, not a standalone entity)\n   - (c) Dvitīyā strīliṅga (accusative feminine singular)\n   - (d) \"Her whose body is the color of vermillion and dawn\"\n\n2. **trinayanām**\n   - (a) tri (three) + nayana (eyes) + -ām\n   - (b) Bahuvrīhi — \"she who has three eyes\"\n   - (c) Dvitīyā strīliṅga\n   - (d) \"Her who has three eyes\"\n\n3. **māṇikya-mauli-sphurat-tārā-nāyaka-śekharām**\n   - (a) māṇikya (ruby) + mauli (crown) + sphurat (shining, present participle) + tārā-nāyaka (lord of stars = moon) + śekhara (crest) + -ām\n   - (b) Nested bahuvrīhi — \"she whose crest-jewel is the moon shining from a ruby crown\"\n   - (c) Dvitīyā strīliṅga\n   - (d) \"Her whose crown-ornament is the moon radiating from a jeweled diadem\"\n\n4. **smitamukhīm**\n   - (a) smita (smile, past participle of √smi) + mukhī (feminine of mukha, face) + -m\n   - (b) Bahuvrīhi — \"she whose face is smiling\"\n   - (c) Dvitīyā strīliṅga\n   - (d) \"Her whose face bears a smile\"\n\n5. **āpīna-vakṣoruhām**\n   - (a) āpīna (full/swollen) + vakṣaḥ-ruha (breast, literally \"chest-growing\") + -ām\n   - (b) Bahuvrīhi — \"she whose breasts are full\"\n   - (c) Dvitīyā strīliṅga\n   - (d) \"Her whose breasts are full\"\n\n**C2.** All five are in the accusative feminine because they are all objects of the implied verb **dhyāyāmi** (\"I meditate on\"). The entire dhyāna-śloka is one enormous accusative noun-phrase — a chain of bahuvrīhi descriptors all modifying the same \"tām\" (her). The grammar constructs the visualization: each compound adds one more detail to the image being built in the mind.\n\n**C3.** (Answers will vary. Model for Kālī):\n\n> *khaḍga-khaṇḍita-dānava-śoṇita-dhārāṃ*\n> *muṇḍamālā-vibhūṣita-kaṇṭhām ahaṃ dhyāyāmi kālīm*\n\n- khaḍga-khaṇḍita-dānava-śoṇita-dhārām = bahuvrīhi: \"her from whose sword flows streams of demon-blood\"\n- muṇḍamālā-vibhūṣita-kaṇṭhām = bahuvrīhi: \"her whose throat is adorned with a garland of skulls\"\n- kālīm = accusative of kālī, object of dhyāyāmi\n\n---\n\n## Section D: Upacāra Formulas\n\n**D1.**\n\n1. śrī-**śivāya** namaḥ (śiva → dative: śivāya)\n2. śrī-**lalitāyai** namaḥ (lalitā → dative: lalitāyai)\n3. śrī-**gaṇeśāya** namaḥ (gaṇeśa → dative: gaṇeśāya)\n4. śrī-**kālyai** namaḥ (kālī → dative: kālyai)\n5. śrī-**viṣṇave** namaḥ (viṣṇu → dative: viṣṇave)\n\n**D2.** The student used **śivam** — this is the **dvitīyā** (accusative), meaning \"Śiva\" as the *object* of an action. But in the offering formula, the deity is the **recipient** of the offering, not the object. The deity name must be in the **caturthī** (dative): **śivāya** — \"to/for Śiva.\"\n\nThe formula is: \"I offer [this thing — accusative] **to** [this deity — dative].\" Samarpayāmi takes a dative recipient and an accusative object. Using accusative for the deity would grammatically make Śiva the *thing being offered,* not the one receiving the offering.\n\n**D3.** The verb *samarpayāmi* means \"I offer / I present.\" It is a transitive verb (sakarmaka kriyā) that requires a direct object — the thing being offered. In Sanskrit, the direct object of a transitive verb takes the **dvitīyā** (accusative) case. Each upacāra word (gandham, puṣpam, dīpam, etc.) is the direct object of samarpayāmi, answering the question \"what am I offering?\" The answer — the substance being given — is always accusative.\n\n---\n\n## Section E: Āvaraṇa Bīja Analysis\n\n**E1.**\n\n| Āvaraṇa | Bīja | Prefix Added |\n|----------|------|-------------|\n| 2nd | aiṃ klīṃ sauḥ | (base — no prefix) |\n| 4th | haiṃ hklīṃ hsauḥ | **h-** (ha) prefixed to each bīja |\n| 5th | hsaiṃ hsklīṃ hssauḥ | **hs-** (ha + sa) prefixed to each bīja |\n\n**Ha** represents **Śiva** in the tantric context — it is the last consonant, pure breath, the exhale of consciousness. The progression signifies:\n- **No prefix** (2nd): Pure Śakti — the Bālā mantra in its base form\n- **h-** prefix (4th): Śiva's breath enters each bīja — he begins to animate the Śakti-mantras from within\n- **hs-** prefix (5th): Full **haṃsa** (ha + sa = Śiva + Śakti breathing together) permeates every bīja — the complete union\n\nThe inward journey through the Śrīcakra is a progressive revelation of Śiva within Śakti.\n\n**E2.**\n- **Aiṃ** represents **Jñāna-śakti** (knowledge/speech) — it is the Vāgbhavā bīja, pure vāk.\n- **Hrīṃ** represents **Māyā-śakti** — the power of veiling and revealing, the cosmic illusion that is also the cosmic play.\n\nThe substitution happens because as one moves deeper into the Śrīcakra (from the outer enclosures toward the center), the practitioner moves from the realm of *speech and knowledge about the deity* (aiṃ/vāgbhavā — you can talk about her) into the realm of *direct encounter with her māyā* (hrīṃ — you are inside her illusion/play). The outer enclosures are approachable through vāk (speech/intellect). The inner enclosures require encountering māyā directly.\n\n**E3.** An upasarga (prefix) added to a dhātu does not change the *root meaning* — it modifies its *direction, scope, or intensity:*\n- √gam = to go\n- ā + √gam = to come (direction changed)\n- sam + ā + √gam = to come together (scope expanded)\n\nSimilarly, adding h- to a bīja does not change the *base bīja* (aiṃ remains aiṃ) — it modifies its *operative dimension:*\n- aiṃ = vāk-śakti operating as Śakti alone\n- h + aiṃ = vāk-śakti now infused with Śiva's breath\n- hs + aiṃ = vāk-śakti permeated by the full Śiva-Śakti union\n\nIn both cases, the prefix is not a separate word — it fuses with the base to create a new operative unit. And in both cases, the system is *recursive:* you can stack prefixes (sam + ā + √gam; hs + aiṃ) to deepen the modification. The grammar of language and the grammar of mantra use the same structural principle.\n\n---\n\n## Section F: Dīkṣitar's Vibhakti Architecture\n\n**F1.**\n\n| Āvaraṇa | Kamalāmbā form | Vibhakti | Meaning of the relationship |\n|----------|----------------|----------|-----------------------------|\n| 1st | kamalāmbā | **Prathamā** (nominative) | Identity — \"she IS\" — pure being/appearance |\n| 2nd | kamalāmbām | **Dvitīyā** (accusative) | Object — \"worship HER\" — she becomes the focus of devotion |\n| 3rd | kamalāmbayā | **Tṛtīyā** (instrumental) | Means — \"BY/through her\" — she becomes the instrument |\n| 4th | kamalāmbāyai | **Caturthī** (dative) | Recipient — \"FOR/to her\" — she receives the offering |\n| 5th | kamalāmbāyāḥ | **Pañcamī** (ablative) | Source — \"FROM her\" — she is the origin |\n| 6th | kamalāmbāyāḥ | **Ṣaṣṭhī** (genitive) | Possession — \"OF her\" — everything belongs to her |\n| 7th | kamalāmbāyām | **Saptamī** (locative) | Location — \"IN her\" — she is the field of all experience |\n| 8th | kamalāmbike | **Sambodhana** (vocative) | Address — \"O Kamalāmbikā!\" — direct encounter |\n\n**F2.** The forms are identical (kamalāmbāyāḥ) because feminine ā-stems share the ending -āyāḥ for both pañcamī and ṣaṣṭhī. Disambiguation comes from context and syntax:\n\n- **Pañcamī (ablative — \"from her\"):** Used with verbs/concepts of origin, separation, fear, protection-from. Example: *kamalāmbāyāḥ sakalaṃ jagat jātam* — \"The entire world was born **from** Kamalāmbā.\"\n- **Ṣaṣṭhī (genitive — \"of her\"):** Used for possession, relationship, belonging. Example: *kamalāmbāyāḥ pādapadmaṃ namāmi* — \"I bow to the lotus-feet **of** Kamalāmbā.\"\n\nThe ablative answers \"from where?\" The genitive answers \"whose?\" In Dīkṣitar's kṛtis, the 5th āvaraṇa kṛti emphasizes that everything *originates from* her (source/ablative), while the 6th emphasizes that everything *belongs to* her (possession/genitive). Two different theological statements, same grammatical form, distinguished by lyrical context.\n", "badge": "# Stage 17 Badge: Pūjāvādin\n\n**Title:** Ritual Voice\n**Badge:** 🏅 Pūjāvādin\n\n## Requirements\n\n1. Parse one saṅkalpa from a real paddhati — identify each grammatical element\n2. Write your own saṅkalpa for a specific occasion\n3. Identify the vibhakti pattern in one Kamalāmbā kṛti verse\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 18 content and grants the **Pūjāvādin** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "18-katha", "number": 18, "title": "Katha", "subtitle": "Narration", "files": {"theory": "# Stage 18: Kathā — Narration\n\n## Goal\nNarrate a deity's story (līlā) in Sanskrit for 2-3 minutes. Master past tense, sequence markers, and narrative structure.\n\n## Past Tense (Laṅ-lakāra)\n\n| Person | Singular | Plural |\n|--------|----------|--------|\n| 3rd | a-√-t (agacchat) | a-√-an (agacchan) |\n| 2nd | a-√-ḥ (agacchaḥ) | a-√-ta (agacchata) |\n| 1st | a-√-am (agaccham) | a-√-āma (agacchāma) |\n\n### Common Past Tenses\n| Present | Past (3sg) | Meaning |\n|---------|-----------|---------|\n| asti | āsīt | was |\n| bhavati | abhavat | became |\n| gacchati | agacchat | went |\n| karoti | akarot | did |\n| vadati | avadat | said |\n| paśyati | apaśyat | saw |\n| dadāti | adadāt | gave |\n| śṛṇoti | aśṛṇot | heard |\n| jānāti | ajānāt | knew |\n| jayati | ajayat | conquered |\n| harati | aharat | took |\n| patati | apatat | fell |\n| tiṣṭhati | atiṣṭhat | stood |\n| namati | anamat | bowed |\n\n## Narrative Connectors\n\n| Sanskrit | Meaning |\n|----------|---------|\n| purā / purākāle | long ago |\n| ekadā | once upon a time |\n| tadā | then |\n| tataḥ | then, after that |\n| anantaram | afterwards |\n| tadanantaram | after that |\n| atha | now, then |\n| evaṃ | thus |\n| iti | (end quote) |\n| saḥ / sā | he / she |\n| tena | by him / therefore |\n| tasmāt | from that / therefore |\n| yadā... tadā | when... then |\n| yāvat... tāvat | while... meanwhile |\n\n## Kathā Structure\n\n### Opening\n> purā kāle eka-smin vane mahān ṛṣiḥ āsīt.\n> (Long ago, in a certain forest, there was a great sage.)\n\n### Development\n> ekadā saḥ dhyānaṃ kurvan āsīt. tadā ekaḥ rākṣasaḥ āgacchat.\n> (Once he was meditating. Then a demon came.)\n\n### Crisis\n> rākṣasaḥ ṛṣiṃ hantuṃ aicchat. ṛṣiḥ bhayam anubhavat.\n> (The demon wanted to kill the sage. The sage felt fear.)\n\n### Resolution\n> tadā devī prādurabhat. sā rākṣasaṃ nāśayat.\n> (Then the Goddess appeared. She destroyed the demon.)\n\n### Closing\n> ṛṣiḥ devīm praṇamat. \"he devi! dhanyaḥ asmi\" iti avadat.\n> (The sage bowed to the Goddess. \"O Goddess, I am blessed,\" he said.)\n\n## Sample Kathā: Gaṅgāvataraṇa (Descent of Gaṅgā)\n\n> purā bhagīrathaḥ nāma rājā āsīt. tasya pūrvajāḥ sagarasya putrāḥ kapila-muneḥ śāpena bhasma-sāt abhavan. teṣāṃ uddhārārtham gaṅgā pṛthivīm ānayanīyā āsīt.\n>\n> bhagīrathaḥ tapasyāṃ akarot. brahma tuṣṭaḥ abhavat. \"gaṅgā avadiṣyati\" iti avadat. kintu gaṅgāyāḥ vegaḥ pṛthivīṃ nāśayet.\n>\n> tataḥ bhagīrathaḥ śivasya ārādhanāṃ akarot. śivaḥ prasannaḥ abhavat. gaṅgāṃ jaṭāsu dhārayat. tataḥ śanaiḥ śanaiḥ gaṅgā pṛthivīm avātarat.\n>\n> evaṃ śivasya kṛpayā gaṅgā loke āgacchat. ataḥ śivaḥ gaṅgādharaḥ iti ucyate.\n\n## Direct Speech in Narration\n\nUse **iti** to close quoted speech:\n> \"he devi! rakṣa mām!\" iti ṛṣiḥ prārthayat.\n> (The sage prayed, \"O Goddess, protect me!\")\n\n> \"mā bhaiṣīḥ\" iti devī avadat.\n> (\"Don't fear,\" said the Goddess.)\n\n## Milestone Check\nCan you narrate a complete deity story (Gaṅgāvataraṇa, Samudra-manthana, or any līlā) in Sanskrit for 2-3 minutes?\n", "reference": "# Stage 18: Kathā — Reference Guide\n\n## Past Tense (Laṅ) — 30 Essential Verbs\n\n| Present | Past 3sg | Past 3pl | Meaning |\n|---------|---------|---------|---------|\n| asti | āsīt | āsan | was/were |\n| bhavati | abhavat | abhavan | became |\n| gacchati | agacchat | agacchan | went |\n| āgacchati | āgacchat | āgacchan | came |\n| karoti | akarot | akurvan | did |\n| vadati | avadat | avadan | said |\n| paśyati | apaśyat | apaśyan | saw |\n| śṛṇoti | aśṛṇot | aśṛṇvan | heard |\n| dadāti | adadāt | adaduḥ | gave |\n| jānāti | ajānāt | ajānan | knew |\n| jayati | ajayat | ajayan | conquered |\n| harati | aharat | aharan | took |\n| tiṣṭhati | atiṣṭhat | atiṣṭhan | stood |\n| namati | anamat | anaman | bowed |\n| tyajati | atyajat | atyajan | abandoned |\n| patati | apatat | apatan | fell |\n| manyate | amanyata | amanyanta | thought |\n| icchati | aicchat | aicchan | wanted |\n| nayati | anayat | anayan | led |\n| pibati | apibat | apiban | drank |\n| rakṣati | arakṣat | arakṣan | protected |\n| pūjayati | apūjayat | apūjayan | worshipped |\n| kathayati | akathayat | akathayan | told |\n| prārthayati | aprārthayat | — | prayed |\n| hasati | ahasat | ahasan | laughed |\n| rudati | arudat | arudan | cried |\n| smarati | asmarat | asmaran | remembered |\n| nṛtyati | anṛtyat | anṛtyan | danced |\n| gāyati | agāyat | agāyan | sang |\n| likhati | alikhat | alikhan | wrote |\n\n## Narrative Structure Template\n\n```\n1. SETTING:    purā [kāle/deśe] [character] āsīt.\n2. CHARACTER:  saḥ/sā [description] āsīt.\n3. EVENT:      ekadā [event] abhavat.\n4. ACTION:     saḥ/sā [action-past].\n5. CRISIS:     kintu/tadā [problem] abhavat.\n6. RESPONSE:   tataḥ [character] [response-past].\n7. CLIMAX:     tadā [deity] [intervention-past].\n8. RESOLUTION: evaṃ [result] abhavat.\n9. MORAL:      ataḥ/tasmāt [lesson].\n```\n\n## Narrative Connectors (Sequence)\n\n| Connector | Position | Meaning |\n|-----------|----------|---------|\n| purā | opening | long ago |\n| ekadā | opening | once |\n| ekasmin dine | opening | one day |\n| tadā | mid | then |\n| tataḥ | mid | after that |\n| anantaram | mid | afterwards |\n| atha | mid | now, then |\n| kintu | mid | but |\n| tathāpi | mid | even so |\n| evaṃ | closing | thus |\n| ataḥ | closing | therefore |\n| iti | closing | thus (end) |\n\n## Direct Speech Pattern\n```\n\"[speech]\" iti [speaker] avadat/prārthayat/cintayat\n```\n\n## Story Starters\n- purā kailāsa-parvate śivaḥ pārvatyā saha āsīt...\n- ekadā vṛndāvane kṛṣṇaḥ gopībhiḥ saha krīḍat...\n- purākāle ayodhyāyāṃ rāmaḥ nāma rājakumāraḥ āsīt...\n- devāsura-saṃgrāme devāḥ parābhūtāḥ abhavan...\n", "workbook-questions": "# Stage 18: Kathā — Workbook (Questions)\n\n## Section A: Past Tense (10 marks)\n**A1.** Convert to past tense (laṅ) 3rd sg (5 marks):\n1. gacchati →  2. karoti →  3. vadati →  4. bhavati →  5. paśyati →\n\n**A2.** Convert to past tense 3rd sg (5 marks):\n1. dadāti →  2. jayati →  3. namati →  4. asti →  5. icchati →\n\n## Section B: Narrative Sentences (15 marks)\n**B1.** Translate into Sanskrit past tense (5 marks):\n1. The sage lived in the forest.\n2. The demon came.\n3. The goddess appeared.\n4. The king prayed.\n5. Śiva was pleased.\n\n**B2.** Put these sentences in logical order and add connectors (5 marks):\n- devī rākṣasaṃ nāśayat\n- ṛṣiḥ vane dhyānaṃ akarot\n- rākṣasaḥ āgacchat\n- ṛṣiḥ devīm prārthayat\n- devī prādurabhat\n\n**B3.** Add direct speech using iti (5 marks):\n1. The sage said, \"O Goddess, save me!\" → ___\n2. The deity said, \"Do not fear.\" → ___\n\n## Section C: Story Composition (25 marks)\n**C1.** Narrate the story of Gaṅgā's descent in 10 Sanskrit sentences (15 marks):\n**C2.** Narrate any deity līlā of your choice in at least 8 sentences (10 marks):\n\n## Section D: Comprehension (10 marks)\nTranslate this passage into English:\n> purā laṅkāyāṃ rāvaṇaḥ nāma rākṣasarājaḥ āsīt. saḥ atīva balavān āsīt. ekadā saḥ sītāṃ hṛtvā laṅkāṃ anayat. rāmaḥ atīva duḥkhitaḥ abhavat. tataḥ rāmaḥ hanumantam preṣayat. hanumān samudraṃ laṅghayat. saḥ sītāṃ apaśyat. \"mā śocaya, rāmaḥ āgamiṣyati\" iti avadat. tataḥ rāmaḥ vānara-sainya-sahitaḥ laṅkām agacchat. mahān yudhaṃ abhavat. rāmaḥ rāvaṇaṃ ajayat. sītā muktā abhavat.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 18: Kathā — Workbook (Answers)\n\n## Section A\n**A1.** 1. **agacchat** 2. **akarot** 3. **avadat** 4. **abhavat** 5. **apaśyat**\n**A2.** 1. **adadāt** 2. **ajayat** 3. **anamat** 4. **āsīt** 5. **aicchat**\n\n## Section B\n**B1.**\n1. **ṛṣiḥ vane avasīt** (or vane āsīt)\n2. **rākṣasaḥ āgacchat**\n3. **devī prādurabhat** (or āvirbabhūva)\n4. **rājā prārthayat**\n5. **śivaḥ prasannaḥ abhavat** (or tuṣṭaḥ abhavat)\n\n**B2.** Correct order with connectors:\n> **purā** ṛṣiḥ vane dhyānaṃ akarot. **tadā** rākṣasaḥ āgacchat. **tataḥ** ṛṣiḥ devīm prārthayat. **tadā** devī prādurabhat. **sā** devī rākṣasaṃ nāśayat.\n\n**B3.**\n1. **\"he devi! pāhi mām!\" iti ṛṣiḥ avadat**\n2. **\"mā bhaiṣīḥ\" iti devatā avadat**\n\n## Section C\n**C1.** Sample:\n> purā sagarasya putrāḥ kapila-muneḥ śāpena bhasmasāt abhavan. bhagīrathaḥ nāma rājā teṣām uddhārārtham gaṅgām pṛthivīm ānetum aicchat. saḥ brahmaṇaḥ ārādhanāṃ akarot. brahma tuṣṭaḥ abhavat. \"gaṅgā avatarati\" iti brahma avadat. kintu gaṅgāyāḥ vegaḥ pṛthivīṃ nāśayet. tataḥ bhagīrathaḥ śivaṃ prārthayat. śivaḥ prasannaḥ abhavat. saḥ gaṅgāṃ jaṭāsu dhārayat. evaṃ gaṅgā śanaiḥ pṛthivīm avātarat. ataḥ śivaḥ gaṅgādharaḥ iti ucyate.\n\n**C2.** Accept any coherent 8+ sentence narration of a deity story in grammatically reasonable Sanskrit.\n\n## Section D\n> Long ago in Laṅkā there was a demon-king named Rāvaṇa. He was very powerful. Once he abducted Sītā and took her to Laṅkā. Rāma became very sorrowful. Then Rāma sent Hanumān. Hanumān leaped across the ocean. He saw Sītā. \"Do not grieve, Rāma will come,\" he said. Then Rāma went to Laṅkā with the monkey army. A great battle took place. Rāma conquered Rāvaṇa. Sītā was freed.\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 18 Badge: Kathāvācaka\n\n**Title:** Story Teller\n**Badge:** 🏅 Kathāvācaka\n\n## Requirements\n\nNarrate a 2-3 minute story in Sanskrit (a purāṇic episode or original). Must use past, present, and future tenses.\n\n## How to Demonstrate\n\n**Format:** Voice recording\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 19 content and grants the **Kathāvācaka** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "19-chandas-i", "number": 19, "title": "Chandas I", "subtitle": "Syllables & Meter", "files": {"theory": "# Stage 19: Chandas I — Syllables\n\n## Goal\nUnderstand the syllable system (akṣara, laghu/guru) that underlies all Sanskrit meter. Learn to hear and mark 8-syllable units.\n\n## Laghu and Guru\n\nEvery Sanskrit syllable is either **laghu** (light, ∪) or **guru** (heavy, –):\n\n**Laghu (∪):** a short vowel (a, i, u, ṛ) NOT followed by a conjunct consonant or visarga/anusvāra\n**Guru (–):** a long vowel (ā, ī, ū, e, ai, o, au) OR a short vowel followed by conjunct consonant, anusvāra (ṃ), or visarga (ḥ)\n\n### Rules\n1. Long vowel → always guru: **nā** (–), **de** (–), **vai** (–)\n2. Short vowel + single consonant + vowel → laghu: **na-ma** (∪ ∪)\n3. Short vowel + conjunct → guru: **bha-ktyā** (–, because k+t follows)\n4. Short vowel + anusvāra → guru: **saṃ** (–)\n5. Short vowel + visarga → guru: **śi-vaḥ** (last syllable –)\n6. Last syllable of a pāda is counted as guru by convention\n\n### Examples\n| Word | Syllables | Pattern |\n|------|-----------|---------|\n| namāmi | na-mā-mi | ∪ – ∪ |\n| śivāya | śi-vā-ya | ∪ – ∪ |\n| bhagavān | bha-ga-vān | ∪ ∪ – |\n| triśūlam | tri-śū-lam | ∪ – – |\n| namaḥ | na-maḥ | ∪ – |\n| padmam | pad-mam | – – |\n\n## Gaṇas (Metrical Feet)\n\nGroups of 3 syllables have names:\n\n| Gaṇa | Pattern | Memory | Example |\n|------|---------|--------|---------|\n| ya | ∪ – – | yamātā | yamātā |\n| ma | – – – | mātārā | mātārā |\n| ta | – – ∪ | tārāja | tārāja |\n| ra | – ∪ – | rājabhā | rājabhā |\n| ja | ∪ – ∪ | jabhāna | jabhāna |\n| bha | – ∪ ∪ | bhānasa | bhānasa |\n| na | ∪ ∪ ∪ | nasala | nasala |\n| sa | ∪ ∪ – | salagā | salagā |\n\n**Memory trick:** Take the phrase **ya-mā-tā-rā-ja-bhā-na-sa-la-gā-m**. Each gaṇa's pattern is read from its starting letter through the next two syllables.\n\n## Counting Syllables (Akṣara-gaṇanā)\n\n### Exercise: Mark the pattern of this pāda:\n> śā-nta-kā-ra-ṃ bhu-ja-ga-śa-ya-na-m\n> –   –  –  ∪  –  ∪ ∪ ∪ ∪ ∪ ∪ –\n\nWait — let's be more careful:\n> śān-ta-kā-raṃ bhu-ja-ga-śa-ya-naṃ\n> –   ∪  –  –   ∪  ∪ ∪ ∪ ∪ ∪ –\n\n(This is from the Viṣṇu-sahasranāma dhyāna-śloka, in śārdūlavikrīḍita meter — 19 syllables per pāda.)\n\n## 8-Syllable Units: The Anuṣṭubh Foundation\n\nThe most common meter in Sanskrit is **anuṣṭubh** (śloka) — 4 pādas of 8 syllables each, total 32.\n\nLearn to feel groups of 8:\n> na-mā-mi-śi-va-māṃ-śān-tam (8 syllables)\n> Count: 1-2-3-4-5-6-7-8\n\nPractice clapping on each syllable while reciting any śloka.\n\n## The Mantra Tetris Game\n\nTake a devotional phrase and reshape it to fit exactly 8 syllables:\n\n| Phrase | Syllables | Adjustment |\n|--------|-----------|------------|\n| namāmi śivam | 5 | too short — add: śāntam → namāmi śivam śāntam (7)... nityam → 8! |\n| namāmi nīlakaṇṭham | 7 | add: tam → 8... or: namāmi nīlakaṇṭha(m) prabhu(m) |\n\nThis is the beginning of metrical composition.\n\n## Milestone Check\nCan you mark any Sanskrit verse as laghu/guru and count syllables accurately? Can you hear 8-syllable units naturally?\n", "reference": "# Stage 19: Chandas I — Reference Guide\n\n## Laghu/Guru Rules\n\n| Condition | Result | Example |\n|-----------|--------|---------|\n| Long vowel (ā,ī,ū,e,ai,o,au) | Guru (–) | nā, de, vai |\n| Short vowel + single C + vowel | Laghu (∪) | na, ma, ka |\n| Short vowel + conjunct | Guru (–) | bha in bhaktyā |\n| Short vowel + anusvāra | Guru (–) | saṃ, taṃ |\n| Short vowel + visarga | Guru (–) | namaḥ (maḥ = –) |\n| Last syllable of pāda | Guru (by convention) | always – |\n\n## 8 Gaṇas\n\n| Name | Pattern | Mnemonic (from yamātārājabhānasalagām) |\n|------|---------|----------------------------------------|\n| ya | ∪ – – | **ya**-mā-tā |\n| ma | – – – | **mā**-tā-rā |\n| ta | – – ∪ | **tā**-rā-ja |\n| ra | – ∪ – | **rā**-ja-bhā |\n| ja | ∪ – ∪ | **ja**-bhā-na |\n| bha | – ∪ ∪ | **bhā**-na-sa |\n| na | ∪ ∪ ∪ | **na**-sa-la |\n| sa | ∪ ∪ – | **sa**-la-gā |\n\nPlus single-syllable units: **la** (∪) and **ga** (–)\n\n## Common Meters Overview\n\n| Meter | Syllables/pāda | Total | Key Feature |\n|-------|---------------|-------|-------------|\n| Gāyatrī | 6 | 24 | Vedic |\n| Anuṣṭubh/Śloka | 8 | 32 | Most common |\n| Triṣṭubh | 11 | 44 | Vedic/epic |\n| Jagati | 12 | 48 | Vedic |\n| Vasantatilakā | 14 | 56 | Ornate |\n| Mandākrāntā | 17 | 68 | Slow, majestic |\n| Śārdūlavikrīḍita | 19 | 76 | Grand |\n| Sragdharā | 21 | 84 | Longest common |\n\n## Scansion Notation\n\nUse ∪ for laghu and – for guru. Write the pattern below each syllable:\n\n```\nna  mā  mi  śi  vam  śān  tam  de  vam\n∪   –   ∪   ∪   –    –    –    –   –\n```\n\n## Syllable Counting Practice Words\n\n| Word | Syllables | Count | Pattern |\n|------|-----------|-------|---------|\n| deva | de-va | 2 | – ∪ |\n| devam | de-vam | 2 | – – |\n| namaḥ | na-maḥ | 2 | ∪ – |\n| bhagavān | bha-ga-vān | 3 | ∪ ∪ – |\n| nīlakaṇṭha | nī-la-kaṇ-ṭha | 4 | – ∪ – ∪ |\n| mahādevāya | ma-hā-de-vā-ya | 5 | ∪ – – – ∪ |\n| karuṇāmayī | ka-ru-ṇā-ma-yī | 5 | ∪ ∪ – ∪ – |\n| trilocanam | tri-lo-ca-nam | 4 | ∪ – ∪ – |\n| gaṅgādharam | gaṅ-gā-dha-ram | 4 | – – ∪ – |\n", "workbook-questions": "# Stage 19: Chandas I — Workbook (Questions)\n\n## Section A: Laghu/Guru (15 marks)\n**A1.** Mark each syllable as laghu (∪) or guru (–) (10 marks):\n1. namāmi →  2. śivāya →  3. bhagavān →  4. nīlakaṇṭham →  5. triśūlam →\n6. puṣpam →  7. padmam →  8. devī →  9. saṃsāra →  10. karuṇā →\n\n**A2.** State the rule that makes each syllable guru (5 marks):\n1. mā in namāmi  2. ḥ in namaḥ  3. ṃ in saṃ  4. pad in padmam  5. vai in vaira\n\n## Section B: Gaṇa Identification (10 marks)\n**B1.** Name the gaṇa (3-syllable foot) (5 marks):\n1. ∪ – – →  2. – – – →  3. ∪ ∪ ∪ →  4. – ∪ – →  5. ∪ – ∪ →\n\n**B2.** Give the pattern for each gaṇa (5 marks):\n1. sa →  2. bha →  3. ta →  4. na →  5. ma →\n\n## Section C: Syllable Counting (15 marks)\n**C1.** Count the syllables in each phrase (5 marks):\n1. namāmi śivam →  2. he devi rakṣa mām →  3. śivāya namaḥ →  4. nīlakaṇṭhāya namaḥ →  5. oṃ namaḥ śivāya →\n\n**C2.** Scan this anuṣṭubh pāda — mark all 8 syllables as ∪ or – (10 marks):\n1. dharmasya glānir bhavati (8 syllables)\n2. dharmakṣetre kurukṣetre (8 syllables)\n\n## Section D: 8-Syllable Fitting (20 marks)\n**D1.** Reshape each phrase to fit exactly 8 syllables (add or substitute words) (10 marks):\n1. namāmi śivam (5 syl) → add 3 syllables: ___\n2. devīm bhajāmi (5 syl) → add 3: ___\n3. śivāya namaḥ śāntāya namaḥ (10 syl) → trim to 8: ___\n\n**D2.** Compose 4 original 8-syllable pādas on any devotional theme (10 marks):\n1. ___ (8 syllables)\n2. ___ (8 syllables)\n3. ___ (8 syllables)\n4. ___ (8 syllables)\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 19: Chandas I — Workbook (Answers)\n\n## Section A\n**A1.**\n1. na-mā-mi → **∪ – ∪**  2. śi-vā-ya → **∪ – ∪**  3. bha-ga-vān → **∪ ∪ –**\n4. nī-la-kaṇ-ṭham → **– ∪ – –**  5. tri-śū-lam → **∪ – –**\n6. puṣ-pam → **– –**  7. pad-mam → **– –**  8. de-vī → **– –**\n9. saṃ-sā-ra → **– – ∪**  10. ka-ru-ṇā → **∪ ∪ –**\n\n**A2.**\n1. mā — **long vowel (ā)**  2. ḥ — **visarga makes preceding syllable guru**  3. ṃ — **anusvāra makes syllable guru**  4. pad — **short vowel + conjunct (d+m)**  5. vai — **diphthong (long by nature)**\n\n## Section B\n**B1.** 1. ∪ – – → **ya**  2. – – – → **ma**  3. ∪ ∪ ∪ → **na**  4. – ∪ – → **ra**  5. ∪ – ∪ → **ja**\n**B2.** 1. sa → **∪ ∪ –**  2. bha → **– ∪ ∪**  3. ta → **– – ∪**  4. na → **∪ ∪ ∪**  5. ma → **– – –**\n\n## Section C\n**C1.** 1. na-mā-mi-śi-vam → **5**  2. he-de-vi-ra-kṣa-mām → **6**  3. śi-vā-ya-na-maḥ → **5**\n4. nī-la-kaṇ-ṭhā-ya-na-maḥ → **7**  5. oṃ-na-maḥ-śi-vā-ya → **6**\n\n**C2.**\n1. dha-rma-sya-glā-nir-bha-va-ti → ∪ – ∪ – – ∪ ∪ ∪ (accepting reasonable analysis)\n2. dha-rma-kṣe-tre-ku-ru-kṣe-tre → ∪ – – – ∪ ∪ – – (accepting reasonable analysis)\n\n## Section D\n**D1.**\n1. namāmi śivam → **namāmi śivaṃ śāntam** (∪–∪∪–––, 7...) or **nityaṃ namāmi śivam** (8: ni-tyaṃ-na-mā-mi-śi-va-m)\n2. devīm bhajāmi → **devīṃ bhajāmi sadā** (8: de-vīṃ-bha-jā-mi-sa-dā + adjust)\n3. śivāya namaḥ śāntāya namaḥ → **śivāya śāntāya namaḥ** (8: śi-vā-ya-śān-tā-ya-na-maḥ)\n\n**D2.** Sample:\n1. na-mā-mi-de-vaṃ-śi-va-m (namāmi devaṃ śivam — 8)\n2. pā-hi-māṃ-pa-ra-me-śva-ra (pāhi māṃ parameśvara — 8)\n3. de-vī-ma-māṃ-sa-dā-pā-tu (devī mamāṃ sadā pātu — 8)\n4. bha-ja-śaṃ-bhuṃ-sa-dā-śi-vam (bhaja śambhuṃ sadāśivam — 8)\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 19 Badge: Chandasvit I\n\n**Title:** Meter Listener\n**Badge:** 🏅 Chandasvit I\n\n## Requirements\n\n1. Identify the chandas (meter) of 5 given ślokas\n2. Mark laghu (u) and guru (—) for 3 pādas\n3. Explain the structure of anuṣṭubh\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 20 content and grants the **Chandasvit I** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "20-svara-vidya", "number": 20, "title": "Svara-Vidya", "subtitle": "Vedic Accent", "files": {"theory": "# Svara-Vidyā — The Science of Vedic Accent\n\n## Goal\nUnderstand the three Vedic svaras (udātta, anudātta, svarita), their rules in the Kṛṣṇa Yajurveda tradition, and the difference between Vedic recitation and classical Sanskrit. Learn to mark svaras on a mantra. Understand the vikṛti system (jaṭā, ghana) as sonic architecture.\n\n## Position in the Syllabus\nInsert after Chandas I (syllable weight). You just learned laghu/guru — the *weight* dimension of the syllable. Svara is the *pitch* dimension. Classical Sanskrit lost accent; Vedic Sanskrit preserves it. This stage recovers what was lost.\n\n## Why This Matters\n\nThe Taittirīya Upaniṣad opens the Śikṣāvallī with:\n\n> *śīkṣāṃ vyākhyāsyāmaḥ — varṇaḥ svaraḥ mātrā balaṃ sāma santānaḥ*\n> \"We shall explain Śikṣā: letter, accent, measure, force, melody, junction.\"\n\nSix factors govern sacred pronunciation. You already know **varṇa** (letter — from Varṇa-Vidyā) and **mātrā** (duration — from Chandas I). Now you learn **svara** — the factor the tradition considers most dangerous to get wrong.\n\n---\n\n## Part 1: The Three Svaras\n\nVedic Sanskrit is a **tonal language** — each syllable carries a pitch-accent that is part of the word's identity. Classical Sanskrit (post-Pāṇini) lost this tonal system; Vedic recitation preserves it.\n\n| Svara | Sanskrit | Pitch | Marking (KYV) | What It Does |\n|-------|----------|-------|---------------|-------------|\n| **Udātta** | उदात्त | Raised / high | Unmarked (no sign) | The \"lit\" syllable — the peak of the word's pitch contour |\n| **Anudātta** | अनुदात्त | Lowered / low | Underline (horizontal bar below) | The valley — the syllable before the rise |\n| **Svarita** | स्वरित | Falling / compound | Vertical bar above | Immediately follows udātta — the pitch falls from the peak |\n\n### The Basic Pattern\n\nIn most Vedic words, one syllable is **udātta** (high). The syllable immediately after it is **svarita** (falling). All other syllables are **anudātta** (low).\n\nExample with **agním** (Agni, accusative):\n\n```\na   gním\n↓    ↑↘\nanu  ud+sva\n```\n\n- **a** = anudātta (low) — marked with underline\n- **gni** = udātta (high) — unmarked\n- The pitch rises from \"a\" to \"gni\" and would fall on the next syllable if there were one\n\n### The Indraśatru Warning\n\nThe tradition's most famous teaching on svara:\n\n> *indraśatruḥ vardhasva*\n\nWith one svara pattern, this means \"O Indra's enemy, grow!\" — which is what the priest intended. But with wrong svara it becomes \"May Indra's enemy grow!\" — and the demon Vṛtra was killed by his own priest's mispronunciation.\n\nThe Taittirīya Brāhmaṇa records this story as a warning: **svara is not decoration. It is the direction of the mantra's power.** Wrong pitch does not make the mantra slightly less effective — it makes it a *different mantra* aimed at a different target.\n\n---\n\n## Part 2: Svara Rules in the Kṛṣṇa Yajurveda\n\nThe Taittirīya Prātiśākhya (the phonetics manual specific to the KYV) provides the exact rules for svara behavior. Key principles:\n\n### Rule 1: Every Word Has One Udātta\n\nEach independent word has exactly one udātta syllable (with rare exceptions for compounds). The udātta is inherent to the word — it is part of the word's identity, not a choice made by the reciter.\n\n### Rule 2: Svarita Follows Udātta\n\nThe syllable immediately after an udātta becomes svarita — the pitch falls. This is called **jātya svarita** (natural svarita) when it occurs within a word.\n\n### Rule 3: Anudātta Fills Everything Else\n\nAll syllables that are neither udātta nor svarita are anudātta — the default low pitch.\n\n### Rule 4: Sandhi Affects Svara\n\nWhen words combine in saṃhitā-pāṭha (continuous recitation), the svara pattern of the combined sequence may differ from the individual words. The Prātiśākhya specifies exactly how svaras interact at word-boundaries:\n\n- When two udāttas would be adjacent, rules determine which survives\n- Svarita can be **enclitic** (kampa-svarita) — a wavering pitch that signals the meeting of two tonal contours\n- Certain particles (like ca, tu, hi) lose their accent and become enclitic\n\n### Rule 5: Verbs in Main Clauses Lose Accent\n\nIn main clauses (not subordinate), finite verbs become anudātta — they lose their natural udātta. This is why verb-accent is often different in Vedic prose (brāhmaṇa) vs Vedic hymns (mantra).\n\n---\n\n## Part 3: The Marking System\n\nThe Kṛṣṇa Yajurveda uses a specific notation:\n\n| What | Mark | Position | Example |\n|------|------|----------|---------|\n| **Anudātta** | Horizontal line | Below the syllable | a̱gne (the \"a\" is low) |\n| **Udātta** | (No mark) | — | The unmarked syllable is the peak |\n| **Svarita** | Vertical line | Above the syllable | The syllable after udātta |\n\nThis is the opposite of what you might expect — the \"special\" syllable (udātta) is unmarked, while the \"default\" (anudātta) is marked. The logic: if you know where the anudātta and svarita are, the udātta is everything else. The system marks the *support structure,* not the peak.\n\n### Reading Example: First Line of the Namakam\n\n> *namaḥ somāya ca rudrāya ca*\n\nSvara pattern (simplified):\n```\nna  maḥ  so  mā  ya  ca  rud rā  ya  ca\n↓   ↓    ↑   ↘   ↓   ↓   ↑   ↘   ↓   ↓\nan  an   ud  sv   an  an  ud  sv   an  an\n```\n\n- **so** in somāya carries the udātta — the word peaks there\n- **mā** immediately after is svarita — the pitch falls\n- **rud** in rudrāya carries the udātta\n- **rā** is svarita\n- Everything else is anudātta\n\n### Practice: Marking Svaras\n\nTo mark svaras on a mantra you know:\n1. Identify each word's natural udātta (from a pada-pāṭha text or teacher)\n2. Mark the syllable after each udātta as svarita\n3. Mark everything else as anudātta\n4. Check sandhi-boundaries for svara interactions\n\n---\n\n## Part 4: Saṃhitā vs Pada — The Sandhi Dimension\n\nThe KYV tradition preserves every mantra in (at least) two forms:\n\n| Form | What It Is | Example |\n|------|-----------|---------|\n| **Saṃhitā-pāṭha** | Continuous recitation with full sandhi | *namo̍ rudra̱ya ca* (sounds flow together) |\n| **Pada-pāṭha** | Word-by-word with sandhi dissolved | *namaḥ | rudrāya | ca* (each word isolated) |\n\n### Why Both Exist\n\n- **Saṃhitā** is how the mantra is *performed* — it is the living, breathing form. Sandhi creates the continuous sound-stream.\n- **Pada** is how the mantra is *analyzed* — each word is separated so you can see the grammar. Where saṃhitā says \"namo\" (namaḥ + r → namo), pada shows you the original \"namaḥ\" + \"rudrāya.\"\n\nThe relationship between saṃhitā and pada is the relationship between *performance and analysis,* between the woven cloth and the individual threads.\n\n### Svara in Saṃhitā vs Pada\n\nCrucially, the svaras in saṃhitā-pāṭha are not always identical to those in pada-pāṭha. When words join (sandhi), their svara contours interact. The Prātiśākhya specifies the resulting combined pattern. Learning to hear the difference — to hear the individual word-accents underneath the continuous flow — is a major step in Vedic literacy.\n\n---\n\n## Part 5: The Vikṛtis — Weaving the Sound-Body\n\nBeyond simple recitation, the Vedic tradition developed eight **vikṛti** patterns — systematic rearrangements of the word-order that weave the text forward and backward:\n\n### The Hierarchy of Recitation\n\n| Level | Name | Pattern (for words A B C D) | Complexity |\n|-------|------|----------------------------|-----------|\n| 1 | **Saṃhitā** | A B C D | Continuous, linear |\n| 2 | **Pada** | A \\| B \\| C \\| D | Word-by-word, no sandhi |\n| 3 | **Krama** | AB, BC, CD | Pairs, stepping forward |\n| 4 | **Jaṭā** | AB BA AB, BC CB BC, CD DC CD | Forward-backward-forward |\n| 5 | **Ghana** | AB BA ABC, BC CB BCD, CD DC CDE | Triple weave |\n\n### Krama-Pāṭha (Step Recitation)\n\nThe first step beyond pada. Take the words in overlapping pairs:\n\nFor *namaḥ somāya ca rudrāya ca:*\n```\nnamaḥ somāya    (words 1-2)\nsomāya ca       (words 2-3)\nca rudrāya      (words 3-4)\nrudrāya ca      (words 4-5)\n```\n\nEach word appears twice — once as the second member of a pair, once as the first of the next pair. This overlap ensures that if any word were to be lost, its neighbor preserves the link.\n\n### Jaṭā-Pāṭha (Braid Recitation)\n\nForward-backward-forward for each pair:\n\n```\nnamaḥ somāya — somāya namaḥ — namaḥ somāya\nsomāya ca — ca somāya — somāya ca\nca rudrāya — rudrāya ca — ca rudrāya\nrudrāya ca — ca rudrāya — rudrāya ca\n```\n\nThe name \"jaṭā\" (matted locks) describes what happens to the sound — words interlock like the matted hair of an ascetic. You cannot remove one strand without disturbing the whole.\n\n### Ghana-Pāṭha (Dense/Block Recitation)\n\nThe most complex standard vikṛti:\n\n```\nnamaḥ somāya — somāya namaḥ — namaḥ somāya ca — ca somāya namaḥ — namaḥ somāya ca\nsomāya ca — ca somāya — somāya ca rudrāya — rudrāya ca somāya — somāya ca rudrāya\n...\n```\n\nThe pattern: AB BA ABC CBA ABC, then shift.\n\nGhana-pāṭha produces a **three-dimensional weave** — forward movement (sṛṣṭi), backward movement (saṃhāra), and the compound three-word movement (sthiti). When you hear Chamaka-ghana, you are hearing the Chamakam woven into a sonic sculpture.\n\n### Why the Vikṛtis Exist\n\n1. **Preservation:** The overlapping patterns make corruption nearly impossible. If a single word changes, the error is immediately obvious because it breaks the forward AND backward patterns. The Vedic text has been preserved with extraordinary fidelity for 3,000+ years — largely because of this system.\n\n2. **Sonic architecture:** Ghana-pāṭha creates overtone patterns and resonances impossible in linear recitation. The weaving produces a quality of sound that is qualitatively different from simple chanting.\n\n3. **Dhāraṇā training:** The reciter must hold the entire sequence in mind while weaving forward and backward. This is high-order memory training — directly relevant to the avadhāna skills you will develop in later stages of this syllabus.\n\n---\n\n## Part 6: Svara vs Chandas — Two Dimensions of the Syllable\n\nYou now know two systems that operate on the same syllable:\n\n| System | What It Measures | Values | Where Used |\n|--------|-----------------|--------|-----------|\n| **Chandas** (meter) | Syllable *weight* | Laghu (light) / guru (heavy) | Classical + Vedic poetry |\n| **Svara** (accent) | Syllable *pitch* | Udātta (high) / anudātta (low) / svarita (falling) | Vedic recitation only |\n\nA syllable can be:\n- laghu AND udātta (light AND high-pitched)\n- guru AND anudātta (heavy AND low-pitched)\n- Any combination — the two systems are independent\n\nClassical Sanskrit poetry retained chandas but lost svara — syllable weight still matters (for anuṣṭubh, śārdūlavikrīḍita, etc.) but pitch-accent is gone. The Vedic tradition preserves both.\n\n### Why Classical Sanskrit Lost Svara\n\nPāṇini's grammar records the accent system but notes that it was already becoming archaic in everyday speech. The Prātiśākhya texts preserve the rules because the Vedic recitation tradition *needed* them — the mantras required exact pitch. But laukika (worldly) Sanskrit moved toward a stress-based system instead of a pitch-based one.\n\nThis means: when you compose a śloka in classical Sanskrit (stages 12-22 of this syllabus), you control syllable *weight* through meter. When you recite a Vedic mantra, you control syllable *pitch* through svara. The two disciplines use different parameters on the same raw material.\n\n---\n\n## Part 7: The Six Factors — Complete Framework\n\nReturning to the Taittirīya Upaniṣad's framework, you now know four of the six factors:\n\n| Factor | What | Where You Learned It |\n|--------|------|---------------------|\n| **Varṇa** (letter) | Which sound | Varṇa-Vidyā: sthāna, prayatna, the 48 letters |\n| **Svara** (accent) | Which pitch | This stage: udātta, anudātta, svarita |\n| **Mātrā** (duration) | How long | Chandas I: laghu (1 mātrā), guru (2 mātrā), pluta (3 mātrā) |\n| **Bala** (force) | How much prāṇa | Practice-based: the pressure of articulation |\n| **Sāma** (melody) | How smooth | Practice-based: evenness of flow between sounds |\n| **Santāna** (junction) | How sounds connect | Sandhi rules + saṃhitā/pada distinction |\n\nA fully competent Vedic reciter controls all six simultaneously. Each syllable is produced with the right letter, at the right pitch, for the right duration, with the right force, connected smoothly to its neighbors. This is the standard the tradition sets.\n\n---\n\n## Summary\n\n| Concept | What You Now Know |\n|---------|------------------|\n| **Three svaras** | Udātta (high/peak), anudātta (low/default), svarita (falling/after peak) |\n| **One udātta per word** | Each word peaks once — the peak is inherent, not chosen |\n| **Wrong svara = different mantra** | The indraśatru principle — pitch changes meaning |\n| **KYV notation** | Anudātta marked below, svarita above, udātta unmarked |\n| **Saṃhitā vs pada** | Performance (with sandhi) vs analysis (without) |\n| **Krama → jaṭā → ghana** | Progressively complex weaves for preservation and sonic architecture |\n| **Svara ≠ chandas** | Pitch and weight are independent dimensions of the same syllable |\n| **Classical lost svara** | Poetry retained weight-based meter; only Vedic recitation preserves pitch |\n", "reference": "# Svara-Vidyā — Reference Guide\n\n## The Three Svaras\n\n| Svara | Pitch | KYV Mark | Position | Symbol |\n|-------|-------|----------|----------|--------|\n| **Udātta** | High / raised | Unmarked | The peak syllable of a word | (none) |\n| **Anudātta** | Low / depressed | Underline below | All syllables before the rise | \\_ |\n| **Svarita** | Falling | Vertical bar above | Immediately after udātta | \\| |\n\n## Svara Determination Rules\n\n| Rule | Description | Example |\n|------|-------------|---------|\n| One udātta per word | Each word has exactly one udātta syllable | agním: \"gni\" is udātta |\n| Svarita follows udātta | The syllable after udātta becomes svarita | agnínā: \"ná\" is svarita after \"gní\" |\n| Anudātta = default | Everything not udātta or svarita | Multiple syllables may be anudātta |\n| Verb-accent loss | Finite verbs in main clauses lose udātta | bhávati (independent) vs bhavati (in clause) |\n| Compound accent | In most compounds, first member loses accent | rāja + puruṣa → rājapúruṣa |\n\n## Svarita Subtypes\n\n| Type | Name | When It Occurs |\n|------|------|---------------|\n| Jātya | Natural | Within a word, on the syllable after udātta |\n| Kṣaipra | Quick | When a long svarita vowel shortens before another vowel |\n| Abhinihita | Absorbed | When a svarita vowel mer
