habet.\n\n---\n\n## The 25 Sparśa: The Consonant Matrix\n\nThe 25 stop-consonants are arranged in a 5×5 grid — five rows (by sthāna) and five columns (by effort):\n\n| | 1st (aghoṣa) | 2nd (mahāprāṇa) | 3rd (ghoṣa) | 4th (ghoṣa-mahāprāṇa) | 5th (anunāsika) |\n|---|---|---|---|---|---|\n| **Kaṇṭha** | **ka** | **kha** | **ga** | **gha** | **ṅa** |\n| **Tālu** | **ca** | **cha** | **ja** | **jha** | **ña** |\n| **Mūrdhan** | **ṭa** | **ṭha** | **ḍa** | **ḍha** | **ṇa** |\n| **Danta** | **ta** | **tha** | **da** | **dha** | **na** |\n| **Oṣṭha** | **pa** | **pha** | **ba** | **bha** | **ma** |\n\n### What the Columns Mean\n\n| Column | Prayatna | What the Voice Does |\n|--------|----------|-------------------|\n| 1st | Unvoiced, unaspirated | Seed — compact, potential, the stop before anything flows |\n| 2nd | Unvoiced, aspirated | Seed + breath — prāṇa enters the form |\n| 3rd | Voiced | Vibration begins — the vocal cords engage, *life enters* |\n| 4th | Voiced + aspirated | Full animation — voice AND breath together |\n| 5th | Nasal | Dissolution into resonance — sound enters the nose and head |\n\nEach row traverses the same arc: from closed seed to open resonance. From potential to dissolution. Five times, at five locations in the mouth.\n\n### The Remaining 8 Letters\n\n**Antastha** (in-between) — ya, ra, la, va: transitional sounds between vowel and consonant.\n**Ūṣma** (heat/friction) — śa, ṣa, sa, ha: sibilants and the final breath.\n\n| Letter | Sthāna | Significance |\n|--------|--------|-------------|\n| **ya** | Tālu | Glide — the transitional energy |\n| **ra** | Mūrdhan | Fire-letter — the letter of transformation (present in hrīṃ, śrīṃ, krīṃ) |\n| **la** | Danta | Earth-touch — grounding |\n| **va** | Danta-oṣṭha | Wind — flowing energy |\n| **śa** | Tālu | The śakti-sibilant — in śiva, śakti, śānti, śrī |\n| **ṣa** | Mūrdhan | The fire-sibilant |\n| **sa** | Danta | The soma-sibilant — satya, soma, sattva |\n| **ha** | Kaṇṭha | Pure breath — the final letter, Śiva's exhale |\n\n### Aham: The Entire Alphabet in One Word\n\n**Aham** (अहम्) = \"I.\"\n- **a** = the first vowel — the initial pulse\n- **ha** = the last consonant — the final breath\n- **m** = the bindu — where all sounds dissolve\n\nThe word for \"I\" in Sanskrit literally spans the entire alphabet from first to last, sealed by the bindu. Every time you say \"aham,\" you are saying: *I contain all sounds.*\n\n---\n\n## The Maheshvara Sūtrāṇi: Pāṇini's Compression Algorithm\n\nTradition says these 14 aphorisms emanated from Śiva's ḍamaru at the end of his cosmic dance. Pāṇini received them as the raw material for his grammar. They are a brilliantly compressed encoding of every Sanskrit phoneme:\n\n| # | Sūtra | Sounds | It-marker |\n|---|-------|--------|-----------|\n| 1 | **aiuṇ** | a, i, u | ṇ |\n| 2 | **ṛḷk** | ṛ, ḷ | k |\n| 3 | **eoṅ** | e, o | ṅ |\n| 4 | **aiauc** | ai, au | c |\n| 5 | **hayavaraṭ** | ha, ya, va, ra | ṭ |\n| 6 | **laṇ** | la | ṇ |\n| 7 | **ñamaṅaṇanam** | ña, ma, ṅa, ṇa, na | m |\n| 8 | **jhabañ** | jha, bha | ñ |\n| 9 | **ghaḍhadhaṣ** | gha, ḍha, dha | ṣ |\n| 10 | **jabagaḍadaś** | ja, ba, ga, ḍa, da | ś |\n| 11 | **khaphachaṭhathacaṭatav** | kha, pha, cha, ṭha, tha, ca, ṭa, ta | v |\n| 12 | **kapay** | ka, pa | y |\n| 13 | **śaṣasar** | śa, ṣa, sa | r |\n| 14 | **hal** | ha | l |\n\n### How Pratyāhāras Work\n\nA **pratyāhāra** takes any starting sound and combines it with any later it-marker. The result denotes *all sounds in between*. The governing sūtra: **ādir antyena sahetā** (1.1.71) — \"The first [sound], combined with the last [it-marker], [denotes all sounds between].\"\n\n| Pratyāhāra | What It Captures | What It Means |\n|------------|-----------------|---------------|\n| **ac** | a, i, u, ṛ, ḷ, e, o, ai, au | All vowels |\n| **hal** | ha, ya, va, ra... through to ha | All consonants |\n| **ik** | i, u, ṛ, ḷ | The \"high\" vowels |\n| **aṇ** | a, i, u | The three basic vowels |\n| **eṅ** | e, o | The simple compound vowels |\n| **yar** | ya, va, ra, la, ña, ma... through sa | All voiced and sonorant consonants |\n\nThis system compresses hundreds of grammar rules into minimal form. When Pāṇini writes \"ac,\" he means \"all vowels\" in two letters. The entire Aṣṭādhyāyī depends on this compression.\n\n### Why This Matters for This Course\n\nThe pratyāhāra system proves that the phoneme inventory is not a random list. The order of the Maheshvara Sūtrāṇi is *designed* — each sound is placed so that meaningful groupings can be captured with minimum notation. The same principle applies to bīja-mantras: each letter is chosen for its specific sthāna and prayatna. Nothing in the Sanskrit sound-system is arbitrary.\n\n---\n\n## Bījākṣara: The Anatomy of Seed-Syllables\n\nA bīja (seed) mantra concentrates an entire deity or principle into one syllable. Every bīja follows the same architecture:\n\n1. **Consonant(s)** — the *form* of the energy (which sthāna, which element, which type of contact)\n2. **Vowel** — the *life-force* (usually ī for śakti-bījas)\n3. **Anusvāra (ṃ)** — the *seal* — sound collapses into nasal resonance, then silence. The bindu makes a bīja a bīja.\n\n### Dissecting the Major Bījas\n\n| Bīja | Letters | Deity | Letter-by-Letter Analysis |\n|------|---------|-------|--------------------------|\n| **Oṃ** | a + u + ṃ | Brahman | Three vowels = three states (waking, dream, sleep); bindu = turīya (the silence after) |\n| **Hrīṃ** | ha + ra + ī + ṃ | Bhuvaneśvarī / Māyā | Breath (ha, kaṇṭha) + fire (ra, mūrdhan) + śakti (ī, tālu) + seal (ṃ) |\n| **Śrīṃ** | śa + ra + ī + ṃ | Lakṣmī | Śakti-sibilant (śa, tālu) + fire (ra) + śakti (ī) + seal (ṃ) |\n| **Krīṃ** | ka + ra + ī + ṃ | Kālī | First stop (ka, kaṇṭha — consciousness hitting itself) + fire (ra) + śakti (ī) + seal (ṃ) |\n| **Klīṃ** | ka + la + ī + ṃ | Kāma / Kṛṣṇa | First stop (ka) + earth-touch (la, danta) + śakti (ī) + seal (ṃ) |\n| **Aiṃ** | ai + ṃ | Sarasvatī / Vāgbhavā | The compound vowel of speech (kaṇṭha-tālu) + seal (ṃ) — pure vāk |\n| **Sauḥ** | sa + au + ḥ | Parā Śakti | Soma-sibilant (sa, danta) + fullest compound vowel (au) + visarga (pure breath) |\n| **Hauṃ** | ha + au + ṃ | Śiva | Pure breath (ha) + fullest compound vowel (au) + seal (ṃ) |\n\n### Detailed Analysis: Krīṃ\n\n**ka** — The first consonant in the entire alphabet. The hardest stop. Back of the throat. Ākāśa. The first impact of consciousness against itself.\n\n**ra** — Fire. The mūrdhanya letter that transforms. The rolling, burning energy. In every śakti-bīja that transforms (hrīṃ, śrīṃ, krīṃ), \"ra\" is present. It is the fire that cooks the seed.\n\n**ī** — The long feminine vowel. Tālu. Sustained śakti. Not the brief \"i\" (a spark) but \"ī\" (a sustained flame). Present in almost every śakti-bīja.\n\n**ṃ** — The bindu. Sound collapses from articulated form into pure nasal resonance and then into silence. The point. The seed within the seed.\n\nKrīṃ = *the first impact of consciousness (ka), transformed by fire (ra), sustained by śakti (ī), dissolved into the point (ṃ).* This IS Kālī — the force that begins, burns, sustains, and dissolves.\n\n### Krīṃ vs Klīṃ: One Letter Changes Everything\n\nThe only difference between Kālī's bīja (krīṃ) and Kāma's bīja (klīṃ) is **ra vs la** — fire vs earth. Same starting impact (ka), same sustaining śakti (ī), same seal (ṃ). But:\n\n- **ra** (mūrdhan, fire) → Kālī's bīja *burns* — it transforms, consumes, liberates through destruction\n- **la** (danta, earth) → Kāma's bīja *grounds* — it attracts, embodies, draws the desired thing into manifestation\n\nOne letter. One sthāna shift. Entirely different deity, entirely different function. This is why the sthāna system is not academic phonetics — it is the architecture of mantric power.\n\n### The Bījas of Bālā: Aiṃ Klīṃ Sauḥ\n\nThe simplest complete mantra in Śrīvidyā — and a masterclass in bīja composition:\n\n| Bīja | Śakti | Kūṭa | Analysis |\n|------|-------|------|----------|\n| **Aiṃ** | Jñāna (knowledge) | Vāgbhava | ai = intensified Śiva-Śakti union at the speech level (e is a+i; ai intensifies further). Pure vāk-śakti sealed by bindu. |\n| **Klīṃ** | Icchā (will/desire) | Kāmarāja | ka = the first impulse, la = descent to earth, ī = the māyā-śakti matrix, ṃ = sealed. The complete arc of desire from impulse through embodiment. |\n| **Sauḥ** | Kriyā (action) | Śakti | sa = \"tat\" (that), au = the fullest union-vowel, ḥ = visarga = Śakti's exhalation into manifestation. The bīja encodes tat-tvam-asi as sonic event. |\n\nThree bījas. Three śaktis. Three kūṭas of the Pañcadaśī. The entire Śrīvidyā theology compressed into three syllables — and you can now read *why* each syllable does what it does, letter by letter.\n\n---\n\n## From Letters to Names: Reading the Sahasranāma\n\nArmed with sthāna-prayatna knowledge, divine names stop being labels and become descriptions:\n\n**Lalitā** (ललिता) — la + la + i + tā: two earth-touches (la, la), a bright vowel (i), and a dental stop held long (tā). The name *feels* playful in the mouth — the tongue taps the palate twice, lightly. \"She who plays\" — the etymology (√laḍ/laḷ) and the phonetics say the same thing.\n\n**Kālī** (काली) — kā + lī: throat-stop held long (kā = ka + ā) + earth-touch held long (lī = la + ī). Deep throat to grounded earth. Two syllables spanning the full vertical axis of the mouth. The name itself sounds like descent — from space to ground. Time (kāla) crashing into form.\n\n**Śiva** (शिव) — śa + i + va: śakti-sibilant at the palate (śa) + bright short vowel (i) + wind at the lips (va). The name moves from palatal friction to labial flow — from the hiss of energy to the breath of release. \"The auspicious one\" — but also, phonetically, the sound of something relaxing from tension into ease.\n\n---\n\n## Summary\n\n| Principle | What You Now Know |\n|-----------|------------------|\n| **Sthāna** | Every letter has a home in the mouth — throat, palate, dome, teeth, or lips |\n| **Prayatna** | Every consonant has a mode — stopped, aspirated, voiced, voiced+aspirated, nasal |\n| **Element** | Sthānas map to the five elements from subtle (ākāśa) to gross (pṛthivī) |\n| **Vowels** | The 16 vowels are the life-force; without them, consonants cannot speak |\n| **Pratyāhāra** | The Maheshvara Sūtrāṇi compress the entire phoneme system into 14 phrases |\n| **Bīja anatomy** | Every bīja = consonant(s) + vowel + bindu; each component chosen for its sthāna |\n| **One letter changes the deity** | ra vs la in krīṃ vs klīṃ = fire vs earth = Kālī vs Kāma |\n", "reference": "# Varṇa-Vidyā — Reference Guide\n\n## The Five Sthānas (Places of Articulation)\n\n| Sthāna | Location | Element | Letters Produced |\n|--------|----------|---------|-----------------|\n| Kaṇṭhya | Throat | Ākāśa | a, ā, ka-varga, ha, visarga |\n| Tālavya | Hard palate | Vāyu | i, ī, ca-varga, ya, śa |\n| Mūrdhanya | Dome of palate | Agni | ṛ, ṝ, ṭa-varga, ra, ṣa |\n| Dantya | Teeth | Āpas | ḷ, ḹ, ta-varga, la, sa |\n| Oṣṭhya | Lips | Pṛthivī | u, ū, pa-varga, va (danta-oṣṭhya) |\n| Kaṇṭha-tālu | Throat+palate | — | e, ai |\n| Kaṇṭha-oṣṭha | Throat+lips | — | o, au |\n| Nāsikā | Nose | — | ṃ (anusvāra), all nasals |\n\n## The 5x5 Sparśa Matrix\n\n| | Aghoṣa | Mahāprāṇa | Ghoṣa | Ghoṣa+Mahāprāṇa | Anunāsika |\n|---|---|---|---|---|---|\n| **Kaṇṭha** | ka | kha | ga | gha | ṅa |\n| **Tālu** | ca | cha | ja | jha | ña |\n| **Mūrdhan** | ṭa | ṭha | ḍa | ḍha | ṇa |\n| **Danta** | ta | tha | da | dha | na |\n| **Oṣṭha** | pa | pha | ba | bha | ma |\n\n## Complete Varṇamālā (48/50 letters)\n\n### Svarāḥ (16 vowels)\na ā i ī u ū ṛ ṝ ḷ ḹ e ai o au aṃ aḥ\n\n### Sparśāḥ (25 stops)\nka kha ga gha ṅa | ca cha ja jha ña | ṭa ṭha ḍa ḍha ṇa | ta tha da dha na | pa pha ba bha ma\n\n### Antasthāḥ (4 semivowels)\nya ra la va\n\n### Ūṣmāṇaḥ (4 fricatives/aspirate)\nśa ṣa sa ha\n\n### Additional (in some counts)\nkṣa (ka + ṣa), jña (ja + ña)\n\n## The 14 Maheshvara Sūtrāṇi\n\n```\n1.  a i u ṇ        8.  jha bha ñ\n2.  ṛ ḷ k           9.  gha ḍha dha ṣ\n3.  e o ṅ           10. ja ba ga ḍa da ś\n4.  ai au c          11. kha pha cha ṭha tha ca ṭa ta v\n5.  ha ya va ra ṭ    12. ka pa y\n6.  la ṇ             13. śa ṣa sa r\n7.  ña ma ṅa ṇa na m 14. ha l\n```\n\n## Key Pratyāhāras\n\n| Pratyāhāra | = | Used in |\n|------------|---|---------|\n| **ac** | All vowels (a through au) | Vowel sandhi rules |\n| **hal** | All consonants (ha through ha) | Consonant identification |\n| **ik** | i, u, ṛ, ḷ | Guṇa/vṛddhi rules |\n| **aṇ** | a, i, u | Basic vowel triad |\n| **eṅ** | e, o | Simple diphthongs |\n| **ec** | e, o, ai, au | All diphthongs |\n| **yar** | All sonorants + voiced stops | Sandhi contexts |\n| **jaś** | ja, ba, ga, ḍa, da | 3rd-column voiced stops |\n| **khar** | All voiceless consonants + sibilants | Voiceless environment rules |\n\n## Bīja Anatomy Quick Reference\n\n### Architecture: Consonant(s) + Vowel + Bindu\n\n| Component | Role | Common Values |\n|-----------|------|--------------|\n| Consonant(s) | Form/sthāna of the energy | ka, ha, śa, kla, etc. |\n| Vowel | Life-force | ī (śakti), ū (stability), ai (speech), au (fullness) |\n| Bindu (ṃ) | Seal — sound collapses into the point | Always anusvāra |\n| Visarga (ḥ) | Breath-seal — exhaled, not collapsed | In sauḥ, namaḥ |\n\n### Major Bīja Table\n\n| Bīja | Consonant | Sthāna | Vowel | Deity |\n|------|-----------|--------|-------|-------|\n| **Oṃ** | (a+u) | kaṇṭha+oṣṭha | compound | Brahman |\n| **Hrīṃ** | ha+ra | kaṇṭha+mūrdhan | ī | Bhuvaneśvarī |\n| **Śrīṃ** | śa+ra | tālu+mūrdhan | ī | Lakṣmī |\n| **Krīṃ** | ka+ra | kaṇṭha+mūrdhan | ī | Kālī |\n| **Klīṃ** | ka+la | kaṇṭha+danta | ī | Kāma |\n| **Aiṃ** | — | kaṇṭha-tālu | ai | Sarasvatī |\n| **Sauḥ** | sa | danta | au+ḥ | Parā Śakti |\n| **Hauṃ** | ha | kaṇṭha | au | Śiva |\n| **Dūṃ** | da+ū | danta | ū | Durgā |\n| **Gaṃ** | ga | kaṇṭha | a | Gaṇeśa |\n| **Strīṃ** | sa+ta+ra | danta+danta+mūrdhan | ī | Tārā |\n\n### The ra-la Distinction in Bījas\n\n| Bīja | Middle letter | Sthāna | Element | Function |\n|------|-------------|--------|---------|----------|\n| **Krīṃ** (Kālī) | ra | Mūrdhan | Fire | Burns, transforms, liberates |\n| **Klīṃ** (Kāma) | la | Danta | Earth | Attracts, grounds, embodies |\n| **Hrīṃ** (Māyā) | ra | Mūrdhan | Fire | Veils and reveals through fire |\n| **Hlīṃ** (variant) | la | Danta | Earth | Grounds the māyā principle |\n\n### Bālā Mantra Components (Aiṃ Klīṃ Sauḥ)\n\n| Bīja | Kūṭa | Śakti | Letter Analysis |\n|------|-------|-------|----------------|\n| Aiṃ | Vāgbhava | Jñāna | ai (intensified a+i union at speech-level) + ṃ |\n| Klīṃ | Kāmarāja | Icchā | ka (impulse) + la (earth-descent) + ī (śakti-matrix) + ṃ |\n| Sauḥ | Śakti | Kriyā | sa (tat) + au (union/samarasya) + ḥ (aham/visarga) |\n\n## Divine Name Analysis Examples\n\n| Name | Letters | Sthāna Movement | Etymology |\n|------|---------|-----------------|-----------|\n| Lalitā | la-li-tā | danta → tālu → danta | √laḍ/laḷ — she who plays |\n| Kālī | kā-lī | kaṇṭha → danta | √kal (to count/time) — she who is Time |\n| Śiva | śi-va | tālu → danta-oṣṭha | √śī (to rest) — the auspicious/restful one |\n| Durgā | dur-gā | danta → kaṇṭha | dur + √gam — she who is hard to reach |\n| Rudra | rud-ra | danta → mūrdhan | √rud (to weep/howl) — the howler |\n| Viṣṇu | viṣ-ṇu | danta-oṣṭha → mūrdhan | √viṣ (to pervade) — the all-pervading |\n", "workbook-questions": "# Varṇa-Vidyā — Workbook (Questions)\n\n## Section A: Sthāna Identification (15 marks)\n\n**A1.** Name the sthāna (place of articulation) for each letter (5 marks):\n1. ka\n2. ṭa\n3. pa\n4. śa\n5. ra\n\n**A2.** Name the element associated with each sthāna (5 marks):\n1. Kaṇṭhya (throat)\n2. Tālavya (palate)\n3. Mūrdhanya (dome)\n4. Dantya (teeth)\n5. Oṣṭhya (lips)\n\n**A3.** Which sthāna do the following compound vowels combine? (5 marks):\n1. e\n2. ai\n3. o\n4. au\n5. Why are these called \"compound\" vowels?\n\n---\n\n## Section B: The Sparśa Matrix (15 marks)\n\n**B1.** Complete the missing letters in this partial matrix (5 marks):\n\n| | 1st | 2nd | 3rd | 4th | 5th |\n|---|---|---|---|---|---|\n| Kaṇṭha | ka | ___ | ga | ___ | ṅa |\n| Tālu | ___ | cha | ja | jha | ___ |\n| Danta | ta | tha | ___ | dha | na |\n\n**B2.** For each pair, identify which column (1st through 5th) each letter belongs to and explain the difference (5 marks):\n1. ka vs kha\n2. ga vs gha\n3. ka vs ga\n4. ta vs na\n5. pa vs ma\n\n**B3.** A varga (row) moves from \"seed to dissolution.\" Explain what this means using the ka-varga as an example (5 marks):\n> ka → kha → ga → gha → ṅa\n\nWhat changes at each step? What is the arc?\n\n---\n\n## Section C: Pratyāhāra (15 marks)\n\n**C1.** Using the Maheshvara Sūtrāṇi, determine which sounds are captured by each pratyāhāra (5 marks):\n1. ac\n2. hal\n3. ik\n4. aṇ\n5. ec\n\n**C2.** Create the pratyāhāra that captures each of these groups (5 marks):\n1. All vowels\n2. All consonants\n3. i, u, ṛ, ḷ (vowels without a, e, o, ai, au)\n4. e, o only\n5. All sibilants: śa, ṣa, sa\n\n**C3.** The sūtra \"ādir antyena sahetā\" (1.1.71) governs the pratyāhāra system. Explain its meaning in your own words. Why is this system more efficient than simply listing sounds? (5 marks)\n\n---\n\n## Section D: Bīja Analysis (20 marks)\n\n**D1.** Dissect each bīja into its component letters. For each letter, give the sthāna and element (10 marks):\n1. Hrīṃ\n2. Krīṃ\n3. Klīṃ\n4. Śrīṃ\n5. Aiṃ\n\n**D2.** The only difference between Krīṃ and Klīṃ is one letter: ra vs la (5 marks):\n1. What is the sthāna of ra?\n2. What is the sthāna of la?\n3. What element does ra carry?\n4. What element does la carry?\n5. How does this single-letter difference explain the difference between Kālī's function (liberation through fire) and Kāma's function (attraction into form)?\n\n**D3.** Analyze the Bālā mantra — Aiṃ Klīṃ Sauḥ (5 marks):\n1. Which three śaktis do the three bījas represent?\n2. What is unusual about Aiṃ compared to the other bījas? (Hint: look at the consonant component)\n3. Sauḥ ends with visarga (ḥ) rather than anusvāra (ṃ). What is the difference between these two seals?\n4. The three bījas correspond to the three kūṭas of the Pañcadaśī. Name them.\n5. Why does the Vāgbhava (speech) kūṭa use the compound vowel \"ai\" specifically?\n\n---\n\n## Section E: Reading Names (15 marks)\n\n**E1.** For each divine name, identify the sthāna of each syllable and describe the \"movement\" through the mouth (5 marks):\n1. Śiva (śi-va)\n2. Rudra (rud-ra)\n3. Lalitā (la-li-tā)\n\n**E2.** The name \"Kālī\" (kā-lī) moves from kaṇṭha to danta — from throat to teeth, from ākāśa to āpas. Perform the same analysis for (5 marks):\n1. Durgā (dur-gā)\n2. Gaṇeśa (ga-ṇe-śa)\n3. Viṣṇu (viṣ-ṇu)\n4. Sarasvatī (sa-ra-sva-tī)\n5. Tripurasundarī (tri-pu-ra-sun-da-rī)\n\n**E3.** The Lalitā Sahasranāma name #82 is **aṣṭacatvāriṃśad-varṇa-rūpā** — \"she whose form is the 48 letters.\" Why 48? Account for all 48 letters using the categories you have learned (5 marks).\n\n---\n\n## Section F: Synthesis (20 marks)\n\n**F1.** The word \"aham\" (I) is said to contain the entire alphabet. Explain how, using the positions of a, ha, and m in the varṇamālā (5 marks).\n\n**F2.** A student says: \"Bīja mantras are just random sacred syllables — their power comes from tradition and faith, not from the letters themselves.\" Using what you have learned in this stage, construct a counter-argument based on the sthāna system (5 marks).\n\n**F3.** Take any one name of your iṣṭadevatā from Stage 1. Perform a complete analysis (5 marks):\n- Break it into syllables\n- Identify the sthāna and element of each consonant\n- Identify the vowel type (short/long/compound) and its quality\n- Describe the \"sonic geography\" — how does the name move through the mouth?\n\n**F4.** Why does Pāṇini's grammar begin with the Maheshvara Sūtrāṇi rather than with grammar rules? What does this say about the relationship between sound and structure in the Sanskrit tradition? (5 marks)\n", "workbook-answers": "# Varṇa-Vidyā — Workbook (Answers)\n\n## Section A: Sthāna Identification\n\n**A1.**\n1. ka → **Kaṇṭhya** (throat)\n2. ṭa → **Mūrdhanya** (dome of palate)\n3. pa → **Oṣṭhya** (lips)\n4. śa → **Tālavya** (palate)\n5. ra → **Mūrdhanya** (dome of palate)\n\n**A2.**\n1. Kaṇṭhya → **Ākāśa** (space)\n2. Tālavya → **Vāyu** (air)\n3. Mūrdhanya → **Agni** (fire)\n4. Dantya → **Āpas** (water)\n5. Oṣṭhya → **Pṛthivī** (earth)\n\n**A3.**\n1. e → **Kaṇṭha + Tālu** (throat + palate)\n2. ai → **Kaṇṭha + Tālu** (throat + palate, further intensified)\n3. o → **Kaṇṭha + Oṣṭha** (throat + lips)\n4. au → **Kaṇṭha + Oṣṭha** (throat + lips, further intensified)\n5. They are called \"compound\" because they arise from the fusion of two simple vowels at two different sthānas: e = a (kaṇṭha) + i (tālu), o = a (kaṇṭha) + u (oṣṭha). They are sandhi within the vowel system itself — two places of articulation producing one sound.\n\n---\n\n## Section B: The Sparśa Matrix\n\n**B1.**\n\n| | 1st | 2nd | 3rd | 4th | 5th |\n|---|---|---|---|---|---|\n| Kaṇṭha | ka | **kha** | ga | **gha** | ṅa |\n| Tālu | **ca** | cha | ja | jha | **ña** |\n| Danta | ta | tha | **da** | dha | na |\n\n**B2.**\n1. ka vs kha → ka is **1st column** (unvoiced, unaspirated), kha is **2nd column** (unvoiced, aspirated). Difference: **aspiration** — kha adds a puff of breath (prāṇa) to the same stop.\n2. ga vs gha → ga is **3rd column** (voiced), gha is **4th column** (voiced, aspirated). Difference: gha adds aspiration to the voiced sound — both voice AND breath.\n3. ka vs ga → ka is **1st column** (unvoiced), ga is **3rd column** (voiced). Difference: **voicing** — ga engages the vocal cords, ka does not. Both are at the same sthāna (kaṇṭha).\n4. ta vs na → ta is **1st column** (stop), na is **5th column** (nasal). Difference: ta stops air completely at the teeth; na lets air flow through the nose while the tongue is in the same position. The nasal is the \"dissolution\" of the stop.\n5. pa vs ma → pa is **1st column** (stop), ma is **5th column** (nasal). Same relationship as ta/na but at the lips. Pa seals; ma hums.\n\n**B3.** The ka-varga arc:\n- **ka** — Pure stop. No voice, no breath. The sound hits the back of the throat like a fist. Seed. Potential. Compact.\n- **kha** — Same stop + breath. The fist opens slightly. Prāṇa enters. First expansion.\n- **ga** — Voice enters. The vocal cords vibrate. Life. Animation. What was silent now hums.\n- **gha** — Voice + breath together. Maximum energy in the form. Full animation.\n- **ṅa** — The nasal. Sound leaves the throat entirely and enters the nose. Dissolution into pure resonance. The stop has been transcended.\n\nThe arc is: **seed → breath → life → fullness → dissolution.** This mirrors sṛṣṭi (creation) to saṃhāra (dissolution) within a single sthāna.\n\n---\n\n## Section C: Pratyāhāra\n\n**C1.**\n1. **ac** = Start at **a** (sūtra 1), end at **c** (it-marker of sūtra 4) → a, i, u, ṛ, ḷ, e, o, ai, au = **all vowels**\n2. **hal** = Start at **ha** (sūtra 5), end at **l** (it-marker of sūtra 14) → all consonants from ha through the complete set = **all consonants**\n3. **ik** = Start at **i** (sūtra 1), end at **k** (it-marker of sūtra 2) → i, u, ṛ, ḷ = **the high/close vowels (without a)**\n4. **aṇ** = Start at **a** (sūtra 1), end at **ṇ** (it-marker of sūtra 1) → a, i, u = **the three basic short vowels**\n5. **ec** = Start at **e** (sūtra 3), end at **c** (it-marker of sūtra 4) → e, o, ai, au = **all diphthongs/compound vowels**\n\n**C2.**\n1. All vowels → **ac** (a through the c-marker of sūtra 4)\n2. All consonants → **hal** (ha through the l-marker of sūtra 14)\n3. i, u, ṛ, ḷ → **ik** (i through the k-marker of sūtra 2)\n4. e, o only → **eṅ** (e through the ṅ-marker of sūtra 3)\n5. śa, ṣa, sa → **śar** (śa through the r-marker of sūtra 13) — note: this captures śa, ṣa, sa but NOT ha\n\n**C3.** \"Ādir antyena sahetā\" means: \"The first [sound in the sequence], together with the final [it-marker], [denotes all sounds between them].\"\n\nThis system is more efficient than listing because:\n- One two-letter code can denote 2 to 40+ sounds\n- When Pāṇini writes a rule about \"all vowels,\" he writes \"ac\" (2 letters) instead of listing 9 vowels\n- The entire Aṣṭādhyāyī (~4,000 sūtras) depends on this compression — without pratyāhāras, every rule would be several times longer\n- The ordering of sounds in the 14 sūtras is not alphabetical or arbitrary — it is *optimized* so that every phonetically meaningful group can be captured by some pratyāhāra. The arrangement is itself a feat of compression engineering.\n\n---\n\n## Section D: Bīja Analysis\n\n**D1.**\n1. **Hrīṃ** = ha (kaṇṭha / ākāśa) + ra (mūrdhan / agni) + ī (tālu / vāyu) + ṃ (nāsikā / bindu)\n2. **Krīṃ** = ka (kaṇṭha / ākāśa) + ra (mūrdhan / agni) + ī (tālu / vāyu) + ṃ (nāsikā / bindu)\n3. **Klīṃ** = ka (kaṇṭha / ākāśa) + la (danta / āpas) + ī (tālu / vāyu) + ṃ (nāsikā / bindu)\n4. **Śrīṃ** = śa (tālu / vāyu) + ra (mūrdhan / agni) + ī (tālu / vāyu) + ṃ (nāsikā / bindu)\n5. **Aiṃ** = ai (kaṇṭha-tālu / compound) + ṃ (nāsikā / bindu)\n\n**D2.**\n1. ra → **Mūrdhanya** (dome of palate)\n2. la → **Dantya** (teeth)\n3. ra → **Agni** (fire)\n4. la → **Āpas** (water) — some traditions assign earth since la is the grounding letter; in the 5-element sthāna mapping, dantya = āpas\n5. Fire transforms and consumes — Kālī's function is to burn through illusion, to liberate by destroying what binds. Water/earth conforms and attracts — Kāma's function is to draw things together, to embody desire in form. The sthāna shift from mūrdhan (fire, the highest point in the mouth) to danta (water/earth, lower and structural) mirrors the difference between a force that *ascends and burns* vs one that *descends and manifests.* One letter. One sthāna. Entirely different theology.\n\n**D3.**\n1. Aiṃ = **Jñāna-śakti** (knowledge). Klīṃ = **Icchā-śakti** (will/desire). Sauḥ = **Kriyā-śakti** (action).\n2. Aiṃ has **no consonant** — it is a pure compound vowel (ai) + bindu. All other major bījas begin with a consonant. Aiṃ is pure vāk (speech) without any stop or friction. This is fitting: Sarasvatī/Vāgbhavā IS speech itself, not speech *about* something.\n3. Anusvāra (ṃ) is **implosion** — sound collapses inward into nasal resonance and then silence. The point absorbs. Visarga (ḥ) is **exhalation** — sound releases outward as breath. Sauḥ ends with visarga because Kriyā-śakti is *outward-directed* action, Śakti exhaling herself into creation. The other bījas end with anusvāra because they seal the energy inward.\n4. Aiṃ = **Vāgbhava kūṭa** (speech). Klīṃ = **Kāmarāja kūṭa** (desire). Sauḥ = **Śakti kūṭa** (power/action).\n5. \"Ai\" is the most intensified form of the speech-vowels. Simple a (kaṇṭha) + i (tālu) = e (compound). But ai intensifies further — it is e *raised.* It is the vowel that combines throat (where sound is born) and palate (where it becomes articulate) at maximum intensity. This is why it carries Vāgbhavā: the *fullest possible expression of the speech-producing mechanism.*\n\n---\n\n## Section E: Reading Names\n\n**E1.**\n1. **Śiva** (śi-va): śa (tālu/palate) → i (tālu) → va (danta-oṣṭha/teeth-lips). Movement: palatal friction dissolves into a labial glide. The sound relaxes from high tension (sibilant) into flowing breath. Sonic signature: *release, ease.*\n2. **Rudra** (rud-ra): ru (mūrdhan, with danta for d) → dra (danta + mūrdhan). Movement: the tongue strikes the dome, drops to the teeth, rolls back to the dome. Forceful, percussive. Sonic signature: *impact, howling.*\n3. **Lalitā** (la-li-tā): la (danta) → li (danta → tālu) → tā (danta). Movement: the tongue stays at the teeth/palate zone throughout — light taps, never going deep to the throat or sealing at the lips. Sonic signature: *playfulness, lightness.*\n\n**E2.**\n1. **Durgā** (dur-gā): du (danta) → r (mūrdhan) → gā (kaṇṭha). Movement: teeth → dome → throat. The name moves *inward and upward* — from the structural (teeth) through fire (dome) to the deepest place (throat). Reaching the inaccessible.\n2. **Gaṇeśa** (ga-ṇe-śa): ga (kaṇṭha) → ṇa (mūrdhan) → e (kaṇṭha-tālu) → śa (tālu). Movement: deep throat → dome → throat-palate compound → palate. The name arcs upward from the throat through the dome and settles at the palate. The lord of beginnings starts at the root.\n3. **Viṣṇu** (viṣ-ṇu): va (danta-oṣṭha) → i (tālu) → ṣa (mūrdhan) → ṇu (mūrdhan + oṣṭha). Movement: lips-teeth → palate → dome → dome-lips. A wide sweep through the mouth — the all-pervading one touches almost every position.\n4. **Sarasvatī** (sa-ra-sva-tī): sa (danta) → ra (mūrdhan) → sva (danta + danta-oṣṭha) → tī (danta + tālu). Movement: teeth → dome → teeth-lips → teeth-palate. The tongue stays primarily in the dental zone — precise, articulate, clear. Fitting for the goddess of structured speech.\n5. **Tripurasundarī** (tri-pu-ra-sun-da-rī): ta (danta) → ra (mūrdhan) → i (tālu) → pu (oṣṭha) → ra (mūrdhan) → su (danta) → n (danta) → da (danta) → rī (mūrdhan + tālu). Movement: the name traverses the entire mouth repeatedly — teeth, dome, palate, lips, dome, teeth, teeth, teeth, dome. The three cities (tri-pura) are literally three sweeps through the sthāna geography.\n\n**E3.** The 48 letters:\n- 16 vowels: a, ā, i, ī, u, ū, ṛ, ṝ, ḷ, ḹ, e, ai, o, au, aṃ, aḥ\n- 25 sparśa (stops): ka through ma (5 vargas × 5)\n- 4 antastha (semivowels): ya, ra, la, va\n- 3 ūṣma (sibilants): śa, ṣa, sa\n\nTotal: 16 + 25 + 4 + 3 = **48**\n\n(Some counts give 50 by adding kṣa and jña as compound letters, or 51 by adding ha separately from the sibilants. The Lalitā Sahasranāma follows the 48-letter count, which treats ha as part of the ūṣma group implicitly or counts visarga separately.)\n\n---\n\n## Section F: Synthesis\n\n**F1.** In the varṇamālā:\n- **a** is the **first vowel** — the beginning of the entire alphabet\n- **ha** is the **last consonant** — the final letter before the alphabet ends\n- **m** (anusvāra) is the **bindu** — the point where all articulated sound dissolves into nasal resonance and then silence\n\n\"Aham\" thus spans from the first sound to the last sound, sealed by the point of dissolution. The word for \"I\" literally contains the entire alphabet compressed into three phonemes. The self (aham) IS the totality of sound (the mātṛkā).\n\n**F2.** Counter-argument: Bīja mantras are *constructed* from specific letters chosen for their sthāna (place of articulation) and prayatna (manner of production). Each sthāna corresponds to an element and produces a specific quality of vibration in the body. The difference between krīṃ and klīṃ is a single letter — ra vs la — but this shifts the sthāna from mūrdhan (fire/transformation) to danta (water-earth/grounding), producing an entirely different function (Kālī's liberating fire vs Kāma's embodying attraction). If bījas were arbitrary, swapping one letter would make no difference. But the tradition treats ra→la as the difference between two entirely different deities. The letters are the technology. The sthāna system is the engineering specification.\n\n**F3.** (Answers will vary by student's iṣṭadevatā. Model answer for \"Kṛṣṇa\"):\n\n**Kṛṣṇaḥ** (kṛṣ-ṇaḥ):\n- **kṛ**: ka (kaṇṭha/ākāśa — throat stop) + ṛ (mūrdhan/agni — vocalic r at the dome). The hard stop opens into fire-vibration.\n- **ṣ**: ṣa (mūrdhan/agni — retroflex sibilant). Fire-friction at the dome. The name stays in the fire-zone.\n- **ṇaḥ**: ṇa (mūrdhan/agni — retroflex nasal) + ḥ (visarga — pure breath release).\n\nSonic geography: The name begins at the deepest point (ka, throat) and immediately rises to the dome of the palate (ṛ, ṣ, ṇ) — and stays there. Three consecutive mūrdhanya sounds. Then the visarga releases everything as breath. The name is dominated by retroflex/fire energy — the \"dark one\" (kṛṣṇa = dark) is sonically a fire-name. Darkness that *burns.* The visarga at the end is an exhale — the fire doesn't seal (no bindu), it breathes out.\n\n**F4.** Pāṇini begins with the Maheshvara Sūtrāṇi because *the sounds come before the rules.* Grammar does not invent sounds — it describes how pre-existing sounds combine. The sūtrāṇi establish the raw material (the phoneme inventory) in an order optimized for the rules that follow. This reflects the Sanskrit tradition's understanding that sound (śabda) is prior to meaning (artha) and structure (vyākaraṇa). The grammar is *discovered* in the sound-system, not imposed upon it. Starting with the Maheshvara Sūtrāṇi says: before you can understand how language works, you must know what sounds exist and how they are organized. Sound first. Structure second. Meaning emerges from the meeting of the two.\n", "badge": "# Stage 2 Badge: Varṇajña\n\n**Title:** Letter Master\n**Badge:** 🏅 Varṇajña\n\n## Requirements\n\n1. Recite all 14 Māheśvara Sūtras from memory (voice note)\n2. Dissect 3 bīja mantras letter-by-letter (sthāna + prayatna for each varṇa)\n3. Expand 3 pratyāhāras (e.g., ac, hal, yaṇ) into their component letters\n\n## How to Demonstrate\n\n**Format:** Voice note + text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 3 content and grants the **Varṇajña** role on Discord.\n"}, "tabs": ["bricks", "theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "03-sandhi", "number": 3, "title": "Sandhi", "subtitle": "27 Snap-Rules for Joining Bricks", "files": {"theory": "# Stage 3: Sandhi — The Snap-Rules\n\n## Why This Matters\n\nEvery mantra you chant, every stotra you recite, every śloka you read aloud — sandhi is already happening in your mouth. When you say \"namaḥ śivāya,\" the visarga of namaḥ transforms before the ś. When you chant \"sadāśiva,\" two words have fused into one. Sandhi is not abstract grammar — it is the physics of sacred sound, the rules your voice already follows when joining syllables in worship.\n\nMaster these rules and you can **read any Sanskrit text on sight**, split compounds back into their components, and understand why mantras sound the way they do. Without sandhi, Sanskrit remains a collection of isolated words. With it, the words flow into living speech.\n\n## Goal\n\nUnderstand and apply the core sandhi rules of Sanskrit. Given any two words or morphemes, identify which sandhi applies, perform the combination, and split compound forms back into their components.\n\n## What is Sandhi?\n\n**Sandhi** (सन्धि) means \"joining\" or \"junction.\" In the LEGO framework, these are the **snap-rules** — the laws governing what happens when two bricks click together. Just as LEGO bricks have studs and tubes that must align, Sanskrit sounds have contact rules that transform letters at the boundary. These changes are predictable, governed by Pāṇini's sūtras.\n\n### Three Types of Sound Change (Kārya)\n\n| Type | Sanskrit | Meaning |\n|------|----------|---------|\n| Ādeśa | आदेश | Replacement -- a new sound replaces the old |\n| Āgama | आगम | Insertion -- a new sound is added alongside existing sounds |\n| Lopa | लोप | Deletion -- an existing sound disappears |\n\n### Where Sandhi Applies\n\n| Context | Mandatory? |\n|---------|-----------|\n| Prakṛti + Pratyaya (root + suffix, inside a word) | Yes (nitya) |\n| Upasarga + Dhātu (prefix + verb root) | Yes (nitya) |\n| Samāsa (compound words) | Yes (nitya) |\n| Vākya (between words in a sentence) | Optional (vikalpa) |\n\n---\n\n## Classification of Sandhi\n\nSandhis are classified by which type of sound undergoes transformation:\n\n| Category | Also Called | What Changes | Count in This Course |\n|----------|-----------|--------------|---------------------|\n| **Svara Sandhi** (vowel) | Ac Sandhi | Svaras (vowels) | 7 |\n| **Vyañjana Sandhi** (consonant) | Hal Sandhi | Vyañjanas (consonants) | 12 |\n| **Viśeṣa Sandhi** (special/visarga) | Visarga Sandhi | Visarga and special cases | 8 |\n\nThe pratyāhāra **ac** (from the Māheśvara Sūtras) represents all svaras, hence \"ac sandhi.\" Similarly, **hal** represents all vyañjanas.\n\n---\n\n# Part I: Ac Sandhi (Svara / Vowel Sandhi)\n\n## 1. Yan Sandhi (यण् सन्धि)\n\n### Rule\n\nWhen **i/ī, u/ū, ṛ/ṝ, or ḷ** occur at the end of the first component and are followed by any **dissimilar vowel** (asavarṇa svara), they are replaced by the corresponding semivowel.\n\n### Sūtra\n\n> iko yaṇ aci (इको यणचि) -- Pāṇini 6.1.77\n\n### Table\n\n| Pūrva (left) | Para (right) | Ādeśa (result) |\n|-------------|-------------|----------------|\n| i / ī | any svara except i/ī | y |\n| u / ū | any svara except u/ū | v |\n| ṛ / ṝ | any svara except ṛ/ṝ | r |\n| ḷ | any svara except ḷ | l |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| prati + ekam | pratyekam | i + e → y + e |\n| su + āgatam | svāgatam | u + ā → v + ā |\n| pitṛ + ājñā | pitrājñā | ṛ + ā → r + ā |\n| devī + arpitam | devyarpitam | ī + a → y + a |\n| madhu + ariḥ | madhvariḥ | u + a → v + a |\n\n### Key Points\n\n- The ādeśa happens only to the pūrva (left-side) vowel.\n- The para (right-side) vowel remains unchanged; it is the *nimitta* (cause) but does not itself transform.\n- The semivowel shares the same sthāna (place of articulation) as the vowel it replaces: i/ī and y are both tālavya, u/ū and v are both oṣṭhya, etc.\n\n---\n\n## 2. Yantāvantādeśa Sandhi (यण्तावन्तादेश सन्धि) -- Yan Sandhi with Dīrgha\n\n### Rule\n\nThis is a special extension of Yan Sandhi. When the preceding vowel (i/ī, u/ū, ṛ) is preceded by a conjunct consonant cluster, the semivowel replacement still occurs, and in some cases the following vowel takes a dīrgha (long) form.\n\n### Sūtra\n\n> This is governed by additional vārttikas on Yan sandhi.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| stri + ai | stryai | ī + ai → y + ai |\n| dhātrī + ādeśaḥ | dhātryādeśaḥ | ī + ā → y + ā (ā remains dīrgha) |\n\n### Key Points\n\n- This is essentially the same mechanism as Yan Sandhi but noted separately because the phonetic environment (conjuncts) makes the resulting pronunciation distinct.\n\n---\n\n## 3. Savarṇadīrgha Sandhi (सवर्णदीर्घ सन्धि)\n\n### Rule\n\nWhen two **similar** (savarṇa) vowels come together, they are replaced by the **long** (dīrgha) form of that vowel.\n\n### Sūtra\n\n> akaḥ savarṇe dīrghaḥ (अकः सवर्णे दीर्घः) -- Pāṇini 6.1.101\n\n### Table\n\n| Pūrva | Para | Result |\n|-------|------|--------|\n| a / ā | a / ā | ā |\n| i / ī | i / ī | ī |\n| u / ū | u / ū | ū |\n| ṛ / ṝ | ṛ / ṝ | ṝ |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| vidyā + ālayaḥ | vidyālayaḥ | ā + ā → ā |\n| kavi + indraḥ | kavīndraḥ | i + i → ī |\n| guru + upadeśaḥ | gurūpadeśaḥ | u + u → ū |\n| mahā + ātmā | mahātmā | ā + ā → ā |\n| giri + īśaḥ | girīśaḥ | i + ī → ī |\n\n### Key Points\n\n- \"Savarṇa\" means \"of the same class\" -- a/ā are savarṇa to each other, i/ī to each other, etc.\n- The result is always the dīrgha (long/two-mātrā) form.\n- This is also called \"dīrgha sandhi\" in some textbooks.\n\n---\n\n## 4. Guṇa Sandhi (गुण सन्धि)\n\n### Rule\n\nWhen **a/ā** is followed by **i/ī, u/ū, or ṛ/ṝ**, the two vowels are replaced by the guṇa vowel: **e, o, or ar** respectively.\n\n### Sūtra\n\n> ādguṇaḥ (आद्गुणः) -- Pāṇini 6.1.87\n\n### Table\n\n| Pūrva | Para | Guṇa Result |\n|-------|------|-------------|\n| a / ā | i / ī | e |\n| a / ā | u / ū | o |\n| a / ā | ṛ / ṝ | ar |\n| a / ā | ḷ | al |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| nara + indraḥ | narendraḥ | a + i → e |\n| mahā + utsavaḥ | mahotsavaḥ | ā + u → o |\n| mahā + ṛṣiḥ | maharṣiḥ | ā + ṛ → ar |\n| parama + īśvaraḥ | parameśvaraḥ | a + ī → e |\n| sūrya + udayaḥ | sūryodayaḥ | a + u → o |\n\n### Key Points\n\n- The ādeśa replaces both the pūrva and para vowels.\n- Guṇa vowels are: e (for i-class), o (for u-class), ar (for ṛ-class), al (for ḷ).\n- The sūtra \"ādguṇaḥ\" means \"after a/ā, guṇa comes.\"\n\n---\n\n## 5. Vṛddhi Sandhi (वृद्धि सन्धि)\n\n### Rule\n\nWhen **a/ā** is followed by **e/ai** or **o/au**, the two vowels are replaced by the vṛddhi vowel: **ai** or **au** respectively.\n\n### Sūtra\n\n> vṛddhireci (वृद्धिरेचि) -- Pāṇini 6.1.88\n\n### Table\n\n| Pūrva | Para | Vṛddhi Result |\n|-------|------|---------------|\n| a / ā | e / ai | ai |\n| a / ā | o / au | au |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| sadā + eva | sadaiva | ā + e → ai |\n| mahā + aiśvaryam | mahaiśvaryam | ā + ai → ai |\n| mahā + oṣadhiḥ | mahauṣadhiḥ | ā + o → au |\n| jala + oghaḥ | jalaughaḥ | a + o → au |\n| tava + aikyam | tavaikyam | a + ai → ai |\n\n### Key Points\n\n- Vṛddhi vowels are ai and au.\n- This sandhi is an extension of Guṇa Sandhi: where Guṇa handles i/u/ṛ class, Vṛddhi handles e/o class (which are themselves guṇa grades).\n\n---\n\n## 6. Pūrvarūpa Sandhi (पूर्वरूप सन्धि)\n\n### Rule\n\nWhen **e** or **o** at the end of a **pada** (complete word) is followed by **a**, the **a** is deleted, and the pūrva (preceding) vowel's form remains. An avagraha (ऽ) symbol marks the elided **a** in script.\n\n### Sūtra\n\n> eṅaḥ padāntād ati (एङः पदान्तादति) -- Pāṇini 6.1.109\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| hare + atra | hare'tra | a after e is deleted |\n| vane + asmin | vane'smin | a after e is deleted |\n| viṣṇo + arpitam | viṣṇo'rpitam | a after o is deleted |\n| prabho + anugraham | prabho'nugrahm | a after o is deleted |\n\n### Key Points\n\n- The avagraha symbol (ऽ) indicates where the **a** was elided.\n- This applies only when the pūrva is at the end of a complete pada (not inside a word).\n- The transformation is a **lopa** (deletion) of the para vowel (a-kāra).\n- Pūrvarūpa means \"the form of the preceding letter\" prevails.\n\n---\n\n## 7. Pararūpa Sandhi (पररूप सन्धि)\n\n### Rule\n\nWhen an **upasarga** (prefix) ending in **a** is followed by a **dhātu** (verb root) beginning with **a** or **ā**, the two merge and the **para** (following) vowel's form prevails.\n\n### Sūtra\n\n> eṅi pararūpam (एणि पररूपम्) -- applied in upasarga+dhātu context\n\n### Conditions\n\nThis sandhi applies only when:\n1. The pūrva is an upasarga (verbal prefix), AND\n2. The dhātu begins with **a** (specifically the roots **aj** or **edh** are the classic cases).\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| upa + ajati | upajati | a + a → a (pararūpa) |\n| pra + ajati | prajati | a + a → a (pararūpa) |\n\n### Key Points\n\n- Pararūpa means \"the form of the following letter\" prevails.\n- This is a very restricted sandhi -- it applies only with specific upasarga + dhātu combinations.\n- In the high-school syllabus, very few examples are encountered.\n\n---\n\n# Part II: Hal Sandhi (Vyañjana / Consonant Sandhi)\n\n## 8. Śchutva Sandhi (श्चुत्व सन्धि)\n\n### Rule\n\nWhen **sakāra** (s) or **tavarga** letters (t, th, d, dh, n) come in contact with **śakāra** (ś) or **cavarga** letters (c, ch, j, jh, ñ), the sakāra becomes **śakāra** and tavarga letters become their corresponding **cavarga** letters.\n\n### Sūtra\n\n> stoḥ ścunā ścuḥ (स्तोः श्चुना श्चुः) -- Pāṇini 8.4.40\n\n### Table\n\n| Original | Becomes |\n|----------|---------|\n| s | ś |\n| t | c |\n| th | ch |\n| d | j |\n| dh | jh |\n| n | ñ |\n\nThe transformation happens in **both directions** -- the sthānin (letter being replaced) can be on the left side or the right side.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| rāmas + śete | rāmaś śete | s → ś before ś |\n| sat + cit | sac cit | t → c before c |\n| tat + śrutvā | tac chrutvā | t → c before ś |\n| haris + śiśuḥ | hariś śiśuḥ | s → ś before ś |\n| ud + cinoti | uc cinoti | d → c before c |\n\n### Key Points\n\n- The sthānin can be in pūrva or para position.\n- The key recognition: whenever s/tavarga meets ś/cavarga, transformation to ś/cavarga occurs.\n\n---\n\n## 9. Ṣṭutva Sandhi (ष्टुत्व सन्धि)\n\n### Rule\n\nWhen **sakāra** (s) or **tavarga** letters (t, th, d, dh, n) come in contact with **ṣakāra** (ṣ) or **ṭavarga** letters (ṭ, ṭh, ḍ, ḍh, ṇ), the sakāra becomes **ṣakāra** and tavarga letters become their corresponding **ṭavarga** letters.\n\n### Sūtra\n\n> ṣṭunā ṣṭuḥ (ष्टुना ष्टुः) -- Pāṇini 8.4.41\n\n### Table\n\n| Original | Becomes |\n|----------|---------|\n| s | ṣ |\n| t | ṭ |\n| th | ṭh |\n| d | ḍ |\n| dh | ḍh |\n| n | ṇ |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| rāmas + ṭīkā | rāmaṣ ṭīkā | s → ṣ before ṭ |\n| tat + ṭīkā | taṭ ṭīkā | t → ṭ before ṭ |\n| iṣ + taḥ | iṣ ṭaḥ | t → ṭ after ṣ |\n| dviṣ + taḥ | dviṣ ṭaḥ | t → ṭ after ṣ |\n\n### Key Points\n\n- Like Śchutva, the transformation is bidirectional.\n- This sandhi is called \"ṣṭutva\" because ṣ and ṭ class letters are the result.\n\n---\n\n## 10. Jaśtva Sandhi (जश्त्व सन्धि)\n\n### Rule\n\nWhen the **first letter** (prathama) of any varga (k, c, ṭ, t, p) is at the end of a word and is followed by a **voiced** sound (ghoṣa vyañjana, i.e., 3rd/4th letters, nasals, semivowels, or vowels), it is replaced by the **third letter** (tṛtīya) of its own varga.\n\n### Sūtra\n\n> jhalaṃ jaśo'nte (झलां जशोऽन्ते) -- Pāṇini 8.2.39; jaśtva via 8.4.53\n\n### Table\n\n| Prathama (1st) | Ādeśa (3rd) |\n|---------------|-------------|\n| k | g |\n| c | j |\n| ṭ | ḍ |\n| t | d |\n| p | b |\n\n### Condition\n\nThe para (following letter) must be a ghoṣa sound: any vowel, 3rd/4th/5th letters of any varga, or y/v/r/l.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| vāk + īśaḥ | vāg īśaḥ | k → g before vowel |\n| tat + eva | tad eva | t → d before vowel |\n| jagat + nāthaḥ | jagad nāthaḥ | t → d before n |\n| samrāṭ + jayati | samrāḍ jayati | ṭ → ḍ before j |\n| sup + antam | sub antam | p → b before vowel |\n\n### Key Points\n\n- The first letter becoming the third letter is the defining characteristic of Jaśtva.\n- This often occurs as an intermediate step before Anunāsika Sandhi applies further.\n- Example: jagat + nāṭyam → jagad nāṭyam (jaśtva) → jagan nāṭyam (anunāsika).\n\n---\n\n## 11. Anunāsika Sandhi (अनुनासिक सन्धि)\n\n### Rule\n\nWhen a vyañjana at the end of a word (excluding the 5th/nasal letter) is followed by a **nasal letter** (any of ṅ, ñ, ṇ, n, m), it is **optionally** replaced by the **fifth letter** (pañcama / anunāsika) of its own varga.\n\n### Sūtra\n\n> Based on Pāṇini 8.4.45\n\n### Table\n\n| Pūrva Varga | Anunāsika Ādeśa |\n|-------------|-----------------|\n| kavarga (k, kh, g, gh) | ṅ |\n| cavarga (c, ch, j, jh) | ñ |\n| ṭavarga (ṭ, ṭh, ḍ, ḍh) | ṇ |\n| tavarga (t, th, d, dh) | n |\n| pavarga (p, ph, b, bh) | m |\n\n### Condition\n\n- Pūrva: any vyañjana (class consonant) at end of a word, except the 5th letter itself.\n- Para: any anunāsika (nasal) letter.\n- The ādeśa takes the anunāsika of the **pūrva's** varga, regardless of which nasal is in the para.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| jagat + nāthaḥ | jagan nāthaḥ | d (from jaśtva) → n (tavarga nasal) |\n| vāk + mayam | vāṅ mayam | k → ṅ (kavarga nasal) |\n| ṣaṭ + mukhaḥ | ṣaṇ mukhaḥ | ṭ → ṇ (ṭavarga nasal) |\n| samrāṭ + nayati | samrāṇ nayati | ṭ → ṇ before n |\n\n### Key Points\n\n- This sandhi is **optional** (vikalpa) when it occurs between two separate words (pada-anta).\n- It becomes **mandatory** (nitya) when the para is part of a pratyaya (suffix), e.g., chinmayaḥ from cit + mayaḥ (t → n before m).\n- Often Jaśtva applies first, then Anunāsika applies to the result.\n\n---\n\n## 12. Chartva Sandhi (चर्त्व सन्धि)\n\n### Rule\n\nWhen the **first four letters** of any varga (i.e., the non-nasal stops) stand at the end of a word and are followed by a **kharaḥ** (voiceless consonant: prathama or dvitīya of any varga, or ś, ṣ, s), the final consonant is replaced by the **first letter** (prathama) of its own varga.\n\n### Sūtra\n\n> Based on Pāṇini 8.4.55 (khari ca)\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| samrāḍ + kṛtam | samrāṭ kṛtam | ḍ → ṭ before k (kharaḥ) |\n| jagad + phalam | jagat phalam | d → t before ph |\n| vāg + ca | vāk ca | g → k before c |\n\n### Key Points\n\n- This is essentially the reverse context of Jaśtva: before voiceless consonants, you get the voiceless (prathama) form.\n- Chartva ensures the final consonant matches the voicing of the following sound.\n\n---\n\n## 13. Anusvāra Sandhi (अनुस्वार सन्धि)\n\n### Rule\n\nWhen **makāra** (m) at the end of a word is followed by any **vyañjana** (consonant), the makāra is replaced by **anusvāra** (ṁ).\n\n### Sūtra\n\n> mo'nusvāraḥ (मोऽनुस्वारः) -- Pāṇini 8.3.23\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| kṛṣṇam + vande | kṛṣṇaṁ vande | m → ṁ before v |\n| rāmam + jayati | rāmaṁ jayati | m → ṁ before j |\n| gurum + namati | guruṁ namati | m → ṁ before n |\n| dharmam + cara | dharmaṁ cara | m → ṁ before c |\n| satyam + vada | satyaṁ vada | m → ṁ before v |\n\n### Key Points\n\n- This is the simplest vyañjana sandhi.\n- The condition: makāra must be at end of a word, followed by any consonant.\n- If followed by a svara (vowel), this sandhi does **not** apply -- the m remains.\n- The anusvāra is written as a dot (bindu) above the preceding vowel in Devanāgarī.\n\n---\n\n## 14. Parasavarṇa Sandhi (परसवर्ण सन्धि)\n\n### Rule\n\nThis sandhi has three sub-cases:\n\n**Case 1 (Mandatory, padya/internal):** When anusvāra occurs **within** a word and is followed by a varga consonant, it is replaced by the **pañcama** (fifth/nasal) letter of the **following** consonant's varga.\n\n**Case 2 (Optional, pada-anta):** When anusvāra occurs at the **end** of a word and is followed by a varga consonant, it is **optionally** replaced by the pañcama of the following varga.\n\n**Case 3 (Tavarga + Lakāra):** When a tavarga letter is followed by lakāra, the tavarga is replaced by lakāra. If the tavarga letter is nakāra, it becomes the anunāsika (nasal) form of lakāra.\n\n### Sūtra\n\n> anusvārasya yayi parasavarṇaḥ (अनुस्वारस्य ययि परसवर्णः) -- Pāṇini 8.4.58\n> torli (तोर्लि) -- Pāṇini 8.4.60\n\n### Table (Cases 1 & 2)\n\n| Anusvāra + Para Varga | Ādeśa |\n|-----------------------|-------|\n| ṁ + kavarga (k, kh, g, gh) | ṅ |\n| ṁ + cavarga (c, ch, j, jh) | ñ |\n| ṁ + ṭavarga (ṭ, ṭh, ḍ, ḍh) | ṇ |\n| ṁ + tavarga (t, th, d, dh) | n |\n| ṁ + pavarga (p, ph, b, bh) | m |\n\n### Table (Case 3 -- torli)\n\n| Pūrva | + la | Result |\n|-------|------|--------|\n| tavarga (t, d, etc.) | l | l (doubled: ll) |\n| na | l | anunāsika l (n̐l) |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| nandī (naṁ + dī internally) | nandī | ṁ → n before d (Case 1, mandatory) |\n| alaṁ + cakāra | alañ cakāra | ṁ → ñ before c (Case 2, optional) |\n| taṁ + daṇḍam | tan daṇḍam | ṁ → n before d |\n| bhagavat + līlā | bhagaval līlā | t → l before l (Case 3) |\n| gavan + liti | gaval̃ liti | n → nasal l before l (Case 3) |\n\n### Key Points\n\n- \"Parasavarṇa\" means \"a similar letter of the para (following) letter.\"\n- Case 1 (within a word) is always mandatory.\n- Case 2 (between words) is optional.\n- Case 3 (torli) is a special rule for tavarga letters before lakāra.\n- For anunāsika-type ya, va, la: the nasal form (with candrabindu) appears when nakāra precedes them.\n\n---\n\n# Part III: Viśeṣa Sandhi (Special Sandhis)\n\nThese sandhis include visarga transformations and other special rules that do not fall neatly into the svara or vyañjana categories alone.\n\n## 15. Chatva Sandhi (छत्व सन्धि)\n\n### Rule\n\n**Case 1 (Compulsory):** When a short vowel (hrasva svara) ending in itself (not at pada-anta) is followed by **chakāra** (ch), a **takāra** is inserted (āgama) between them, which then becomes chakāra by Śchutva, yielding **cch**.\n\n**Case 2 (Optional):** When a short vowel at the end of a **pada** (word) is followed by **chakāra**, takāra is optionally inserted, yielding the doubled form **cch**.\n\n### Sūtra\n\n> Based on Pāṇini 6.1.73 (che ca) and related rules\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| sva + chanda | svacchanda | t-āgama → cch (compulsory) |\n| anu + cheda | anuccheda | t-āgama → cch (compulsory) |\n| a + chādanam | ācchādanam | t-āgama → cch |\n| vṛkṣa + chāyā | vṛkṣacchāyā | optional doubling |\n\n### Key Points\n\n- The name \"chatva\" refers to the ch-sound that results.\n- The inserted t becomes ch by the action of Śchutva Sandhi.\n- When occurring inside a word (prakṛti-pratyaya boundary), it is compulsory.\n- When occurring between two separate padas, it is optional.\n\n---\n\n## 16. Pūrvasavarṇa Sandhi (पूर्वसवर्ण सन्धि)\n\n### Rule\n\nWhen the first four letters (jhal) of any varga are followed by **hakāra** (h), the hakāra is **optionally** replaced by the **fourth letter** (caturthi) of the **preceding** consonant's varga.\n\n### Sūtra\n\n> jharo jhari savarṇe (based on Pāṇini 8.4.65, with hakāra specifics)\n\n### Table\n\n| Pūrva Varga | h → 4th letter |\n|-------------|---------------|\n| kavarga | gh |\n| cavarga | jh |\n| ṭavarga | ḍh |\n| tavarga | dh |\n| pavarga | bh |\n\n### Sub-rule (Case 2)\n\nWhen the upasargas **ut** (उद्) or **ud** precede the dhātus **sthā** or **stambh**, the sakāra of the dhātu is replaced by **ṭhakāra** (ṭh). This is also classified under Pūrvasavarṇa.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| vāg + harati | vāg gharati | h → gh (kavarga 4th) |\n| dig + hīnaḥ | dig ghīnaḥ | h → gh |\n| ab + hrasaḥ | ab bhrasaḥ | h → bh (pavarga 4th) |\n| etat + hi | etad dhi | h → dh (tavarga 4th) |\n| ut + sthātum | uṭṭhātum | s → ṭh (special case) |\n\n### Key Points\n\n- The sandhi is optional in most cases.\n- It applies when jhal (non-nasal stops) precede hakāra.\n- The fourth letter replaces hakāra because hakāra is mahāprāṇa, and the 4th letter of each varga is also mahāprāṇa.\n\n---\n\n## 17. Numāgama Sandhi (नुमागम सन्धि)\n\n### Rule\n\nWhen certain letters (nasals: n, ṇ, or ṁ) at the end of a word are preceded by a **hrasva** (short) vowel and followed by any **svara** (vowel), a **num** (nasal consonant, specifically n, ṇ, or the corresponding nasal) is **inserted** (āgama) before the following vowel.\n\n### Sūtra\n\n> Based on various Pāṇini sūtras governing num-āgama\n\n### Conditions\n\n- The pūrva must have a hrasva svara before the final nasal/anusvāra.\n- The para must begin with a svara.\n- The āgama is the nasal itself being doubled (the num joins before the para svara).\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| praśān + ātmā | praśānnātmā | n-āgama: extra n inserted |\n| svamin + ādīnam | svaminnādīnam | n doubled before ā |\n\n### Key Points\n\n- This is an āgama (insertion), not an ādeśa (replacement).\n- The inserted nasal coexists with the existing sounds -- both old and new are present.\n- The name \"numāgama\" means \"insertion of num (nasal augment).\"\n\n---\n\n## 18. Tugāgama Sandhi (तुगागम सन्धि)\n\n### Rule\n\nWhen a short vowel (hrasva) or visarga-ending word is followed by **chakāra** (ch), a **takāra** is inserted as an āgama; alternatively, when a word ends in a short vowel and is followed by **ś** (śakāra), a **takāra** is optionally inserted. The t then transforms to ch by Śchutva.\n\n**Case 1 (Compulsory):** Short vowel + ch → t is inserted → tch → cch.\n\n**Case 2 (Optional):** Short vowel at pada-end + ś → t is optionally inserted → tś → cch.\n\n### Sūtra\n\n> Based on Pāṇini 6.1.73 and related\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| saṃ + vṛta + chadanam | saṃvṛtacchadanam | t-āgama before ch |\n| ā + chādayati | ācchādayati | t-āgama before ch |\n| pra + channa | pracchanna | t-āgama → cch |\n\n### Key Points\n\n- Tugāgama and Chatva are closely related -- both involve insertion of t before ch.\n- The tug specifically refers to the Pāṇinian technical name for this particular āgama.\n\n---\n\n## 19. Satva Sandhi (सत्व सन्धि)\n\n### Rule\n\nWhen a word ends in **nakāra** (n) and is followed by certain consonants, the nakāra is replaced by **sakāra** (s), and an anusvāra is added before the sakāra (on top of the preceding vowel). After this, the sakāra may further transform by Śchutva or Ṣṭutva.\n\n### Sūtra\n\n> Based on Pāṇini 8.3.7 (naś chapadāntasya jhali)\n\n### Table\n\n| Original | + Para | Step 1 (satva) | Step 2 (further sandhi) |\n|----------|--------|---------------|------------------------|\n| n | ch | ṁs + ch | ṁś ch (by śchutva) |\n| n | ṭ | ṁs + ṭ | ṁṣ ṭ (by ṣṭutva) |\n| n | t | ṁs + t | ṁs t (remains) |\n| n | ś | ṁs + ś | ṁś ś (by śchutva) |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| asmin + ca | asmiṁś ca | n → ṁs, then s → ś before c |\n| tān + ca | tāṁś ca | n → s with anusvāra, s → ś |\n| tān + ṭīkā | tāṁṣ ṭīkā | n → s, s → ṣ before ṭ |\n| mahān + tapasvī | mahāṁs tapasvī | n → s with anusvāra |\n\n### Key Points\n\n- Satva = \"becoming sa\" -- the nakāra transforms to sakāra.\n- The anusvāra preserves the nasal quality of the original n.\n- After satva occurs, Śchutva or Ṣṭutva may apply to the resulting sakāra.\n- In Devanāgarī, the anusvāra appears as a dot (or candrabindu for anunāsika pronunciation).\n\n---\n\n## 20. Lopa Sandhi (लोप सन्धि)\n\n### Rule\n\nIn certain contexts, a sound is deleted entirely. The most common lopa in visarga sandhi is when visarga disappears:\n\n1. When visarga preceded by **a** is followed by a **voiced consonant** (3rd/4th letters, nasals, semivowels) or a vowel other than a, the visarga undergoes lopa (deletion) and the a may lengthen.\n2. Terminal consonants may undergo lopa in specific environments.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| rāmaḥ + gacchati | rāmo gacchati | (visarga → o before voiced) |\n| devāḥ + vadanti | devā vadanti | āḥ → ā before voiced consonant (lopa of visarga) |\n| bhavataḥ + dṛṣṭam | bhavato dṛṣṭam | aḥ → o before voiced |\n\n### Key Points\n\n- Lopa means complete disappearance of a sound.\n- The visarga lopa cases are systematically handled in the visarga sandhi rules below.\n\n---\n\n## 21. Ukārādeśa Sandhi (उकारादेश सन्धि / Visarga → u)\n\n### Rule\n\nWhen visarga is preceded by **a** and followed by a **voiced consonant** (3rd, 4th, 5th letters, semivowels, or h), the visarga and the preceding **a** together become **o**.\n\n### Sūtra\n\n> hashi ca (हशि च) -- Pāṇini 6.1.114 (with ato roraplutādaplute)\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| rāmaḥ + hasati | rāmo hasati | aḥ + h → o |\n| bālaḥ + vadati | bālo vadati | aḥ + v → o |\n| devaḥ + jayati | devo jayati | aḥ + j → o |\n| naraḥ + gacchati | naro gacchati | aḥ + g → o |\n| eṣaḥ + gaṇeśaḥ | eṣo gaṇeśaḥ | aḥ + g → o |\n\n### Key Points\n\n- The combination aḥ → o is one of the most frequently encountered visarga sandhis.\n- When followed by **a** specifically, the result is o + avagraha (pūrvarūpa applies): rāmaḥ + atra → rāmo'tra.\n\n---\n\n## 22. Rephādeśa Sandhi (रेफादेश सन्धि / Visarga → r)\n\n### Rule\n\nWhen visarga is preceded by a vowel **other than a or ā** (i.e., any of i, ī, u, ū, e, ai, o, au, ṛ) and is followed by a **voiced sound** (voiced consonant or vowel), the visarga is replaced by **repha** (r).\n\n### Sūtra\n\n> sasajuṣo ruḥ (ससजुषो रुः) -- Pāṇini 8.2.66 (visarga to ru); followed by context rules\n\n### Sub-cases\n\n**Case 1:** Visarga preceded by any vowel except a/ā, followed by a voiced consonant or vowel → visarga becomes **r**.\n\n**Case 2:** Visarga preceded by **ā** at the end of an *avyaya* (indeclinable), followed by a voiced sound → visarga becomes **r**. (An avyaya is a word that does not change form: ca, punaḥ, antaḥ, etc.)\n\n**Case 3:** Visarga from a rephānta-śabda (a word whose stem ends in r) in the sambodhana (vocative) form, followed by a voiced sound → visarga becomes **r**.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| muniḥ + āgataḥ | munir āgataḥ | iḥ + ā → r (Case 1) |\n| guruḥ + uvāca | gurur uvāca | uḥ + u → r (Case 1) |\n| punaḥ + api | punar api | aḥ (avyaya) + a → r (Case 2) |\n| aśīḥ + yuddham | aśīr yuddham | īḥ + y → r (Case 1) |\n| mātuḥ + āśīḥ | mātur āśīḥ | uḥ + ā → r (Case 1) |\n\n### Key Points\n\n- \"Repha\" literally means the r-sound.\n- The three sub-cases distinguish based on what vowel precedes the visarga and whether the word is an avyaya or rephānta noun.\n- After rephādeśa, further svara sandhi (like guṇa) may apply.\n\n---\n\n## 23. Sakārādeśa Sandhi (सकारादेश सन्धि / Visarga → s)\n\n### Rule\n\nWhen visarga is followed by a **kharaḥ vyañjana** (voiceless consonant) belonging to **tavarga** (t, th) or **cavarga** (c, ch) or **ṭavarga** (ṭ, ṭh) or the sibilants ś and ṣ, the visarga is replaced by **sakāra** (s). After this sakāra appears, further Śchutva or Ṣṭutva may apply.\n\n### Sūtra\n\n> visarjanīyasya saḥ (विसर्जनीयस्य सः) -- Pāṇini 8.3.34 (in relevant contexts)\n\n### Table\n\n| Visarga + Para | Step 1 | Step 2 (further) | Final |\n|---------------|--------|-------------------|-------|\n| ḥ + t/th | s + t/th | -- | st/sth |\n| ḥ + c/ch | s + c/ch | s → ś (śchutva) | śc/śch |\n| ḥ + ṭ/ṭh | s + ṭ/ṭh | s → ṣ (ṣṭutva) | ṣṭ/ṣṭh |\n| ḥ + ś | s + ś | s → ś (śchutva) | śś (or ḥ remains) |\n| ḥ + ṣ | s + ṣ | s → ṣ (ṣṭutva) | ṣṣ (or ḥ remains) |\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| rāmaḥ + tatra | rāmas tatra | ḥ → s before t |\n| hariḥ + sādhayati | haris sādhayati | ḥ → s before s |\n| rāmaḥ + ca | rāmaś ca | ḥ → s → ś before c |\n| namaḥ + te | namas te | ḥ → s before t |\n| dhanuḥ + ṭaṅkāram | dhanuṣ ṭaṅkāram | ḥ → s → ṣ before ṭ |\n\n### Key Points\n\n- This is the most mechanical visarga sandhi: visarga simply becomes s, then further consonant sandhis may apply.\n- When followed by ś or ṣ, there are two possible outcomes: sakāra (which transforms), or visarga remains unchanged (the optional variant).\n- The rule excludes ka, kha, pa, pha -- those are handled by Jihvāmūlīya/Upadhmānīya.\n\n---\n\n## 24. Jihvāmūlīya and Upadhmānīya Sandhi (जिह्वामूलीय / उपध्मानीय सन्धि)\n\n### Rule\n\nWhen visarga is followed by **ka/kha** (kavarga kharaḥ), it optionally becomes **jihvāmūlīya** (a sound produced at the root of the tongue, written with a special symbol). When visarga is followed by **pa/pha** (pavarga kharaḥ), it optionally becomes **upadhmānīya** (a labial fricative, also written with a special symbol).\n\nAlternatively, the visarga simply remains as visarga.\n\n### Sūtra\n\n> Based on descriptions in Prātiśākhyas and Śikṣā texts\n\n### Examples\n\n| Before | After (with special sounds) | After (simplified) |\n|--------|---------------------------|-------------------|\n| rāmaḥ + karoti | rāmaḫ karoti (jihvāmūlīya) | rāmaḥ karoti |\n| rāmaḥ + pūjayati | rāmaᳶ pūjayati (upadhmānīya) | rāmaḥ pūjayati |\n| viṣṇuḥ + kr̥pāluḥ | viṣṇuḫ kr̥pāluḥ | viṣṇuḥ kr̥pāluḥ |\n\n### Key Points\n\n- In modern usage, visarga before ka/kha and pa/pha is typically left as visarga itself.\n- The jihvāmūlīya and upadhmānīya sounds are described in Śikṣā texts and Prātiśākhyas but are rarely written in standard Devanāgarī today.\n- These are **optional** transformations.\n\n---\n\n## 25. Rephaādeśa Sandhi in Visarga (विसर्गस्य पूर्वरूप / Visarga Pūrvarūpa)\n\n### Rule\n\nWhen visarga is preceded by **a** and followed by **a** (the specific case of aḥ + a), the result is **o** and the following **a** is elided, marked by avagraha.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| rāmaḥ + atra | rāmo'tra | aḥ + a → o + avagraha |\n| śivaḥ + arjunam | śivo'rjunam | aḥ + a → o + avagraha |\n| devaḥ + asti | devo'sti | aḥ + a → o + avagraha |\n\n### Key Points\n\n- This combines Ukārādeśa (aḥ → o before voiced sounds) with Pūrvarūpa (deletion of following a).\n- The avagraha marks the deleted a.\n\n---\n\n## 26. Visarga Lopa (āḥ before voiced sounds) (विसर्गलोप)\n\n### Rule\n\nWhen visarga is preceded by **ā** and followed by a **voiced consonant** (3rd/4th/5th letters, semivowels, h) or any vowel **other than a**, the visarga undergoes **lopa** (deletion), and ā remains.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| devāḥ + vadanti | devā vadanti | āḥ → ā (visarga deleted) |\n| bālakāḥ + gacchanti | bālakā gacchanti | āḥ → ā |\n| narāḥ + hasanti | narā hasanti | āḥ → ā |\n\n### Key Points\n\n- When āḥ is followed by a soft/voiced consonant, the visarga simply drops.\n- This is distinct from the aḥ case (which gives o).\n\n---\n\n## 27. Visarga Rakārādeśa (Rephaādeśa in specialized rephānta words)\n\n### Rule\n\nThis combines rephādeśa with subsequent svara sandhis. When a rephānta word (stem ending in r) has visarga in the sambodhana or prāthamika form, and it is followed by a vowel, the visarga becomes r, and then guṇa or other svara sandhi may apply.\n\n### Examples\n\n| Before | After | Explanation |\n|--------|-------|-------------|\n| punaḥ + uktiḥ | punaruktih | ḥ → r, then no further svara sandhi |\n| punaḥ + āgamanam | punarāgamanam | ḥ → r before ā |\n| antaḥ + āsanam | antarāsanam | ḥ → r before ā |\n\n### Key Points\n\n- The rephādeśa often triggers a chain: visarga → r → then svara sandhi with the following vowel.\n- This is particularly common with avyayas like punaḥ, antaḥ, prātaḥ.\n\n---\n\n## Summary Matrix\n\n### Ac Sandhi at a Glance\n\n| Pūrva ↓ / Para → | a/ā | i/ī | u/ū | ṛ/ṝ | e/ai | o/au |\n|-------------------|-----|-----|-----|-----|------|------|\n| **a/ā** | ā (dīrgha) | e (guṇa) | o (guṇa) | ar (guṇa) | ai (vṛddhi) | au (vṛddhi) |\n| **i/ī** | ya (yan) | ī (dīrgha) | yu (yan) | yr (yan) | yai (yan) | yau (yan) |\n| **u/ū** | va (yan) | vi (yan) | ū (dīrgha) | vr (yan) | vai (yan) | vau (yan) |\n| **ṛ/ṝ** | ra (yan) | ri (yan) | ru (yan) | ṝ (dīrgha) | rai (yan) | rau (yan) |\n| **e** | e' (pūrvarūpa if pada-anta + a) | -- | -- | -- | -- | -- |\n| **o** | o' (pūrvarūpa if pada-anta + a) | -- | -- | -- | -- | -- |\n\n*Note: e/ai and o/au in pūrva position outside pada-anta contexts follow special rules not fully covered at the high-school level.*\n\n### Hal Sandhi Summary\n\n1. **Śchutva**: s/tavarga + ś/cavarga → ś/cavarga\n2. **Ṣṭutva**: s/tavarga + ṣ/ṭavarga → ṣ/ṭavarga\n3. **Jaśtva**: 1st letter at pada-end + voiced → 3rd letter\n4. **Anunāsika**: consonant + nasal → 5th letter of pūrva's varga (optional)\n5. **Chartva**: non-nasal stop + voiceless consonant → 1st letter of own varga\n6. **Anusvāra**: m + consonant → anusvāra (ṁ)\n7. **Parasavarṇa**: anusvāra + varga consonant → 5th letter of para's varga\n\n### Visarga Sandhi Summary\n\n- aḥ + voiced consonant → **o** (ukārādeśa)\n- aḥ + a → **o'** (ukārādeśa + pūrvarūpa)\n- āḥ + voiced consonant → **ā** (visarga lopa)\n- (i/ī/u/ū)ḥ + voiced → **r** (rephādeśa)\n- ḥ + kharaḥ (t,th,c,ch,ṭ,ṭh,ś,ṣ,s) → **s** (sakārādeśa, then further śchutva/ṣṭutva)\n- ḥ + ka/kha → **jihvāmūlīya** (optional) or remains ḥ\n- ḥ + pa/pha → **upadhmānīya** (optional) or remains ḥ\n\n---\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Snap-rules (ac sandhi) | a+i→e, a+u→o, i+a→ya, u+a→va | Vowel-ending bricks (Stage 1 nouns) meeting vowel-starting bricks — these rules fire automatically at every junction |\n| Snap-rules (hal sandhi) | jaśtva, anusvāra, śchutva | Consonant-ending bricks meeting the next brick — transforms the contact point so the join is smooth |\n| Snap-rules (visarga sandhi) | aḥ+voiced→o, āḥ+voiced→ā | Visarga-ending bricks (namaḥ, devaḥ) meeting any following brick — the visarga adapts to its neighbor |\n\n**Try snapping**: Take the deity name and noun bricks from Stage 1, and the letter-knowledge from Stage 2. Now snap them together with sandhi: \"namaḥ + śivāya\" → \"namaś śivāya\" (visarga → ś before ś). Try \"mahā + īśvara\" → \"maheśvara\" (ā+ī → e, vṛddhi). Every mantra you know is bricks + snap-rules.\n", "reference": "# Chapter 2: Sandhi -- Reference Guide\n\n## Master Table of All 27 Sandhis\n\n### Ac Sandhi (Svara / Vowel Sandhi)\n\n| # | Sandhi Name | Rule Summary | Example | Mandatory? |\n|---|------------|-------------|---------|-----------|\n| 1 | Yan (यण्) | i/ī, u/ū, ṛ/ṝ, ḷ + asavarṇa svara → y, v, r, l | prati + ekam → pratyekam | Yes |\n| 2 | Yantāvantādeśa | Yan sandhi with conjuncts; dīrgha preservation | stri + ai → stryai | Yes |\n| 3 | Savarṇadīrgha | Same-class vowels merge into dīrgha form | vidyā + ālayaḥ → vidyālayaḥ | Yes |\n| 4 | Guṇa (गुण) | a/ā + i/ī → e; a/ā + u/ū → o; a/ā + ṛ → ar | nara + indraḥ → narendraḥ | Yes |\n| 5 | Vṛddhi (वृद्धि) | a/ā + e/ai → ai; a/ā + o/au → au | sadā + eva → sadaiva | Yes |\n| 6 | Pūrvarūpa (पूर्वरूप) | e/o (pada-anta) + a → e/o (a deleted, avagraha) | hare + atra → hare'tra | Yes (pada-anta) |\n| 7 | Pararūpa (पररूप) | upasarga ending a + dhātu beginning a → a (para form) | upa + ajati → upajati | Restricted |\n\n### Hal Sandhi (Vyañjana / Consonant Sandhi)\n\n| # | Sandhi Name | Rule Summary | Example | Mandatory? |\n|---|------------|-------------|---------|-----------|\n| 8 | Śchutva (श्चुत्व) | s/tavarga + ś/cavarga → ś/cavarga | sat + cit → sac cit | Yes |\n| 9 | Ṣṭutva (ष्टुत्व) | s/tavarga + ṣ/ṭavarga → ṣ/ṭavarga | iṣ + taḥ → iṣ ṭaḥ | Yes |\n| 10 | Jaśtva (जश्त्व) | 1st letter + voiced sound → 3rd letter | vāk + īśaḥ → vāg īśaḥ | Yes |\n| 11 | Anunāsika (अनुनासिक) | consonant + nasal → 5th letter of pūrva's varga | jagat + nāṭyam → jagan nāṭyam | Optional* |\n| 12 | Chartva (चर्त्व) | non-nasal stop + voiceless → 1st letter of own varga | vāg + ca → vāk ca | Yes |\n| 13 | Anusvāra (अनुस्वार) | m (pada-anta) + vyañjana → anusvāra (ṁ) | kṛṣṇam + vande → kṛṣṇaṁ vande | Yes |\n| 14 | Parasavarṇa (परसवर्ण) | anusvāra + varga → 5th letter of para's varga | alaṁ + cakāra → alañcakāra | Case-dependent |\n\n### Viśeṣa Sandhi (Special / Visarga Sandhi)\n\n| # | Sandhi Name | Rule Summary | Example | Mandatory? |\n|---|------------|-------------|---------|-----------|\n| 15 | Chatva (छत्व) | hrasva svara + ch → t-āgama → cch | anu + cheda → anuccheda | Case-dependent |\n| 16 | Pūrvasavarṇa (पूर्वसवर्ण) | jhal + h → 4th letter of pūrva's varga | vāg + harati → vāg gharati | Optional |\n| 17 | Numāgama (नुमागम) | hrasva + n/ṇ + svara → nasal doubled (āgama) | praśān + ātmā → praśānnātmā | Yes |\n| 18 | Tugāgama (तुगागम) | hrasva + ch → t inserted → cch | ā + chādayati → ācchādayati | Case-dependent |\n| 19 | Satva (सत्व) | n (pada-anta) + kharaḥ → ṁs (+ further śchutva/ṣṭutva) | tān + ca → tāṁś ca | Yes |\n| 20 | Lopa (लोप) | Sound deletion (esp. visarga or vowel) | devāḥ + vadanti → devā vadanti | Context |\n| 21 | Ukārādeśa (उकारादेश) | aḥ + voiced → o | rāmaḥ + gacchati → rāmo gacchati | Yes |\n| 22 | Rephādeśa (रेफादेश) | (non-a)ḥ + voiced → r | muniḥ + āgataḥ → munir āgataḥ | Yes |\n| 23 | Sakārādeśa (सकारादेश) | ḥ + kharaḥ (t/th/c/ch/ṭ/ṭh/ś/ṣ/s) → s | rāmaḥ + tatra → rāmas tatra | Yes |\n| 24 | Jihvāmūlīya (जिह्वामूलीय) | ḥ + ka/kha → jihvāmūlīya (or ḥ remains) | rāmaḥ + karoti → rāmaḫ karoti | Optional |\n| 25 | Visarga + a Pūrvarūpa | aḥ + a → o + avagraha | rāmaḥ + asti → rāmo'sti | Yes |\n| 26 | Visarga Lopa (āḥ) | āḥ + voiced consonant → ā (ḥ deleted) | devāḥ + gacchanti → devā gacchanti | Yes |\n| 27 | Visarga Rephādeśa (avyaya/rephānta) | (avyaya/rephānta) ḥ + voiced → r | punaḥ + api → punar api | Yes |\n\n*\\* Anunāsika is optional between padas, mandatory within a word (prakṛti-pratyaya boundary).*\n\n---\n\n## Sandhi Identification Flowchart\n\nUse this decision guide when you encounter a sandhi or need to determine which rule applies.\n\n### Step 1: Identify the Boundary Sounds\n\nLook at the **last sound of the first component** (pūrva) and the **first sound of the second component** (para).\n\n### Step 2: Classify the Boundary\n\n```\nIs the pūrva sound a svara (vowel)?\n   YES → Go to AC SANDHI GUIDE (Step 3a)\n   NO  → Is the pūrva sound a visarga (ḥ)?\n            YES → Go to VISARGA SANDHI GUIDE (Step 3c)\n            NO  → Go to HAL SANDHI GUIDE (Step 3b)\n```\n\n### Step 3a: Ac Sandhi Decision\n\n```\nAre pūrva and para the SAME class of vowel? (a+a, i+i, u+u, ṛ+ṛ)\n   YES → SAVARṆADĪRGHA: result is the dīrgha form\n\nIs pūrva a/ā and para i/ī, u/ū, or ṛ/ṝ?\n   YES → GUṆA: result is e, o, or ar\n\nIs pūrva a/ā and para e/ai or o/au?\n   YES → VṚDDHI: result is ai or au\n\nIs pūrva i/ī, u/ū, ṛ/ṝ, or ḷ and para a DIFFERENT class vowel?\n   YES → YAN: result is y, v, r, or l\n\nIs pūrva e/o (at pada-anta) and para a?\n   YES → PŪRVARŪPA: para a is deleted (avagraha)\n\nIs pūrva a (upasarga) and para a (dhātu starting with a)?\n   YES → PARARŪPA (special cases only)\n```\n\n### Step 3b: Hal Sandhi Decision\n\n```\nIs pūrva m (at pada-anta) and para any vyañjana?\n   YES → ANUSVĀRA: m → ṁ\n\nDoes boundary involve s/tavarga meeting ś/cavarga?\n   YES → ŚCHUTVA: s→ś, t→c, etc.\n\nDoes boundary involve s/tavarga meeting ṣ/ṭavarga?\n   YES → ṢṬUTVA: s→ṣ, t→ṭ, etc.\n\nIs pūrva 1st letter of varga + para voiced?\n   YES → JAŚTVA: 1st → 3rd letter\n\nIs pūrva non-nasal stop + para voiceless?\n   YES → CHARTVA: → 1st letter of own varga\n\nIs pūrva consonant + para nasal?\n   YES → ANUNĀSIKA: → 5th letter of pūrva's varga (optional)\n\nIs pūrva anusvāra + para varga consonant?\n   YES → PARASAVARṆA: ṁ → 5th letter of para's varga\n```\n\n### Step 3c: Visarga Sandhi Decision\n\n```\nIs pūrva aḥ + para voiced consonant (not a)?\n   YES → UKĀRĀDEŚA: aḥ → o\n\nIs pūrva aḥ + para a?\n   YES → UKĀRĀDEŚA + PŪRVARŪPA: aḥ + a → o'\n\nIs pūrva āḥ + para voiced consonant or vowel (not a)?\n   YES → VISARGA LOPA: āḥ → ā\n\nIs pūrva (i/ī/u/ū/e/o)ḥ + para voiced?\n   YES → REPHĀDEŚA: ḥ → r\n\nIs para kharaḥ (t/th/c/ch/ṭ/ṭh/ś/ṣ/s)?\n   YES → SAKĀRĀDEŚA: ḥ → s (then apply śchutva/ṣṭutva if needed)\n\nIs para ka/kha?\n   YES → JIHVĀMŪLĪYA (optional) or ḥ remains\n\nIs para pa/pha?\n   YES → UPADHMĀNĪYA (optional) or ḥ remains\n```\n\n---\n\n## Quick-Reference: Guṇa and Vṛddhi Grades\n\n| Base Vowel | Guṇa | Vṛddhi |\n|-----------|-------|--------|\n| a / ā | a | ā |\n| i / ī | e | ai |\n| u / ū | o | au |\n| ṛ / ṝ | ar | ār |\n| ḷ | al | āl |\n\n---\n\n## Quick-Reference: Varga Table\n\n| Varga | 1st (prathama) | 2nd (dvitīya) | 3rd (tṛtīya) | 4th (caturtha) | 5th (pañcama) |\n|-------|---------------|---------------|--------------|----------------|---------------|\n| kavarga | k | kh | g | gh | ṅ |\n| cavarga | c | ch | j | jh | ñ |\n| ṭavarga | ṭ | ṭh | ḍ | ḍh | ṇ |\n| tavarga | t | th | d | dh | n |\n| pavarga | p | ph | b | bh | m |\n\n**Key terms:**\n- Kharaḥ = voiceless consonants (1st, 2nd letters + ś, ṣ, s)\n- Ghoṣa = voiced consonants (3rd, 4th, 5th letters + semivowels + h)\n- Alphaprāṇa = unaspirated (1st, 3rd)\n- Mahāprāṇa = aspirated (2nd, 4th)\n\n---\n\n## Sūtra Quick-Reference\n\n| Sandhi | Sūtra | Reference |\n|--------|-------|-----------|\n| Yan | iko yaṇ aci | 6.1.77 |\n| Savarṇadīrgha | akaḥ savarṇe dīrghaḥ | 6.1.101 |\n| Guṇa | ādguṇaḥ | 6.1.87 |\n| Vṛddhi | vṛddhir eci | 6.1.88 |\n| Pūrvarūpa | eṅaḥ padāntād ati | 6.1.109 |\n| Śchutva | stoḥ ścunā ścuḥ | 8.4.40 |\n| Ṣṭutva | ṣṭunā ṣṭuḥ | 8.4.41 |\n| Jaśtva | jhalaṃ jaśo'nte | 8.2.39 |\n| Anusvāra | mo'nusvāraḥ | 8.3.23 |\n| Parasavarṇa | anusvārasya yayi parasavarṇaḥ / torli | 8.4.58 / 8.4.60 |\n", "workbook-questions": "# Chapter 2: Sandhi -- Workbook (Questions)\n\n## Section A: Ac Sandhi (Svara / Vowel Sandhi) (30 marks)\n\n### Yan Sandhi (5 marks)\n\n**A1.** Perform Yan Sandhi for each pair (5 marks):\n1. iti + āha = ___\n2. madhu + ari = ___\n3. pitṛ + anumatam = ___\n4. devī + āgatā = ___\n5. su + āgatam = ___\n\n---\n\n### Savarṇadīrgha Sandhi (5 marks)\n\n**A2.** Perform Savarṇadīrgha Sandhi (5 marks):\n1. mahā + ātmā = ___\n2. giri + īśaḥ = ___\n3. bhānu + udayaḥ = ___\n4. vidyā + ālayaḥ = ___\n5. kavi + indraḥ = ___\n\n---\n\n### Guṇa Sandhi (5 marks)\n\n**A3.** Perform Guṇa Sandhi (5 marks):\n1. nara + indraḥ = ___\n2. mahā + utsavaḥ = ___\n3. deva + ṛṣiḥ = ___\n4. gaṅgā + udakam = ___\n5. parama + īśvaraḥ = ___\n\n---\n\n### Vṛddhi Sandhi (5 marks)\n\n**A4.** Perform Vṛddhi Sandhi (5 marks):\n1. sadā + eva = ___\n2. mahā + aiśvaryam = ___\n3. jala + oghaḥ = ___\n4. tava + aikyam = ___\n5. mahā + oṣadhiḥ = ___\n\n---\n\n### Pūrvarūpa and Pararūpa Sandhi (5 marks)\n\n**A5.** Perform Pūrvarūpa Sandhi (use avagraha where appropriate) (4 marks):\n1. hare + atra = ___\n2. viṣṇo + arpaṇam = ___\n3. vane + asmin = ___\n4. prabho + anugrahah = ___\n\n**A6.** Identify which ac sandhi applies and give the result (1 mark):\n1. upa + ajati = ___ (sandhi name: ___)\n\n---\n\n### Mixed Ac Sandhi Identification (5 marks)\n\n**A7.** Identify the sandhi type AND perform the sandhi (5 marks):\n1. rāma + īśaḥ = ___ (sandhi: ___)\n2. iti + uvāca = ___ (sandhi: ___)\n3. sadā + eṣaḥ = ___ (sandhi: ___)\n4. guru + upadeśaḥ = ___ (sandhi: ___)\n5. na + asti = ___ (sandhi: ___)\n\n---\n\n## Section B: Hal Sandhi (Vyañjana / Consonant Sandhi) (30 marks)\n\n### Śchutva and Ṣṭutva Sandhi (6 marks)\n\n**B1.** Perform the sandhi and name it (6 marks):\n1. sat + cit = ___ (sandhi: ___)\n2. tat + śrutvā = ___ (sandhi: ___)\n3. rāmas + śete = ___ (sandhi: ___)\n4. iṣ + taḥ = ___ (sandhi: ___)\n5. tat + ṭīkā = ___ (sandhi: ___)\n6. ud + cinoti = ___ (sandhi: ___)\n\n---\n\n### Jaśtva Sandhi (5 marks)\n\n**B2.** Apply Jaśtva Sandhi (5 marks):\n1. vāk + īśaḥ = ___\n2. tat + eva = ___\n3. jagat + nāthaḥ = ___\n4. samrāṭ + jayati = ___\n5. kakup + antam = ___\n\n---\n\n### Anunāsika Sandhi (4 marks)\n\n**B3.** Apply Anunāsika Sandhi to these pairs (note: jaśtva may apply first) (4 marks):\n1. jagat + nāṭyam = ___ (show steps)\n2. vāk + mayam = ___\n3. ṣaṭ + mukhaḥ = ___\n4. cit + mayaḥ = ___\n\n---\n\n### Anusvāra Sandhi (5 marks)\n\n**B4.** Apply Anusvāra Sandhi (5 marks):\n1. kṛṣṇam + vande = ___\n2. satyam + vada = ___\n3. dharmam + cara = ___\n4. gurum + namati = ___\n5. rāmam + jayati = ___\n\n---\n\n### Parasavarṇa Sandhi (5 marks)\n\n**B5.** Apply Parasavarṇa Sandhi. State which case applies (5 marks):\n1. saṁ + dhiḥ = ___ (case: ___)\n2. alaṁ + cakāra = ___ (case: ___)\n3. taṁ + daṇḍam = ___ (case: ___)\n4. bhagavat + līlā = ___ (case: ___)\n5. saṁ + gamaḥ = ___ (case: ___)\n\n---\n\n### Chartva Sandhi (2 marks)\n\n**B6.** Apply Chartva Sandhi (2 marks):\n1. samrāḍ + kṛtam = ___\n2. jagad + phalam = ___\n\n---\n\n### Mixed Hal Sandhi Identification (3 marks)\n\n**B7.** Split the following compound forms and name the sandhi involved (3 marks):\n1. sac cidam = ___ + ___ (sandhi: ___)\n2. jagan nāthaḥ = ___ + ___ (sandhi: ___)\n3. kṛṣṇaṁ vande = ___ + ___ (sandhi: ___)\n\n---\n\n## Section C: Viśeṣa Sandhi (Special / Visarga Sandhi) (30 marks)\n\n### Chatva / Tugāgama Sandhi (4 marks)\n\n**C1.** Perform the sandhi (4 marks):\n1. anu + cheda = ___\n2. sva + chanda = ___\n3. ā + chādayati = ___\n4. pra + channa = ___\n\n---\n\n### Pūrvasavarṇa Sandhi (4 marks)\n\n**C2.** Perform the sandhi (4 marks):\n1. vāg + harati = ___\n2. dig + hīnaḥ = ___\n3. ab + hrasaḥ = ___\n4. etat + hi = ___\n\n---\n\n### Satva Sandhi (4 marks)\n\n**C3.** Perform Satva Sandhi, showing intermediate steps (4 marks):\n1. mahān + tapasvī = ___\n2. tān + ca = ___\n3. asmin + ṭīkā = ___\n4. tān + śūraḥ = ___\n\n---\n\n### Visarga Sandhi -- Ukārādeśa (4 marks)\n\n**C4.** Apply the correct visarga sandhi (4 marks):\n1. rāmaḥ + gacchati = ___\n2. bālaḥ + hasati = ___\n3. rāmaḥ + asti = ___\n4. eṣaḥ + bālakaḥ = ___\n\n---\n\n### Visarga Sandhi -- Rephādeśa (4 marks)\n\n**C5.** Apply Rephādeśa Sandhi (4 marks):\n1. muniḥ + āgataḥ = ___\n2. guruḥ + uvāca = ___\n3. punaḥ + api = ___\n4. aśīḥ + yuddham = ___\n\n---\n\n### Visarga Sandhi -- Sakārād
