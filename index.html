Uttama (1st) | dade | dadvahe | dadmahe |\n\n---\n\n## 7. Lṛṭ Lakāra -- Simple Future Tense\n\n### Formation\n\nThe future tense is formed by inserting the pratyaya **-iṣya-** (parasmaipada) or **-iṣya-** (ātmanepada) between the dhātu (with guṇa/vṛddhi as applicable) and the tiṅ endings. The formula:\n\n> dhātu (+ guṇa) + **-iṣya-** + tiṅ pratyaya\n\nThe tiṅ endings in lṛṭ are the same as in laṭ.\n\n### Parasmaipada Conjugations in Lṛṭ\n\n#### paṭh (to read) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | paṭhiṣyati | paṭhiṣyataḥ | paṭhiṣyanti |\n| Madhyama (2nd) | paṭhiṣyasi | paṭhiṣyathaḥ | paṭhiṣyatha |\n| Uttama (1st) | paṭhiṣyāmi | paṭhiṣyāvaḥ | paṭhiṣyāmaḥ |\n\n#### bhū (to be) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | bhaviṣyati | bhaviṣyataḥ | bhaviṣyanti |\n| Madhyama (2nd) | bhaviṣyasi | bhaviṣyathaḥ | bhaviṣyatha |\n| Uttama (1st) | bhaviṣyāmi | bhaviṣyāvaḥ | bhaviṣyāmaḥ |\n\n#### gam (to go) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | gamiṣyati | gamiṣyataḥ | gamiṣyanti |\n| Madhyama (2nd) | gamiṣyasi | gamiṣyathaḥ | gamiṣyatha |\n| Uttama (1st) | gamiṣyāmi | gamiṣyāvaḥ | gamiṣyāmaḥ |\n\n#### likh (to write) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | lekhiṣyati | lekhiṣyataḥ | lekhiṣyanti |\n| Madhyama (2nd) | lekhiṣyasi | lekhiṣyathaḥ | lekhiṣyatha |\n| Uttama (1st) | lekhiṣyāmi | lekhiṣyāvaḥ | lekhiṣyāmaḥ |\n\n#### kṛ (to do) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | kariṣyati | kariṣyataḥ | kariṣyanti |\n| Madhyama (2nd) | kariṣyasi | kariṣyathaḥ | kariṣyatha |\n| Uttama (1st) | kariṣyāmi | kariṣyāvaḥ | kariṣyāmaḥ |\n\n#### nand (to rejoice) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | nandiṣyati | nandiṣyataḥ | nandiṣyanti |\n| Madhyama (2nd) | nandiṣyasi | nandiṣyathaḥ | nandiṣyatha |\n| Uttama (1st) | nandiṣyāmi | nandiṣyāvaḥ | nandiṣyāmaḥ |\n\n#### has (to laugh) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | hasiṣyati | hasiṣyataḥ | hasiṣyanti |\n| Madhyama (2nd) | hasiṣyasi | hasiṣyathaḥ | hasiṣyatha |\n| Uttama (1st) | hasiṣyāmi | hasiṣyāvaḥ | hasiṣyāmaḥ |\n\n#### dṛś (to see) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | drakṣyati | drakṣyataḥ | drakṣyanti |\n| Madhyama (2nd) | drakṣyasi | drakṣyathaḥ | drakṣyatha |\n| Uttama (1st) | drakṣyāmi | drakṣyāvaḥ | drakṣyāmaḥ |\n\n#### pā (to drink) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | pāsyati | pāsyataḥ | pāsyanti |\n| Madhyama (2nd) | pāsyasi | pāsyathaḥ | pāsyatha |\n| Uttama (1st) | pāsyāmi | pāsyāvaḥ | pāsyāmaḥ |\n\n#### gā (to sing) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | gāsyati | gāsyataḥ | gāsyanti |\n| Madhyama (2nd) | gāsyasi | gāsyathaḥ | gāsyatha |\n| Uttama (1st) | gāsyāmi | gāsyāvaḥ | gāsyāmaḥ |\n\n#### ji (to conquer) -- P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | jeṣyati | jeṣyataḥ | jeṣyanti |\n| Madhyama (2nd) | jeṣyasi | jeṣyathaḥ | jeṣyatha |\n| Uttama (1st) | jeṣyāmi | jeṣyāvaḥ | jeṣyāmaḥ |\n\n### Ātmanepada Conjugations in Lṛṭ\n\n#### sev (to serve) -- Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | seviṣyate | seviṣyete | seviṣyante |\n| Madhyama (2nd) | seviṣyase | seviṣyethe | seviṣyadhve |\n| Uttama (1st) | seviṣye | seviṣyāvahe | seviṣyāmahe |\n\n#### labh (to obtain) -- Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | lapsyate | lapsyete | lapsyante |\n| Madhyama (2nd) | lapsyase | lapsyethe | lapsyadhve |\n| Uttama (1st) | lapsye | lapsyāvahe | lapsyāmahe |\n\n#### kṛ (to do) -- Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | kariṣyate | kariṣyete | kariṣyante |\n| Madhyama (2nd) | kariṣyase | kariṣyethe | kariṣyadhve |\n| Uttama (1st) | kariṣye | kariṣyāvahe | kariṣyāmahe |\n\n---\n\n## 8. Forming Simple Sentences\n\nSanskrit word order is typically: **Subject (kartā) + Object (karma) + Verb (kriyā)**\n\n### Present Tense Examples\n\n| Sanskrit | Translation |\n|----------|-------------|\n| rāmaḥ paṭhati | Rāma reads |\n| sītā gacchati | Sītā goes |\n| bālakau krīḍataḥ | The two boys play |\n| vayam likhāmaḥ | We write |\n| tvam paśyasi | You see |\n| te hasanti | They laugh |\n| aham namāmi | I bow |\n| yūyam pibatha | You all drink |\n| saḥ nṛtyati | He dances |\n| gurūṇām śiṣyaḥ vandate | The guru's student salutes |\n\n### Future Tense Examples\n\n| Sanskrit | Translation |\n|----------|-------------|\n| aham paṭhiṣyāmi | I will read |\n| tvam gamiṣyasi | You will go |\n| saḥ kariṣyati | He will do |\n| vayam lekhiṣyāmaḥ | We will write |\n| te bhaviṣyanti | They will be |\n| sā gāsyati | She will sing |\n\n---\n\n## Milestone Check\n\nCan you:\n1. Name the 10 gaṇas and give one dhātu from each?\n2. Recite the 9 parasmaipada tiṅ pratyayas for laṭ?\n3. Conjugate bhū, paṭh, and gam fully in laṭ parasmaipada?\n4. Conjugate paṭh and bhū fully in lṛṭ parasmaipada?\n5. Conjugate labh and vand in laṭ ātmanepada?\n6. Parse a form like \"gacchāmaḥ\" into dhātu + lakāra + puruṣa + vacana?\n", "theory": "# Stage 6: Kriyā — Verbs\n\n## Goal\nLearn Sanskrit verbs to describe acts of worship, devotion, and daily spiritual practice. Describe your own worship in Sanskrit.\n\n## What is a Kriyā?\n\n**Kriyā** (क्रिया) means \"action.\" Sanskrit verbs conjugate according to:\n- **Puruṣa** (person): prathama (3rd), madhyama (2nd), uttama (1st)\n- **Vacana** (number): eka (singular), dvi (dual), bahu (plural)\n- **Lakāra** (tense/mood): laṭ (present), loṭ (imperative), laṅ (past), etc.\n\n## Present Tense (Laṭ-lakāra) — The Essential Tense\n\n### Parasmaipada (active) endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| Prathama (he/she/it) | -ti | -taḥ | -anti |\n| Madhyama (you) | -si | -thaḥ | -tha |\n| Uttama (I) | -mi | -vaḥ | -maḥ |\n\n### Core Devotional Verbs (Present Tense, Uttama Puruṣa = \"I\")\n\n| Dhātu | 1st person | Meaning | Devotional Use |\n|-------|-----------|---------|----------------|\n| nam (1P) | namāmi | I bow | namāmi śivam |\n| pūj (10P) | pūjayāmi | I worship | pūjayāmi devīm |\n| smṛ (1P) | smarāmi | I remember | smarāmi kṛṣṇam |\n| dṛś (1P) | paśyāmi | I see | paśyāmi mūrtim |\n| dā (3P) | dadāmi | I give | dadāmi puṣpam |\n| śru (5P) | śṛṇomi | I hear | śṛṇomi mantram |\n| gam (1P) | gacchāmi | I go | gacchāmi mandiram |\n| sthā (1P) | tiṣṭhāmi | I stand | tiṣṭhāmi mandire |\n| bhaj (1P) | bhajāmi | I adore/serve | bhajāmi harim |\n| gai (1P) | gāyāmi | I sing | gāyāmi stotram |\n| paṭh (1P) | paṭhāmi | I recite | paṭhāmi mantram |\n| dhyai (1P) | dhyāyāmi | I meditate | dhyāyāmi devam |\n| jap (1P) | japāmi | I chant | japāmi nāma |\n| arpay (10P) | arpayāmi | I offer | arpayāmi naivedyam |\n| rakṣ (1P) | rakṣāmi | I protect | — (used of deity) |\n| kṛ (8U) | karomi | I do/make | karomi pūjām |\n\n## All Three Persons\n\nExample with \"nam\" (to bow):\n\n| Person | Singular | Meaning |\n|--------|----------|---------|\n| 3rd | namati | he/she bows |\n| 2nd | namasi | you bow |\n| 1st | namāmi | I bow |\n\nExample with \"pūj\" (to worship, causative/10th class):\n\n| Person | Singular | Meaning |\n|--------|----------|---------|\n| 3rd | pūjayati | he/she worships |\n| 2nd | pūjayasi | you worship |\n| 1st | pūjayāmi | I worship |\n\n## Ātmanepada Verbs\n\nSome verbs use ātmanepada (middle voice) endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | -te | -ete | -ante |\n| 2nd | -se | -ethe | -dhve |\n| 1st | -e | -vahe | -mahe |\n\nKey ātmanepada verb: **sev** (to serve) → **seve** (I serve)\n\n## The Game: \"What Do I Offer?\"\n\nDescribe your daily worship using verbs:\n\n> prātaḥ uttiṣṭhāmi (in the morning I rise)\n> snānaṃ karomi (I bathe)\n> mandiram gacchāmi (I go to the temple)\n> devam paśyāmi (I see the deity)\n> puṣpam arpayāmi (I offer a flower)\n> dhūpam dadāmi (I give incense)\n> dīpam jvālayāmi (I light a lamp)\n> mantram japāmi (I chant a mantra)\n> stotram gāyāmi (I sing a hymn)\n> devam namāmi (I bow to the deity)\n> dhyāyāmi (I meditate)\n> prasādam svīkaromi (I accept prasāda)\n\n## Past Tense (Laṅ-lakāra — Imperfect)\n\nThe imperfect tense describes completed past actions. It is formed by:\n1. Adding the **augment a-** prefix to the verb stem\n2. Using **laṅ endings** (secondary endings)\n\n### Parasmaipada Laṅ endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| Prathama (he/she/it) | -at | -atām | -an |\n| Madhyama (you) | -aḥ | -atam | -ata |\n| Uttama (I) | -am | -āva | -āma |\n\n### Paradigm: √bhū (to be/become)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | abhavat | abhavatām | abhavan |\n| 2nd | abhavaḥ | abhavatam | abhavata |\n| 1st | abhavam | abhavāva | abhavāma |\n\n### Paradigm: √nam (to bow)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | anamat | anamatām | anaman |\n| 2nd | anamaḥ | anamatam | anamata |\n| 1st | anamam | anamāva | anamāma |\n\n### Paradigm: √pūj (to worship, 10th class)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | apūjayat | apūjayatām | apūjayan |\n| 2nd | apūjayaḥ | apūjayatam | apūjayata |\n| 1st | apūjayam | apūjayāva | apūjayāma |\n\n### Paradigm: √rakṣ (to protect)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | arakṣat | arakṣatām | arakṣan |\n| 2nd | arakṣaḥ | arakṣatam | arakṣata |\n| 1st | arakṣam | arakṣāva | arakṣāma |\n\n**The augment pattern**: Notice the **a-** prefix on every form. This is the hallmark of the laṅ-lakāra. When the dhātu already begins with a vowel, the augment merges with it (vṛddhi): e.g., √iṣ → aicchat.\n\n**Devotional usage**:\n- bhaktaḥ devam apūjayat — the devotee worshipped the deity\n- śivaḥ jagat arakṣat — Śiva protected the world\n- aham mandiram agaccham — I went to the temple\n- vayam stotram agāyāma — we sang a hymn\n\n## Imperative (Loṭ-lakāra)\n\nThe imperative mood is essential for prayers, commands, and blessings. It expresses direct requests to the deity.\n\n### Parasmaipada Loṭ endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| Prathama (let him/her) | -tu | -tām | -antu |\n| Madhyama (you!) | -(a)/-(hi) | -tam | -ta |\n| Uttama (let me) | -āni | -āva | -āma |\n\n### Paradigm: √bhū (to be/become)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | bhavatu | bhavatām | bhavantu |\n| 2nd | bhava | bhavatam | bhavata |\n| 1st | bhavāni | bhavāva | bhavāma |\n\n### Paradigm: √nam (to bow)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | namatu | namatām | namantu |\n| 2nd | nama | namatam | namata |\n| 1st | namāni | namāva | namāma |\n\n### Paradigm: √pūj (to worship, 10th class)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | pūjayatu | pūjayatām | pūjayantu |\n| 2nd | pūjaya | pūjayatam | pūjayata |\n| 1st | pūjayāni | pūjayāva | pūjayāma |\n\n### Paradigm: √rakṣ (to protect)\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | rakṣatu | rakṣatām | rakṣantu |\n| 2nd | rakṣa | rakṣatam | rakṣata |\n| 1st | rakṣāṇi | rakṣāva | rakṣāma |\n\n**Devotional usage — prayers and commands**:\n- rakṣa mām — protect me!\n- āgaccha — come!\n- pāhi mām — save me! (√pā, 2nd sg. imperative: pāhi)\n- bhagavan prasīda — O Lord, be gracious!\n- devāḥ rakṣantu naḥ — may the gods protect us\n- stotram paṭha — recite the hymn!\n- dhyānam kuru — do meditation! (√kṛ imperative: kuru)\n\n## Optative (Vidhiliṅ-lakāra) — \"Should\" / \"May\"\n\nThe optative expresses wishes, duties, and gentle suggestions. It uses the mood marker **-yā-** (or **-ī-** in parasmaipada) inserted before the personal ending.\n\n### Parasmaipada Vidhiliṅ endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | -et | -eyātām | -eyuḥ |\n| 2nd | -eḥ | -eyātam | -eta |\n| 1st | -eyam | -eva | -ema |\n\n### Key devotional forms:\n\n| Dhātu | 3rd sg. | 1st sg. | Meaning |\n|-------|---------|---------|---------|\n| pūj | pūjayet | pūjayeyam | one should worship / I should worship |\n| rakṣ | rakṣet | rakṣeyam | one should protect / may he protect |\n| nam | namet | nameyam | one should bow |\n| bhaj | bhajet | bhajeyam | one should adore |\n| smṛ | smaret | smareyam | one should remember |\n\n**Devotional usage**:\n- nityam devam pūjayet — one should worship the deity daily\n- sarve janāḥ dharmaṃ bhajeyuḥ — may all people follow dharma\n- bhaktaḥ satatam smaret — the devotee should always remember\n- rakṣet dharmam sadā — one should always protect dharma\n\n## Negation\n\nTo negate a verb, place **na** before it:\n- na jānāmi — I do not know\n- na paśyāmi — I do not see\n- na tyajāmi — I do not abandon\n\n## Milestone Check\n\nCan you describe your own daily worship (real or ideal) using at least 8 different verbs?\n\nCan you retell yesterday's pūjā using the past tense? Can you write 3 prayers using the imperative?\n\n---\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Present verb brick (laṭ) | namāmi, pūjayati | Subject (prathamā) + object (dvitīyā) noun bricks |\n| Past verb brick (laṅ) | anamam, apūjayat | Same noun bricks, but describes completed actions; adds a- prefix |\n| Command verb brick (loṭ) | rakṣa, āgaccha, pāhi | Direct address — snaps onto vocative noun bricks for prayers |\n| Wish verb brick (vidhiliṅ) | pūjayet, rakṣet | Expresses duty/wish — \"one should...\" or \"may he...\" |\n\n**Try snapping**: Take the sentence \"aham devam namāmi\" (present). Now swap the verb brick to past: \"aham devam anamam\" (I bowed to the deity). Now to imperative, addressing the deity: \"he deva! mām rakṣa!\" (O deity, protect me!). Now to optative: \"bhaktaḥ devam namet\" (the devotee should bow to the deity).\n", "reference": "# Stage 6: Kriyā — Reference Guide\n\n## Parasmaipada Present Tense Endings\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd (prathama) | -ti | -taḥ | -anti |\n| 2nd (madhyama) | -si | -thaḥ | -tha |\n| 1st (uttama) | -mi | -vaḥ | -maḥ |\n\n## Ātmanepada Present Tense Endings\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd | -te | -ete | -ante |\n| 2nd | -se | -ethe | -dhve |\n| 1st | -e | -vahe | -mahe |\n\n## 40 Essential Verbs — Full Present Tense (1st person singular)\n\n### Worship & Devotion\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| nam | namāmi | namati | bow |\n| pūj | pūjayāmi | pūjayati | worship |\n| bhaj | bhajāmi | bhajati | adore/serve |\n| sev | seve | sevate | serve |\n| arc | arcāmi | arcati | worship with rites |\n| stū/stu | staumi/stuvāmi | stauti/stuvati | praise |\n| dhyai | dhyāyāmi | dhyāyati | meditate |\n| jap | japāmi | japati | chant/repeat |\n| smṛ | smarāmi | smarati | remember |\n| prārth | prārthayāmi | prārthayati | pray |\n\n### Giving & Offering\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| dā | dadāmi | dadāti | give |\n| arpay | arpayāmi | arpayati | offer |\n| yaj | yajāmi | yajati | sacrifice |\n| hu | juhomi | juhoti | pour oblation |\n\n### Perception & Knowledge\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| dṛś | paśyāmi | paśyati | see |\n| śru | śṛṇomi | śṛṇoti | hear |\n| jñā | jānāmi | jānāti | know |\n| vid | vede/vedmi | vetti | know |\n| man | manye | manyate | think |\n| budh | bodhāmi | bodhati | understand |\n\n### Movement\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| gam | gacchāmi | gacchati | go |\n| ā-gam | āgacchāmi | āgacchati | come |\n| sthā | tiṣṭhāmi | tiṣṭhati | stand/stay |\n| car | carāmi | carati | walk/move |\n| praviś | praviśāmi | praviśati | enter |\n| ni-kram | niṣkrāmāmi | niṣkrāmati | exit |\n\n### Speech & Song\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| vad | vadāmi | vadati | speak |\n| gai | gāyāmi | gāyati | sing |\n| paṭh | paṭhāmi | paṭhati | recite |\n| brū | bravīmi | bravīti | say/tell |\n\n### Action & Creation\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| kṛ | karomi | karoti | do/make |\n| likh | likhāmi | likhati | write |\n| nī | nayāmi | nayati | lead |\n| rakṣ | rakṣāmi | rakṣati | protect |\n| tyaj | tyajāmi | tyajati | abandon |\n| grah | gṛhṇāmi | gṛhṇāti | take/seize |\n| pā | pibāmi | pibati | drink |\n| bhuj | bhuñjāmi | bhuṅkte | eat |\n| vas | vasāmi | vasati | live/dwell |\n| jīv | jīvāmi | jīvati | live |\n\n## Imperative (Loṭ-lakāra) — Quick Reference\n\n| Person | Eka | Meaning |\n|--------|-----|---------|\n| 3rd | -tu | let him... |\n| 2nd | -a / -hi | do...! |\n| 1st | -āni | let me... |\n\nExamples: pātu (let him protect), gaccha (go!), karāṇi (let me do)\n\n## Parasmaipada Past Tense (Laṅ-lakāra) Endings\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd (prathama) | -at | -atām | -an |\n| 2nd (madhyama) | -aḥ | -atam | -ata |\n| 1st (uttama) | -am | -āva | -āma |\n\nRemember: prefix **a-** (the augment) to the verb stem.\n\n### Key Verbs in Laṅ (3rd sg. / 1st sg.)\n\n| Dhātu | 3rd sg. | 1st sg. | Meaning (past) |\n|-------|---------|---------|----------------|\n| bhū | abhavat | abhavam | became/was |\n| nam | anamat | anamam | bowed |\n| pūj | apūjayat | apūjayam | worshipped |\n| rakṣ | arakṣat | arakṣam | protected |\n| gam | agacchat | agaccham | went |\n| dā | adadāt | adadām | gave |\n| smṛ | asmarat | asmaram | remembered |\n| bhaj | abhajat | abhajam | adored |\n| gai | agāyat | agāyam | sang |\n| paṭh | apaṭhat | apaṭham | recited |\n| kṛ | akarot | akuravam | did/made |\n\n## Full Imperative (Loṭ-lakāra) Endings — Parasmaipada\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd (prathama) | -tu | -tām | -antu |\n| 2nd (madhyama) | -a / -hi | -tam | -ta |\n| 1st (uttama) | -āni | -āva | -āma |\n\n### Key Verbs in Loṭ (2nd sg. / 3rd sg.)\n\n| Dhātu | 2nd sg. | 3rd sg. | Devotional Use |\n|-------|---------|---------|----------------|\n| rakṣ | rakṣa | rakṣatu | rakṣa mām! (protect me!) |\n| gam | gaccha | gacchatu | āgaccha! (come!) |\n| pūj | pūjaya | pūjayatu | devam pūjaya (worship the deity!) |\n| nam | nama | namatu | namantu devāḥ (let the gods bow) |\n| bhū | bhava | bhavatu | maṅgalam bhavatu (may there be auspiciousness) |\n| kṛ | kuru | kurūtu | dhyānam kuru (do meditation!) |\n| pā | pāhi | pātu | pāhi mām (save me!) |\n| śru | śṛṇu | śṛṇotu | śṛṇu me (hear me!) |\n| dā | dehi | dadātu | dehi me varadam (give me a boon!) |\n\n## Optative (Vidhiliṅ-lakāra) Endings — Parasmaipada\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd | -et | -eyātām | -eyuḥ |\n| 2nd | -eḥ | -eyātam | -eta |\n| 1st | -eyam | -eva | -ema |\n\n### Key Verbs in Vidhiliṅ (3rd sg. / 1st sg.)\n\n| Dhātu | 3rd sg. | 1st sg. | Meaning |\n|-------|---------|---------|---------|\n| pūj | pūjayet | pūjayeyam | should worship |\n| rakṣ | rakṣet | rakṣeyam | should protect |\n| nam | namet | nameyam | should bow |\n| bhaj | bhajet | bhajeyam | should adore |\n| smṛ | smaret | smareyam | should remember |\n| bhū | bhavet | bhaveyam | should be |\n| kṛ | kuryāt | kuryām | should do |\n\n## Common Verb Phrases for Pūjā\n\n| Sanskrit | Meaning |\n|----------|---------|\n| pādau prakṣālayāmi | I wash the feet |\n| ācamanam samarpayāmi | I offer sipping water |\n| snānam samarpayāmi | I offer bathing |\n| vastram samarpayāmi | I offer clothing |\n| gandham samarpayāmi | I offer fragrance |\n| puṣpam samarpayāmi | I offer a flower |\n| dhūpam samarpayāmi | I offer incense |\n| dīpam samarpayāmi | I offer a lamp |\n| naivedyam samarpayāmi | I offer food |\n| pradakṣiṇam karomi | I circumambulate |\n| namaskāram karomi | I offer prostration |\n", "workbook-questions": "# Stage 6: Kriyā — Workbook (Questions)\n\n## Section A: Conjugation (15 marks)\n\n**A1.** Give the present tense form for each (5 marks):\n1. nam, 1st person singular (I bow): ___\n2. pūj, 3rd person singular (he worships): ___\n3. gam, 2nd person singular (you go): ___\n4. dā, 1st person singular (I give): ___\n5. paśy (dṛś), 3rd person plural (they see): ___\n\n**A2.** Conjugate \"bhaj\" (to adore) in all three persons, singular (3 marks):\n- 3rd: ___\n- 2nd: ___\n- 1st: ___\n\n**A3.** Conjugate \"smṛ\" (to remember) in all three persons, singular (3 marks):\n- 3rd: ___\n- 2nd: ___\n- 1st: ___\n\n**A4.** What is the difference between parasmaipada and ātmanepada? Give one example verb of each (4 marks).\n\n---\n\n## Section B: Translation (15 marks)\n\n**B1.** Translate into Sanskrit (use 1st person singular) (5 marks):\n1. I bow to Śiva\n2. I sing a hymn\n3. I go to the temple\n4. I offer a flower\n5. I meditate on the deity\n\n**B2.** Translate into English (5 marks):\n1. bhaktaḥ devam pūjayati\n2. mantram japāmi\n3. śivaḥ rakṣati\n4. dīpam jvālayāmi\n5. gāyāmi stotram\n\n**B3.** Change each sentence from 1st person to 3rd person (5 marks):\n1. namāmi → ___\n2. gacchāmi → ___\n3. dadāmi → ___\n4. paśyāmi → ___\n5. karomi → ___\n\n---\n\n## Section C: Sentence Building (15 marks)\n\n**C1.** Complete each sentence with the correct verb form (5 marks):\n1. aham devam ___ (I worship) [pūj]\n2. bhaktaḥ mandiram ___ (the devotee goes) [gam]\n3. tvam mantram ___ (you chant) [jap]\n4. devī bhaktam ___ (the goddess protects) [rakṣ]\n5. vayam stotram ___ (we sing) [gai]\n\n**C2.** Build 5 sentences describing a morning pūjā, using 5 different verbs (10 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n\n---\n\n## Section D: Negation & Questions (5 marks)\n\n**D1.** Negate each sentence (3 marks):\n1. jānāmi → ___\n2. paśyāmi → ___\n3. tyajāmi → ___\n\n**D2.** What does each sentence mean? (2 marks):\n1. na tyajāmi devam\n2. kiṃ paśyasi?\n\n---\n\n## Section E: Milestone — Describe Your Worship (10 marks)\n\nWrite a sequence of at least 8 Sanskrit sentences describing your daily worship (real or imagined). Use at least 8 different verbs. Include subjects, objects, and verbs.\n\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n6. ___\n7. ___\n8. ___\n\n---\n\n## Section F: Past Tense — Laṅ-lakāra (15 marks)\n\n**F1.** Give the laṅ (past tense) form for each (5 marks):\n1. nam, 1st person singular (I bowed): ___\n2. pūj, 3rd person singular (he worshipped): ___\n3. rakṣ, 3rd person plural (they protected): ___\n4. bhū, 1st person singular (I became): ___\n5. gam, 2nd person singular (you went): ___\n\n**F2.** Translate into English (5 marks):\n1. bhaktaḥ devam apūjayat\n2. śivaḥ jagat arakṣat\n3. aham mandiram agaccham\n4. devāḥ arakṣan\n5. tvam mantram ajapāḥ (from √jap)\n\n**F3.** Rewrite each present-tense sentence in the past tense (5 marks):\n1. namāmi śivam → ___\n2. bhaktaḥ pūjayati → ___\n3. gacchāmi mandiram → ___\n4. devī rakṣati bhaktam → ___\n5. gāyāmaḥ stotram → ___\n\n---\n\n## Section G: Imperative & Optative (15 marks)\n\n**G1.** Give the loṭ (imperative) form for each (5 marks):\n1. rakṣ, 2nd person singular (protect!): ___\n2. gam, 2nd person singular (go!): ___\n3. pūj, 3rd person singular (let him worship): ___\n4. bhū, 3rd person plural (let them be): ___\n5. nam, 1st person singular (let me bow): ___\n\n**G2.** Write 3 commands or prayers using the imperative (6 marks):\n1. A prayer asking a deity to protect you: ___\n2. A command telling someone to recite a mantra: ___\n3. A wish that the gods bless everyone: ___\n\n**G3.** Give the vidhiliṅ (optative) form and translate (4 marks):\n1. pūj, 3rd person singular: ___ (meaning: ___)\n2. rakṣ, 1st person singular: ___ (meaning: ___)\n\n---\n\n## Section H: Composition (10 marks)\n\n**H1.** Describe what you did in yesterday's pūjā using the past tense. Write at least 4 sentences with 4 different verbs in laṅ-lakāra. (5 marks)\n\n1. ___\n2. ___\n3. ___\n4. ___\n\n**H2.** Write 3 commands or prayers using the imperative. Address a deity directly using the vocative and request protection, grace, or presence. (5 marks)\n\n1. ___\n2. ___\n3. ___\n\n---\n\n**Total: 100 marks**\n", "workbook-answers": "# Stage 6: Kriyā — Workbook (Answers)\n\n## Section A: Conjugation\n\n**A1.**\n1. nam, 1st sing. → **namāmi**\n2. pūj, 3rd sing. → **pūjayati**\n3. gam, 2nd sing. → **gacchasi**\n4. dā, 1st sing. → **dadāmi**\n5. dṛś, 3rd pl. → **paśyanti**\n\n**A2.** bhaj:\n- 3rd: **bhajati**\n- 2nd: **bhajasi**\n- 1st: **bhajāmi**\n\n**A3.** smṛ:\n- 3rd: **smarati**\n- 2nd: **smarasi**\n- 1st: **smarāmi**\n\n**A4.** Parasmaipada (\"for another\") uses -ti/-si/-mi endings; ātmanepada (\"for oneself\") uses -te/-se/-e endings. Parasmaipada example: **namati** (nam). Ātmanepada example: **sevate** (sev).\n\n---\n\n## Section B: Translation\n\n**B1.**\n1. I bow to Śiva → **śivam namāmi** (or namāmi śivam)\n2. I sing a hymn → **stotram gāyāmi**\n3. I go to the temple → **mandiram gacchāmi**\n4. I offer a flower → **puṣpam arpayāmi**\n5. I meditate on the deity → **devam dhyāyāmi**\n\n**B2.**\n1. bhaktaḥ devam pūjayati → **The devotee worships the deity**\n2. mantram japāmi → **I chant a mantra**\n3. śivaḥ rakṣati → **Śiva protects**\n4. dīpam jvālayāmi → **I light a lamp**\n5. gāyāmi stotram → **I sing a hymn**\n\n**B3.**\n1. namāmi → **namati**\n2. gacchāmi → **gacchati**\n3. dadāmi → **dadāti**\n4. paśyāmi → **paśyati**\n5. karomi → **karoti**\n\n---\n\n## Section C: Sentence Building\n\n**C1.**\n1. aham devam **pūjayāmi**\n2. bhaktaḥ mandiram **gacchati**\n3. tvam mantram **japasi**\n4. devī bhaktam **rakṣati**\n5. vayam stotram **gāyāmaḥ**\n\n**C2.** Sample answers:\n1. **prātaḥ uttiṣṭhāmi** (I rise in the morning)\n2. **snānam karomi** (I bathe)\n3. **mandiram gacchāmi** (I go to the temple)\n4. **dīpam jvālayāmi** (I light a lamp)\n5. **puṣpam arpayāmi** (I offer a flower)\n\nAccept any 5 grammatically correct sentences with different verbs.\n\n---\n\n## Section D: Negation & Questions\n\n**D1.**\n1. jānāmi → **na jānāmi** (I do not know)\n2. paśyāmi → **na paśyāmi** (I do not see)\n3. tyajāmi → **na tyajāmi** (I do not abandon)\n\n**D2.**\n1. na tyajāmi devam → **I do not abandon the deity**\n2. kiṃ paśyasi? → **What do you see?**\n\n---\n\n## Section E: Milestone\n\nSample answer:\n1. **prātaḥ uttiṣṭhāmi** (In the morning I rise)\n2. **snānam karomi** (I bathe)\n3. **mandiram gacchāmi** (I go to the temple)\n4. **devam paśyāmi** (I see the deity)\n5. **puṣpam arpayāmi** (I offer a flower)\n6. **mantram japāmi** (I chant a mantra)\n7. **stotram gāyāmi** (I sing a hymn)\n8. **devam namāmi** (I bow to the deity)\n\nAward marks for: correct verb forms (4), correct objects in dvitīyā (3), use of 8+ different verbs (3).\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 6 Badge: Kriyāvit\n\n**Title:** Verb Builder\n**Badge:** 🏅 Kriyāvit\n\n## Requirements\n\n1. Conjugate 3 dhātus in laṭ lakāra (all 9 parasmaipada forms)\n2. Conjugate 1 dhātu in lṛṭ lakāra\n3. Write 5 sentences describing your own worship using correct verb forms\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 7 content and grants the **Kriyāvit** role on Discord.\n"}, "tabs": ["bricks", "theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "07-karaka", "number": 7, "title": "Karaka", "subtitle": "Semantic Relations", "files": {"theory": "# Stage 7: Kāraka — Semantic Relations\n\n## Goal\nUnderstand the kāraka system — the deep semantic roles that map to vibhaktis — and build complete devotional sentences with multiple participants.\n\n## What is Kāraka?\n\n**Kāraka** (कारक) means \"that which causes action.\" It is the Pāṇinian system for describing the semantic roles that nouns play in relation to a verb. While vibhakti is the surface form (ending), kāraka is the underlying meaning.\n\n## The Six Kārakas\n\n| Kāraka | Meaning | Typical Vibhakti | Example |\n|--------|---------|------------------|---------|\n| **Kartā** | Agent/doer | Prathamā (1st) | **bhaktaḥ** pūjayati (the devotee worships) |\n| **Karma** | Object/patient | Dvitīyā (2nd) | bhaktaḥ **devam** pūjayati (worships the deity) |\n| **Karaṇa** | Instrument/means | Tṛtīyā (3rd) | **puṣpeṇa** pūjayati (worships with a flower) |\n| **Sampradāna** | Recipient/purpose | Caturthī (4th) | **śivāya** namaḥ (salutation to Śiva) |\n| **Apādāna** | Source/origin | Pañcamī (5th) | **parvātat** nadī patati (river falls from mountain) |\n| **Adhikaraṇa** | Location/locus | Saptamī (7th) | **mandire** pūjā (worship in the temple) |\n\nNote: Ṣaṣṭhī (genitive, \"of\") is NOT a kāraka — it expresses sambandha (relation) rather than participation in the action.\n\n## Kāraka in Devotional Sentences\n\n### Full Sentence Analysis\n\n**bhaktaḥ bhaktyā mandire śivāya puṣpam dadāti**\n(The devotee gives a flower to Śiva in the temple with devotion)\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| bhaktaḥ | 1st | Kartā | agent — who gives |\n| bhaktyā | 3rd | Karaṇa | instrument — by what means |\n| mandire | 7th | Adhikaraṇa | location — where |\n| śivāya | 4th | Sampradāna | recipient — to whom |\n| puṣpam | 2nd | Karma | object — what is given |\n| dadāti | verb | — | action — gives |\n\n## Building Complex Devotional Sentences\n\n### Pattern 1: Kartā + Karma + Kriyā (Subject + Object + Verb)\n> bhaktaḥ devam namati — The devotee bows to the deity\n\n### Pattern 2: + Karaṇa (adding instrument)\n> bhaktaḥ puṣpeṇa devam pūjayati — The devotee worships the deity with a flower\n\n### Pattern 3: + Sampradāna (adding recipient)\n> bhaktaḥ śivāya puṣpam dadāti — The devotee gives a flower to Śiva\n\n### Pattern 4: + Adhikaraṇa (adding location)\n> bhaktaḥ mandire śivāya puṣpam dadāti — The devotee gives a flower to Śiva in the temple\n\n### Pattern 5: + Karaṇa (adding manner)\n> bhaktaḥ bhaktyā mandire śivāya puṣpam dadāti — with devotion, in the temple, to Śiva, a flower, the devotee gives\n\n## The Pūjā Grammar Game\n\nExpress each step of pūjā as a full kāraka sentence:\n\n1. **āvāhanam**: bhaktaḥ bhaktyā devam āvāhayati\n   (The devotee invokes the deity with devotion)\n\n2. **āsanam**: bhaktaḥ devāya āsanam arpayati\n   (The devotee offers a seat to the deity)\n\n3. **puṣpam**: bhaktaḥ devāya sundaram puṣpam dadāti\n   (The devotee gives a beautiful flower to the deity)\n\n4. **dhūpam**: bhaktaḥ dhūpena devam arcati\n   (The devotee worships the deity with incense)\n\n5. **naivedyam**: bhaktaḥ devāya naivedyam nivedayati\n   (The devotee presents food to the deity)\n\n## Tṛtīyā as Bhāva (Manner)\n\nThe instrumental case often expresses the emotional manner of worship:\n\n| Expression | Meaning |\n|-----------|---------|\n| bhaktyā | with devotion |\n| premaṇā | with love |\n| śraddhayā | with faith |\n| ānandena | with joy |\n| namratayā | with humility |\n\n> bhaktyā śivāya puṣpam dadāmi\n> (With devotion I give a flower to Śiva)\n\n## Word Order Freedom\n\nBecause kāraka relations are marked by endings, word order is flexible:\n- śivāya puṣpam dadāmi\n- puṣpam śivāya dadāmi\n- dadāmi śivāya puṣpam\n- puṣpam dadāmi śivāya\n\nAll mean the same thing. Choose the order that emphasizes what matters most (what comes first gets emphasis, what comes just before the verb gets focus).\n\n## Milestone Check\n\nCan you build 5 complete devotional sentences, each with at least 3 kārakas?\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Case-connector bricks | kartā→prathamā, karma→dvitīyā, karaṇa→tṛtīyā, sampradāna→caturthī, apādāna→pañcamī, adhikaraṇa→saptamī | Noun-bricks from Stages 1–2 (vibhakti endings) and verb-bricks; kārakas are the semantic glue that tells you *why* a noun has a particular ending |\n\n**Try snapping**: Take a verb-brick like \"dadāti\" and snap on as many case-connector bricks as you can — kartā (who gives?), karma (what?), sampradāna (to whom?), karaṇa (with what?), adhikaraṇa (where?) — building a full pūjā scene from one action.\n", "reference": "# Stage 7: Kāraka — Reference Guide\n\n## Kāraka-Vibhakti Mapping\n\n| Kāraka | Meaning | Vibhakti | Marker (M -a) | Question |\n|--------|---------|----------|---------------|----------|\n| Kartā | Agent | 1st (prathamā) | -aḥ | Who does? |\n| Karma | Object | 2nd (dvitīyā) | -am | What is done? |\n| Karaṇa | Instrument | 3rd (tṛtīyā) | -ena | By what means? |\n| Sampradāna | Recipient | 4th (caturthī) | -āya | For whom? |\n| Apādāna | Source | 5th (pañcamī) | -āt | From where? |\n| Adhikaraṇa | Location | 7th (saptamī) | -e | Where? |\n| (Sambandha) | Relation | 6th (ṣaṣṭhī) | -asya | Whose? |\n\n## Sentence Building Template\n\n```\n[Kartā/1st] + [Karaṇa/3rd] + [Adhikaraṇa/7th] + [Sampradāna/4th] + [Karma/2nd] + [Kriyā/verb]\n```\n\nExample:\n```\nbhaktaḥ    bhaktyā    mandire    śivāya    puṣpam    dadāti\nkartā      karaṇa     adhikaraṇa sampradāna karma     kriyā\n```\n\n## Common Karaṇa (Instrument) Words\n\n| Sanskrit | Vibhakti 3 | Meaning |\n|----------|-----------|---------|\n| bhakti | bhaktyā | with devotion |\n| śraddhā | śraddhayā | with faith |\n| prema | premaṇā / premṇā | with love |\n| ānanda | ānandena | with joy |\n| puṣpa | puṣpeṇa | with a flower |\n| dhūpa | dhūpena | with incense |\n| mantra | mantreṇa | with a mantra |\n| jala | jalena | with water |\n| candana | candanena | with sandalwood |\n\n## Common Sampradāna (Recipient) Words\n\n| Sanskrit | Vibhakti 4 | Meaning |\n|----------|-----------|---------|\n| śiva | śivāya | to/for Śiva |\n| viṣṇu | viṣṇave | to/for Viṣṇu |\n| devī | devyai | to/for the goddess |\n| gaṇeśa | gaṇeśāya | to/for Gaṇeśa |\n| guru | gurave | to/for the guru |\n| bhakta | bhaktāya | to/for the devotee |\n\n## Common Adhikaraṇa (Location) Words\n\n| Sanskrit | Vibhakti 7 | Meaning |\n|----------|-----------|---------|\n| mandira | mandire | in the temple |\n| hṛdaya | hṛdaye | in the heart |\n| padma | padme | on the lotus |\n| gṛha | gṛhe | in the house |\n| vana | vane | in the forest |\n| nadī | nadyām | in the river |\n| parvata | parvate | on the mountain |\n\n## Pūjā Kāraka Sentences — Complete Set\n\n| Step | Full Sentence | Analysis |\n|------|--------------|----------|\n| Āvāhana | bhaktaḥ bhaktyā devam āvāhayati | K1+K3+K2+V |\n| Āsana | bhaktaḥ devāya āsanam arpayati | K1+K4+K2+V |\n| Pādya | bhaktaḥ jalena devasya pādau prakṣālayati | K1+K3+K6+K2+V |\n| Gandha | bhaktaḥ devāya candanam arpayati | K1+K4+K2+V |\n| Puṣpa | bhaktaḥ devāya puṣpam dadāti | K1+K4+K2+V |\n| Dhūpa | bhaktaḥ dhūpena devam arcati | K1+K3+K2+V |\n| Dīpa | bhaktaḥ dīpena devam arcati | K1+K3+K2+V |\n| Naivedya | bhaktaḥ devāya naivedyam nivedayati | K1+K4+K2+V |\n| Pradakṣiṇā | bhaktaḥ bhaktyā devam pradakṣiṇam karoti | K1+K3+K2+V |\n| Namaskāra | bhaktaḥ devam namati | K1+K2+V |\n\n## Kāraka Analysis Shorthand\n\nUse these codes for quick analysis:\n- K1 = Kartā (agent)\n- K2 = Karma (object)\n- K3 = Karaṇa (instrument)\n- K4 = Sampradāna (recipient)\n- K5 = Apādāna (source)\n- K7 = Adhikaraṇa (location)\n- V = Kriyā (verb)\n- S6 = Sambandha (genitive relation)\n", "workbook-questions": "# Stage 7: Kāraka — Workbook (Questions)\n\n## Section A: Kāraka Identification (15 marks)\n\n**A1.** Identify the kāraka of each underlined word (5 marks):\n1. **bhaktaḥ** devam pūjayati\n2. bhaktaḥ **devam** pūjayati\n3. bhaktaḥ **puṣpeṇa** devam pūjayati\n4. bhaktaḥ **śivāya** namaḥ karoti\n5. bhaktaḥ **mandire** pūjayati\n\n**A2.** For each kāraka, give the typical vibhakti it maps to (6 marks):\n1. Kartā → ___\n2. Karma → ___\n3. Karaṇa → ___\n4. Sampradāna → ___\n5. Apādāna → ___\n6. Adhikaraṇa → ___\n\n**A3.** Which of the 8 vibhaktis is NOT a kāraka? What does it express instead? (4 marks)\n\n---\n\n## Section B: Sentence Analysis (15 marks)\n\n**B1.** Analyze each word in the following sentence (label kāraka and vibhakti) (5 marks):\n\n> bhaktaḥ bhaktyā mandire devāya puṣpam arpayati\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| bhaktaḥ | | | |\n| bhaktyā | | | |\n| mandire | | | |\n| devāya | | | |\n| puṣpam | | | |\n\n**B2.** Analyze this sentence (5 marks):\n\n> sītā śraddhayā gṛhe rāmāya dīpam jvālayati\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| sītā | | | |\n| śraddhayā | | | |\n| gṛhe | | | |\n| rāmāya | | | |\n| dīpam | | | |\n\n**B3.** Analyze this sentence (5 marks):\n\n> guruḥ ānandena āśrame śiṣyāya jñānam dadāti\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| guruḥ | | | |\n| ānandena | | | |\n| āśrame | | | |\n| śiṣyāya | | | |\n| jñānam | | | |\n\n---\n\n## Section C: Sentence Building (20 marks)\n\n**C1.** Build a sentence using these kārakas (5 marks):\n- Kartā: bhaktaḥ\n- Karma: stotram\n- Karaṇa: bhaktyā\n- Adhikaraṇa: mandire\n- Verb: gāyati\nSentence: ___\n\n**C2.** Build a sentence using these elements (5 marks):\n- Kartā: devī\n- Karma: bhaktam\n- Karaṇa: kṛpayā\n- Apādāna: duḥkhāt\n- Verb: rakṣati\nSentence: ___\n\n**C3.** Write 5 complete pūjā sentences, each using at least 3 kārakas. Label the kārakas (10 marks):\n\n1. Sentence: ___\n   Kārakas: ___\n\n2. Sentence: ___\n   Kārakas: ___\n\n3. Sentence: ___\n   Kārakas: ___\n\n4. Sentence: ___\n   Kārakas: ___\n\n5. Sentence: ___\n   Kārakas: ___\n\n---\n\n## Section D: Word Order (10 marks)\n\n**D1.** Rearrange each sentence to emphasize the word in brackets (5 marks):\n1. bhaktaḥ puṣpam devāya dadāti [emphasize: puṣpam]\n2. śivaḥ bhaktam rakṣati [emphasize: śivaḥ]\n3. mandire bhaktaḥ dhyāyati [emphasize: mandire]\n\n**D2.** Do all three arrangements below mean the same thing? Explain (5 marks):\n1. śivāya puṣpam dadāmi\n2. puṣpam dadāmi śivāya\n3. dadāmi śivāya puṣpam\n\n---\n\n---\n\n## Section E: Composition (Rachanā)\n\nUsing everything learned through Stage 7, compose the following:\n\nWrite 3 sentences about a pūjā scene using at least 4 different kārakas each. Example structure: [Who] [does what] [to whom] [with what] [where] [for what purpose].\n\n1. Sentence: ___\n   Label each kāraka: kartā = ___, karma = ___, karaṇa = ___, sampradāna = ___, adhikaraṇa = ___\n\n2. Sentence: ___\n   Label each kāraka: kartā = ___, karma = ___, karaṇa = ___, sampradāna = ___, adhikaraṇa = ___\n\n3. Sentence: ___\n   Label each kāraka: kartā = ___, karma = ___, karaṇa = ___, sampradāna = ___, adhikaraṇa = ___\n\nRemember to apply sandhi rules from Stage 3 at word boundaries. Use adjective agreement from Stage 4 when describing the nouns (e.g., \"sundaram puṣpam,\" \"śuddham jalam\"). Incorporate number forms from Stage 5 if offering multiple items (e.g., \"pañca puṣpāṇi\"). Use vibhakti endings from Stage 6 correctly for each kāraka role.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 7: Kāraka — Workbook (Answers)\n\n## Section A\n\n**A1.**\n1. bhaktaḥ → **Kartā** (agent)\n2. devam → **Karma** (object)\n3. puṣpeṇa → **Karaṇa** (instrument)\n4. śivāya → **Sampradāna** (recipient)\n5. mandire → **Adhikaraṇa** (location)\n\n**A2.**\n1. Kartā → **Prathamā (1st)**\n2. Karma → **Dvitīyā (2nd)**\n3. Karaṇa → **Tṛtīyā (3rd)**\n4. Sampradāna → **Caturthī (4th)**\n5. Apādāna → **Pañcamī (5th)**\n6. Adhikaraṇa → **Saptamī (7th)**\n\n**A3.** **Ṣaṣṭhī (6th / genitive)** is not a kāraka. It expresses **sambandha** (relation/possession), e.g., \"śivasya mandiraṃ\" (Śiva's temple). It does not describe a participant in the action.\n\n---\n\n## Section B\n\n**B1.**\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| bhaktaḥ | 1st | Kartā | agent — who offers |\n| bhaktyā | 3rd | Karaṇa | instrument — with devotion |\n| mandire | 7th | Adhikaraṇa | location — in the temple |\n| devāya | 4th | Sampradāna | recipient — to the deity |\n| puṣpam | 2nd | Karma | object — what is offered |\n\n**B2.**\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| sītā | 1st | Kartā | agent — Sītā |\n| śraddhayā | 3rd | Karaṇa | instrument — with faith |\n| gṛhe | 7th | Adhikaraṇa | location — in the house |\n| rāmāya | 4th | Sampradāna | recipient — for Rāma |\n| dīpam | 2nd | Karma | object — a lamp |\n\n**B3.**\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| guruḥ | 1st | Kartā | agent — the guru |\n| ānandena | 3rd | Karaṇa | instrument — with joy |\n| āśrame | 7th | Adhikaraṇa | location — in the āśrama |\n| śiṣyāya | 4th | Sampradāna | recipient — to the student |\n| jñānam | 2nd | Karma | object — knowledge |\n\n---\n\n## Section C\n\n**C1.** **bhaktaḥ bhaktyā mandire stotram gāyati**\n(The devotee sings a hymn with devotion in the temple)\n\n**C2.** **devī kṛpayā bhaktam duḥkhāt rakṣati**\n(The goddess protects the devotee from suffering with grace)\n\n**C3.** Sample answers:\n\n1. **bhaktaḥ bhaktyā mandire devam namati**\n   K1=bhaktaḥ, K3=bhaktyā, K7=mandire, K2=devam\n\n2. **bālaḥ premaṇā devāya puṣpam arpayati**\n   K1=bālaḥ, K3=premaṇā, K4=devāya, K2=puṣpam\n\n3. **yogī hṛdaye śivam dhyāyati**\n   K1=yogī, K7=hṛdaye, K2=śivam\n\n4. **mātā śraddhayā gṛhe dīpam jvālayati**\n   K1=mātā, K3=śraddhayā, K7=gṛhe, K2=dīpam\n\n5. **guruḥ āśrame śiṣyāya mantram dadāti**\n   K1=guruḥ, K7=āśrame, K4=śiṣyāya, K2=mantram\n\n---\n\n## Section D\n\n**D1.**\n1. Emphasize puṣpam: **puṣpam bhaktaḥ devāya dadāti**\n2. Emphasize śivaḥ: **śivaḥ bhaktam rakṣati** (already first — correct)\n3. Emphasize mandire: **mandire bhaktaḥ dhyāyati** (already first — correct)\n\n**D2.** **Yes**, all three mean the same thing: \"I give a flower to Śiva.\" Because kāraka relations are encoded in the vibhakti endings (-āya = dative, puṣpam = accusative), the meaning is preserved regardless of word order. The difference is emphasis: the first position carries topical emphasis, and the pre-verbal position carries focus.\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 7 Badge: Kārakavit\n\n**Title:** Sentence Architect\n**Badge:** 🏅 Kārakavit\n\n## Requirements\n\n1. Construct 5 complete sentences, each using a different kāraka as the focus\n2. Label all kārakas in a given 3-line Sanskrit passage\n3. Rearrange one sentence 3 ways showing free word order\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 8 content and grants the **Kārakavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "08-sambodhana", "number": 8, "title": "Sambodhana", "subtitle": "Direct Address", "files": {"theory": "# Stage 8: Sambodhana — Direct Address\n\n## Goal\nLearn to speak directly to the deity — vocative case, imperatives, and spontaneous prayer. Move from talking *about* the divine to talking *to* the divine.\n\n## What is Sambodhana?\n\n**Sambodhana** (सम्बोधन) is the vocative case — the form used when calling or addressing someone directly. It is the grammar of prayer, invocation, and intimate conversation with the divine.\n\n## Vocative Forms\n\n### Masculine -a stems\n- devaḥ → **he deva!** (O god!)\n- śivaḥ → **he śiva!** (O Śiva!)\n- rāmaḥ → **he rāma!** (O Rāma!)\n\nRule: Drop the -aḥ visarga, keep the -a. Prefix with **he** (हे).\n\n### Feminine -ā stems\n- durgā → **he durge!** (O Durgā!)\n- gaṅgā → **he gaṅge!** (O Gaṅgā!)\n- mālā → **he māle!**\n\nRule: -ā becomes -e.\n\n### Feminine -ī stems\n- devī → **he devi!** (O Goddess!)\n- lakṣmī → **he lakṣmi!**\n- pārvatī → **he pārvati!**\n\nRule: Long -ī shortens to -i.\n\n### Masculine -u stems\n- viṣṇuḥ → **he viṣṇo!** (O Viṣṇu!)\n- guruḥ → **he guro!**\n\nRule: -uḥ becomes -o.\n\n### Masculine -i stems\n- agniḥ → **he agne!** (O Fire!)\n- muniḥ → **he mune!**\n\nRule: -iḥ becomes -e.\n\n## Imperatives (Loṭ-lakāra)\n\nWhen addressing the deity, we use imperative verb forms:\n\n### 2nd Person (requesting the deity to act)\n| Verb | Imperative (2P sg) | Meaning |\n|------|-------------------|---------|\n| pā (protect) | **pāhi** | protect! |\n| rakṣ (protect) | **rakṣa** | protect! |\n| dā (give) | **dehi** | give! |\n| kṛ (do/make) | **kuru** | do/make! |\n| pra-sad (be gracious) | **prasīda** | be gracious! |\n| kṣam (forgive) | **kṣamasva** | forgive! |\n| nī (lead) | **naya** | lead! |\n| śru (hear) | **śṛṇu** | hear/listen! |\n| ā-gam (come) | **āgaccha** | come! |\n| darśay (show) | **darśaya** | show! |\n\n### 3rd Person (benedictive — \"let X happen\")\n| Form | Meaning |\n|------|---------|\n| pātu | let [deity] protect |\n| rakṣatu | let [deity] protect |\n| bhavatu | let it be |\n| jayatu | let [deity] be victorious |\n| nayatu | let [deity] lead |\n\n## Building Spontaneous Prayers\n\n### Structure 1: Address + Imperative\n> he śiva! prasīda! — O Śiva, be gracious!\n> he devi! rakṣa mām! — O Goddess, protect me!\n> he kṛṣṇa! pāhi mām! — O Kṛṣṇa, save me!\n\n### Structure 2: Address + Imperative + Object\n> he rāma! dehi me bhaktim — O Rāma, give me devotion!\n> he devi! dehi me jñānam — O Goddess, give me knowledge!\n> he guru! naya mām — O Guru, lead me!\n\n### Structure 3: Address + Description + Imperative\n> he karuṇāmaya śiva! prasīda! — O compassionate Śiva, be gracious!\n> he jagadambike! rakṣa mām! — O Mother of the world, protect me!\n\n### Structure 4: Multiple Requests\n> he devi! pāhi mām, rakṣa mām, naya mām!\n> O Goddess, save me, protect me, lead me!\n\n## Key Pronoun: mām (me)\n\nWhen praying, you often need \"me\" — this is **mām** (माम्), the accusative of aham:\n\n| Case | Form | Meaning |\n|------|------|---------|\n| Nominative | aham | I |\n| Accusative | mām | me (object) |\n| Instrumental | mayā | by me |\n| Dative | mahyam / me | to/for me |\n| Genitive | mama / me | my, of me |\n| Locative | mayi | in me |\n\n## The Particle \"namaḥ\"\n\n**namaḥ** takes the dative (caturthī), not the vocative:\n- śivāya namaḥ (salutation TO Śiva) — correct\n- he śiva! namaḥ — mixing vocative address with namaḥ (also used)\n\n## Classical Prayer Phrases\n\n| Sanskrit | Meaning |\n|----------|---------|\n| he śiva prasīda | O Śiva, be gracious |\n| he devi rakṣa mām | O Goddess, protect me |\n| tvaṃ eva mātā ca pitā tvaṃ eva | You alone are mother and father |\n| tvaṃ eva sarvaṃ mama deva deva | You alone are everything, O God of gods |\n| śaraṇam prapadye | I take refuge |\n| tvām eva śaraṇam | You alone are refuge |\n| kṛpāṃ kuru | show mercy |\n| bhayāt trāhi | save from fear |\n\n## Milestone Check\n\nCan you compose a spontaneous 4-line prayer to your iṣṭadevatā using vocative + imperatives?\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Vocative brick | he rāma!, he devi!, he śiva!, he guro!, he agne! | Any sentence — this brick \"addresses\" the listener directly; snaps onto imperative verbs (pāhi, dehi, rakṣa) and kāraka sentences from Stage 7 to turn statements into prayers |\n\n**Try snapping**: Take a full kāraka sentence from Stage 7 (e.g., \"bhaktaḥ bhaktyā mandire devāya puṣpam dadāti\"), replace the third-person kartā with \"aham,\" swap the verb to first person, and snap a vocative brick onto the front — now it is a direct prayer instead of a description.\n", "reference": "# Stage 8: Sambodhana — Reference Guide\n\n## Vocative Formation Rules\n\n| Stem Type | Nominative | Vocative | Rule |\n|-----------|-----------|----------|------|\n| M -a | devaḥ | he deva! | drop visarga |\n| F -ā | durgā | he durge! | -ā → -e |\n| F -ī | devī | he devi! | -ī → -i |\n| M -u | guruḥ | he guro! | -uḥ → -o |\n| M -i | agniḥ | he agne! | -iḥ → -e |\n| M -an | rājan | he rājan! | unchanged |\n| M -at | bhagavat | he bhagavan! | -at → -an |\n\n## Deity Vocative Forms\n\n| Deity | Nominative | Vocative |\n|-------|-----------|----------|\n| Śiva | śivaḥ | he śiva! |\n| Viṣṇu | viṣṇuḥ | he viṣṇo! |\n| Kṛṣṇa | kṛṣṇaḥ | he kṛṣṇa! |\n| Rāma | rāmaḥ | he rāma! |\n| Gaṇeśa | gaṇeśaḥ | he gaṇeśa! |\n| Devī | devī | he devi! |\n| Durgā | durgā | he durge! |\n| Lakṣmī | lakṣmī | he lakṣmi! |\n| Sarasvatī | sarasvatī | he sarasvati! |\n| Pārvatī | pārvatī | he pārvati! |\n| Ambā | ambā | he ambe! |\n| Bhagavān | bhagavān | he bhagavan! |\n\n## Imperative Forms (Loṭ-lakāra)\n\n### 2nd Person Singular (commands/requests)\n\n| Root | Imperative | Meaning |\n|------|-----------|---------|\n| pā | pāhi | protect/save |\n| rakṣ | rakṣa | protect |\n| trā | trāhi | save/rescue |\n| dā | dehi | give |\n| kṛ | kuru | do/make |\n| nī | naya | lead |\n| gam | gaccha | go |\n| ā-gam | āgaccha | come |\n| śru | śṛṇu | hear/listen |\n| pra-sad | prasīda | be gracious |\n| kṣam | kṣamasva | forgive |\n| darśay | darśaya | show |\n| bhaj | bhaja | worship/adore |\n| jñā | jānīhi | know |\n| brū | brūhi | speak/tell |\n| tyaj | tyaja | abandon/release |\n\n### 3rd Person Singular (benedictive \"let...\")\n\n| Root | Imperative | Meaning |\n|------|-----------|---------|\n| pā | pātu | let [him/her] protect |\n| rakṣ | rakṣatu | let [him/her] protect |\n| bhū | bhavatu | let it be |\n| ji | jayatu | let [him/her] be victorious |\n| nī | nayatu | let [him/her] lead |\n| vas | vasatu | let [him/her] dwell |\n| kṛ | karotu | let [him/her] do |\n\n## Pronoun Quick Reference (aham = I)\n\n| Case | Form | Use in Prayer |\n|------|------|--------------|\n| 1st | aham | aham bhaktaḥ (I am a devotee) |\n| 2nd | mām | rakṣa mām (protect me) |\n| 3rd | mayā | mayā kṛtam (done by me) |\n| 4th | mahyam / me | dehi me (give to me) |\n| 5th | mat | mat sakāśāt (from me) |\n| 6th | mama / me | mama pāpam (my sin) |\n| 7th | mayi | mayi kṛpā kuru (show mercy to me) |\n\n## Prayer Building Blocks\n\n### Openings\n| Sanskrit | Meaning |\n|----------|---------|\n| he śiva! | O Śiva! |\n| he jagadīśvara! | O Lord of the world! |\n| he karuṇānidhe! | O treasury of compassion! |\n| he jagadamba! | O Mother of the world! |\n| he bhagavan! | O Lord! |\n\n### Requests\n| Sanskrit | Meaning |\n|----------|---------|\n| prasīda | be gracious |\n| pāhi mām | save me |\n| rakṣa mām | protect me |\n| dehi me bhaktim | give me devotion |\n| dehi me jñānam | give me knowledge |\n| naya mām | lead me |\n| kṛpāṃ kuru | show mercy |\n| kṣamasva | forgive |\n\n### Surrender Phrases\n| Sanskrit | Meaning |\n|----------|---------|\n| śaraṇam prapadye | I take refuge |\n| tvām prapadye | I surrender to you |\n| tavāsmi | I am yours |\n| tvayi sarvaṃ samarpayāmi | I offer everything to you |\n| tvam eva mama sarvasvaṃ | you alone are my everything |\n\n### Closings\n| Sanskrit | Meaning |\n|----------|---------|\n| namaḥ | salutation |\n| namo namaḥ | repeated salutation |\n| jayatu jayatu | victory, victory |\n| svāhā | offering (in fire) |\n| svasti | may there be well-being |\n", "workbook-questions": "# Stage 8: Sambodhana — Workbook (Questions)\n\n## Section A: Vocative Formation (10 marks)\n\n**A1.** Give the vocative (sambodhana) form (5 marks):\n1. śivaḥ → he ___!\n2. devī → he ___!\n3. durgā → he ___!\n4. viṣṇuḥ → he ___!\n5. agniḥ → he ___!\n\n**A2.** Give the vocative for these compound epithets (5 marks):\n1. mahādevaḥ → he ___!\n2. jagadambā → he ___!\n3. bhagavān → he ___!\n4. karuṇāmayī (devī) → he ___!\n5. sundarī (devī) → he ___!\n\n---\n\n## Section B: Imperatives (10 marks)\n\n**B1.** Give the 2nd person singular imperative (5 marks):\n1. pā (to protect) → ___\n2. dā (to give) → ___\n3. kṛ (to do) → ___\n4. pra-sad (to be gracious) → ___\n5. rakṣ (to protect) → ___\n\n**B2.** Give the 3rd person singular imperative (\"let him/her...\") (5 marks):\n1. pā → ___\n2. bhū (to be) → ___\n3. ji (to conquer) → ___\n4. rakṣ → ___\n5. nī (to lead) → ___\n\n---\n\n## Section C: Prayer Construction (20 marks)\n\n**C1.** Combine the vocative and imperative to form a prayer (5 marks):\n1. Śiva + protect me → ___\n2. Devī + be gracious → ___\n3. Kṛṣṇa + give me devotion → ___\n4. Rāma + lead me → ___\n5. Guru + forgive → ___\n\n**C2.** Translate into Sanskrit (5 marks):\n1. O Śiva, I bow to you!\n2. O Mother, protect me!\n3. O Lord, give me knowledge!\n4. O Goddess, be gracious!\n5. I take refuge in you.\n\n**C3.** Translate into English (5 marks):\n1. he devi! pāhi mām!\n2. he kṛṣṇa! dehi me premam\n3. he bhagavan! kṛpāṃ kuru\n4. he śiva! tvaṃ eva mama śaraṇam\n5. he rāma! prasīda, rakṣa mām\n\n**C4.** Compose a 4-line prayer to your iṣṭadevatā. Each line must contain a vocative and at least one imperative (5 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n\n---\n\n## Section D: Pronoun Usage (10 marks)\n\n**D1.** Fill in the correct form of \"aham\" (I/me/my) (5 marks):\n1. rakṣa ___ (protect me) [accusative]\n2. dehi ___ jñānam (give ___ knowledge) [dative]\n3. ___ pāpam kṣamasva (forgive ___ sin) [genitive]\n4. ___ bhaktaḥ asmi (I am a devotee) [nominative]\n5. ___ kṛpā kuru (show mercy on me) [locative]\n\n**D2.** Write a 3-line prayer using mām, mama, and mayi (5 marks):\n1. ___ (using mām)\n2. ___ (using mama)\n3. ___ (using mayi)\n\n---\n\n## Section E: Milestone — Spontaneous Prayer (10 marks)\n\nCompose an original prayer of at least 6 lines to any deity. Include:\n- Vocative address (at least 2 different forms)\n- At least 4 different imperatives\n- Use of mām / mama / me\n- One line of praise (adjective + noun)\n- One line of surrender\n\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n6. ___\n\n---\n\n---\n\n## Section F: Composition (Rachanā)\n\nUsing everything learned through Stage 8, compose the following:\n\nWrite a 4-line invocation addressing your iṣṭadevatā in the vocative, then describing their qualities, then making a request in the imperative.\n\n1. Line 1 — Vocative address with an epithet describing a quality: ___\n2. Line 2 — A description of the deity using adjective agreement (Stage 4) and at least one kāraka from Stage 7: ___\n3. Line 3 — A request using an imperative verb, with \"mām\" or \"me\" as object: ___\n4. Line 4 — A closing line of surrender or praise: ___\n\nRemember to apply sandhi rules from Stage 3 when vowels meet at word boundaries. Use correct vocative endings for masculine (-a→a), feminine (-ā→e, -ī→i), and other stems. Apply adjective-noun agreement from Stage 4 in your descriptive line. Use at least 2 different kāraka roles from Stage 7 across your lines.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 8: Sambodhana — Workbook (Answers)\n\n## Section A\n\n**A1.**\n1. śivaḥ → he **śiva**!\n2. devī → he **devi**!\n3. durgā → he **durge**!\n4. viṣṇuḥ → he **viṣṇo**!\n5. agniḥ → he **agne**!\n\n**A2.**\n1. mahādevaḥ → he **mahādeva**!\n2. jagadambā → he **jagadambe**!\n3. bhagavān → he **bhagavan**!\n4. karuṇāmayī → he **karuṇāmayi**!\n5. sundarī → he **sundari**!\n\n---\n\n## Section B\n\n**B1.**\n1. pā → **pāhi**\n2. dā → **dehi**\n3. kṛ → **kuru**\n4. pra-sad → **prasīda**\n5. rakṣ → **rakṣa**\n\n**B2.**\n1. pā → **pātu**\n2. bhū → **bhavatu**\n3. ji → **jayatu**\n4. rakṣ → **rakṣatu**\n5. nī → **nayatu**\n\n---\n\n## Section C\n\n**C1.**\n1. **he śiva! pāhi mām!** (or rakṣa mām)\n2. **he devi! prasīda!**\n3. **he kṛṣṇa! dehi me bhaktim!**\n4. **he rāma! naya mām!**\n5. **he guro! kṣamasva!**\n\n**C2.**\n1. **he śiva! tvām namāmi!** (or tubhyaṃ namaḥ)\n2. **he ambe! rakṣa mām!** (or he mātar!)\n3. **he bhagavan! dehi me jñānam!**\n4. **he devi! prasīda!**\n5. **tvāṃ śaraṇaṃ prapadye**\n\n**C3.**\n1. O Goddess, save me!\n2. O Kṛṣṇa, give me love\n3. O Lord, show mercy\n4. O Śiva, you alone are my refuge\n5. O Rāma, be gracious, protect me\n\n**C4.** Sample for Śiva:\n1. he śiva! he mahādeva! prasīda!\n2. he karuṇānidhe! pāhi mām!\n3. he nīlakaṇṭha! dehi me jñānam!\n4. he śambho! rakṣa mām sadā!\n\n---\n\n## Section D\n\n**D1.**\n1. rakṣa **mām**\n2. dehi **mahyam** (or **me**) jñānam\n3. **mama** pāpam kṣamasva\n4. **aham** bhaktaḥ asmi\n5. **mayi** kṛpāṃ kuru\n\n**D2.** Sample:\n1. he devi! rakṣa **mām** — O Goddess, protect me\n2. **mama** pāpam kṣamasva — forgive my sin\n3. **mayi** kṛpāṃ kuru — show mercy upon me\n\n---\n\n## Section E\n\nSample prayer to Devī:\n1. **he devi! he jagadambe! namāmi tvām** (O Goddess, O Mother of the world, I bow to you)\n2. **tvaṃ karuṇāmayī, tvaṃ sundarī** (You are full of compassion, you are beautiful)\n3. **pāhi mām he mātar!** (Save me, O Mother!)\n4. **dehi me bhaktim, dehi me jñānam** (Give me devotion, give me knowledge)\n5. **mama pāpam kṣamasva** (Forgive my sins)\n6. **tvām eva śaraṇaṃ prapadye** (To you alone I take refuge)\n\nAward marks for: vocative forms (2), imperative variety (3), pronoun usage (2), praise line (1), surrender line (1), overall coherence (1).\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 8 Badge: Sambodhanavit\n\n**Title:** Invoker\n**Badge:** 🏅 Sambodhanavit\n\n## Requirements\n\n1. Compose and recite a spontaneous 4-line prayer using vocative + imperatives\n2. Give sambodhana forms for 5 nouns across different baseplates\n\n## How to Demonstrate\n\n**Format:** Voice note + text\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 9 content and grants the **Sambodhanavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "09-dhatu", "number": 9, "title": "Dhatu", "subtitle": "Roots & Upasargas", "files": {"theory": "# Stage 9: Dhātu — Roots and Upasargas\n\n## Goal\nUnderstand verbal roots (dhātus) as the atomic units of Sanskrit meaning, and learn how upasargas (prefixes) transform them systematically. See the semantic architecture hidden inside sacred vocabulary.\n\n## What is a Dhātu?\n\nA **dhātu** (धातु) is a verbal root — the irreducible seed from which verbs, nouns, adjectives, and entire families of words grow. Pāṇini's Dhātupāṭha lists ~2000 roots. Mastering even 50 core roots unlocks thousands of words.\n\n## Core Dhātus for Devotional Sanskrit\n\n| Dhātu | Basic Meaning | Verb | Noun | Adjective |\n|-------|--------------|------|------|-----------|\n| √kṛ | to do/make | karoti | karma (action) | kṛta (done) |\n| √bhū | to be/become | bhavati | bhava (existence) | bhūta (being) |\n| √gam | to go | gacchati | gati (path) | gata (gone) |\n| √dā | to give | dadāti | dāna (gift) | datta (given) |\n| √dṛś | to see | paśyati | darśana (vision) | dṛṣṭa (seen) |\n| √jñā | to know | jānāti | jñāna (knowledge) | jñāta (known) |\n| √nam | to bow | namati | namas (bow) | nata (bowed) |\n| √bhaj | to serve | bhajati | bhakti (devotion) | bhakta (devoted) |\n| √śru | to hear | śṛṇoti | śruti (hearing) | śruta (heard) |\n| √vac | to speak | vakti | vāc (speech) | ukta (spoken) |\n| √man | to think | manyate | manas (mind) | mata (thought) |\n| √vid | to know | vetti | vidyā (knowledge) | vidita (known) |\n| √sthā | to stand | tiṣṭhati | sthāna (place) | sthita (standing) |\n| √pā | to protect | pāti | pāla (protector) | pālita (protected) |\n| √muc | to release | muñcati | mokṣa (liberation) | mukta (released) |\n| √yuj | to join | yunakti | yoga (union) | yukta (joined) |\n| √jan | to be born | jāyate | janma (birth) | jāta (born) |\n| √har | to take/seize | harati | hara (remover) | hṛta (taken) |\n| √pūj | to worship | pūjayati | pūjā (worship) | pūjita (worshipped) |\n| √stu | to praise | stauti | stuti (praise) | stuta (praised) |\n\n## Upasargas (Prefixes)\n\nSanskrit has 22 traditional upasargas that modify root meanings:\n\n| Upasarga | Core Meaning | Example with √gam |\n|----------|-------------|-------------------|\n| pra- | forth, forward | pragacchati (goes forth) |\n| parā- | away, back | parāgacchati (goes away) |\n| apa- | away, off | apagacchati (departs) |\n| sam- | together, fully | saṃgacchati (comes together) |\n| anu- | after, along | anugacchati (follows) |\n| ava- | down | avagacchati (understands) |\n| nis- | out, away | nirgacchati (goes out) |\n| dur- | bad, hard | durgama (hard to go) |\n| abhi- | toward | abhigacchati (approaches) |\n| adhi- | over, upon | adhigacchati (attains) |\n| su- | good, well | sugama (easy to go) |\n| ut- | up | udgacchati (rises) |\n| ati- | beyond | atigacchati (transcends) |\n| vi- | apart, special | vigacchati (separates) |\n| ā- | toward, back | āgacchati (comes) |\n| prati- | toward, against | pratigacchati (returns) |\n| pari- | around | parigacchati (goes around) |\n| upa- | near | upagacchati (approaches) |\n\n## The Mantra of Meanings: √grah as Example\n\n**√grah** (to seize/grasp):\n\n| Prefix + Root | Word | Meaning | Shift |\n|--------------|------|---------|-------|\n| grah | graha | planet (that seizes) | basic |\n| anu + grah | **anugraha** | grace, favor | \"seize after\" → bless |\n| ni + grah | **nigraha** | restraint, control | \"seize down\" → subdue |\n| sam + grah | **saṃgraha** | collection | \"seize together\" → gather |\n| pari + grah | **parigraha** | acceptance, embrace | \"seize around\" → surround |\n| vi + grah | **vigraha** | conflict, form | \"seize apart\" → separate |\n| upa + grah | **upagraha** | satellite, support | \"seize near\" → assist |\n| pra + grah | **pragraha** | rein, control | \"seize forward\" → guide |\n\nFrom one root, an entire philosophical vocabulary blooms.\n\n## Sacred Vocabulary Through Dhātu-Analysis\n\n### Divine Names as Root-Derivatives\n\n| Name | Dhātu | Meaning |\n|------|-------|---------|\n| Śiva | √śī (to lie) or auspicious | the auspicious one |\n| Viṣṇu | √viṣ (to pervade) | the all-pervading |\n| Brahman | √bṛh (to expand) | the vast, expansive |\n| Rudra | √rud (to cry/roar) | the howler |\n| Bhagavān | √bhaj (to share) | possessor of bhagas |\n| Īśvara | √īś (to rule) | the ruler |\n| Hara | √hṛ (to take) | the remover (of sin) |\n| Dhātā | √dhā (to place) | the placer, creator |\n| Vidhi | √dhā (to place) + vi | ordainer |\n| Kartā | √kṛ (to do) | the doer |\n\n### Bhakti Vocabulary from √bhaj\n\n| Word | Form | Meaning |\n|------|------|---------|\n| bhajati | verb | serves, adores |\n| bhakti | abstract noun | devotion |\n| bhakta | past participle | devoted; devotee |\n| bhajana | action noun | worship, singing |\n| bhāgavata | derivative | pertaining to Bhagavān |\n| bhāga | derivative | share, portion |\n\n## Kṛt-pratyayas (Root Suffixes)\n\nThese suffixes attach to dhātus to create new words:\n\n| Suffix | Creates | Example |\n|--------|---------|---------|\n| -ta / -na | past participle | kṛta (done), datta (given) |\n| -ti | abstract noun (F) | bhakti, śakti, mukti |\n| -ana | action noun (N) | darśana, smaraṇa |\n| -tṛ | agent noun | kartā (doer), dātā (giver) |\n| -ya | gerundive (\"to be X\") | pūjya (to be worshipped) |\n| -in | possessor | yogin (one who has yoga) |\n\n## Milestone Check\n\nGiven a word like \"anugraha,\" can you identify the root (√grah) and prefix (anu-), and explain how the meaning shifts? Can you see the semantic architecture in at least 10 sacred words?\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Root bricks | √kṛ (do), √bhū (be), √gam (go), √dā (give), √nam (bow), √bhaj (serve) | Everything — roots are the atomic meaning-units from which verbs, nouns, and adjectives all grow; every verb-brick you have used since Stage 1 is a root brick in disguise |\n| Prefix bricks (upasarga) | pra- (forth), ā- (toward), sam- (together), vi- (apart), anu- (after), upa- (near) | Snap onto root bricks to shift meaning: pra+√nam = praṇam (bow forth), ā+√gam = āgam (come toward), sam+√gam = saṃgam (come together) |\n\n**Try snapping**: Pick a single root brick like √hṛ (to take) and snap on four different prefix bricks — anu+hṛ (anugraha, grace), vi+hṛ (vihāra, sport), pra+hṛ (prahāra, strike), sam+hṛ (saṃhāra, destruction) — then use each derived word in a devotional sentence with kāraka connectors from Stage 7.\n", "reference": "# Stage 9: Dhātu — Reference Guide\n\n## 50 Core Dhātus\n\n| # | Dhātu | Meaning | Class | Present 3sg | Key Derivative |\n|---|-------|---------|-------|-------------|---------------|\n| 1 | √kṛ | do/make | 8U | karoti | karma, kṛta |\n| 2 | √bhū | be/become | 1P | bhavati | bhava, bhūta |\n| 3 | √as | be/exist | 2P | asti | sat, astitva |\n| 4 | √gam | go | 1P | gacchati | gati, gata |\n| 5 | √dā | give | 3P | dadāti | dāna, datta |\n| 6 | √dhā | place/hold | 3U | dadhāti | dhāman, hita |\n| 7 | √dṛś | see | 1P | paśyati | darśana, dṛṣṭa |\n| 8 | √śru | hear | 5P | śṛṇoti | śruti, śruta |\n| 9 | √jñā | know | 9U | jānāti | jñāna, jñāta |\n| 10 | √vid | know | 2P | vetti | vidyā, vidita |\n| 11 | √vac | speak | 2P | vakti | vāc, ukta |\n| 12 | √brū | say | 2U | bravīti | — |\n| 13 | √man | think | 4Ā | manyate | manas, mata |\n| 14 | √budh | know/wake | 1P | bodhati | bodha, buddha |\n| 15 | √nam | bow | 1P | namati | namas, nata |\n| 16 | √bhaj | serve/adore | 1U | bhajati | bhakti, bhakta |\n| 17 | √pūj | worship | 10U | pūjayati | pūjā, pūjita |\n| 18 | √stu | praise | 2U | stauti | stuti, stuta |\n| 19 | √sev | serve | 1Ā | sevate | sevā, sevita |\n| 20 | √yaj | sacrifice | 1U | yajati | yajña, iṣṭa |\n| 21 | √hu | pour (oblation) | 3P | juhoti | homa, huta |\n| 22 | √sthā | stand | 1P | tiṣṭhati | sthāna, sthita |\n| 23 | √nī | lead | 1U | nayati | nīti, nīta |\n| 24 | √pā | protect | 2P | pāti | pāla, pālita |\n| 25 | √rakṣ | protect | 1P | rakṣati | rakṣā, rakṣita |\n| 26 | √hṛ | take/seize | 1U | harati | haraṇa, hṛta |\n| 27 | √grah | grasp | 9U | gṛhṇāti | graha, gṛhīta |\n| 28 | √muc | release | 6P | muñcati | mokṣa, mukta |\n| 29 | √yuj | join | 7U | yunakti | yoga, yukta |\n| 30 | √jan | be born | 4Ā | jāyate | janma, jāta |\n| 31 | √mṛ | die | 6Ā | mriyate | mṛtyu, mṛta |\n| 32 | √ji | conquer | 1P | jayati | jaya, jita |\n| 33 | √vṛt | turn/exist | 1Ā | vartate | vṛtti, vṛtta |\n| 34 | √car | move/act | 1P | carati | carya, carita |\n| 35 | √pat | fall | 1P | patati | pāta, patita |\n| 36 | √kram | step | 1U | krāmati | krama |\n| 37 | √prach | ask | 6P | pṛcchati | praśna, pṛṣṭa |\n| 38 | √labh | obtain | 1Ā | labhate | lābha, labdha |\n| 39 | √tyaj | abandon | 1P | tyajati | tyāga, tyakta |\n| 40 | √smṛ | remember | 1P | smarati | smṛti, smṛta |\n| 41 | √dhyai | meditate | 1P | dhyāyati | dhyāna |\n| 42 | √jap | chant | 1P | japati | japa |\n| 43 | √gai | sing | 1P | gāyati | gāna, gīta |\n| 44 | √likh | write | 6P | likhati | lekha, likhita |\n| 45 | √paṭh | recite | 1P | paṭhati | pāṭha |\n| 46 | √vas | dwell | 1P | vasati | vāsa |\n| 47 | √īś | rule | 2Ā | īṣṭe | īśvara |\n| 48 | √śī | lie/sleep | 2Ā | śete | śayana |\n| 49 | √sad | sit | 1P | sīdati | sādana |\n| 50 | √kṣam | forgive | 1Ā | kṣamate | kṣamā |\n\n## 22 Upasargas\n\n| Upasarga | Meaning | Example | Result |\n|----------|---------|---------|--------|\n| pra- | forth | pra+nam | praṇāma (prostration) |\n| parā- | away | parā+ji | parājaya (defeat) |\n| apa- | away, off | apa+nī | apanaya (removal) |\n| sam- | together | sam+gam | saṃgama (confluence) |\n| anu- | after, along | anu+grah | anugraha (grace) |\n| ava- | down | ava+tṝ | avatāra (descent) |\n| nis/nir- | out | nir+gam | nirgama (exit) |\n| dur- | bad, hard | dur+gam | durgama (inaccessible) |\n| abhi- | toward | abhi+ṣic | abhiṣeka (consecration) |\n| adhi- | over, upon | adhi+ṣṭhā | adhiṣṭhāna (foundation) |\n| su- | good, well | su+gam | sugama (accessible) |\n| ut/ud- | up | ut+sṛj | utsarga (offering up) |\n| ati- | beyond | ati+kram | atikrama (transgression) |\n| vi- | apart, special | vi+jñā | vijñāna (discernment) |\n| ā- | toward | ā+gam | āgama (tradition) |\n| prati- | back, toward | prati+pad | pratipad (understanding) |\n| pari- | around | pari+kram | parikrama (circumambulation) |\n| upa- | near | upa+niṣad | upaniṣad (sitting near) |\n| ni- | down, in | ni+vas | nivāsa (dwelling) |\n\n## Kṛt-Pratyaya (Suffix) Table\n\n| Suffix | Function | Example |\n|--------|----------|---------|\n| -ta | past participle | √kṛ → kṛta (done) |\n| -ti | abstract F noun | √bhaj → bhakti |\n| -ana | action N noun | √darś → darśana |\n| -tṛ | agent | √kṛ → kartā (doer) |\n| -ya | \"to be X\" | √pūj → pūjya |\n| -in | \"having X\" | √yuj → yogin |\n| -man | instrument/result | √kṛ → karman |\n| -tra | instrument | √man → mantra |\n| -tva | abstract N noun | √deva → devatva |\n", "workbook-questions": "# Stage 9: Dhātu — Workbook (Questions)\n\n## Section A: Root Identification (15 marks)\n\n**A1.** Identify the dhātu (root) behind each word (5 marks):\n1. darśana → √___\n2. bhakti → √___\n3. mokṣa → √___\n4. jñāna → √___\n5. karma → √___\n\n**A2.** Identify the dhātu and the upasarga in each compound (5 marks):\n1. anugraha → upa: ___ + √___\n2. avatāra → upa: ___ + √___\n3. praṇāma → upa: ___ + √___\n4. saṃgama → upa: ___ + √___\n5. vijñāna → upa: ___ + √___\n\n**A3.** Give the present tense 3rd singular form for each dhātu (5 marks):\n1. √kṛ → ___\n2. √gam → ___\n3. √dṛś → ___\n4. √bhū → ___\n5. √jñā → ___\n\n---\n\n## Section B: Upasarga Transformation (15 marks)\n\n**B1.** Add the given upasarga to √gam and give the meaning (5 marks):\n1. ā + gam → ___ (meaning: ___)\n2. sam + gam → ___ (meaning: ___)\n3. upa + gam → ___ (meaning: ___)\n4. pra + gam → ___ (meaning: ___)\n5. ni + gam → ___ (meaning: ___)\n\n**B2.** Add the given upasarga to √kṛ and give the meaning (5 marks):\n1. sam + kṛ → ___ (meaning: ___)\n2. pra + kṛ → ___ (meaning: ___)\n3. vi + kṛ → ___ (meaning: ___)\n4. upa + kṛ → ___ (meaning: ___)\n5. anu + kṛ → ___ (meaning: ___)\n\n**B3.** For each pair, explain how the upasarga changes the root's meaning (5 marks):\n1. graha vs. anugraha\n2. gama vs. āgama\n3. krama vs. parikrama\n4. nāma vs. praṇāma\n5. jñāna vs. vijñāna\n\n---\n\n## Section C: Word Families (15 marks)\n\n**C1.** From √bhaj, give (5 marks):\n1. Present tense verb (3sg): ___\n2. Abstract noun (-ti): ___\n3. Past participle (-ta): ___\n4. Action noun (-ana): ___\n5. Agent noun: ___\n\n**C2.** From √dṛś, give (5 marks):\n1. Present tense verb (3sg): ___\n2. Abstract noun: ___\n3. Past participle: ___\n4. \"Worth seeing\" (-ya): ___\n5. Agent noun (\"seer\"): ___\n\n**C3.** Identify the divine name's root and explain the etymology (5 marks):\n1. Viṣṇu ← √___ (meaning: ___)\n2. Rudra ← √___ (meaning: ___)\n3. Īśvara ← √___ (meaning: ___)\n4. Hara ← √___ (meaning: ___)\n5. Bhagavān ← √___ (meaning: ___)\n\n---\n\n## Section D: Semantic Architecture (15 marks)\n\n**D1.** Take √hṛ (to take/seize) and show how 4 different upasargas create 4 different sacred concepts (8 marks):\n1. upa: ___ + √hṛ = ___ (meaning: ___)\n2. upa: ___ + √hṛ = ___ (meaning: ___)\n3. upa: ___ + √hṛ = ___ (meaning: ___)\n4. upa: ___ + √hṛ = ___ (meaning: ___)\n\n**D2.** Explain the connection between these words — what root do they share? (7 marks):\n1. yoga, yukta, yuj → √___ meaning: ___\n2. dāna, datta, dātā → √___ meaning: ___\n3. stuti, stuta, stauti → √___ meaning: ___\n\n---\n\n---\n\n## Section E: Composition (Rachanā)\n\nUsing everything learned through Stage 9, compose the following:\n\nTake 5 dhātus and show how adding different upasargas changes meaning. Then use each derived verb in a devotional sentence.\n\n1. √gam:\n   - upasarga + root = ___ (meaning: ___)\n   - Sentence: ___\n\n2. √kṛ:\n   - upasarga + root = ___ (meaning: ___)\n   - Sentence: ___\n\n3. √nam:\n   - upasarga + root = ___ (meaning: ___)\n   - Sentence: ___\n\n4. √hṛ:\n   - upasarga + root = ___ (meaning: ___)\n   - Sentence: ___\n\n5. √dā:\n   - upasarga + root = ___ (meaning: ___)\n   - Sentence: ___\n\nIn each sentence, remember to apply sandhi rules from Stage 3 at word junctions. Use adjective agreement from Stage 4 to describe nouns. Include at least 3 kārakas from Stage 7 per sentence (kartā, karma, karaṇa, etc.). Address the deity using vocative forms from Stage 8 in at least 2 of your sentences.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 9: Dhātu — Workbook (Answers)\n\n## Section A\n\n**A1.**\n1. darśana → **√dṛś** (to see)\n2. bhakti → **√bhaj** (to serve/adore)\n3. mokṣa → **√muc** (to release)\n4. jñāna → **√jñā** (to know)\n5. karma → **√kṛ** (to do)\n\n**A2.**\n1. anugraha → upa: **anu** + **√grah** (grace = \"seize after\" → bless)\n2. avatāra → upa: **ava** + **√tṝ** (descent = \"cross down\")\n3. praṇāma → upa: **pra** + **√nam** (prostration = \"bow forth\")\n4. saṃgama → upa: **sam** + **√gam** (confluence = \"go together\")\n5. vijñāna → upa: **vi** + **√jñā** (discernment = \"know apart/specially\")\n\n**A3.**\n1. √kṛ → **karoti**\n2. √gam → **gacchati**\n3. √dṛś → **paśyati**\n4. √bhū → **bhavati**\n5. √jñā → **jānāti**\n\n---\n\n## Section B\n\n**B1.**\n1. ā + gam → **āgama** (coming, tradition/scripture)\n2. sam + gam → **saṃgama** (confluence, meeting)\n3. upa + gam → **upagama** (approach)\n4. pra + gam → **pragama** (going forth, advance)\n5. ni + gam → **nigama** (conclusion, Veda)\n\n**B2.**\n1. sam + kṛ → **saṃskāra** / saṃskṛta (refinement, perfected)\n2. pra + kṛ → **prakṛti** (nature, primal matter)\n3. vi + kṛ → **vikāra** / vikṛti (transformation, distortion)\n4. upa + kṛ → **upakāra** (help, service)\n5. anu + kṛ → **anukāra** / anukṛti (imitation)\n\n**B3.**\n1. graha (seizing) vs. anugraha (grace) — **anu-** adds \"following/favoring,\" transforming seizure into blessing\n2. gama (going) vs. āgama (tradition) — **ā-** adds \"toward,\" what has come down to us = scripture\n3. krama (step) vs. parikrama (circumambulation) — **pari-** adds \"around,\" stepping around = sacred circling\n4. nāma (name/bow) vs. praṇāma (prostration) — **pra-** adds \"forth/fully,\" complete bowing\n5. jñāna (knowledge) vs. vijñāna (discernment) — **vi-** adds \"special/distinct,\" knowledge that discriminates\n\n---\n\n## Section C\n\n**C1.** From √bhaj:\n1. Present 3sg: **bhajati**\n2. Abstract noun: **bhakti** (devotion)\n3. Past participle: **bhakta** (devoted)\n4. Action noun: **bhajana** (worship/singing)\n5. Agent noun: **bhājaka** (one who serves) or bhakta as agent\n\n**C2.** From √dṛś:\n1. Present 3sg: **paśyati**\n2. Abstract noun: **darśana** (vision/philosophy)\n3. Past participle: **dṛṣṭa** (seen)\n4. \"Worth seeing\": **darśanīya** or **dṛśya**\n5. Agent noun: **draṣṭā** (seer)\n\n**C3.**\n1. Viṣṇu ← **√viṣ** (to pervade) — \"the all-pervading one\"\n2. Rudra ← **√rud** (to cry/roar) — \"the howler/roarer\"\n3. Īśvara ← **√īś** (to rule) — \"the ruler/lord\"\n4. Hara ← **√hṛ** (to take/remove) — \"the remover (of sin/sorrow)\"\n5. Bhagavān ← **√bhaj** (to share/serve) — \"possessor of bhagas (fortune, power, etc.)\"\n\n---\n\n## Section D\n\n**D1.** √hṛ with different upasargas:\n1. **ā** + √hṛ = **āhāra** (food — \"bringing toward\" → intake)\n2. **upa** + √hṛ = **upahāra** (offering — \"bringing near\" → gift)\n3. **sam** + √hṛ = **saṃhāra** (destruction — \"seizing together\" → dissolution)\n4. **pra** + √hṛ = **prahāra** (strike — \"seizing forth\" → blow)\n\n(Also accept: vi+hṛ = vihāra (sport/monastery); pari+hṛ = parihāra (avoidance))\n\n**D2.**\n1. yoga, yukta, yuj → **√yuj** — \"to join/yoke\"; yoga=union, yukta=joined, yuj=to join\n2. dāna, datta, dātā → **√dā** — \"to give\"; dāna=gift, datta=given, dātā=giver\n3. stuti, stuta, stauti → **√stu** — \"to praise\"; stuti=praise, stuta=praised, stauti=he praises\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 9 Badge: Dhātuvit\n\n**Title:** Root Seer\n**Badge:** 🏅 Dhātuvit\n\n## Requirements\n\n1. Given 5 Sanskrit words, identify the dhātu + upasarga + pratyaya\n2. From one dhātu (e.g., √gam), derive 5 different words using different prefixes\n3. Explain the dhātu behind 3 deity names\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 10 content and grants the **Dhātuvit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "10-paryaya", "number": 10, "title": "Paryaya", "subtitle": "Synonyms & Epithets", "files": {"theory": "# Stage 10: Paryāya — Synonyms\n\n## Goal\nMaster synonyms (paryāyas) for key devotional concepts. Understand how divine epithets are built from attributes, and learn to generate names from qualities — the skill behind aṣṭottaraśatanāma (108 names).\n\n## What is Paryāya?\n\n**Paryāya** (पर्याय) means \"synonym\" or \"alternative expression.\" Sanskrit is extraordinarily rich in synonyms because words are derived from roots: any quality or action associated with an entity can become its name.\n\n## Why Synonyms Matter\n\n1. **Poetic flexibility** — Different synonyms have different syllable counts and vowel patterns, critical for metrical composition\n2. **Depth of understanding** — Each synonym reveals a different facet of the deity\n3. **108 names tradition** — Aṣṭottaraśatanāmāvali are built from paryāyas\n4. **Avadhāna skill** — Rapid synonym recall is essential for spontaneous composition\n\n## Synonyms for Core Concepts\n\n### Names for Śiva (30+)\n\n| Name | Derivation | Meaning |\n|------|-----------|---------|\n| Śiva | √śī + va | the auspicious one |\n| Śambhu | śam + √bhū | source of happiness |\n| Śaṅkara | śam + √kṛ | maker of happiness |\n| Mahādeva | mahā + deva | the great god |\n| Maheśvara | mahā + īśvara | the great lord |\n| Rudra | √rud | the howler |\n| Hara | √hṛ | the remover |\n| Īśa | √īś | the ruler |\n| Īśāna | √īś | the ruling one |\n| Bhava | √bhū | existence itself |\n| Paśupati | paśu + pati | lord of beings |\n| Nīlakaṇṭha | nīla + kaṇṭha | blue-throated |\n| Gaṅgādhara | gaṅgā + √dhṛ | bearer of Gaṅgā |\n| Candraśekhara | candra + śekhara | moon-crested |\n| Trilocana | tri + locana | three-eyed |\n| Naṭarāja | naṭa + rāja | king of dance |\n| Tryambaka | tri + ambaka | three-eyed |\n| Bhairava | √bhī | the fearsome |\n| Vāmadeva | vāma + deva | the beautiful god |\n| Sadāśiva | sadā + śiva | eternally auspicious |\n\n### Names for the Goddess (Devī/Śakti)\n\n| Name | Meaning |\n|------|---------|\n| Devī | the goddess |\n| Ambā / Ambikā | mother |\n| Durgā | the invincible (dur + √gam) |\n| Pārvatī | daughter of the mountain |\n| Gaurī | the fair/golden one |\n| Lalitā | the playful one |\n| Kāmākṣī | she whose eyes are desire |\n| Mīnākṣī | fish-eyed |\n| Tripurasundarī | beauty of the three worlds |\n| Bhavānī | consort of Bhava |\n| Caṇḍikā | the fierce one |\n| Jagadambā | mother of the world |\n| Mahāmāyā | the great illusion |\n| Annapūrṇā | full of food |\n| Śāradā | Sarasvatī (of autumn) |\n\n### Synonyms for Key Concepts\n\n**Sun (Sūrya):** sūrya, āditya, bhāskara, divākara, savitṛ, arka, ravi, bhānu, mārtaṇḍa, mitra, prabhākara, dinamaṇi\n\n**Moon (Candra):** candra, śaśin, indu, soma, niśākara, sudhākara, himāṃśu, mṛgāṅka, kaumudīpati, vidhu\n\n**Lotus (Padma):** padma, kamala, aravinda, pankaja, sarasija, vārija, ambuja, nīraja, jalaja, rajīva, puṇḍarīka\n\n**Water (Jala):** jala, vāri, nīra, toya, ambu, pānīya, salila, uda, āpa, payas\n\n**Fire (Agni):** agni, vahni, anala, pāvaka, hutāśana, dahana, jvalana, kṛśānu, śikhin\n\n## How Epithets Are Built\n\n### From Physical Attributes\n- **nīla** (b
