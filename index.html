ges with the following vowel |\n| Kampa | Trembling | Enclitic svarita at word-boundaries — wavering pitch |\n| Praślișṭa | Merged | When svarita results from vowel-coalescence in sandhi |\n\n## KYV Notation Compared to Other Śākhās\n\n| Tradition | Udātta | Anudātta | Svarita |\n|-----------|--------|----------|---------|\n| **Kṛṣṇa Yajurveda** | Unmarked | Underline below | Vertical bar above |\n| **Ṛgveda** | Vertical bar above | Unmarked | Double bar / horizontal above |\n| **Śukla Yajurveda** | Similar to KYV | Similar | Similar |\n| **Sāmaveda** | Number system (1-7) for musical notes | — | — |\n\nNote: The Sāmaveda extends the three-svara system into a full musical scale — this is the bridge between Vedic recitation and Indian music (sāmagāna).\n\n## Saṃhitā, Pada, and Vikṛtis\n\n### Recitation Forms — Complete Table\n\n| Form | Pattern | Example (words: A B C D) | Redundancy |\n|------|---------|--------------------------|-----------|\n| **Mūla** (saṃhitā) | ABCD | Continuous, with sandhi | None |\n| **Pada** | A \\| B \\| C \\| D | Word-by-word, sandhi dissolved | None |\n| **Krama** | AB BC CD | Overlapping pairs | Each word appears 2× |\n| **Jaṭā** | AB BA AB, BC CB BC | Forward-back-forward per pair | Each word appears 6× |\n| **Śikhā** | AB BA AB+C | Jaṭā + next word appended | — |\n| **Rekhā** | AB BA AB, BC CB BC... | Like jaṭā, continuous | — |\n| **Dhvaja** | End-to-start patterns | Complex reverse | — |\n| **Daṇḍa** | Linear combinations | — | — |\n| **Ratha** | Chariot-wheel pattern | — | — |\n| **Ghana** | AB BA ABC CBA ABC | Triple weave | Each word appears 10×+ |\n\n### Building Krama from Saṃhitā\n\nSource: *namaḥ somāya ca rudrāya ca*\n\nWords: (1) namaḥ (2) somāya (3) ca (4) rudrāya (5) ca\n\n```\nKrama:\nnamaḥ somāya    (1-2)\nsomāya ca       (2-3)\nca rudrāya      (3-4)\nrudrāya ca      (4-5)\nca iti ca        (5-end marker)\n```\n\n### Building Jaṭā from Pada\n\n```\nJaṭā:\nnamaḥ somāya — somāya namaḥ — namaḥ somāya\nsomāya ca — ca somāya — somāya ca\nca rudrāya — rudrāya ca — ca rudrāya\nrudrāya ca — ca rudrāya — rudrāya ca\n```\n\n### Building Ghana from Pada\n\n```\nGhana:\nnamaḥ somāya — somāya namaḥ — namaḥ somāya ca — ca somāya namaḥ — namaḥ somāya ca\nsomāya ca — ca somāya — somāya ca rudrāya — rudrāya ca somāya — somāya ca rudrāya\nca rudrāya — rudrāya ca — ca rudrāya ca — ca rudrāya ca — ca rudrāya ca\n...\n```\n\nPattern formula: AB BA ABC CBA ABC (then shift by one word and repeat)\n\n## The Six Factors of Śikṣā\n\n| # | Factor | Sanskrit | Controls | Where Learned |\n|---|--------|----------|----------|---------------|\n| 1 | **Varṇa** | वर्ण | Which sound (identity) | Varṇa-Vidyā |\n| 2 | **Svara** | स्वर | Which pitch (accent) | This stage |\n| 3 | **Mātrā** | मात्रा | How long (duration) | Chandas I |\n| 4 | **Bala** | बल | How much force (prāṇa) | Practice |\n| 5 | **Sāma** | साम | How smooth (melody/flow) | Practice |\n| 6 | **Santāna** | सन्तान | How sounds connect (junction) | Sandhi rules |\n\n## Svara vs Chandas — Two Independent Dimensions\n\n| | Chandas (meter) | Svara (accent) |\n|---|---|---|\n| **Measures** | Syllable weight | Syllable pitch |\n| **Values** | Laghu / guru | Udātta / anudātta / svarita |\n| **Used in** | Classical + Vedic | Vedic only |\n| **Still active** | Yes (all poetry) | Only in Vedic recitation |\n| **Determines** | Meter pattern | Meaning / mantra direction |\n| **Independence** | A syllable can be laghu+udātta, guru+anudātta, etc. | |\n\n## Key Prātiśākhya Terms\n\n| Term | Meaning | Relevance |\n|------|---------|-----------|\n| **Saṃhitā** | \"Placed together\" — continuous text with sandhi | The recited form |\n| **Pada** | \"Word/foot\" — separated text without sandhi | The analytical form |\n| **Vikṛti** | \"Modification\" — rearranged recitation pattern | Jaṭā, ghana, etc. |\n| **Prakṛti** | \"Natural form\" — saṃhitā, pada, krama (the three \"natural\" forms) | Baseline recitations |\n| **Sthāna** | \"Place\" — point of articulation | From Varṇa-Vidyā |\n| **Prayatna** | \"Effort\" — manner of articulation | From Varṇa-Vidyā |\n| **Pluta** | \"Extended\" — 3-mātrā vowel (tripled duration) | Rare; used in calling |\n| **Kampa** | \"Trembling\" — wavering pitch at word-junctions | Enclitic svarita |\n| **Avagraha** | \"Separation\" — the mark showing elided \"a\" in sandhi | Written as ' (apostrophe) |\n\n## Source Texts for KYV Svara Study\n\n| Text | Content | Location |\n|------|---------|----------|\n| Taittirīya Prātiśākhya | Complete phonetic rules for KYV | ~/srividya/veda/yajurveda/pratisakhya/ |\n| Taittirīya Śikṣā (Svara Śikṣā) | Accent rules specifically | ~/srividya/veda/yajurveda/krishna/shiksha/ |\n| Svara Siddhānta Candrikā | Commentary on svara principles | ~/srividya/veda/yajurveda/krishna/shiksha/ |\n| Ghana Darpaṇam | Rules for constructing ghana-pāṭha | ~/srividya/veda/yajurveda/krishna/shiksha/ |\n| Jaṭā Darpaṇam | Rules for constructing jaṭā-pāṭha | ~/srividya/veda/yajurveda/krishna/shiksha/ |\n| Pāṇinīya Śikṣā | General Sanskrit phonetics | ~/srividya/veda/yajurveda/krishna/shiksha/ |\n", "workbook-questions": "# Svara-Vidyā — Workbook (Questions)\n\n## Section A: The Three Svaras (15 marks)\n\n**A1.** Define each of the three Vedic svaras and give the KYV notation for each (6 marks):\n1. Udātta\n2. Anudātta\n3. Svarita\n\n**A2.** A student says: \"Udātta means 'high,' so it must be the marked syllable.\" Why is this wrong in the KYV notation system? What is actually marked, and why? (4 marks)\n\n**A3.** Explain the Indraśatru example in your own words (5 marks):\n1. What did the priest intend to say?\n2. What did the wrong svara make him say?\n3. What happened as a result (according to the tradition)?\n4. What principle does this illustrate about svara?\n5. How is this different from mispronouncing a *letter* (varṇa)?\n\n---\n\n## Section B: Svara Rules (20 marks)\n\n**B1.** Apply the basic svara rules to the following words. Mark each syllable as U (udātta), A (anudātta), or S (svarita). The udātta syllable is given in bold (10 marks):\n\n1. **ag**nim — (agni, accusative — udātta on first syllable)\n2. na**maḥ** — (salutation — udātta on second syllable)\n3. **so**māya — (to Soma — udātta on first syllable)\n4. ru**drā**ya — (to Rudra — udātta on second syllable)\n5. tri**yam**bakam — (three-eyed one — udātta on second syllable)\n6. su**gan**dhim — (fragrant — udātta on second syllable)\n7. **puṣ**ṭi — (nourishment — udātta on first syllable)\n8. var**dha**nam — (increaser — udātta on second syllable)\n9. u**rvā**ru**ka**m — (cucumber — two udāttas? — mark as heard in Rudram)\n10. mṛ**tyor** — (from death — udātta on second syllable)\n\n**B2.** State the svara rule that applies in each situation (5 marks):\n1. A word has three syllables. Only the middle one is udātta. What are the other two?\n2. The syllable immediately after an udātta syllable becomes what?\n3. In a main clause, a finite verb's accent does what?\n4. In a compound word, which member typically loses its accent?\n5. What happens when two udātta syllables from different words would be adjacent in saṃhitā?\n\n**B3.** The Sāmaveda extends the three-svara system into a musical scale with seven notes. How does this connect the Vedic svara system to Indian music? Why is the Sāmaveda called the origin of saṅgīta? (5 marks)\n\n---\n\n## Section C: Saṃhitā vs Pada (20 marks)\n\n**C1.** The following pada-pāṭha shows the Mahāmṛtyuñjaya mantra word-by-word. Write the saṃhitā form by applying sandhi rules (10 marks):\n\nPada-pāṭha:\n```\noṃ | tryambakaṃ | yajāmahe | sugandhiṃ | puṣṭi-vardhanam |\nurvārukam | iva | bandhanāt | mṛtyoḥ | mukṣīya | mā | amṛtāt |\n```\n\nSaṃhitā-pāṭha (fill in — apply the sandhi):\n```\noṃ tryambakaṃ yajāmahe sugandhiṃ puṣṭi-vardhanam |\nurvārukam iva bandhanāt mṛtyoḥ mukṣīya _____________ |\n```\n\n(Focus on the last section: what happens when mā + amṛtāt combine?)\n\n**C2.** Explain why the tradition preserves *both* saṃhitā and pada forms (5 marks):\n1. What does saṃhitā preserve that pada does not?\n2. What does pada reveal that saṃhitā obscures?\n3. Which form is used in actual ritual recitation?\n4. Which form is used for grammatical analysis?\n5. How does the relationship between saṃhitā and pada relate to the sandhi you learned in earlier stages?\n\n**C3.** A corruption enters the text: one word is changed. Explain why this corruption would be detected more easily in krama-pāṭha than in saṃhitā-pāṭha (5 marks).\n\n---\n\n## Section D: The Vikṛtis (25 marks)\n\n**D1.** Given the pada sequence: **namaḥ | śivāya | ca | mahādevāya | ca**\nConstruct the krama-pāṭha (5 marks):\n\n```\nStep 1: _______ _______\nStep 2: _______ _______\nStep 3: _______ _______\nStep 4: _______ _______\nStep 5: _______ iti _______\n```\n\n**D2.** Using the same pada sequence, construct the jaṭā-pāṭha for the first TWO pairs only (10 marks):\n\n```\nPair 1 (namaḥ, śivāya):\nForward:  _______ _______\nBackward: _______ _______\nForward:  _______ _______\n\nPair 2 (śivāya, ca):\nForward:  _______ _______\nBackward: _______ _______\nForward:  _______ _______\n```\n\n**D3.** Ghana-pāṭha uses the pattern: AB BA ABC CBA ABC. Apply this to the first group of the same sequence (words: namaḥ, śivāya, ca) (5 marks):\n\n```\nAB:    _______ _______\nBA:    _______ _______\nABC:   _______ _______ _______\nCBA:   _______ _______ _______\nABC:   _______ _______ _______\n```\n\n**D4.** The vikṛtis serve three functions: preservation, sonic architecture, and dhāraṇā training. Explain each (5 marks):\n1. How does the overlapping pattern prevent textual corruption?\n2. What do you mean by \"sonic architecture\" — what happens to the sound when words are woven forward and backward?\n3. How does reciting ghana-pāṭha train the memory skills needed for avadhāna (the goal of this syllabus)?\n\n---\n\n## Section E: Two Dimensions of the Syllable (10 marks)\n\n**E1.** The syllable \"mā\" in \"somāya\" is:\n1. Laghu or guru? Why?\n2. What svara would it carry if \"so\" is udātta? Why?\n3. These two properties (weight and pitch) are independent. Explain what this means with an example of a laghu-udātta syllable and a guru-anudātta syllable (4 marks).\n\n**E2.** Classical Sanskrit poetry (śloka, śārdūlavikrīḍita, etc.) uses chandas but not svara. Vedic mantras use both. What was lost when classical Sanskrit dropped the svara system? What was retained? (3 marks)\n\n**E3.** A student who knows both Chandas I and Svara-Vidyā analyzes the Gāyatrī mantra. They mark each syllable for both weight (L/G) and pitch (U/A/S). Explain why these two analyses answer different questions: what does the weight-pattern tell you vs what does the pitch-pattern tell you? (3 marks)\n\n---\n\n## Section F: Synthesis (10 marks)\n\n**F1.** The Taittirīya Upaniṣad lists six factors: varṇa, svara, mātrā, bala, sāma, santāna. You have now studied the first three in detail across this syllabus (Varṇa-Vidyā, Chandas I, Svara-Vidyā). For each, state (6 marks):\n1. What dimension of the syllable it controls\n2. Where in this syllabus you learned it\n3. One consequence of getting it wrong\n\n**F2.** The KYV (Kṛṣṇa Yajurveda) is unique among the four Vedas because it interleaves mantra and brāhmaṇa within the same text. How might this affect the svara system — given that verbs in main clauses lose their accent, and brāhmaṇa prose uses more main-clause verbs than mantra hymns? (4 marks)\n", "workbook-answers": "# Svara-Vidyā — Workbook (Answers)\n\n## Section A: The Three Svaras\n\n**A1.**\n1. **Udātta** — \"raised.\" The high-pitched syllable — the peak of a word's tonal contour. In KYV notation: **unmarked** (no special sign).\n2. **Anudātta** — \"not raised.\" The low-pitched syllable — the valley or baseline. In KYV notation: **horizontal line below** the syllable (underline).\n3. **Svarita** — \"sounded\" (compound pitch). A falling pitch that occurs immediately after an udātta syllable. In KYV notation: **vertical bar above** the syllable.\n\n**A2.** The KYV system marks the *support structure,* not the peak. If you know where the anudātta (low) and svarita (falling) syllables are, the udātta is identified by elimination — it is the unmarked syllable between them. This is efficient: in a long word with many syllables, only one is udātta, so marking the (potentially many) anudātta syllables and the (always exactly one) svarita leaves the udātta unambiguously identified without a mark. The system treats the low pitch as the thing that needs flagging, since the high pitch is the exception that stands out by contrast.\n\n**A3.**\n1. The priest intended: \"*indraśatro vardhasva*\" — \"O you whose enemy is Indra (i.e., O Indra's foe), grow!\" — addressing Vṛtra with a vocative, meaning \"you, Indra's enemy, may you grow.\"\n2. The wrong svara shifted the compound accent, making it: \"*indraśatruḥ vardhasva*\" — \"May Indra's enemy grow!\" — a wish *about* Vṛtra rather than *addressed to* Vṛtra.\n3. The mantra turned against its speaker — Vṛtra's own priest caused his patron's destruction rather than empowerment.\n4. **Svara is not cosmetic — it determines the grammatical structure and therefore the meaning.** A change in pitch-accent changes whether a compound is a vocative address or a nominative statement, which changes the entire target and direction of the mantra.\n5. Mispronouncing a varṇa (letter) gives you a wrong word or nonsense. Mispronouncing a svara gives you a *grammatically valid but differently-meaning* expression — which is more dangerous, because the mantra still \"works,\" just at the wrong target.\n\n---\n\n## Section B: Svara Rules\n\n**B1.**\n\n1. **ag**nim → **U S** (udātta on \"ag,\" svarita on \"nim\")\n2. na**maḥ** → **A U** (anudātta on \"na,\" udātta on \"maḥ\")\n3. **so**māya → **U S A** (udātta on \"so,\" svarita on \"mā,\" anudātta on \"ya\")\n4. ru**drā**ya → **A U S** (anudātta on \"ru,\" udātta on \"drā,\" svarita on \"ya\")\n5. tri**yam**bakam → **A U S A** (anudātta on \"tri,\" udātta on \"yam,\" svarita on \"ba,\" anudātta on \"kam\")\n6. su**gan**dhim → **A U S** (anudātta on \"su,\" udātta on \"gan,\" svarita on \"dhim\")\n7. **puṣ**ṭi → **U S** (udātta on \"puṣ,\" svarita on \"ṭi\")\n8. var**dha**nam → **A U S** (anudātta on \"var,\" udātta on \"dha,\" svarita on \"nam\")\n9. u**rvā**rukam → **A U S A** (anudātta on \"u,\" udātta on \"rvā,\" svarita on \"ru,\" anudātta on \"kam\") — as heard in standard Rudram recitation\n10. mṛ**tyor** → **A U** (anudātta on \"mṛ,\" udātta on \"tyor\")\n\n**B2.**\n1. The first is **anudātta** (low — before the rise) and the third is **svarita** (falling — after the peak).\n2. It becomes **svarita** — the pitch falls after the udātta peak.\n3. It **loses its udātta** — the finite verb becomes fully anudātta (accentless) in a main clause. This is why Vedic prose (brāhmaṇa) sounds \"flatter\" than Vedic hymns (mantra).\n4. The **first member** typically loses its independent accent. The compound carries the accent of the second member (with exceptions).\n5. A **kampa-svarita** (trembling/wavering pitch) may occur at the boundary, or one of the udāttas may be suppressed according to Prātiśākhya rules. The exact resolution depends on the syntactic relationship and is specified by the Prātiśākhya sūtras.\n\n**B3.** The Sāmaveda takes the three Vedic svaras and maps them onto a seven-note musical scale:\n\n- Udātta → the high note(s)\n- Anudātta → the low note(s)\n- Svarita → the transitional/falling note(s)\n\nThe Sāmaveda recitation system (sāmagāna) assigns specific numerical values (1-7) to pitches, creating actual melodies from what in the Ṛgveda and Yajurveda is a three-level accent system. This is why Indian musicological tradition considers the Sāmaveda the origin of saṅgīta — it is the point where Vedic tonal recitation becomes music. The seven svaras of Indian music (ṣaḍja, ṛṣabha, gāndhāra, madhyama, pañcama, dhaivata, niṣāda) are an elaboration of the three Vedic svaras. Recitation became melody became rāga.\n\n---\n\n## Section C: Saṃhitā vs Pada\n\n**C1.** The sandhi of mā + amṛtāt:\n\nmā + amṛtāt → **māmṛtāt** (the ā of mā combines with the a of amṛtāt → māmṛtāt by dīrgha-sandhi: ā + a → ā)\n\nComplete saṃhitā:\n```\noṃ tryambakaṃ yajāmahe sugandhiṃ puṣṭivardhanam |\nurvārukamiva bandhanānmṛtyormukṣīya māmṛtāt |\n```\n\n(Note: bandhanāt + mṛtyoḥ → bandhanānmṛtyoḥ by visarga-sandhi; mṛtyoḥ + mukṣīya → mṛtyormukṣīya by visarga-sandhi; mā + amṛtāt → māmṛtāt.)\n\n**C2.**\n1. **Saṃhitā preserves** the continuous sound-stream as it is actually recited — including the svara contour that operates across word-boundaries and the specific sandhi-generated sounds that exist only in combination.\n2. **Pada reveals** the individual words and their independent forms — showing the original visarga, the pre-sandhi vowels, the word-boundaries that sandhi obscures.\n3. **Saṃhitā** is used in ritual recitation — it is the performed, living form of the mantra.\n4. **Pada** is used for grammatical analysis — it shows what words are present, their cases, their stems.\n5. The relationship IS sandhi — saṃhitā is the text *with* sandhi applied; pada is the text *before* sandhi. The pada-pāṭha is the analytical key to the saṃhitā-pāṭha. Understanding both means understanding sandhi as a reversible process: given pada, you can construct saṃhitā; given saṃhitā, you can reconstruct pada.\n\n**C3.** In saṃhitā-pāṭha, each word appears once in a continuous stream. If word B is corrupted to B', only one instance exists, and if the change is subtle, it may not be noticed.\n\nIn krama-pāṭha, word B appears in TWO pairs: AB and BC. If B is corrupted to B':\n- Pair 1 becomes AB' — something sounds wrong because A-B' is an unfamiliar combination\n- Pair 2 becomes B'C — again unfamiliar\n- The correct form B is remembered from the two overlapping contexts\n\nThe redundancy means every word is *cross-checked* against its neighbors in both directions. A corruption that might slip past in a linear reading is caught by the overlap. This redundancy increases dramatically in jaṭā (6× per word) and ghana (10×+ per word).\n\n---\n\n## Section D: The Vikṛtis\n\n**D1.** Krama-pāṭha for: namaḥ | śivāya | ca | mahādevāya | ca\n\n```\nStep 1: namaḥ śivāya\nStep 2: śivāya ca\nStep 3: ca mahādevāya\nStep 4: mahādevāya ca\nStep 5: ca iti ca\n```\n\n**D2.** Jaṭā-pāṭha (first two pairs):\n\n```\nPair 1 (namaḥ, śivāya):\nForward:  namaḥ śivāya\nBackward: śivāya namaḥ\nForward:  namaḥ śivāya\n\nPair 2 (śivāya, ca):\nForward:  śivāya ca\nBackward: ca śivāya\nForward:  śivāya ca\n```\n\n**D3.** Ghana-pāṭha (first group: namaḥ, śivāya, ca):\n\n```\nAB:    namaḥ śivāya\nBA:    śivāya namaḥ\nABC:   namaḥ śivāya ca\nCBA:   ca śivāya namaḥ\nABC:   namaḥ śivāya ca\n```\n\n**D4.**\n1. **Preservation:** Each word appears in multiple overlapping contexts (forward and backward). If any word is corrupted, the error breaks the pattern in several places simultaneously. In ghana-pāṭha, a single word appears 10+ times in different configurations — accidentally changing one instance while all others remain correct is virtually impossible. This interlocking redundancy has preserved Vedic texts with near-perfect fidelity for over 3,000 years, predating writing.\n\n2. **Sonic architecture:** When words are woven forward and backward, the sound-patterns overlap and interfere constructively. Linear recitation produces a one-dimensional stream. Jaṭā produces a two-dimensional weave (forward + backward). Ghana produces a three-dimensional structure (forward + backward + triple-compound). The result is overtone patterns and resonance effects that do not exist in linear recitation — the woven sound fills acoustic space differently. Chamaka-ghana, for instance, produces a quality of sustained resonance that simple Chamakam recitation does not.\n\n3. **Dhāraṇā training:** To recite ghana-pāṭha, the reciter must simultaneously hold: (a) the current position in the source text, (b) the forward sequence, (c) the backward sequence, (d) the triple-compound sequence, and (e) where to shift next. This is *divided attention on multiple simultaneous threads* — exactly the skill required for avadhāna, where you hold eight challenges at once, cycling between them while remembering the state of each. The vikṛtis are, in effect, avadhāna training built into the recitation tradition. A competent ghana-pāṭhī already has the core dhāraṇā skill that stages 27-31 of this syllabus develop.\n\n---\n\n## Section E: Two Dimensions of the Syllable\n\n**E1.**\n1. **Guru** — because ā is a long vowel. Long vowels always make a syllable guru (heavy / 2 mātrā).\n2. **Svarita** — because \"so\" (the preceding syllable) is udātta, and the syllable immediately after udātta becomes svarita (falling pitch).\n3. Independence means: a syllable's weight (laghu/guru) is determined by vowel-length and consonant-clustering, while its pitch (udātta/anudātta/svarita) is determined by word-accent rules. The two systems use different criteria and can produce any combination:\n   - **Laghu + udātta:** The syllable \"a\" in \"agním\" — short vowel (laghu), but it carries the udātta (high pitch).\n   - **Guru + anudātta:** The syllable \"mā\" in a word where it is not near the udātta — long vowel (guru), but low pitch (anudātta).\n\n**E2.**\n- **Lost:** The pitch-accent system — classical Sanskrit no longer distinguishes udātta/anudātta/svarita. Words that were distinguished by accent alone became homophones. The tonal dimension of the language collapsed.\n- **Retained:** The syllable-weight system (laghu/guru) — classical Sanskrit poetry is entirely built on this. Every śloka, every śārdūlavikrīḍita, every mandākrāntā is defined by patterns of light and heavy syllables. Chandas survived; svara did not.\n- **Consequence:** Classical Sanskrit poetry controls *rhythm* (through weight-patterns) but not *pitch* (which is free). Vedic recitation controls both. This is why Vedic recitation has a distinctive melodic quality that classical śloka recitation does not — the pitch is prescribed, not improvised.\n\n**E3.**\n- **Weight-pattern** tells you the *meter* — which chandas the verse is in, whether the syllable-pattern matches anuṣṭubh or gāyatrī or triṣṭubh. It answers: \"what is the rhythmic structure?\"\n- **Pitch-pattern** tells you the *word-identity and grammatical structure* — where each word peaks, how compounds are accented, whether a verb has lost its accent. It answers: \"what do the words mean and how do they relate?\"\n\nWeight is about the *body* of the verse (its rhythmic skeleton). Pitch is about the *meaning* of the verse (its semantic contour). A metrical analysis tells you how to *scan* the verse. A svara analysis tells you how to *understand* it.\n\n---\n\n## Section F: Synthesis\n\n**F1.**\n\n1. **Varṇa** — controls the *identity* of the sound (which phoneme). Learned in Varṇa-Vidyā (after Stage 1). Getting it wrong: you produce a different word entirely or nonsense. A mispronounced letter is a different letter.\n\n2. **Svara** — controls the *pitch* of the syllable (high/low/falling). Learned in this stage (Svara-Vidyā, after Chandas I). Getting it wrong: the Indraśatru effect — the mantra is grammatically valid but semantically redirected. The power goes to the wrong target.\n\n3. **Mātrā** — controls the *duration* of the syllable (short/long/extended). Learned in Chandas I. Getting it wrong: the meter breaks — the verse no longer fits its chandas, which in Vedic understanding means it loses the breath-pattern that makes it effective. A gāyatrī with wrong mātrā is no longer gāyatrī.\n\n**F2.** The KYV's interleaving of mantra and brāhmaṇa creates a distinctive svara landscape:\n\n- **Mantra sections** (hymns, invocations) use full accent — every word carries its udātta, and the recitation has a strong tonal contour with clear peaks and valleys.\n- **Brāhmaṇa sections** (explanatory prose) have more main-clause finite verbs, and these verbs lose their accent. The result is \"flatter\" — more anudātta, fewer peaks.\n\nIn a text like the Taittirīya Saṃhitā, the reciter shifts between these two tonal registers as they move from mantra to brāhmaṇa and back. The svara contour itself signals which mode you are in — the ear can distinguish mantra from brāhmaṇa by the density of udātta peaks. This tonal switching is unique to the KYV (the Śukla Yajurveda separates mantra and brāhmaṇa into different texts; the KYV weaves them). Learning to hear this switch — from the peaked, melodic mantra-voice to the flatter brāhmaṇa-voice and back — is a distinctive skill of KYV recitation.\n", "badge": "# Stage 20 Badge: Svaravit\n\n**Title:** Accent Keeper\n**Badge:** 🏅 Svaravit\n\n## Requirements\n\n1. Mark udātta, anudātta, and svarita on one complete Rudram anuvāka\n2. Explain the 3 svara types and their marking convention\n3. Demonstrate one vikṛti (krama or jaṭā) for 3 words\n\n## How to Demonstrate\n\n**Format:** Text + voice note\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 21 content and grants the **Svaravit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "21-chandas-ii", "number": 21, "title": "Chandas II", "subtitle": "Anustubh", "files": {"theory": "# Stage 21: Chandas II — Anuṣṭubh (Śloka)\n\n## Goal\nMaster the anuṣṭubh/śloka meter and compose spontaneous verses in it.\n\n## Anuṣṭubh Structure\n\n4 pādas × 8 syllables = 32 syllables per verse. Two pādas form a half-verse (ardha-śloka).\n\n```\npāda a (8) | pāda b (8)    ← first half\npāda c (8) | pāda d (8)    ← second half\n```\n\n## The Rules\n\nThe anuṣṭubh is **not** strictly fixed in all positions. The key constraints:\n\n### Even pādas (b and d):\n- Position 5 must be **laghu** (∪)\n- Position 6 must be **guru** (–)\n- Position 7 must be **guru** (–) [in pāda b] or **laghu** (∪) [in pāda d is flexible]\n- Pattern at 5-6-7: typically ∪ – – (b) and ∪ – ∪ (d)\n\n### Odd pādas (a and c):\n- Position 5 should **not** be ∪ – ∪ (ja-gaṇa at 5-6-7 is avoided)\n- Otherwise quite free\n\n### Summary of key constraint:\n```\nPāda b: × × × × ∪ – – ×    (positions 5-6-7 = ∪ – –)\nPāda d: × × × × ∪ – ∪ ×    (positions 5-6-7 = ∪ – ∪)\n```\n(× = free, but certain patterns preferred)\n\n## Yati (Caesura)\n\nA natural word-break (yati) typically falls after the 4th syllable in each pāda.\n\n## Classical Examples\n\n### Bhagavadgītā 2.47:\n```\nkar-ma-ṇy-e-vā-dhi-kā-ras-te    (a: 8 syllables)\nmā pha-le-ṣu ka-dā-ca-na         (b: 8, pos 5-7: ∪ – ∪... actually this is flexible)\nmā kar-ma-pha-la-he-tur bhūr       (c: 8)\nmā te saṅ-go'-stv a-kar-ma-ṇi     (d: 8)\n```\n\n### Simple anuṣṭubh:\n```\nna-mā-mi śi-vaṃ śān-taṃ de-   (a)\nvaṃ tri-lo-ca-naṃ ha-ram       (b)\nnī-la-kaṇ-ṭhaṃ ga-ṅgā-dha-    (c)\nraṃ na-ṭa-rā-jaṃ na-mā-my-a-ham (d)\n```\n\n## Composition Process\n\n### Step 1: Choose your message\n\"I bow to peaceful Śiva who has three eyes\"\n\n### Step 2: List key words with syllable counts\nnamāmi (3), śivam (2), śāntam (2), trilocanam (4), devam (2)\n\n### Step 3: Arrange into 8-syllable pādas\nTry: namāmi śivaṃ śāntam (7... need 1 more)\n→ namāmi śivaṃ śāntaṃ tam (8? adjust...)\n\n### Step 4: Check constraints on positions 5-6-7\n\n### Step 5: Adjust with synonyms if needed\nReplace \"trilocanam\" (4) with \"trinetram\" (3) or \"tryambakam\" (3) if needed for fit.\n\n## Practice Technique\n\n1. Take any simple devotional sentence\n2. Restate it to fit 8 syllables per half-line\n3. Use synonyms to adjust syllable count\n4. Check laghu/guru at positions 5-6-7 in even pādas\n5. Recite aloud — it should flow naturally\n\n## The Śloka Offering Game\n\nCompose one śloka (4 pādas) as a daily offering to your iṣṭadevatā.\n\n## Milestone Check\nCan you compose a spontaneous anuṣṭubh śloka on a given devotional theme?\n", "reference": "# Stage 21: Chandas II — Reference Guide\n\n## Anuṣṭubh Rules Summary\n\n```\nPosition:  1  2  3  4  5  6  7  8\nPāda a:    ×  ×  ×  ×  ×  ×  ×  ×   (free, avoid ja at 5-6-7)\nPāda b:    ×  ×  ×  ×  ∪  –  –  ×   (5-6-7 must be ∪ – –)\nPāda c:    ×  ×  ×  ×  ×  ×  ×  ×   (free, avoid ja at 5-6-7)\nPāda d:    ×  ×  ×  ×  ∪  –  ∪  ×   (5-6-7 should be ∪ – ∪)\n```\n\n× = free (laghu or guru), but patterns should sound natural.\n\n## Word Length × Syllable Count\n\n| Syllables | Useful Words (Masculine Acc.) |\n|-----------|------------------------------|\n| 1 | taṃ, yaṃ, māṃ |\n| 2 | devam, śivam, haram, bhajam |\n| 3 | namāmi, bhajāmi, trinetram |\n| 4 | trilocanam, nīlakaṇṭham, jagadīśam |\n| 5 | mahādevāya, parameśvaram |\n| 6 | nīlakaṇṭhāya, karuṇāmayīm |\n\n## Anuṣṭubh Composition Checklist\n\n1. ☐ Each pāda has exactly 8 syllables\n2. ☐ Pāda b positions 5-6-7 = ∪ – –\n3. ☐ Pāda d positions 5-6-7 = ∪ – ∪\n4. ☐ Natural word-break near position 4-5\n5. ☐ Meaning is complete and devotional\n6. ☐ Sandhi applied at word junctions\n\n## 10 Model Anuṣṭubh Ślokas\n\n### 1. (BG 9.22)\nananyāś cintayanto māṃ / ye janāḥ paryupāsate\nteṣāṃ nityābhiyuktānāṃ / yogakṣemaṃ vahāmy aham\n\n### 2. (BG 4.7)\nyadā yadā hi dharmasya / glānir bhavati bhārata\nabhyutthānam adharmasya / tadātmānaṃ sṛjāmy aham\n\n### 3. (Sarasvatī-stotra pattern)\nyā devī sarvabhūteṣu / buddhirūpeṇa saṃsthitā\nnamas tasyai namas tasyai / namas tasyai namo namaḥ\n\n### 4. (Traditional)\nguru-brahma guru-viṣṇuḥ / gurur devo maheśvaraḥ\nguruḥ sākṣāt paraṃ brahma / tasmai śrīgurave namaḥ\n\n## Synonym Swaps for Metrical Fit\n\n| Too long? | Try shorter | Syl |\n|-----------|-------------|-----|\n| parameśvara (5) | maheśvara (4) | save 1 |\n| nīlakaṇṭha (4) | hara (2) | save 2 |\n| trilocana (4) | trinetra (3) | save 1 |\n| padmanābha (4) | hari (2) | save 2 |\n| karuṇāmaya (5) | kṛpālu (3) | save 2 |\n\n| Too short? | Try longer | Syl |\n|------------|-----------|-----|\n| hara (2) | maheśvara (4) | gain 2 |\n| hari (2) | nārāyaṇa (4) | gain 2 |\n| deva (2) | bhagavān (3) | gain 1 |\n| padma (2) | aravinda (4) | gain 2 |\n", "workbook-questions": "# Stage 21: Chandas II — Workbook (Questions)\n\n## Section A: Scansion (15 marks)\n**A1.** Scan these pādas — mark each syllable as ∪ or – and count (10 marks):\n1. yadā yadā hi dharmasya\n2. glānir bhavati bhārata\n3. namāmi śivaṃ śāntaṃ ca\n4. devīṃ bhajāmi mādhavīm\n\n**A2.** Check: do pādas 2 and 4 above follow the ∪ – – and ∪ – ∪ rule at positions 5-6-7? (5 marks)\n\n## Section B: Composition (30 marks)\n**B1.** Complete these half-ślokas by supplying the second pāda (8 syllables, correct pattern at 5-6-7) (10 marks):\n1. namāmi śivaṃ devam / ___\n2. yā devī sarvabhūteṣu / ___\n\n**B2.** Compose 2 complete anuṣṭubh ślokas (4 pādas each) on any devotional theme. Mark syllable count for each pāda (20 marks):\n\nŚloka 1:\n- a: ___ (count: ___)\n- b: ___ (count: ___)\n- c: ___ (count: ___)\n- d: ___ (count: ___)\n\nŚloka 2:\n- a: ___\n- b: ___\n- c: ___\n- d: ___\n\n## Section C: Synonym Substitution (15 marks)\n**C1.** This pāda has 10 syllables — reduce to 8 by using shorter synonyms (5 marks):\n> nīlakaṇṭhaṃ maheśvaraṃ namāmi (10)\nRevised: ___\n\n**C2.** This pāda has 6 syllables — expand to 8 (5 marks):\n> haraṃ namāmi (5-6)\nExpanded: ___\n\n**C3.** Adjust this śloka so all 4 pādas have exactly 8 syllables (5 marks):\n> a: namāmi devam (5)\n> b: śivaṃ bhajāmi sadā (7)\n> c: nityam smarāmi (5)\n> d: prabhuṃ nīlakaṇṭham (6)\nCorrected version: ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 21: Chandas II — Workbook (Answers)\n\n## Section A\n**A1.**\n1. ya-dā-ya-dā-hi-dha-rma-sya → ∪ – ∪ – ∪ ∪ – ∪ (8 syllables)\n2. glā-nir-bha-va-ti-bhā-ra-ta → – – ∪ ∪ ∪ – ∪ ∪ (8 syllables)\n3. na-mā-mi-śi-vaṃ-śān-taṃ-ca → ∪ – ∪ ∪ – – – ∪ (8 syllables)\n4. de-vīṃ-bha-jā-mi-mā-dha-vīm → ∪ – ∪ – ∪ – ∪ – (8 syllables)\n\n**A2.** Pāda 2, pos 5-6-7: ∪ – ∪ → This is the d-type pattern (∪ – ∪), acceptable. Pāda 4, pos 5-6-7: ∪ – ∪ → also d-type. If these are b-pādas, they should ideally be ∪ – –. Context determines correctness.\n\n## Section B\n**B1.** Samples:\n1. namāmi śivaṃ devam / **nīlakaṇṭhaṃ maheśvaram** (8, pos 5-6-7: ∪ – ∪ – ... check and adjust)\n2. yā devī sarvabhūteṣu / **buddhirūpeṇa saṃsthitā** (classic completion)\n\n**B2.** Sample śloka 1:\n- a: na-mā-mi-de-vaṃ-śaṃ-bhu-m (8) — namāmi devaṃ śambhum\n- b: nī-la-kaṇ-ṭhaṃ-ma-he-śva-ram (8) — nīlakaṇṭhaṃ maheśvaram\n- c: tri-ne-traṃ-bha-sma-bhū-ṣi-tam (8) — trinetraṃ bhasmabhūṣitam\n- d: sa-dā-śi-vaṃ-na-mā-my-a-ham (8) — sadāśivaṃ namāmy aham\n\nAccept any correctly structured anuṣṭubh.\n\n## Section C\n**C1.** nīlakaṇṭhaṃ maheśvaraṃ namāmi (10) → **haraṃ nīlakaṇṭhaṃ bhaje** (8) or **nīlakaṇṭhaṃ bhaje haram** (8)\n\n**C2.** haraṃ namāmi (5) → **sadā haraṃ namāmy aham** (8) or **śāntaṃ haraṃ namāmy aham** (8)\n\n**C3.** Corrected sample:\n- a: namāmi śivaṃ devaṃ taṃ (8)\n- b: bhajāmi sadā śaṅkaram (8)\n- c: nityaṃ smarāmi śambhum aham (8)\n- d: prabhuṃ nīlakaṇṭhaṃ haram (8)\n\n(Accept any valid 8-syllable correction.)\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 21 Badge: Chandasvit II\n\n**Title:** Anuṣṭubh Composer\n**Badge:** 🏅 Chandasvit II\n\n## Requirements\n\nCompose an original anuṣṭubh verse (32 syllables, 4 pādas of 8). Must follow pathyā pattern in 2nd and 4th pādas.\n\n## How to Demonstrate\n\n**Format:** Text post with scansion\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 22 content and grants the **Chandasvit II** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "22-chandas-iii", "number": 22, "title": "Chandas III", "subtitle": "Multiple Meters", "files": {"theory": "# Stage 22: Chandas III — Multiple Meters\n\n## Goal\nLearn 5+ meters beyond anuṣṭubh. Match meter to devotional mood. Compose in several meters.\n\n## The Meters\n\n### 1. Anuṣṭubh (8 per pāda) — review\nPattern: relatively free, 5-6-7 constrained. Mood: narrative, instructional.\n\n### 2. Indravajrā (11 per pāda)\nPattern: **– – ∪ – – ∪ ∪ – ∪ – –** (ta ta ja ga ga)\nMood: Stately, powerful. Good for praising powerful deities.\n\n### 3. Upendravajrā (11 per pāda)\nPattern: **∪ – ∪ – – ∪ ∪ – ∪ – –** (ja ta ja ga ga)\nMood: Flowing, graceful. Mixed with Indravajrā = Upajāti.\n\n### 4. Vasantatilakā (14 per pāda)\nPattern: **– – ∪ – ∪ ∪ ∪ – ∪ ∪ – ∪ – –** (ta bha ja ja ga ga)\nMood: Spring-like, ornate, devotional. Very popular in stotras.\n\n### 5. Mandākrāntā (17 per pāda)\nPattern: **– – – – ∪ ∪ ∪ ∪ ∪ – – ∪ – – ∪ – –** (ma bha na ta ta ga ga)\nYati after 4, 10. Mood: Majestic, slow, meditative. Used for Meghadūta.\n\n### 6. Śārdūlavikrīḍita (19 per pāda)\nPattern: **– – – ∪ ∪ – ∪ – ∪ ∪ ∪ – – – ∪ – – ∪ –** (ma sa ja sa ta ta ga)\nYati after 12. Mood: Grand, elaborate. Most stately of common meters.\n\n### 7. Sragdharā (21 per pāda)\nPattern: **– – – – ∪ – – ∪ ∪ ∪ ∪ ∪ ∪ – – – ∪ – – ∪ –** (ma ra bha na ya ya ya)\nYati after 7, 14. Mood: Most expansive, for supreme praise.\n\n### 8. Mālinī (15 per pāda)\nPattern: **∪ ∪ ∪ ∪ ∪ ∪ – – ∪ – – ∪ – – –** (na na ma ya ya)\nYati after 8. Mood: Gentle, sweet. Ideal for Kṛṣṇa/Devī devotion.\n\n## Matching Meter to Bhāva\n\n| Bhāva | Recommended Meters |\n|-------|-------------------|\n| Śānta (peace) | Mandākrāntā, Mālinī |\n| Vīra (heroic) | Śārdūlavikrīḍita, Indravajrā |\n| Śṛṅgāra (beauty) | Vasantatilakā, Mālinī |\n| Karuṇa (compassion) | Mandākrāntā, Vasantatilakā |\n| Adbhuta (wonder) | Sragdharā, Śārdūlavikrīḍita |\n| General praise | Anuṣṭubh, Upajāti |\n\n## Composition Exercise\n\nFor each meter, compose just ONE pāda (one line) correctly:\n\n1. **Indravajrā** (11): – – ∪ – – ∪ ∪ – ∪ – –\n   > nā-mā-mi-de-vaṃ-tri-pu-rān-ta-kā-ram (check pattern)\n\n2. **Vasantatilakā** (14): – – ∪ – ∪ ∪ ∪ – ∪ ∪ – ∪ – –\n   > (compose and scan)\n\n## Key Principle\nStart by imitating. Take a famous verse in each meter, replace key words while maintaining the pattern.\n\n## Milestone Check\nCan you compose at least one pāda in Indravajrā, Vasantatilakā, and one other meter beyond anuṣṭubh?\n", "reference": "# Stage 22: Chandas III — Reference Guide\n\n## Meter Patterns (Sama-vṛtta — all pādas identical)\n\n| Meter | Syl | Pattern (gaṇa) | Pattern (∪ –) |\n|-------|-----|----------------|---------------|\n| Anuṣṭubh | 8 | (variable) | ×××× ∪–(–/∪)× |\n| Indravajrā | 11 | ta-ta-ja-ga-ga | ––∪––∪∪–∪–– |\n| Upendravajrā | 11 | ja-ta-ja-ga-ga | ∪–∪––∪∪–∪–– |\n| Vaṃśastha | 12 | ja-ta-ja-ra | ∪–∪––∪∪–∪–∪– |\n| Vasantatilakā | 14 | ta-bha-ja-ja-ga-ga | ––∪–∪∪∪–∪∪–∪–– |\n| Mālinī | 15 | na-na-ma-ya-ya | ∪∪∪∪∪∪––∪––∪––– |\n| Mandākrāntā | 17 | ma-bha-na-ta-ta-ga-ga | ––––∪∪∪∪∪––∪––∪–– |\n| Śārdūlavikrīḍita | 19 | ma-sa-ja-sa-ta-ta-ga | –––∪∪–∪–∪∪∪–––∪––∪– |\n| Sragdharā | 21 | ma-ra-bha-na-ya-ya-ya | ––––∪––∪∪∪∪∪∪–––∪––∪– |\n\n## Yati (Caesura) Positions\n\n| Meter | Yati after |\n|-------|-----------|\n| Anuṣṭubh | 4 |\n| Indravajrā | 5 |\n| Vasantatilakā | 8 |\n| Mālinī | 8 |\n| Mandākrāntā | 4, 10 |\n| Śārdūlavikrīḍita | 12 |\n| Sragdharā | 7, 14 |\n\n## Famous Examples\n\n### Indravajrā (11)\n> sā vidyā yā vimuktaye (part of a famous verse)\n\n### Vasantatilakā (14)\n> śāntākāraṃ bhujagaśayanaṃ padmanābhaṃ sureśam\n(Actually this is Śārdūlavikrīḍita — careful!)\n\nThe Viṣṇu dhyāna-śloka:\n> śān-tā-kā-raṃ-bhu-ja-ga-śa-ya-naṃ-pa-dma-nā-bhaṃ-su-re-śam\nThis is 19 syllables = Śārdūlavikrīḍita!\n\n### Mālinī (15)\nMany Meghadūta stanzas. Also Devī-māhātmya ślokas.\n\n### Mandākrāntā (17)\nKālidāsa's Meghadūta opening:\n> kaś-cit-kān-tā | vi-ra-ha-gu-ru-ṇā | sva-adhi-kā-rāt-pra-ma-ttaḥ\n\n## Meter-Mood Matching Quick Card\n\n| For this mood... | Use this meter |\n|-----------------|----------------|\n| Quiet teaching | Anuṣṭubh |\n| Royal praise | Indravajrā |\n| Flowing devotion | Vasantatilakā |\n| Sweet tenderness | Mālinī |\n| Vast majesty | Mandākrāntā |\n| Grand celebration | Śārdūlavikrīḍita |\n| Supreme glory | Sragdharā |\n", "workbook-questions": "# Stage 22: Chandas III — Workbook (Questions)\n\n## Section A: Meter Identification (15 marks)\n**A1.** Count syllables and identify the meter (10 marks):\n1. Syllable count 8 per pāda → meter: ___\n2. Syllable count 11 per pāda, starts – – ∪ → meter: ___\n3. Syllable count 14 per pāda → meter: ___\n4. Syllable count 19 per pāda → meter: ___\n5. Syllable count 17 per pāda → meter: ___\n\n**A2.** Match meter to mood (5 marks):\n1. Grand heroic praise → ___  2. Gentle sweetness → ___  3. Narrative/teaching → ___\n4. Majestic meditation → ___  5. Spring-like devotion → ___\n\n## Section B: Scansion (15 marks)\n**B1.** Scan 2 verses — mark every syllable ∪ or –, then identify the meter (15 marks):\n\nVerse 1:\n> śāntākāraṃ bhujagaśayanaṃ padmanābhaṃ sureśam\n> viśvādhāraṃ gaganasadṛśaṃ meghavarṇaṃ śubhāṅgam\n\nVerse 2 (one anuṣṭubh):\n> sarvadharmān parityajya māmekam śaraṇaṃ vraja\n> ahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ\n\n## Section C: Composition (30 marks)\n**C1.** Compose one pāda (single line) in Indravajrā meter (11 syllables, pattern: ––∪––∪∪–∪––) (10 marks):\n\n**C2.** Compose one pāda in Vasantatilakā (14 syllables) (10 marks):\n\n**C3.** Compose a full anuṣṭubh śloka (4 × 8) and then restate the same idea in a different meter of your choice (10 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 22: Chandas III — Workbook (Answers)\n\n## Section A\n**A1.** 1. **Anuṣṭubh** 2. **Indravajrā** 3. **Vasantatilakā** 4. **Śārdūlavikrīḍita** 5. **Mandākrāntā**\n\n**A2.** 1. **Śārdūlavikrīḍita** 2. **Mālinī** 3. **Anuṣṭubh** 4. **Mandākrāntā** 5. **Vasantatilakā**\n\n## Section B\n**B1.** Verse 1:\n> śān-tā-kā-raṃ-bhu-ja-ga-śa-ya-naṃ-pa-dma-nā-bhaṃ-su-re-śam\n> – – – – ∪ ∪ ∪ ∪ ∪ – ∪ – – – ∪ – – –\nCount: 19 syllables → **Śārdūlavikrīḍita**\n\nVerse 2:\n> sar-va-dha-rmān-pa-ri-tya-jya / mā-me-kaṃ-śa-ra-ṇaṃ-vra-ja\n> – ∪ ∪ – ∪ ∪ – ∪ / – – – ∪ ∪ – ∪ ∪\nCount: 8 + 8 = 16 per half → **Anuṣṭubh**\n\n## Section C\n**C1.** Sample Indravajrā pāda (11, ––∪––∪∪–∪––):\n> nā-mā-mi-de-vaṃ-pa-ra-maṃ-ma-he-śam\n> – – ∪ – – ∪ ∪ – ∪ – –\n(Accept if pattern matches closely)\n\n**C2.** Sample Vasantatilakā pāda (14, ––∪–∪∪∪–∪∪–∪––):\n> (Very challenging — accept any reasonable 14-syllable attempt with correct pattern at key positions)\n\n**C3.** Sample:\nAnuṣṭubh: namāmi śivaṃ devaṃ taṃ / nīlakaṇṭhaṃ maheśvaram / trinetraṃ bhasmabhūṣitam / sadāśivaṃ namāmy aham\n\nSame idea in Indravajrā (11 per pāda):\n> nā-mā-mi-śaṃ-bhuṃ-tri-pu-rān-ta-kā-ram (attempt — accept reasonable efforts)\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 22 Badge: Chandasvit III\n\n**Title:** Multi-Meter Poet\n**Badge:** 🏅 Chandasvit III\n\n## Requirements\n\nCompose one verse each in 3 different meters (e.g., anuṣṭubh, indravajrā, vasantatilakā). Show the scansion.\n\n## How to Demonstrate\n\n**Format:** Text post with scansion\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 23 content and grants the **Chandasvit III** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "23-paryaya-chandas", "number": 23, "title": "Paryaya-Chandas", "subtitle": "Lexical Flexibility", "files": {"theory": "# Stage 23: Paryāya-Chandas — Lexical Flexibility\n\n## Goal\nDevelop the ability to swap synonyms instantly to save a meter — making lexical search automatic under metrical pressure.\n\n## The Problem\nYou're composing in Vasantatilakā and need a 2-syllable word for \"sun\" at a position requiring – –. \"Sūryaḥ\" (– –) works! But what if you need ∪ – ? Then \"raviḥ\" (∪ –). Need ∪ ∪ – ? Try \"bhānuḥ\" doesn't work... \"dinakaraḥ\" (∪ ∪ ∪ ∪) — too many lags. \"arkaḥ\" (– –) — back to guru-guru.\n\nThis is the **Save the Meter** game: when your first-choice word doesn't fit the metrical pattern, instantly find a synonym that does.\n\n## Synonym Banks by Prosodic Pattern\n\n### Sun\n| Pattern | Word | Syllables |\n|---------|------|-----------|\n| – – | sūryaḥ, arkaḥ | 2 |\n| ∪ – | raviḥ | 2 |\n| – ∪ ∪ | bhāskaraḥ | 3 (– ∪ ∪) |\n| ∪ – ∪ | savitā | 3 |\n| ∪ ∪ – ∪ | divākaraḥ | 4 |\n\n### Moon\n| Pattern | Word |\n|---------|------|\n| – – | candraḥ |\n| ∪ – | induḥ |\n| ∪ ∪ – | śaśī (∪ ∪? no: śa-śī = ∪ –)... vidhuḥ (∪ –) |\n| – – ∪ ∪ | niśākaraḥ (∪ – ∪ ∪) |\n\n### Water\n| Pattern | Word |\n|---------|------|\n| ∪ ∪ | jala |\n| – ∪ | vāri |\n| – – | toyam (– –) |\n| ∪ ∪ ∪ | salila (∪ ∪ ∪) |\n| – – ∪ | nīram (– –) |\n\n### Lotus\n| Pattern | Word |\n|---------|------|\n| – – | padmam |\n| ∪ ∪ ∪ | kamala (∪ ∪ ∪) |\n| ∪ ∪ – – | aravindam (∪ ∪ – –) |\n| ∪ ∪ ∪ ∪ | sarasijam (∪ ∪ ∪ ∪) |\n| – ∪ ∪ | paṅkajam (– ∪ ∪) |\n\n## The Technique\n\n1. **Know 3-5 synonyms** for every common noun\n2. **Know their prosodic profiles** (laghu-guru patterns)\n3. **When stuck**, cycle through synonyms mentally: padmam (––), kamalam (∪∪∪), aravindam (∪∪––), paṅkajam (–∪∪)\n4. **Pick the one that fits** the required pattern at that position\n\n## Practice Method\n\nTake a half-composed pāda with a gap:\n> – – ∪ – – [need ∪ ∪ –] ∪ – – (Indravajrā, 11 syllables)\n\nPosition 6-7-8 needs ∪ ∪ –. I need a word for \"lotus\":\n- padmam (– –) — NO\n- kamala (∪ ∪ ∪) — close, but last is laghu\n- kamale (∪ ∪ –) — YES! (locative gives the guru ending)\n\n**Key insight:** Changing the vibhakti (case form) changes the prosodic pattern too! This gives you even more options.\n\n## Case Forms as Prosodic Tools\n\n| Word | Nom | Acc | Inst | Dat | Loc |\n|------|-----|-----|------|-----|-----|\n| śiva | ∪∪– (śivaḥ) | ∪∪– (śivam) | ∪∪–∪ (śivena) | ∪∪–∪ (śivāya) | ∪∪– (śive) |\n| padma | –– (padmam) | –– | –∪–∪ (padmena) | ––∪ (padmāya) | –– (padme) |\n\n## Milestone Check\nGiven a metrical gap of specific pattern, can you instantly find a synonym + case form that fills it?\n", "reference": "# Stage 23: Paryāya-Chandas — Reference Guide\n\n## Prosodic Synonym Banks\n\n### Śiva\n| Syllables | ∪∪ | ∪– | –∪ | –– | ∪∪∪ | ∪–∪ | –∪∪ | –∪– | ∪–– |\n|-----------|----|----|----|----|-----|-----|-----|-----|-----|\n| 2 | — | haraḥ | — | — | — | — | — | — | — |\n| 3 | — | — | — | — | śivaḥ | — | śambhuḥ | — | — |\n| 4+ | — | — | — | — | — | — | — | maheśvaraḥ | — |\n\n### Sun (Sūrya)\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | sūryaḥ, arkaḥ | 2 |\n| ∪ – | raviḥ | 2 |\n| ∪ ∪ – | — | — |\n| – ∪ ∪ | bhāskaraḥ? (–∪∪∪) | 4 |\n| – – ∪ | ādityaḥ (–∪–) | 3 |\n\n### Moon (Candra)\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | candraḥ | 2 |\n| ∪ – | induḥ, vidhuḥ | 2 |\n| ∪ – | śaśī | 2 |\n| – ∪ | somaḥ | 2 |\n| ∪ – ∪ ∪ | niśākaraḥ | 4 |\n\n### Lotus\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | padmam | 2 |\n| ∪ ∪ ∪ | kamalam | 3 |\n| ∪ – – | ambujam | 3 |\n| – ∪ ∪ | paṅkajam | 3 |\n| ∪ ∪ – – | aravindam | 4 |\n| ∪ ∪ ∪ ∪ | sarasijam | 4 |\n| – ∪ ∪ | jalajam | 3 |\n| ∪ ∪ ∪ ∪ | nalinam? | check |\n\n### Water\n| Pattern | Word | Syl |\n|---------|------|-----|\n| ∪ ∪ | jala | 2 |\n| – ∪ | vāri | 2 |\n| – – | toyam | 2 |\n| – – | nīram | 2 |\n| – ∪ | ambu | 2 |\n| ∪ ∪ ∪ | salila | 3 |\n| ∪ ∪ – | udakam | 3 |\n\n### Fire\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | agniḥ | 2 |\n| – – | vahniḥ | 2 |\n| ∪ ∪ ∪ | anala | 3 |\n| – ∪ ∪ | pāvakaḥ | 3 |\n| ∪ – ∪ ∪ | hutāśanaḥ | 4 |\n\n### Mountain\n| Pattern | Word |\n|---------|------|\n| ∪ ∪ | giri | 2 |\n| – ∪ | adri | 2 |\n| – – ∪ ∪ | parvataḥ | 3 |\n| ∪ ∪ ∪ | acalaḥ | 3 |\n| – ∪ | śailaḥ | 2 |\n\n### Ocean\n| Pattern | Word |\n|---------|------|\n| – – | sindhuḥ | 2 |\n| – ∪ ∪ | sāgaraḥ | 3 |\n| ∪ ∪ – | samudraḥ? (∪∪–) | 3 |\n| – ∪ | abdhi | 2 |\n| ∪ ∪ ∪ | udadhi | 3 |\n\n## Case-Form Prosodic Variants (śiva example)\n\n| Case | Form | Pattern |\n|------|------|---------|\n| 1st | śivaḥ | ∪ ∪ – |\n| 2nd | śivam | ∪ ∪ – |\n| 3rd | śivena | ∪ ∪ – ∪ |\n| 4th | śivāya | ∪ ∪ – ∪ |\n| 5th | śivāt | ∪ ∪ – |\n| 6th | śivasya | ∪ ∪ – ∪ |\n| 7th | śive | ∪ – |\n\n## Quick Decision Process\n\n1. What meaning do I need? (e.g., \"lotus\")\n2. How many syllables can I fit? (e.g., 3)\n3. What pattern do I need? (e.g., ∪ – –)\n4. Scan synonym list → ambujam (∪ – –) ✓\n5. Does it make grammatical sense in this case? ✓ → Use it!\n", "workbook-questions": "# Stage 23: Paryāya-Chandas — Workbook (Questions)\n\n## Section A: Pattern Matching (15 marks)\n**A1.** For each concept, give a synonym matching the required prosodic pattern (10 marks):\n1. Sun, pattern – – : ___\n2. Sun, pattern ∪ – : ___\n3. Lotus, pattern ∪ ∪ ∪ : ___\n4. Lotus, pattern – – : ___\n5. Water, pattern – ∪ : ___\n6. Moon, pattern ∪ – : ___\n7. Fire, pattern – – : ___\n8. Mountain, pattern ∪ ∪ : ___\n9. Ocean, pattern – – : ___\n10. Lotus, pattern – ∪ ∪ : ___\n\n**A2.** Give 3 prosodically different synonyms for \"Śiva\" with their patterns (5 marks):\n\n## Section B: Meter Rescue (20 marks)\n**B1.** This Indravajrā pāda (– – ∪ – – ∪ ∪ – ∪ – –) needs fixing. The underlined word doesn't fit metrically. Replace it with a synonym that fits (10 marks):\n1. Position needs – – but \"raviḥ\" (∪ –) is there → replace with: ___\n2. Position needs ∪ ∪ ∪ but \"padmam\" (– –) is there → replace with: ___\n3. Position needs ∪ – but \"candraḥ\" (– –) is there → replace with: ___\n4. Position needs – ∪ but \"jalam\" (∪ ∪) is there → replace with: ___\n5. Position needs ∪ ∪ ∪ but \"agniḥ\" (– –) is there → replace with: ___\n\n**B2.** Complete each pāda by filling the gap with an appropriately patterned word (10 marks):\n1. nā-mā-mi ___(∪∪–∪)___ ma-he-śva-ram (Indravajrā, need 4 syllables matching ∪∪–∪)\n2. ___(––)___kaṇṭhaṃ bhajāmi tam (need 2 guru syllables for \"blue\")\n\n## Section C: Composition Under Constraint (25 marks)\n**C1.** Compose one anuṣṭubh śloka about the sun, using at least 3 different synonyms for \"sun\" (10 marks):\n**C2.** Compose a 2-pāda verse in any longer meter (11+ syllables), using synonym swaps to maintain the pattern. Show your working: which words you tried first and why you swapped (15 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 23: Paryāya-Chandas — Workbook (Answers)\n\n## Section A\n**A1.**\n1. Sun, – – : **sūryaḥ** or **arkaḥ**\n2. Sun, ∪ – : **raviḥ**\n3. Lotus, ∪ ∪ ∪ : **kamalam**\n4. Lotus, – – : **padmam**\n5. Water, – ∪ : **vāri** or **ambu**\n6. Moon, ∪ – : **induḥ** or **śaśī**\n7. Fire, – – : **agniḥ** or **vahniḥ**\n8. Mountain, ∪ ∪ : **giriḥ** (∪ ∪)\n9. Ocean, – – : **sindhuḥ** or **abdhiḥ**\n10. Lotus, – ∪ ∪ : **paṅkajam**\n\n**A2.** Three prosodically different synonyms for Śiva:\n- **haraḥ** (∪ –) — 2 syllables\n- **śambhuḥ** (– –) — 2 syllables\n- **maheśvaraḥ** (∪ – ∪ ∪ ∪) — 5 syllables (or: mahādevaḥ ∪ – – ∪ — 4 syllables)\n\n## Section B\n**B1.**\n1. Need – – for \"sun\" → **sūryaḥ** or **arkaḥ**\n2. Need ∪ ∪ ∪ for \"lotus\" → **kamalam**\n3. Need ∪ – for \"moon\" → **induḥ** or **vidhuḥ**\n4. Need – ∪ for \"water\" → **vāri**\n5. Need ∪ ∪ ∪ for \"fire\" → **analaḥ**\n\n**B2.**\n1. nāmāmi **śivaṃ divyaṃ** (∪∪–∪? need to check — accept reasonable fits) maheśvaram\n2. **nīla**kaṇṭhaṃ bhajāmi tam (nīla = – ∪, giving – ∪ – – ∪ – ∪ –)\n\n## Section C\n**C1.** Sample:\n> sūryaḥ udeti pūrvasyāṃ / raviḥ prakāśate sadā\n> arkaḥ tamāṃsi nāśayet / bhānuḥ jagat prakāśayet\n(Uses sūryaḥ, raviḥ, arkaḥ, bhānuḥ — 4 synonyms. Accept 3+.)\n\n**C2.** Sample working for Indravajrā:\nFirst attempt: nāmāmi devaṃ nīlakaṇṭham → syllable check: 4+2+4 = 10 (need 11!)\nSwap: nāmāmi devaṃ nīlakaṇṭha-haram → too long\nTry: nāmāmi devaṃ nīlakaṇṭham imam → pattern check...\nFinal: nāmāmi śambhuṃ tripurāntakāram (– – ∪ – – ∪ ∪ – ∪ – – = 11 ✓)\n\nAward marks for: showing working (5), metrical correctness (5), synonym variety (5).\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 23 Badge: Padavit\n\n**Title:** Lexical Acrobat\n**Badge:** 🏅 Padavit\n\n## Requirements\n\nTake a given verse and rewrite it replacing 4+ words with synonyms while maintaining the exact meter. Show both versions.\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 24 content and grants the **Padavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "24-alankara", "number": 24, "title": "Alankara", "subtitle": "Poetic Ornament", "files": {"theory": "# Stage 24: Alaṅkāra — Poetic Ornament\n\n## Goal\nTransform correct verse into *beautiful* verse using alaṅkāras (figures of speech). Master upamā (simile), rūpaka (metaphor), anuprāsa (alliteration), and other ornaments.\n\n## What is Alaṅkāra?\n\n**Alaṅkāra** (अलङ्कार) means \"ornament.\" Just as jewelry adorns the body, alaṅkāras adorn poetry. A verse can be grammatically correct and metrically perfect but still lack beauty — alaṅkāra provides the beauty.\n\n## Major Alaṅkāras\n\n### 1. Upamā (Simile) — \"like\"\nExplicit comparison using iva, yathā, sadṛśa, tulya, etc.\n\n> tava mukhaṃ candraḥ **iva** śobhate\n> (Your face shines **like** the moon)\n\n> gaṅgā **iva** pavitrā tava kṛpā\n> (Your grace is pure **like** the Gaṅgā)\n\n**Four elements:** upameya (thing compared), upamāna (standard), sādhāraṇa-dharma (shared quality), vācaka (word of comparison).\n\n### 2. Rūpaka (Metaphor) — \"is\"\nIdentification without comparison word. The upameya IS the upamāna.\n\n> tava mukhaṃ candraḥ (your face IS the moon)\n> saṃsāra-sāgaraḥ (saṃsāra IS an ocean)\n> jñāna-dīpaḥ (knowledge IS a lamp)\n> bhakti-sudhā (devotion IS nectar)\n> kṛpā-varṣaḥ (grace IS rain)\n\n### 3. Anuprāsa (Alliteration)\nRepetition of consonant sounds.\n\n> **śa**mbhuṃ **śa**ṅkaraṃ **śā**ntaṃ **śi**vam\n> (alliteration of **ś**)\n\n> **ka**ruṇā-**ka**lita-**kā**nti-**ka**malam\n> (alliteration of **k**)\n\nTypes:\n- **Chekānuprāsa:** same consonant cluster repeated (e.g., \"nta nta\")\n- **Vṛttyanuprāsa:** single consonant repeated throughout\n\n### 4. Yamaka (Rhyme/Punning Repetition)\nSame syllable sequence repeated with different meanings.\n\n> kālī kālī kālī — dark goddess / time / black\n> rāma-rāma — Rāma + pleasure\n\n### 5. Utprekṣā (Poetic Fancy/Hyperbole)\n\"As if\" — iva, manyate, kalpyate.\n\n> tava netraṃ padmam iva vikasati\n> (your eye blooms as if it were a lotus)\n\n### 6. Atiśayokti (Hyperbole)\nExtreme exaggeration for effect.\n\n> tava yaśaḥ diśaḥ pūrayati\n> (your fame fills all directions)\n\n### 7. Virodha (Paradox)\nApparent contradiction that reveals deeper truth.\n\n> agninā śītalaḥ (cool with fire — Śiva drinks fire but remains cool)\n> mṛtyoḥ amṛtam (from death, immortality)\n\n### 8. Arthāntaranyāsa (Corroboration)\nA general statement followed by a specific example, or vice versa.\n\n> mahātmanāṃ prabhāvaḥ anirvacanīyaḥ / yathā śivaḥ viṣaṃ pītvā nīlakaṇṭhaḥ abhavat\n> (The power of great souls is indescribable — as when Śiva drank poison and became blue-throated)\n\n## Adorning a Simple Verse\n\n### Without alaṅkāra:\n> namāmi devīṃ sundarīṃ karuṇāmayīm\n> (I bow to the beautiful, compassionate goddess)\n\n### With upamā:\n> candra-mukhīṃ devīṃ gaṅgā-sadṛśa-kṛpāṃ namāmi\n> (I bow to the goddess whose face is like the moon, whose grace resembles the Gaṅgā)\n\n### With rūpaka:\n> karuṇā-sindhuṃ jñāna-dīpam devīṃ namāmi\n> (I bow to the goddess who is an ocean of compassion, a lamp of knowledge)\n\n### With anuprāsa:\n> śāntāṃ śubhāṃ śivāṃ śaktiṃ devīṃ namāmi\n> (alliteration of **ś** throughout)\n\n## Milestone Check\nCan you take a plain stotra verse and adorn it with at least 2 different alaṅkāras?\n", "reference": "# Stage 24: Alaṅkāra — Reference Guide\n\n## Alaṅkāra Quick Table\n\n| Alaṅkāra | Type | Marker | Example |\n|-----------|------|--------|---------|\n| Upamā | Śabdālaṅkāra | iva, yathā, sadṛśa | mukhaṃ candra iva |\n| Rūpaka | Arthālaṅkāra | direct identification | karuṇā-sindhuḥ |\n| Anuprāsa | Śabdālaṅkāra | repeated consonant | śambhuṃ śaṅkaraṃ śāntam |\n| Yamaka | Śabdālaṅkāra | repeated syllable group | — |\n| Utprekṣā | Arthālaṅkāra | iva (fancy) | netraṃ padmam iva |\n| Atiśayokti | Arthālaṅkāra | extreme statement | yaśaḥ diśaḥ pūrayati |\n| Virodha | Arthālaṅkāra | paradox | agninā śītalaḥ |\n| Svabhāvokti | Arthālaṅkāra | vivid description | — |\n| Arthāntaranyāsa | Arthālaṅkāra | general + specific | — |\n\n## Upamā Components\n\n| Term | Role | In: mukhaṃ candra iva śobhate |\n|------|------|------|\n| Upameya | thing compared | mukham (face) |\n| Upamāna | standard | candra (moon) |\n| Sādhāraṇa-dharma | shared quality | śobhā (beauty) |\n| Vācaka | comparison word | iva (like) |\n\n## Comparison Words (Vācaka)\n\n| Sanskrit | Meaning |\n|----------|---------|\n| iva | like, as if |\n| yathā | as, like |\n| sadṛśa | resembling |\n| tulya | equal to |\n| samāna | same as |\n| nibha | resembling |\n| prakhya | appearing like |\n| kalpa | almost like |\n\n## Ready-Made Rūpakas (Metaphors)\n\n| Rūpaka | Literal | Applied Meaning |\n|--------|---------|-----------------|\n| karuṇā-sindhuḥ | ocean of compassion | extremely compassionate deity |\n| jñāna-dīpaḥ | lamp of knowledge | source of illumination |\n| bhakti-sudhā | nectar of devotion | devotion that gives immortality |\n| saṃsāra-sāgaraḥ | ocean of worldly existence | vast, hard to cross |\n| kṛpā-varṣaḥ | rain of grace | abundant grace |\n| moha-tamas | darkness of delusion | spiritual ignorance |\n| dharma-sūryaḥ | sun of dharma | illuminating righteousness |\n| prema-latā | vine of love | growing, clinging love |\n| māyā-jālam | net of māyā | entangling illusion |\n| jīvana-nadī | river of life | flowing existence |\n\n## Anuprāsa Consonant Groups for Deity Praise\n\n| Sound | Words Available |\n|-------|----------------|\n| ś- | śiva, śambhu, śaṅkara, śānta, śubha, śakti, śaraṇa, śreṣṭha |\n| k- | kṛṣṇa, karuṇā, kamala, kānti, kṛpā, kīrti, kalā, kailāsa |\n| m- | mahā, mālā, mandira, mādhava, mukha, mokṣa, mūrti, maṅgala |\n| d- | deva, devī, durgā, divya, dayā, darśana, dāna, dīpa |\n| n- | namāmi, nīla, nitya, nadī, nātha, nṛtya, naṭa |\n| p- | padma, pāhi, pavitra, pūjā, prabhu, prasāda, priya, prema |\n\n## Adornment Process\n\n1. **Write plain verse** (correct grammar + meter)\n2. **Identify plain nouns** that could become rūpakas\n3. **Add iva/yathā** comparisons where natural\n4. **Check for anuprāsa opportunities** — can you alliterate?\n5. **Verify meter still works** after changes\n", "workbook-questions": "# Stage 24: Alaṅkāra — Workbook (Questions)\n\n## Section A: Identification (15 marks)\n**A1.** Identify the alaṅkāra in each (10 marks):\n1. tava mukhaṃ candraḥ iva bhāti → ___\n2. karuṇā-sindho! pāhi mām → ___\n3. śambhuṃ śaṅkaraṃ śāntaṃ śivam → ___\n4. tava yaśaḥ sarvā diśaḥ pūrayati → ___\n5. agninā śītalaḥ śivaḥ → ___\n\n**A2.** For A1 #1, identify the four components of the upamā (5 marks):\nUpameya: ___  Upamāna: ___  Sādhāraṇa-dharma: ___  Vācaka: ___\n\n## Section B: Creation (20 marks)\n**B1.** Write one upamā (simile) comparing your iṣṭadevatā to a natural object (5 marks):\n**B2.** Write one rūpaka (metaphor) — use a compound like X-sindhu or X-dīpa (5 marks):\n**B3.** Write a line with anuprāsa (alliteration) — at least 4 words starting with the same consonant (5 marks):\n**B4.** Write a line using utprekṣā (poetic fancy) with \"iva\" (5 marks):\n\n## Section C: Adornment (25 marks)\n**C1.** Take this plain verse and adorn it with at least 2 alaṅkāras. Show before and after (15 marks):\nPlain: namāmi devīṃ karuṇāmayīṃ sundarīṃ pavitrām\n\n**C2.** Compose an original 4-line stotra using at least 3 different alaṅkāras. Label each (10 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 24: Alaṅkāra — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **Upamā** (simile — \"iva\" = like)\n2. **Rūpaka** (metaphor — called \"ocean of compassion\" directly)\n3. **Anuprāsa** (alliteration of ś-)\n4. **Atiśayokti** (hyperbole — fame fills all directions)\n5. **Virodha** (paradox — cool by fire)\n\n**A2.** Upameya: **mukham** (face). Upamāna: **candra** (moon). Sādhāraṇa-dharma: **bhāti/śobhā** (shining/beauty). Vācaka: **iva** (like).\n\n## Section B\n**B1.** Sample upamā: **tava kṛpā gaṅgā iva pavitrā** (your grace is pure like the Gaṅgā)\n**B2.** Sample rūpaka: **he karuṇā-sindho!** (O ocean of compassion!) or **jñāna-dīpa śiva** (Śiva, lamp of knowledge)\n**B3.** Sample anuprāsa: **śāntaṃ śubhaṃ śivaṃ śaṅkaraṃ bhaje** (alliteration of ś)\n**B4.** Sample utprekṣā: **tava netraṃ nīlotpalam iva vikasati** (your eye blooms as if it were a blue lotus)\n\n## Section C\n**C1.**\nPlain: namāmi devīṃ karuṇāmayīṃ sundarīṃ pavitrām\nAdorned:\n> **candra-mukhīṃ** [rūpaka] karuṇā-**sindhu**-samānāṃ [rūpaka + upamā]\n> **mā**yā-hariṇīṃ **mā**ngalya-**mā**linīṃ [anuprāsa of m]\n> devīṃ namāmi\n\n**C2.** Sample 4-line stotra:\n1. candra-vadanaṃ [rūpaka] devam namāmi (face-as-moon)\n2. śambhuṃ śaṅkaraṃ śāntaṃ śivam [anuprāsa: ś]\n3. yasya kṛpā gaṅgā iva pavitrā [upamā: grace like Gaṅgā]\n4. taṃ karuṇā-sāgaraṃ prapadye [rūpaka: ocean of compassion]\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 24 Badge: Alaṅkāravit\n\n**Title:** Ornament Master\n**Badge:** 🏅 Alaṅkāravit\n\n## Requirements\n\nCompose a verse using 3 distinct alaṅkāras (e.g., upamā, rūpaka, anuprāsa). Identify each ornament.\n\n## How to Demonstrate\n\n**Format:** Text post with annotation\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 25 content and grants the **Alaṅkāravit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "25-rasa", "number": 25, "title": "Rasa", "subtitle": "Emotional Aesthetics", "files": {"theory": "# Stage 25: Rasa — Emotional Aesthetics\n\n## Goal\nConsciously control the rasa (aesthetic flavor) of your devotional composition. Describe the same deity in śānta, vīra, adbhuta, karuṇa, and other rasas.\n\n## The Nine Rasas (Navarasa)\n\n| Rasa | Sthāyibhāva (root emotion) | Mood | Color |\n|------|---------------------------|------|-------|\n| Śṛṅgāra | Rati (love) | Romantic, beautiful | Green |\n| Hāsya | Hāsa (laughter) | Comic, playful | White |\n| Karuṇa | Śoka (grief) | Compassionate, sad | Grey |\n| Raudra | Krodha (anger) | Furious, wrathful | Red |\n| Vīra | Utsāha (heroism) | Heroic, brave | Orange |\n| Bhayānaka | Bhaya (fear) | Terrifying | Black |\n| Bībhatsa | Jugupsā (disgust) | Revolting | Blue |\n| Adbhuta | Vismaya (wonder) | Wondrous, magical | Yellow |\n| Śānta | Śama (peace) | Serene, transcendent | White/clear |\n\n## Rasa in Devotional Context\n\nDifferent rasas reveal different facets of the same deity:\n\n### Śiva in Five Rasas\n\n**Śānta (Peace):**\n> dhyāna-sthitaḥ śāntaḥ sadāśivaḥ / nirañjanaḥ nirguṇaḥ nirvikāraḥ\n> (Meditative, peaceful, eternal Śiva — stainless, beyond qualities, unchanging)\n\n**Vīra (Heroic):**\n> tripurāntakaḥ saṃhāra-mūrtiḥ / triśūla-dhārī raudra-naṭarājaḥ\n> (Destroyer of Tripura, embodiment of dissolution, trident-wielding, fierce cosmic dancer)\n\n**Adbhuta (Wonder):**\n> aho! ardhanaṭeśvaraḥ! ardhaṃ strī ardhaṃ puruṣaḥ! / ko'yaṃ māhātmyam!\n> (Oh! The half-woman lord! Half female, half male! What is this greatness!)\n\n**Karuṇa (Compassion):**\n> kṛpāluḥ śivaḥ duḥkhitānāṃ śaraṇam / dīnānāṃ bandhuḥ, ārtānām trātā\n> (Compassionate Śiva, refuge of the suffering, friend of the wretched, rescuer of the distressed)\n\n**Śṛṅgāra (Beauty):**\n> candraśekharaḥ sumukhāḥ / pārvatyā saha kailāse ramate\n> (Moon-crested, beautiful-faced, he sports with Pārvatī on Kailāsa)\n\n## Rasa Control Techniques\n\n### Vocabulary Selection\n| Rasa | Choose words like... |\n|------|---------------------|\n| Śānta | śānta, nirañjana, akhaṇḍa, nitya, sthira |\n| Vīra | jayati, vijaya, parākrama, śūra, bala |\n| Karuṇa | kṛpā, dayā, dīna, ārt, trāhi, duḥkha |\n| Adbhuta | aho!, adbhuta, āścarya, citraṃ, apūrva |\n| Raudra | krodha, ugra, pralaya, dahana, garjana |\n\n### Meter Selection\nŚānta → slow meters (Mandākrāntā). Vīra → powerful meters (Śārdūlavikrīḍita). Karuṇa → flowing meters (Vasantatilakā).\n\n### Sentence Structure\nŚānta → simple declaratives. Vīra → exclamatory, active verbs. Karuṇa → pleas, conditionals. Adbhuta → questions, exclamations.\n\n## The Game: \"Change the Darśana\"\n\nGiven one deity, rapidly switch between rasas — same deity, different emotional lens. The words, meter, alaṅkāras, and sentence structures all change.\n\n## Milestone Check\nCan you compose 4 short passages about one deity, each in a consciously different rasa, and explain what makes each passage that rasa?\n", "reference": "# Stage 25: Rasa — Reference Guide\n\n## Navarasa Vocabulary Banks\n\n### Śānta\nśānta, nitya, akhaṇḍa, nirañjana, nirguṇa, nirvikāra, sthira, dhīra, yoga, dhyāna, samādhi, ātman, brahman, mokṣa, turīya, kaivalya, avyaya, acintyam\n\n### Vīra\nvijaya, jayati, jitam, parākrama, śūra, bala, vīrya, siṃha, garjana, praharaṇa, khaḍga, cāpa, śara, yuddha, saṃgrāma, raṇa, krodha, abhaya\n\n### Karuṇa\nkṛpā, dayā, karuṇā, dīna, ārt, duḥkhita, hā!, trāhi, pāhi, śaraṇa, bandhu, mātar, netra-jala (tears), rudan, vilāpa, snigdha\n\n### Adbhuta\naho!, āścaryam, citraṃ, adbhutam, apūrvam, ko'yam, kīdṛśam, māhātmya, prabhāva, vismaya, akathya, anirvacana, līlā, māyā\n\n### Raudra\nugra, krodha, pralaya, saṃhāra, dahana, jvālā, bhīma, bhayaṅkara, rākṣasa, asura, garjana, huṅkāra, tāṇḍava, kāla\n\n### Śṛṅgāra\nsundara, rūpa, lāvaṇya, kānti, kāma, priya, vallabha, līlā, vilāsa, smita, hāsa, manda, kusuma, candana, mālya\n\n### Bhayānaka\nbhaya, trāsa, kamp, vepathu, palāyana, ghora, karāla, timira, pretāḥ, piśāca, mṛtyu, yama\n\n## Rasa-Meter Pairings\n\n| Rasa | Best Meters | Reason |\n|------|------------|--------|\n| Śānta | Mandākrāntā, Mālinī | Slow, meditative |\n| Vīra | Śārdūlavikrīḍita, Indravajrā | Powerful, stately |\n| Karuṇa | Vasantatilakā, Mandākrāntā | Flowing, emotional |\n| Adbhuta | Sragdharā, Śārdūlavikrīḍita | Grand, expansive |\n| Śṛṅgāra | Vasantatilakā, Mālinī | Beautiful, ornate |\n| Raudra | Śārdūlavikrīḍita | Forceful |\n\n## Rasa Indicators in Composition\n\n| Element | Śānta | Vīra | Karuṇa |\n|---------|-------|------|--------|\n| Verb mood | Declarative | Imperative | Optative/plea |\n| Sentence length | Long, flowing | Short, punchy | Medium, broken |\n| Alaṅkāra | Upamā (serene) | Atiśayokti | Virodha, utprekṣā |\n| Deity aspect | Meditating | Fighting | Rescuing |\n| Reader response | Calm | Inspired | Moved |\n", "workbook-questions": "# Stage 25: Rasa — Workbook (Questions)\n\n## Section A: Identification (10 marks)\nIdentify the dominant rasa in each passage:\n1. dhyāna-sthitaḥ nirañjanaḥ nirguṇaḥ sadāśivaḥ → ___\n2. aho! ko'yaṃ māhātmyam! naṭarājaḥ nṛtyati! → ___\n3. he mātar! dīno'smi, trāhi mām duḥkhāt → ___\n4. jayati jayati vīraḥ tripurāntakaḥ! → ___\n5. sundaraṃ śivaṃ pārvatyā saha kailāse ramate → ___\n\n## Section B: Rasa Composition (30 marks)\nChoose one deity. Compose a 3-line passage in each rasa:\n**B1.** Śānta (6 marks): ___\n**B2.** Vīra (6 marks): ___\n**B3.** Karuṇa (6 marks): ___\n**B4.** Adbhuta (6 marks): ___\n**B5.** Śṛṅgāra (6 marks): ___\n\n## Section C: Analysis (10 marks)\n**C1.** Take any famous stotra you know. Identify its dominant rasa. What vocabulary, meter, and sentence patterns make it that rasa? (10 marks)\n\n## Section D: Controlled Shift (10 marks)\n**D1.** Take the sentence \"namāmi śivam\" and expand it into 4 different versions — one for each rasa (śānta, vīra, karuṇa, adbhuta). Each version should be 2-3 lines.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 25: Rasa — Workbook (Answers)\n\n## Section A\n1. **Śānta** (dhyāna, nirañjana, nirguṇa = peace vocabulary)\n2. **Adbhuta** (aho!, ko'yam = wonder exclamations)\n3. **Karuṇa** (dīna, trāhi, duḥkha = compassion/sorrow)\n4. **Vīra** (jayati, vīra, tripurāntaka = heroic)\n5. **Śṛṅgāra** (sundara, ramate, kailāse = beauty/love)\n\n## Section B — Samples for Śiva\n**B1.** Śānta: nityo nirmalaḥ nirguṇaḥ sadāśivaḥ / akhaṇḍānanda-rūpaḥ svayam-prakāśaḥ / tasmin dhyāna-sthite sarvaṃ śāntam\n**B2.** Vīra: jayati tripurāntakaḥ! jayati saṃhāra-mūrtiḥ! / triśūla-hasta ugra-rūpaḥ śivaḥ asurān nihanti!\n**B3.** Karuṇa: he kṛpālo! he dayānidhe! / dīno'smi, ārtaḥ asmi, trāhi mām / tava kṛpā vinā ko me śaraṇam?\n**B4.** Adbhuta: aho! kīdṛśaṃ rūpam! ardhaṃ strī ardhaṃ puruṣaḥ! / viṣaṃ pītvā nīlakaṇṭhaḥ — ko'yaṃ prabhāvaḥ!\n**B5.** Śṛṅgāra: candra-mukhāḥ smita-sundaraḥ / pārvatyā saha mandāra-vane viharati / manda-vātena jaṭā calanti\n\n## Section C\nAccept any well-reasoned analysis. Example: Rudram (Śrī Rudram) — dominant rasa is **Adbhuta** mixed with **Bhayānaka** and **Śānta**. Vocabulary includes ugra, bhīma, ghora (fearful) but also śiva, śānta, mayaskara (benevolent). The Vedic triṣṭubh meter provides power. Paradoxical descriptions (terrible yet benign) create sustained wonder.\n\n## Section D — Samples\n**Śānta:** namāmi śivaṃ nityaṃ nirañjanam / dhyāna-sthitam ākāśa-sadṛśam / sarvam asya praśāntam\n**Vīra:** namāmi śivaṃ saṃhāra-mūrtim / yasya triśūla-prasāreṇa asuratrayam naṣṭam / jayati mahāvīraḥ!\n**Karuṇa:** namāmi śivaṃ karuṇā-sindhum / he dīna-bandho! mama duḥkhaṃ paśya / tava caraṇe patito'smi\n**Adbhuta:** namāmi śivam — aho adbhutam! / yaḥ viṣam pītvā amṛtaṃ dadāti / yasya ardhāṅge devī vasati — kiṃ citraṃ!\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 25 Badge: Rasavit\n\n**Title:** Rasa Artist\n**Badge:** 🏅 Rasavit\n\n## Requirements\n\nCompose 3 short verses, each in a different rasa (e.g., śṛṅgāra, karuṇa, vīra). Explain how word choice creates the rasa.\n\n## How to Demonstrate\n\n**Format:** Text post with commentary\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 26 content and grants the **Rasavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "26-darshana", "number": 26, "title": "Darshana", "subtitle": "Philosophical Expression", "files": {"theory": "# Stage 26: Darśana — Philosophical Expression\n\n## Goal\nDescribe the deity as consciousness, time, śakti, and other philosophical tattvas. Make philosophy become poetry.\n\n## Core Philosophical Concepts for Poetic Use\n\n### Brahman / Ātman\n> tvam eva sarvam — you alone are everything\n> sacchidānanda-rūpa — whose nature is being-consciousness-bliss\n> nityam, śuddham, buddham, muktam — eternal, pure, awake, free\n\n### Māyā / Prakṛti\n> māyādhīśa — lord of illusion\n> prakṛti-puruṣa — nature and consciousness\n> nāma-rūpa-vilāsa — the play of name and form\n\n### Kāla (Time)\n> kālātīta — beyond time\n> mahākāla — great time (Śiva as time itself)\n> kālasya kālaḥ — the time of time (death of death)\n\n### Śakti (Power)\n> cit-śakti — consciousness-power\n> icchā-jñāna-kriyā — will, knowledge, action (the three śaktis)\n> parā-śaktiḥ — supreme power\n\n### Pañca-kṛtya (Five Acts)\n> sṛṣṭi (creation), sthiti (maintenance), saṃhāra (dissolution), tirodhāna (concealment), anugraha (grace)\n\n## Philosophical Praise Patterns\n\n### Pattern 1: Neti-neti (not this, not this)\n> na strī na puruṣaḥ, na ca napuṃsakaḥ\n> na sthūlaḥ na sūkṣmaḥ, na dṛśyaḥ na śrāvyaḥ\n> sarvasya sākṣī, sarvasya adhiṣṭhānam\n\n### Pattern 2: Paradox as Praise\n> aṇoḥ aṇīyān mahato mahīyān (smaller than the small, greater than the great)\n> dūre ca antike ca (far and near)\n> sarva-gataḥ acalaḥ (all-pervading yet unmoving)\n\n### Pattern 3: Tattva Identification\n> tvaṃ ākāśaḥ, tvaṃ vāyuḥ, tvaṃ agniḥ, tvaṃ āpaḥ, tvaṃ pṛthivī\n> tvaṃ sarvam idam — you are all this\n\n### Pattern 4: Philosophical Epithets\n> caitanya-rūpa (consciousness-formed)\n> ānanda-ghana (mass of bliss)\n> jñāna-svarūpa (knowledge-natured)\n> sat-cit-ānanda (being-consciousness-bliss)\n> svayam-prakāśa (self-luminous)\n\n## The Game: \"Praise Through Tattva\"\n\nInstead of praising a deity's form (eyes, arms), praise through philosophical categories:\n\n> he śiva! tvaṃ caitanyam, tvaṃ ākāśaḥ\n> tvaṃ kālaḥ, tvaṃ kālātītaḥ\n> tvayi sṛṣṭiḥ, tvayi sthitiḥ, tvayi layaḥ\n> tvam advayam brahma, nānyat kiñcit\n\n## Key Philosophical Terms for Poetry\n\n| Sanskrit | Meaning |\n|----------|---------|\n| advaya / advaita | non-dual |\n| nirguṇa / saguṇa | without/with qualities |\n| nirmala | stainless |\n| nirañjana | untainted |\n| nirākāra / sākāra | formless / with form |\n| svayam-bhū | self-born |\n| svayam-prakāśa | self-luminous |\n| anādi | beginningless |\n| ananta | endless |\n| aprameya | immeasurable |\n\n## Milestone Check\nCan you praise your deity philosophically — describing them as consciousness, time, and śakti — making it sound like poetry, not a textbook?\n", "reference": "# Stage 26: Darśana — Reference Guide\n\n## Philosophical Vocabulary by Category\n\n### Being/Reality: sat, satya, tattva, vastu, svarūpa, bhūta, padārtha\n### Consciousness: cit, caitanya, bodha, prajñā, saṃvit, prakāśa\n### Bliss: ānanda, sukha, hlāda, tuṣṭi, muda\n### Non-duality: advaita, advaya, eka, kevala, kaivalya\n### Transcendence: nirguṇa, nirākāra, nirañjana, nirmala, nirvikāra, niṣkala\n### Immanence: saguṇa, sākāra, viśvarūpa, sarva-gata, antaryāmin\n### Time: kāla, mahākāla, nitya, sanātana, anādi, ananta, kṣaṇa\n### Power: śakti, parā, icchā, jñāna, kriyā, māyā, prakṛti, vibhūti\n### Cosmology: sṛṣṭi, sthiti, saṃhāra, tirodhāna, anugraha\n\n## Paradox Pairs for Poetic Use\n| Pair | Meaning |\n|------|---------|\n| aṇu / vibhu | atomic / all-pervading |\n| nirguṇa / saguṇa | qualityless / with qualities |\n| nirākāra / viśvarūpa | formless / universal form |\n| niṣkriya / sarvakartā | actionless / doer of all |\n| śūnya / pūrṇa | empty / full |\n| eka / aneka | one / many |\n| dūra / antika | far / near |\n| avyakta / vyakta | unmanifest / manifest |\n\n## Model Philosophical Verses\n### Dakṣiṇāmūrti Stotra (Ādi Śaṅkara):\n> viśvaṃ darpaṇa-dṛśyamāna-nagarī-tulyaṃ nijāntargatam\n> (The universe is like a city reflected in a mirror, contained within the self)\n\n### Śvetāśvatara Upaniṣad:\n> eko devaḥ sarvabhūteṣu gūḍhaḥ sarvavyāpī sarvabhūtāntarātmā\n> (One god hidden in all beings, all-pervading, inner self of all beings)\n\n## Template: Philosophical Stotra\n```\ntvaṃ [tattva-1], tvaṃ [tattva-2], tvaṃ [tattva-3]\ntvayi [cosmic act], tvayi [cosmic act]\ntvam [paradox-A] ca [paradox-B] ca\nnamo [philosophical epithet]\n```\n", "workbook-questions": "# Stage 26: Darśana — Workbook (Questions)\n\n## Section A: Vocabulary (10 marks)\nGive the Sanskrit for: 1. non-dual  2. self-luminous  3. being-consciousness-bliss  4. formless  5. beyond time\nGive the meaning of: 6. nirañjana  7. svayam-bhū  8. antaryāmin  9. aprameya  10. kaivalya\n\n## Section B: Philosophical Praise (25 marks)\n**B1.** Write a 4-line praise of your deity as consciousness (caitanya) (10 marks):\n**B2.** Write a 4-line praise using the paradox technique (aṇu yet vibhu, near yet far, etc.) (10 marks):\n**B3.** Write a \"tvaṃ... tvaṃ...\" passage identifying the deity with the five elements (5 marks):\n\n## Section C: Philosophy as Poetry (25 marks)\n**C1.** Compose a 6-line philosophical stotra that a reader would find *beautiful*, not merely correct. Use at least 2 alaṅkāras alongside the philosophical content (15 marks):\n**C2.** Take a philosophical concept (māyā, advaita, or pañca-kṛtya) and express it as a 4-line devotional verse (10 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 26: Darśana — Workbook (Answers)\n\n## Section A\n1. **advaita/advaya** 2. **svayam-prakāśa** 3. **saccidānanda** 4. **nirākāra** 5. **kālātīta**\n6. untainted/spotless 7. self-born 8. inner controller/self 9. immeasurable 10. absolute aloneness/liberation\n\n## Section B\n**B1.** Sample: caitanya-rūpa! tvaṃ sarvasya sākṣī / na tvaṃ dṛśyaḥ, kintu draṣṭā tvam eva / tava prakāśena jagatī bhāti / namo namo jñāna-svarūpāya\n\n**B2.** Sample: aṇoḥ aṇīyān mahato mahīyān / dūre ca antike ca sadā vasasi / nirguṇaḥ saguṇaś ca tvam eva / nirākāraḥ viśvarūpaś ca tvam\n\n**B3.** Sample: tvaṃ pṛthivī, tvaṃ āpaḥ, tvaṃ tejaḥ / tvaṃ vāyuḥ, tvaṃ ākāśam / tvaṃ sarvam idam viśvam\n\n## Section C\n**C1.** Sample: viśvaṃ darpaṇe nagarī iva [upamā] tava antare bhāti / tvaṃ caitanya-sindhuḥ [rūpaka], jagat taraṅgāḥ tava / sṛṣṭiṃ karosi līlayā, saṃhāram api līlayā / nirguṇaḥ saguṇaś ca eka eva tvam / aho māyā-vilāsa! [adbhuta-rasa] / namo namo advaya-brahmaṇe tubhyam\n\n**C2.** Sample (Māyā): māyayā āvṛtaṃ jagat sarvaṃ / rajju-sarpa-nyāyena bhāti nānātvam / kintu eka-rūpaḥ tvam eva asti / māyāpatiṃ prapadye tam advayam\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 26 Badge: Darśanavit\n\n**Title:** Philosopher-Poet\n**Badge:** 🏅 Darśanavit\n\n## Requirements\n\nExpress a Vedāntic or Tāntric concept as a 4-line verse. Post with a prose explanation of the philosophical content.\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 27 content and grants the **Darśanavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "27-samasyapurana", "number": 27, "title": "Samasyapurana", "subtitle": "Backwards Composition", "files": {"theory": "# Stage 27: Samasyāpūraṇa — Backwards Composition\n\n## Goal\nGiven a strange, out-of-context pāda (line), construct the remaining pādas so the whole verse makes sense. This is the foundational avadhāna skill — deriving context creatively from a constraint.\n\n## What is Samasyāpūraṇa?\n\n**Samasya** = problem/puzzle. **Pūraṇa** = completion. You receive one pāda (quarter-verse) — often one that seems bizarre or contradictory in isolation — and must compose the remaining three pādas to create a coherent, meaningful verse.\n\n## The Method\n\n### Step 1: Analyze the given pāda\n- What is the literal meaning?\n- What meter is it in? (count syllables, determine pattern)\n- What are the key words?\n\n### Step 2: Find a context that makes the pāda sensible\n- Is there a deity story where this makes sense?\n- Can the words be reinterpreted through sandhi-splitting differently?\n- Is there a philosophical reading?\n\n### Step 3: Compose the surrounding pādas\n- Match the meter\n- Build up to the given pāda naturally\n- The verse should feel inevitable — the given pāda should seem the perfect conclusion\n\n## Example\n\n**Given pāda (d):** viṣaṃ pītvā sukhī bhavat\n(\"He drank poison and became happy\" — seems absurd!)\n\n**Solution:** Create context where this makes sense → Śiva drinking hālāhala!\n\n> devāsura-samudra-manthane purā (a)\n> hālāhalaṃ viṣaṃ samutthitam (b)\n> jagad-rakṣārthaṃ maheśvaraḥ (c)\n> **viṣaṃ pītvā sukhī bhavat** (d)\n\nNow the meaning is clear: \"During the churning of the ocean, terrible poison arose. For the world's protection, Maheśvara drank the poison and was content.\"\n\n## Another Example\n\n**Given pāda:** agnau śītalatā katham\n(\"How can there be coolness in fire?\" — paradox!)\n\n**Solution:** Connect to Prahlāda story — Prahlāda survived the fire through Viṣṇu's grace.\n\n> viṣṇu-bhakta-prahlādasya\n> hiraṇyakaśipor bhayāt\n> agnimadhye sthitasyāpi\n> **agnau śītalatā katham?** → because of Viṣṇu's kṛpā!\n\n## Strategy Tips\n\n1. **Mythological context** — most \"impossible\" pādas become possible in the context of a deity's līlā\n2. **Sandhi re-analysis** — break sandhi differently to find new meanings\n3. **Metaphorical reading** — \"fire\" might mean \"anger,\" \"drinking poison\" might mean \"absorbing criticism\"\n4. **Double meaning (śleṣa)** — words with multiple meanings open new contexts\n\n## Practice Format\n\nYou will be given a pāda. Compose the remaining 3 pādas to make a complete anuṣṭubh śloka. Each pāda should be 8 syllables.\n\n## Milestone Check\nCan you complete a samasyāpūraṇa — given a strange pāda, construct a coherent verse around it — within 10 minutes?\n", "reference": "# Stage 27: Samasyāpūraṇa — Reference Guide\n\n## Problem-Solving Approaches\n\n| Approach | When to Use | Example |\n|----------|------------|---------|\n| Mythological | Pāda describes impossible physical feat | \"drank poison\" → Śiva/hālāhala |\n| Philosophical | Pāda contains paradox | \"formless yet formed\" → Brahman |\n| Śleṣa (double meaning) | Words have multiple meanings | \"go\" = cow/earth/speech |\n| Sandhi re-analysis | Break words differently | \"tapobhiḥ\" → tapaḥ + abhiḥ or tapo + bhiḥ |\n| Metaphorical | Literal reading absurd | \"fire\" = anger, \"ocean\" = saṃsāra |\n| Narrative twist | Set up a story context | Begin with \"once upon a time...\" |\n\n## Common Mythological Rescue Contexts\n\n| Strange Claim | Deity/Story Context |\n|--------------|-------------------|\n| Drank poison, was happy | Śiva + hālāhala |\n| Fire was cool | Prahlāda + Narasiṃha |\n| Ocean was crossed | Hanumān / Rāma's bridge |\n| Mountain was lifted | Kṛṣṇa + Govardhana |\n| Moon on the head | Śiva + Candraśekhara |\n| River on the hair | Śiva + Gaṅgā |\n| Ten heads destroyed | Rāma + Rāvaṇa |\n| Elephant face | Gaṇeśa |\n| Half woman, half man | Ardhanārīśvara |\n\n## Composition Checklist for Samasyāpūraṇa\n\n1. ☐ Given pāda: note exact syllable count and pattern\n2. ☐ Identify meter (usually anuṣṭubh)\n3. ☐ Find a context that naturalizes the given pāda\n4. ☐ Compose pāda a (set the scene)\n5. ☐ Compose pāda b (develop)\n6. ☐ Compose pāda c (transition to the given pāda)\n7. ☐ Given pāda falls naturally as conclusion\n8. ☐ Verify meter in all 4 pādas\n9. ☐ Check that the whole verse is coherent\n\n## Words with Multiple Meanings (Śleṣa Resources)\n\n| Word | Meaning 1 | Meaning 2 | Meaning 3 |\n|------|-----------|-----------|-----------|\n| go | cow | earth | speech |\n| hari | Viṣṇu | lion | monkey |\n| kāla | time | black
