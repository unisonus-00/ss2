lue) + **kaṇṭha** (throat) = Nīlakaṇṭha (Śiva)\n- **catur** (four) + **bhuja** (arm) = Caturbhuja (Viṣṇu)\n- **tri** (three) + **netra** (eye) = Trinetra (Śiva)\n\n### From Actions\n- **√hṛ** (to remove) → Hara (the remover)\n- **√pā** (to protect) → Gopāla (cow-protector = Kṛṣṇa)\n- **√dhṛ** (to bear) → Gaṅgādhara (bearer of Gaṅgā)\n\n### From Relationships\n- **pārvata** (of the mountain) → Pārvatī (daughter of Parvata)\n- **dāśarathi** (son of Daśaratha) → Rāma\n- **umā + pati** → Umāpati (Śiva, husband of Umā)\n\n## The 108 Names Forge Game\n\nGiven a deity, generate epithets by combining:\n1. A quality + a body part → nīla-kaṇṭha\n2. An action + an object → gaṅgā-dhara\n3. A number + an attribute → tri-locana\n4. A relationship + a title → umā-pati\n5. A negation + a quality → a-mara (not dying = immortal)\n\n## Milestone Check\n\nCan you explain the etymology of at least 10 divine epithets and generate 5 new grammatically valid ones?\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Synonym bricks | padma/kamala/aravinda (lotus), sūrya/bhāskara/ravi (sun), jala/vāri/nīra (water), candra/śaśin/indu (moon) | Any noun-slot in your sentences — these are interchangeable bricks of the same shape and meaning, letting you swap for metrical fit or poetic variety without changing the structure |\n\n**Try snapping**: Rewrite a devotional sentence from Stage 7 three times, each time replacing a key noun with a different synonym brick — e.g., \"bhaktaḥ **padmam** arpayati\" → \"bhaktaḥ **kamalam** arpayati\" → \"bhaktaḥ **aravindam** arpayati\" — and notice how the rhythm changes while the meaning stays the same.\n", "reference": "# Stage 10: Paryāya — Reference Guide\n\n## Synonyms by Category\n\n### Deities — Śiva (40 names)\nśivaḥ, śambhuḥ, śaṅkaraḥ, mahādevaḥ, maheśvaraḥ, rudraḥ, haraḥ, īśaḥ, īśānaḥ, bhavaḥ, paśupatiḥ, nīlakaṇṭhaḥ, gaṅgādharaḥ, candraśekharaḥ, trilocanaḥ, naṭarājaḥ, tryambakaḥ, bhairavaḥ, vāmadevaḥ, sadāśivaḥ, umāpatiḥ, giriśaḥ, girīśaḥ, mṛḍaḥ, kapardī, digambaraḥ, bhūteśvaraḥ, vṛṣabhadhvajaḥ, pinākapāṇiḥ, tripurāntakaḥ, viśvanāthaḥ, bhīmaḥ, ugraḥ, kālakālaḥ, dhūrjaṭiḥ, vyomakeśaḥ, liṅgadhārī, somanāthaḥ, ramaṇāthaḥ, kedāranāthaḥ\n\n### Deities — Viṣṇu (30 names)\nviṣṇuḥ, nārāyaṇaḥ, hariḥ, keśavaḥ, mādhavaḥ, govindaḥ, trivikramaḥ, vāmanaḥ, śrīdharaḥ, hṛṣīkeśaḥ, padmanābhaḥ, dāmodaraḥ, saṅkarṣaṇaḥ, vāsudevaḥ, pradyumnaḥ, aniruddhaḥ, puruṣottamaḥ, adhokṣajaḥ, nṛsiṃhaḥ, acyutaḥ, janārdanaḥ, upendraḥ, vanamālī, lakṣmīpatiḥ, garuḍadhvajaḥ, cakrapāṇiḥ, śārṅgadharaḥ, gadādharaḥ, pītāmbaraḥ, murāriḥ\n\n### Deities — Devī (25 names)\ndevī, ambā, ambikā, durgā, pārvatī, gaurī, lalitā, kāmākṣī, tripurasundarī, bhavānī, caṇḍikā, jagadambā, mahāmāyā, annapūrṇā, śāradā, umā, śaktiḥ, mahālakṣmī, mahāsarasvatī, bālā, rājarājeśvarī, bhairāvī, kālikā, tārā, mātaṅgī\n\n### Nature Synonyms\n\n**Sun:** sūryaḥ, ādityaḥ, bhāskaraḥ, divākaraḥ, savitā, arkaḥ, raviḥ, bhānuḥ, mārtaṇḍaḥ, mitraḥ, prabhākaraḥ, dinamaṇiḥ\n\n**Moon:** candraḥ, śaśī, induḥ, somaḥ, niśākaraḥ, sudhākaraḥ, himāṃśuḥ, mṛgāṅkaḥ, vidhuḥ, kaumudīpatiḥ, rākāpatiḥ, oṣadhīśaḥ\n\n**Lotus:** padmam, kamalam, aravindam, paṅkajam, sarasijam, vārijam, ambujam, nīrajam, jalajam, rajīvam, puṇḍarīkam, nalinam, utpalam\n\n**Water:** jalam, vāri, nīram, toyam, ambu, pānīyam, salilam, udakam, āpaḥ, payaḥ, kīlālam\n\n**Fire:** agniḥ, vahniḥ, analaḥ, pāvakaḥ, hutāśanaḥ, dahanaḥ, jvalanaḥ, kṛśānuḥ, śikhī, vaiśvānaraḥ, vibhāvasuḥ\n\n**Earth:** pṛthivī, bhūmiḥ, dharā, dharaṇī, vasundharā, medinī, avaniḥ, kṣitiḥ, kṣmā, mahī\n\n**Sky:** ākāśaḥ, gagaṇam, vyoma, ambaram, nabhaḥ, dyauḥ, antarikṣam, kham\n\n**Mountain:** parvataḥ, giriḥ, adriḥ, acalaḥ, śailaḥ, nagaḥ, bhūdharaḥ\n\n**Ocean:** samudraḥ, sāgaraḥ, sindhuḥ, abdhi, udadhi, jaladhi, ratnākaraḥ, pārāvāraḥ, ambhodhi, vāridhi\n\n## Epithet-Building Patterns\n\n| Pattern | Formula | Examples |\n|---------|---------|----------|\n| Quality + Body part | adj + noun | nīlakaṇṭha, raktanetra |\n| Object + Bearer | noun + √dhṛ | gaṅgādhara, śārṅgadhara |\n| Number + Feature | num + noun | trilocana, caturbhuja |\n| Action + Object | √verb + noun | tripurāntaka, madanāri |\n| Relation + Title | name + pati/suta | umāpati, daśarathasuta |\n| Location + Lord | place + īśa/nātha | kailāsanātha, kedāranātha |\n\n## Syllable Counts for Common Synonyms\n\n| Meaning | 2 syl | 3 syl | 4 syl | 5+ syl |\n|---------|-------|-------|-------|--------|\n| Śiva | ha-ra | śi-va-ḥ | śam-bhu-ḥ | ma-hā-de-vaḥ |\n| Sun | ar-kaḥ | ra-vi-ḥ | bhās-ka-raḥ | di-vā-ka-raḥ |\n| Moon | in-duḥ | can-draḥ | śa-śī | ni-śā-ka-raḥ |\n| Lotus | — | pad-mam | ka-ma-lam | a-ra-vin-dam |\n| Water | — | ja-lam | vā-ri | sa-li-lam |\n", "workbook-questions": "# Stage 10: Paryāya — Workbook (Questions)\n\n## Section A: Synonym Recall (15 marks)\n\n**A1.** Give at least 5 synonyms for each (15 marks, 1 mark each):\n1. Śiva: ___, ___, ___, ___, ___\n2. Lotus: ___, ___, ___, ___, ___\n3. Sun: ___, ___, ___, ___, ___\n\n---\n\n## Section B: Etymology of Epithets (15 marks)\n\n**B1.** Break down each epithet into its components and explain the meaning (10 marks):\n1. Nīlakaṇṭha = ___ + ___ → meaning: ___\n2. Gaṅgādhara = ___ + ___ → meaning: ___\n3. Trilocana = ___ + ___ → meaning: ___\n4. Padmanābha = ___ + ___ → meaning: ___\n5. Caturbhuja = ___ + ___ → meaning: ___\n6. Tripurasundarī = ___ + ___ → meaning: ___\n7. Jagadambā = ___ + ___ → meaning: ___\n8. Annapūrṇā = ___ + ___ → meaning: ___\n9. Gopāla = ___ + ___ → meaning: ___\n10. Vṛṣabhadhvaja = ___ + ___ → meaning: ___\n\n**B2.** Which dhātu (root) is behind each name? (5 marks):\n1. Hara ← √___\n2. Bhāskara ← √___\n3. Durgā ← √___\n4. Śaṅkara ← √___\n5. Divākara ← √___\n\n---\n\n## Section C: Synonym Usage (15 marks)\n\n**C1.** Replace the underlined word with a synonym of different syllable count (5 marks):\n1. **padmam** sundaram asti (use a 4-syllable synonym): ___\n2. **sūryaḥ** udeti (use a 2-syllable synonym): ___\n3. **jalam** pavitraṃ (use a 2-syllable synonym): ___\n4. **candraḥ** śobhate (use a 3-syllable synonym): ___\n5. **agniḥ** jvalati (use a 3-syllable synonym): ___\n\n**C2.** For the concept \"ocean,\" give synonyms of 3, 4, and 5 syllables (3 marks):\n- 3 syllables: ___\n- 4 syllables: ___\n- 5 syllables: ___\n\n**C3.** Why are synonyms important for metrical composition? Give a specific example (2 marks):\n\n**C4.** Generate 5 new (but grammatically valid) epithets for Śiva using the pattern quality+noun or action+object (5 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n\n---\n\n## Section D: 108 Names Forge (15 marks)\n\n**D1.** Categorize these 10 names of Śiva by the *type* of epithet — Physical (P), Action (A), Relationship (R), or Abstract quality (Q) (5 marks):\n1. Nīlakaṇṭha: ___\n2. Umāpati: ___\n3. Hara: ___\n4. Sadāśiva: ___\n5. Naṭarāja: ___\n6. Paśupati: ___\n7. Gaṅgādhara: ___\n8. Tryambaka: ___\n9. Bhairava: ___\n10. Viśvanātha: ___\n\n**D2.** Create a mini nāmāvalī (name garland) of 10 names for your iṣṭadevatā. For each, note the etymology (10 marks):\n1. ___ (etymology: ___)\n2. ___ (etymology: ___)\n3. ___ (etymology: ___)\n4. ___ (etymology: ___)\n5. ___ (etymology: ___)\n6. ___ (etymology: ___)\n7. ___ (etymology: ___)\n8. ___ (etymology: ___)\n9. ___ (etymology: ___)\n10. ___ (etymology: ___)\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 10: Paryāya — Workbook (Answers)\n\n## Section A\n**A1.**\n1. Śiva: **śambhuḥ, śaṅkaraḥ, haraḥ, mahādevaḥ, rudraḥ** (accept any valid)\n2. Lotus: **padmam, kamalam, aravindam, paṅkajam, sarasijam**\n3. Sun: **sūryaḥ, raviḥ, arkaḥ, bhāskaraḥ, ādityaḥ**\n\n## Section B\n**B1.**\n1. Nīlakaṇṭha = **nīla** (blue) + **kaṇṭha** (throat) → blue-throated one\n2. Gaṅgādhara = **gaṅgā** + **dhara** (√dhṛ, bearer) → bearer of Gaṅgā\n3. Trilocana = **tri** (three) + **locana** (eye) → three-eyed\n4. Padmanābha = **padma** (lotus) + **nābha** (navel) → lotus-naveled\n5. Caturbhuja = **catur** (four) + **bhuja** (arm) → four-armed\n6. Tripurasundarī = **tripura** (three cities/worlds) + **sundarī** (beautiful woman) → beauty of the three worlds\n7. Jagadambā = **jagat** (world) + **ambā** (mother) → mother of the world\n8. Annapūrṇā = **anna** (food) + **pūrṇā** (full) → she who is full of food\n9. Gopāla = **go** (cow) + **pāla** (√pā, protector) → protector of cows\n10. Vṛṣabhadhvaja = **vṛṣabha** (bull) + **dhvaja** (banner) → bull-bannered\n\n**B2.**\n1. Hara ← **√hṛ** (to take/remove)\n2. Bhāskara ← **√kṛ** (to make) [bhās + kara = maker of light]\n3. Durgā ← **√gam** (to go) [dur + gā = hard to approach]\n4. Śaṅkara ← **√kṛ** (to make) [śam + kara = maker of peace]\n5. Divākara ← **√kṛ** (to make) [divā + kara = maker of day]\n\n## Section C\n**C1.**\n1. padmam → **aravindam** (4 syllables)\n2. sūryaḥ → **arkaḥ** (2 syllables)\n3. jalam → **vāri** (2 syllables)\n4. candraḥ → **śaśī** is 2; use **niśākaraḥ** for 4 or **induḥ** for 2. For 3: **niśāpaḥ** or accept **candramāḥ**\n5. agniḥ → **vahniḥ** (2) or **analaḥ** (3 syllables)\n\n**C2.**\n- 3 syllables: **sindhuḥ** or **abdhiḥ** (2) — better: **sā-ga-raḥ** (3)\n- 4 syllables: **sa-mu-dra-ḥ** (3-4) or **u-da-dhi-ḥ** (4)\n- 5 syllables: **rat-nā-ka-ra-ḥ** (4-5)\n\n**C3.** Synonyms are essential because Sanskrit meters require specific syllable counts and weight patterns (guru/laghu). If \"padmam\" doesn't fit the meter, \"kamalam\" or \"aravindam\" might. Example: in anuṣṭubh, if you need 3 syllables for \"lotus,\" use \"kamalam\"; if you need 4, use \"aravindam.\"\n\n**C4.** Sample new epithets for Śiva:\n1. **jñānadāyaka** (giver of knowledge)\n2. **bhaktarakṣaka** (protector of devotees)\n3. **śvetavṛṣabha** (white-bulled)\n4. **yogīśvara** (lord of yogīs)\n5. **kailāsavāsin** (dweller of Kailāsa)\n\n## Section D\n**D1.**\n1. Nīlakaṇṭha: **P** (physical)\n2. Umāpati: **R** (relationship)\n3. Hara: **A** (action)\n4. Sadāśiva: **Q** (abstract quality)\n5. Naṭarāja: **A** (action — king of dance)\n6. Paśupati: **R** (relationship — lord of beings)\n7. Gaṅgādhara: **A** (action — bearing Gaṅgā)\n8. Tryambaka: **P** (physical — three-eyed)\n9. Bhairava: **Q** (abstract quality — fearsome)\n10. Viśvanātha: **R** (relationship — lord of the universe)\n\n**D2.** Sample for Kṛṣṇa:\n1. **Kṛṣṇa** (the dark one, √kṛṣ to attract)\n2. **Govinda** (finder of cows, go+√vid)\n3. **Gopāla** (protector of cows, go+√pā)\n4. **Murāri** (enemy of Mura, mura+ari)\n5. **Vanamālī** (wearer of forest garland)\n6. **Pītāmbara** (yellow-robed, pīta+ambara)\n7. **Veṇugopāla** (flute-playing cowherd)\n8. **Devakīnandana** (son of Devakī)\n9. **Rādhāpriya** (beloved of Rādhā)\n10. **Jagannātha** (lord of the world, jagat+nātha)\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 10 Badge: Paryāyavit\n\n**Title:** Epithet Weaver\n**Badge:** 🏅 Paryāyavit\n\n## Requirements\n\n1. Give 10 names/epithets for a single deity with etymological explanation for each\n2. Give 5 synonyms each for: sun, water, lotus\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 11 content and grants the **Paryāyavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "11-samasa", "number": 11, "title": "Samasa", "subtitle": "Compounds -- LEGO Technic", "files": {"theory": "# Stage 11: Samāsa — Compounds\n\n## Goal\nMaster Sanskrit compound formation — the engine behind divine epithets, philosophical terms, and poetic expression. Learn to build and decompose compounds, and invent grammatically valid new epithets.\n\n## What is Samāsa?\n\n**Samāsa** (समास) means \"throwing together\" — the joining of two or more words into a single compound. Sanskrit compounds can be enormously long, but they follow strict rules.\n\n## The Four Major Types\n\n### 1. Tatpuruṣa (Determinative) — \"his man\"\nThe first member modifies the second. The second member is the head word.\n\n**Pattern:** modifier + head (relation between members = a vibhakti)\n\n| Subtype | Vibhakti | Example | Analysis | Meaning |\n|---------|---------|---------|----------|---------|\n| Dvitīyā-tat. | 2nd | grāma-gata | grāmam gataḥ | gone to the village |\n| Tṛtīyā-tat. | 3rd | deva-datta | devena dattaḥ | given by god |\n| Caturthī-tat. | 4th | yajña-śālā | yajñāya śālā | hall for sacrifice |\n| Pañcamī-tat. | 5th | svarga-patita | svargāt patitaḥ | fallen from heaven |\n| Ṣaṣṭhī-tat. | 6th | rāja-putra | rājñaḥ putraḥ | king's son |\n| Saptamī-tat. | 7th | vana-vāsa | vane vāsaḥ | dwelling in forest |\n\n### 2. Dvandva (Copulative) — \"and\"\nBoth members are equal; the compound means \"A and B.\"\n\n| Example | Meaning |\n|---------|---------|\n| rāma-lakṣmaṇau | Rāma and Lakṣmaṇa (dual) |\n| dharma-artha-kāma-mokṣāḥ | dharma, artha, kāma, and mokṣa (pl) |\n| śiva-pārvatī | Śiva and Pārvatī |\n| deva-asurāḥ | gods and demons |\n\n### 3. Bahuvrīhi (Possessive/Exocentric) — \"much rice\"\nThe compound describes something/someone *outside* itself. \"The one who has X.\"\n\n| Example | Literal | Actual Meaning |\n|---------|---------|---------------|\n| nīla-kaṇṭha | blue-throat | he whose throat is blue (= Śiva) |\n| catur-bhuja | four-arm | he who has four arms (= Viṣṇu) |\n| padma-nābha | lotus-navel | he whose navel has a lotus (= Viṣṇu) |\n| daśa-ānana | ten-face | he who has ten faces (= Rāvaṇa) |\n| mahā-bāhu | great-arm | he who has great arms |\n| pīta-ambara | yellow-cloth | he who wears yellow cloth (= Viṣṇu) |\n\nThis is the most common type for deity epithets.\n\n### 4. Avyayībhāva (Indeclinable/Adverbial)\nThe first member is an indeclinable, and the whole compound becomes adverbial.\n\n| Example | Meaning |\n|---------|---------|\n| yathā-śakti | according to ability |\n| prati-dinam | every day |\n| upa-kūlam | near the bank |\n| nir-bhayam | fearlessly |\n\n## Special Compound Types\n\n### Karmadhāraya (Appositional Tatpuruṣa)\nBoth members refer to the same entity — adjective + noun or noun + noun in apposition.\n\n| Example | Meaning |\n|---------|---------|\n| mahā-deva | great-god (Mahādeva) |\n| nīla-utpala | blue-lotus |\n| parama-ātman | supreme-self |\n| sat-guru | true-teacher |\n\n### Dvigu (Numeral Tatpuruṣa)\nFirst member is a number.\n\n| Example | Meaning |\n|---------|---------|\n| tri-loka | three worlds |\n| pañca-bhūta | five elements |\n| sapta-ṛṣi | seven sages |\n| daśa-āvatāra | ten incarnations |\n\n## The Build-a-Deity Game\n\nCreate valid epithets by combining components:\n\n| Component A | Component B | Compound | Type | Deity |\n|------------|------------|----------|------|-------|\n| gaṅgā | dhara | gaṅgādhara | Bahu. | Śiva |\n| tri | netra | trinetra | Bahu. | Śiva |\n| vana | mālī | vanamālī | Bahu. | Viṣṇu |\n| jagat | ambā | jagadambā | Ṣaṣṭhī-tat. | Devī |\n| mahā | lakṣmī | mahālakṣmī | Karm. | Devī |\n| cakra | pāṇi | cakrapāṇi | Bahu. | Viṣṇu |\n| mṛga | aṅka | mṛgāṅka | Bahu. | Moon |\n\n## Sandhi in Compounds\n\nWhen words join, sandhi rules apply at the junction:\n- jagat + ambā → **jagadambā** (t + a → da)\n- mahā + īśvara → **maheśvara** (ā + ī → e)\n- nīla + utpala → **nīlotpala** (a + u → o)\n- vana + oṣadhi → **vanauṣadhi** (a + o → au)\n\n## Milestone Check\n\nCan you:\n1. Identify the samāsa type of 10 common epithets?\n2. Decompose compounds into their constituent words?\n3. Invent 5 new grammatically valid epithets?\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Compound mega-bricks (tatpuruṣa) | rāja-putra (king's son), vana-vāsa (forest-dwelling) | Two noun-bricks fused via a hidden vibhakti — the first brick modifies the second |\n| Compound mega-bricks (bahuvrīhi) | nīla-kaṇṭha (blue-throated one), catur-bhuja (four-armed one) | Two bricks fused to describe an *external* entity — the compound points outward, perfect for deity epithets |\n| Compound mega-bricks (dvandva) | rāma-lakṣmaṇau, śiva-pārvatī | Two equal bricks joined by invisible \"and\" — copulative pairing |\n| Compound mega-bricks (avyayībhāva) | prati-dinam (daily), nir-bhayam (fearlessly) | An indeclinable brick fused with a noun to create an adverb mega-brick |\n\n**Try snapping**: Build a deity epithet by fusing a synonym brick from Stage 10 with a noun brick — e.g., take \"nīla\" (blue) + \"kaṇṭha\" (throat) for a bahuvrīhi, then use that compound mega-brick inside a vocative prayer from Stage 8: \"he nīlakaṇṭha! pāhi mām!\" Remember to apply sandhi from Stage 3 at the junction.\n", "reference": "# Stage 11: Samāsa — Reference Guide\n\n## Compound Types at a Glance\n\n| Type | Head | Meaning Pattern | Example |\n|------|------|----------------|---------|\n| Tatpuruṣa | 2nd word | \"X of/by/for/in Y\" | rāja-putra (king's son) |\n| Karmadhāraya | 2nd word | \"X which is Y\" | mahā-deva (great god) |\n| Dvigu | 2nd word | \"number + Y\" | tri-loka (three worlds) |\n| Dvandva | both | \"X and Y\" | rāma-kṛṣṇau |\n| Bahuvrīhi | external | \"having X-Y\" | nīla-kaṇṭha (blue-throated one) |\n| Avyayībhāva | 1st word | adverb | prati-dinam (daily) |\n\n## Tatpuruṣa Subtypes\n\n| Subtype | Relation | Vigraha (dissolution) | Example |\n|---------|---------|----------------------|---------|\n| 2nd (dvitīyā) | toward | X-am Y | śaraṇāgata (come to refuge) |\n| 3rd (tṛtīyā) | by/with | X-ena Y | deva-datta (god-given) |\n| 4th (caturthī) | for | X-āya Y | yajña-śālā (sacrifice-hall) |\n| 5th (pañcamī) | from | X-āt Y | bhaya-mukta (freed from fear) |\n| 6th (ṣaṣṭhī) | of | X-asya Y | rāja-putra (king's son) |\n| 7th (saptamī) | in | X-e Y | vana-vāsa (forest-dwelling) |\n\n## Common Bahuvrīhi Epithets\n\n| Compound | Components | Literal | Refers to |\n|----------|-----------|---------|-----------|\n| nīlakaṇṭha | nīla+kaṇṭha | blue-throat | Śiva |\n| caturbhuja | catur+bhuja | four-arm | Viṣṇu |\n| padmanābha | padma+nābha | lotus-navel | Viṣṇu |\n| trilocana | tri+locana | three-eye | Śiva |\n| daśānana | daśa+ānana | ten-face | Rāvaṇa |\n| pītāmbara | pīta+ambara | yellow-cloth | Viṣṇu/Kṛṣṇa |\n| cakrapāṇi | cakra+pāṇi | discus-hand | Viṣṇu |\n| pinākapāṇi | pinaka+pāṇi | pinaka-hand | Śiva |\n| vṛṣabhadhvaja | vṛṣabha+dhvaja | bull-banner | Śiva |\n| garuḍadhvaja | garuḍa+dhvaja | garuḍa-banner | Viṣṇu |\n| candraśekhara | candra+śekhara | moon-crest | Śiva |\n| vanamālī | vana+mālī | forest-garland | Viṣṇu |\n| mṛgāṅka | mṛga+aṅka | deer-mark | Moon |\n| pannagabhūṣaṇa | pannaga+bhūṣaṇa | serpent-ornament | Śiva |\n\n## Common Karmadhāraya Compounds\n\n| Compound | Components | Meaning |\n|----------|-----------|---------|\n| mahādeva | mahā+deva | great god |\n| paramātman | parama+ātman | supreme self |\n| sadguru | sat+guru | true teacher |\n| nīlotpala | nīla+utpala | blue lotus |\n| mahāvidyā | mahā+vidyā | great knowledge |\n| parama-puruṣa | parama+puruṣa | supreme person |\n\n## Sandhi at Compound Junctions\n\n| Rule | Example |\n|------|---------|\n| a + a → ā | deva + astra → devāstra |\n| a + i → e | mahā + īśvara → maheśvara |\n| a + u → o | nīla + utpala → nīlotpala |\n| a + ṛ → ar | mahā + ṛṣi → maharṣi |\n| t + vowel → d | jagat + ambā → jagadambā |\n| t + soft consonant → d | sat + guru → sadguru |\n| n + ś → ñś | mahān + śiva → — (rarely compounds) |\n\n## Compound Identification Flowchart\n\n1. Does the compound describe something OUTSIDE itself? → **Bahuvrīhi**\n2. Is the first word an indeclinable? → **Avyayībhāva**\n3. Are both members co-equal (\"and\")? → **Dvandva**\n4. Is the first member a number? → **Dvigu**\n5. Is the first an adjective for the second? → **Karmadhāraya**\n6. Otherwise → **Tatpuruṣa** (determine the case relationship)\n\n## Deity Name Building Toolkit\n\n| Meaning | Components Available |\n|---------|---------------------|\n| \"lord of X\" | X + pati, X + nātha, X + īśa |\n| \"destroyer of X\" | X + antaka, X + ari, X + hara |\n| \"bearer of X\" | X + dhara, X + dhārī |\n| \"having X\" | X + vat/mat (suffix, not compound) |\n| \"X-handed\" | X + pāṇi, X + hasta |\n| \"X-eyed\" | X + netra, X + akṣa, X + locana |\n| \"X-bannered\" | X + dhvaja, X + ketu |\n| \"son/daughter of X\" | X + putra/suta/tanaya, X + putri/sutā |\n", "workbook-questions": "# Stage 11: Samāsa — Workbook (Questions)\n\n## Section A: Compound Identification (15 marks)\n\n**A1.** Identify the samāsa type (Tatpuruṣa, Dvandva, Bahuvrīhi, Karmadhāraya, Dvigu, Avyayībhāva) (10 marks):\n1. nīlakaṇṭha: ___\n2. mahādeva: ___\n3. rāma-lakṣmaṇau: ___\n4. rāja-putra: ___\n5. tri-loka: ___\n6. prati-dinam: ___\n7. caturbhuja: ___\n8. vana-vāsa: ___\n9. pīta-ambara: ___\n10. deva-datta: ___\n\n**A2.** For each Tatpuruṣa compound, identify which vibhakti relates the members (5 marks):\n1. rāja-putra: ___\n2. vana-vāsa: ___\n3. bhaya-mukta: ___\n4. deva-datta: ___\n5. yajña-śālā: ___\n\n---\n\n## Section B: Compound Dissolution (Vigraha) (15 marks)\n\n**B1.** Dissolve each compound into its constituent words with the appropriate vibhakti (10 marks):\n1. gaṅgādhara → ___\n2. tripurāntaka → ___\n3. padmanābha → ___\n4. jagadambā → ___\n5. cakrapāṇi → ___\n6. nīlotpala → ___\n7. pañcabhūta → ___\n8. dharma-artha-kāma-mokṣāḥ → ___\n9. vanavāsa → ___\n10. sadguru → ___\n\n**B2.** What sandhi rule applies at the junction? (5 marks):\n1. mahā + īśvara → maheśvara: ___\n2. nīla + utpala → nīlotpala: ___\n3. jagat + ambā → jagadambā: ___\n4. sat + guru → sadguru: ___\n5. deva + indra → devendra: ___\n\n---\n\n## Section C: Compound Building (20 marks)\n\n**C1.** Form a compound from each pair and name the type (10 marks):\n1. padma (lotus) + akṣa (eye) = ___ (type: ___)\n2. mahā (great) + vidyā (knowledge) = ___ (type: ___)\n3. sūrya + candra = ___ (type: ___)\n4. tri + netra = ___ (type: ___)\n5. vana (forest) + cara (moving) = ___ (type: ___)\n6. rāja (king) + haṃsa (swan) = ___ (type: ___)\n7. śiva + pārvatī = ___ (type: ___)\n8. pra + dinam = ___ (type: ___)\n9. bhakta (devotee) + vatsala (affectionate) = ___ (type: ___)\n10. garuḍa + dhvaja = ___ (type: ___)\n\n**C2.** Invent 5 new Bahuvrīhi epithets for any deity. Give the components, meaning, and which deity (10 marks):\n1. ___ = ___ + ___ (meaning: ___) → deity: ___\n2. ___ = ___ + ___ (meaning: ___) → deity: ___\n3. ___ = ___ + ___ (meaning: ___) → deity: ___\n4. ___ = ___ + ___ (meaning: ___) → deity: ___\n5. ___ = ___ + ___ (meaning: ___) → deity: ___\n\n---\n\n## Section D: Advanced Analysis (10 marks)\n\n**D1.** Some compounds are ambiguous between Tatpuruṣa and Bahuvrīhi. Explain both readings of (5 marks):\n1. nīlakaṇṭha as Tatpuruṣa: ___\n   nīlakaṇṭha as Bahuvrīhi: ___\n\n2. rājaputra as Tatpuruṣa: ___\n   rājaputra as Bahuvrīhi: ___\n\n**D2.** Decompose this long compound (5 marks):\n> śrīmad-rāma-bhadra-mūrti-pādāravinda-yugala-dhyāna-parāyaṇa\n\nBreak it into individual words and explain the overall meaning.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 11: Samāsa — Workbook (Answers)\n\n## Section A\n**A1.**\n1. nīlakaṇṭha: **Bahuvrīhi** (he whose throat is blue)\n2. mahādeva: **Karmadhāraya** (great god)\n3. rāma-lakṣmaṇau: **Dvandva** (Rāma and Lakṣmaṇa)\n4. rāja-putra: **Tatpuruṣa** (ṣaṣṭhī) (king's son)\n5. tri-loka: **Dvigu** (three worlds)\n6. prati-dinam: **Avyayībhāva** (every day)\n7. caturbhuja: **Bahuvrīhi** (having four arms)\n8. vana-vāsa: **Tatpuruṣa** (saptamī) (dwelling in forest)\n9. pīta-ambara: **Bahuvrīhi** (wearing yellow cloth)\n10. deva-datta: **Tatpuruṣa** (tṛtīyā) (given by god)\n\n**A2.**\n1. rāja-putra: **ṣaṣṭhī** (6th — \"of the king\")\n2. vana-vāsa: **saptamī** (7th — \"in the forest\")\n3. bhaya-mukta: **pañcamī** (5th — \"freed from fear\")\n4. deva-datta: **tṛtīyā** (3rd — \"by god\")\n5. yajña-śālā: **caturthī** (4th — \"for sacrifice\")\n\n## Section B\n**B1.**\n1. gaṅgādhara → **gaṅgāṃ dharati yaḥ saḥ** (he who bears Gaṅgā) — Bahu.\n2. tripurāntaka → **tripurasya antakaḥ** (destroyer of Tripura) — Tat.\n3. padmanābha → **padmaṃ nābhau yasya saḥ** (he whose navel has a lotus) — Bahu.\n4. jagadambā → **jagataḥ ambā** (mother of the world) — Tat.\n5. cakrapāṇi → **cakraṃ pāṇau yasya saḥ** (discus in whose hand) — Bahu.\n6. nīlotpala → **nīlam utpalam** (blue lotus) — Karm.\n7. pañcabhūta → **pañca bhūtāni** (five elements) — Dvigu\n8. dharma-artha-kāma-mokṣāḥ → **dharmaḥ ca arthaḥ ca kāmaḥ ca mokṣaḥ ca** — Dvandva\n9. vanavāsa → **vane vāsaḥ** (dwelling in the forest) — Saptamī-tat.\n10. sadguru → **san guruḥ** (true guru) — Karm.\n\n**B2.**\n1. ā + ī → **e** (vowel sandhi: ā+ī=e)\n2. a + u → **o** (vowel sandhi: a+u=o)\n3. t + a → **da** (consonant: final t before voiced → d)\n4. t + g → **dg** (consonant: final t before voiced → d)\n5. a + i → **e** (vowel sandhi: a+i=e)\n\n## Section C\n**C1.**\n1. padma + akṣa = **padmākṣa** (type: **Bahuvrīhi** — lotus-eyed)\n2. mahā + vidyā = **mahāvidyā** (type: **Karmadhāraya** — great knowledge)\n3. sūrya + candra = **sūryacandau** (type: **Dvandva** — sun and moon)\n4. tri + netra = **trinetra** (type: **Bahuvrīhi/Dvigu** — three-eyed)\n5. vana + cara = **vanacara** (type: **Saptamī-Tatpuruṣa** — forest-wanderer)\n6. rāja + haṃsa = **rājahaṃsa** (type: **Karmadhāraya** — royal swan)\n7. śiva + pārvatī = **śivapārvatyau** (type: **Dvandva**)\n8. pra + dinam = **pradinam** (type: **Avyayībhāva** — daily) [or pratitinam]\n9. bhakta + vatsala = **bhaktavatsala** (type: **Saptamī-Tat.** — affectionate to devotees)\n10. garuḍa + dhvaja = **garuḍadhvaja** (type: **Bahuvrīhi** — garuḍa-bannered)\n\n**C2.** Sample new Bahuvrīhi epithets:\n1. **raktanetra** = rakta + netra (red-eyed one) → Rudra/Bhairava\n2. **hemakuṇḍala** = hema + kuṇḍala (gold-earringed) → Devī\n3. **śukladhvaja** = śukla + dhvaja (white-bannered) → Sarasvatī\n4. **daśabāhu** = daśa + bāhu (ten-armed one) → Durgā\n5. **meghavarṇa** = megha + varṇa (cloud-complexioned) → Kṛṣṇa\n\n## Section D\n**D1.**\n1. nīlakaṇṭha:\n   - As Tatpuruṣa: **nīlaḥ kaṇṭhaḥ** = \"a blue throat\" (the object itself)\n   - As Bahuvrīhi: **nīlaḥ kaṇṭhaḥ yasya saḥ** = \"he whose throat is blue\" (= Śiva)\n\n2. rājaputra:\n   - As Tatpuruṣa: **rājñaḥ putraḥ** = \"a king's son\" (the prince himself)\n   - As Bahuvrīhi: **rājā putraḥ yasya saḥ** = \"one whose son is a king\"\n\n**D2.**\nśrīmad-rāma-bhadra-mūrti-pādāravinda-yugala-dhyāna-parāyaṇa:\n- śrīmat = glorious\n- rāma = Rāma\n- bhadra = auspicious\n- mūrti = form\n- pāda = foot\n- aravinda = lotus\n- yugala = pair\n- dhyāna = meditation\n- parāyaṇa = devoted to\n\n**Meaning:** \"One devoted to the meditation upon the pair of lotus-feet of the auspicious form of glorious Rāma\"\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 11 Badge: Samāsakāra\n\n**Title:** Compound Builder\n**Badge:** 🏅 Samāsakāra\n\n## Requirements\n\n1. Create 5 new grammatically valid compound epithets and classify each (tatpuruṣa/bahuvrīhi/dvandva/etc.)\n2. Break down 5 given compound words into their components\n3. Identify sandhi at compound junctions\n\n## How to Demonstrate\n\n**Format:** Text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 12 content and grants the **Samāsakāra** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "12-vakya", "number": 12, "title": "Vakya", "subtitle": "Free Composition", "files": {"theory": "# Stage 12: Vākya — Free Composition\n\n## Goal\nCompose freely in Sanskrit — describe daily life, thoughts, and experiences. Begin thinking directly in Sanskrit without translating from English.\n\n## The Shift: From Grammar to Thought\n\nStages 1–9 gave you building blocks. Now you combine them fluidly. This stage is about **automaticity** — moving from conscious rule-application to natural expression.\n\n## Sentence Patterns for Daily Life\n\n### Pattern 1: Simple Statement (Subject + Verb)\n> ahaṃ paṭhāmi — I study\n> sūryaḥ udeti — the sun rises\n> vṛṣṭiḥ bhavati — rain happens\n\n### Pattern 2: Transitive (Subject + Object + Verb)\n> ahaṃ pustakam paṭhāmi — I read a book\n> mātā bhojanaṃ pacati — mother cooks food\n> bālaḥ jalami pibati — the child drinks water\n\n### Pattern 3: Full Sentence (S + Instrument + Location + Object + Verb)\n> ahaṃ prātaḥ gṛhe bhojanaṃ karomi — I eat food at home in the morning\n\n### Pattern 4: Compound Sentence (X ca Y ca)\n> ahaṃ paṭhāmi likhāmi ca — I study and write\n> sūryaḥ udeti candraḥ ca astam gacchati — the sun rises and the moon sets\n\n### Pattern 5: Relative Clause (yaḥ... saḥ...)\n> yaḥ bhajati saḥ mucyate — he who worships is liberated\n> yā devī sarva-bhūteṣu... — she who is the goddess in all beings...\n\n## Essential Daily Vocabulary\n\n### Time\n| Sanskrit | Meaning |\n|----------|---------|\n| prātaḥ | in the morning |\n| madhyāhne | at noon |\n| sāyam | in the evening |\n| rātrau | at night |\n| adya | today |\n| śvaḥ | tomorrow |\n| hyaḥ | yesterday |\n| sadā / sarvadā | always |\n| kadā | when? |\n| idānīm | now |\n\n### Common Verbs for Daily Life\n| Sanskrit | Meaning |\n|----------|---------|\n| uttiṣṭhāmi | I get up |\n| snānaṃ karomi | I bathe |\n| bhojanaṃ karomi | I eat |\n| pibāmi | I drink |\n| paṭhāmi | I study |\n| likhāmi | I write |\n| gacchāmi | I go |\n| āgacchāmi | I come |\n| vasāmi | I live/dwell |\n| svapimi | I sleep |\n| jāgṛmi | I am awake |\n| krīḍāmi | I play |\n| hasāmi | I laugh |\n| rodimi | I cry |\n| kathayāmi | I tell/narrate |\n\n### Connectors and Particles\n| Sanskrit | Meaning |\n|----------|---------|\n| ca | and |\n| vā | or |\n| na | not |\n| api | also, even |\n| tu | but |\n| eva | only, indeed |\n| iti | thus (quotation marker) |\n| yadi | if |\n| tadā | then |\n| ataḥ | therefore |\n| tathā | so, likewise |\n| yathā | as, like |\n| kim | what? |\n| kutra | where? |\n| katham | how? |\n\n## The Game: \"Tell Bhagavān About Your Day\"\n\nSpeak to your iṣṭadevatā about your day in simple Sanskrit:\n\n> he śiva!\n> adya prātaḥ aham uttiṣṭhāmi.\n> snānaṃ karomi.\n> tava mandiraṃ gacchāmi.\n> tatra tvāṃ paśyāmi.\n> puṣpam arpayāmi.\n> gṛhaṃ āgacchāmi.\n> pustakam paṭhāmi.\n> sāyam bhojanaṃ karomi.\n> rātrau tvāṃ smarāmi.\n> sukhaṃ svapimi.\n\n## Building Longer Passages\n\n### Describing a Place\n> mama gṛham sundaram asti. tatra ekaṃ mandiram asti. mandire śivasya mūrtiḥ asti. pratidinṃ ahaṃ tatra pūjāṃ karomi. mandiraṃ śāntam asti. tatra ahaṃ dhyānaṃ karomi.\n\n### Describing a Person\n> mama guruḥ mahān asti. saḥ śāntaḥ asti. saḥ jñānī asti. saḥ pradinaṃ vedān paṭhati. saḥ śiṣyān pāṭhayati. ahaṃ tasya śiṣyaḥ asmi.\n\n### Narrating an Event\n> hyaḥ ahaṃ mandiraṃ gacchāmi (agaccham). tatra mahāpūjā āsīt. bahavaḥ bhaktāḥ āsan. sarve militvā stotram agāyan. atiśobhanam āsīt.\n\n## Thinking in Sanskrit — Tips\n\n1. **Start with objects around you** — name them in Sanskrit\n2. **Narrate your actions** as you do them: uttiṣṭhāmi, gacchāmi...\n3. **Use simple sentences first**, then add cases and qualifiers\n4. **Don't translate from English** — think in Subject-Object-Verb order\n5. **Talk to your deity** daily in Sanskrit — even one sentence\n\n## Milestone Check\n\nCan you speak for 2 minutes in simple Sanskrit about your day, your surroundings, or your devotional practice — without pausing to translate from English?\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Sentence blueprints | S+V (ahaṃ paṭhāmi), S+O+V (ahaṃ pustakam paṭhāmi), S+Instr+Loc+O+V (ahaṃ bhaktyā mandire stotram gāyāmi), yaḥ...saḥ (relative clause) | Everything from all prior stages — these are the complete assembly instructions, the LEGO instruction manual that tells you how to arrange noun-bricks (Stages 1–2), sandhi-joined forms (Stage 3), adjective-bricks (Stage 4), number-bricks (Stage 5), case-connectors (Stage 7), vocative bricks (Stage 8), root-derived verbs (Stage 9), synonym variants (Stage 10), and compound mega-bricks (Stage 11) into finished utterances |\n\n**Try snapping**: Build a 5-sentence paragraph about your morning pūjā using every brick type learned so far — a compound mega-brick (Stage 11) as an epithet, a vocative brick (Stage 8) to address the deity, synonym bricks (Stage 10) for variety, kāraka connectors (Stage 7) for each noun's role, root-derived vocabulary (Stage 9), and proper sandhi (Stage 3) at every junction.\n", "reference": "# Stage 12: Vākya — Reference Guide\n\n## Sentence Templates\n\n### Existence: X asti (X exists / there is X)\n> mandiram asti. devī asti. jalam asti.\n\n### Identity: X Y asti (X is Y)\n> śivaḥ devaḥ asti. sā mama mātā asti.\n\n### Location: X Y-saptamī asti (X is in Y)\n> mūrtiḥ mandire asti. puṣpam padme asti.\n\n### Possession: X-ṣaṣṭhī Y asti (X has Y / X's Y exists)\n> mama gṛham asti. devasya kṛpā asti.\n\n### Action: S (+ O) + V\n> aham gacchāmi. aham pustakam paṭhāmi.\n\n### Full: S + Time + Place + Instrument + Recipient + O + V\n> aham prātaḥ mandire bhaktyā devāya puṣpam arpayāmi.\n\n## Essential Pronouns\n\n| Case | I | You | He | She | It/That |\n|------|---|-----|----|----|---------|\n| 1st | aham | tvam | saḥ | sā | tat |\n| 2nd | mām | tvām | tam | tām | tat |\n| 3rd | mayā | tvayā | tena | tayā | tena |\n| 4th | mahyam | tubhyam | tasmai | tasyai | tasmai |\n| 6th | mama | tava | tasya | tasyāḥ | tasya |\n| 7th | mayi | tvayi | tasmin | tasyām | tasmin |\n\nPlural: vayam (we), yūyam (you all), te (they M), tāḥ (they F), tāni (they N)\n\n## Question Words\n\n| Sanskrit | Meaning | Example |\n|----------|---------|---------|\n| kim | what? | kim karosi? (what do you do?) |\n| kaḥ | who? (M) | kaḥ āgacchati? |\n| kā | who? (F) | kā gāyati? |\n| kutra | where? | kutra vasasi? |\n| kadā | when? | kadā gacchasi? |\n| katham | how? | katham jānāsi? |\n| kasmāt / kimartham | why? | kasmāt rodisi? |\n| kiyat | how much/many? | kiyat dūram? |\n\n## Time Expressions\n\n| Sanskrit | Meaning |\n|----------|---------|\n| prātaḥ | morning |\n| madhyāhne | noon |\n| aparāhne | afternoon |\n| sāyam / sandhyāyām | evening |\n| rātrau | night |\n| adya | today |\n| śvaḥ | tomorrow |\n| hyaḥ | yesterday |\n| pratidinm | every day |\n| sarvadā | always |\n| kadācit | sometimes |\n| na kadāpi | never |\n\n## Connectors\n\n| Type | Sanskrit | Meaning |\n|------|----------|---------|\n| Addition | ca | and |\n| Alternative | vā | or |\n| Contrast | tu, kintu, parantu | but |\n| Emphasis | eva | indeed, only |\n| Also | api | also, even |\n| Reason | yataḥ, hi | because |\n| Result | ataḥ, tasmāt | therefore |\n| Condition | yadi... tadā | if... then |\n| Comparison | yathā... tathā | as... so |\n| Sequence | tataḥ, anantaram | then, after that |\n| Quotation | iti | thus (end quote) |\n\n## Common Phrases for Daily Narration\n\n| Sanskrit | Meaning |\n|----------|---------|\n| aham uttiṣṭhāmi | I get up |\n| mukhaṃ prakṣālayāmi | I wash my face |\n| snānaṃ karomi | I bathe |\n| vastrāṇi dhārayāmi | I wear clothes |\n| prātarāśaṃ karomi | I have breakfast |\n| gṛhāt nirgacchāmi | I leave the house |\n| kāryālayaṃ gacchāmi | I go to the office |\n| kāryaṃ karomi | I do work |\n| madhyāhna-bhojanaṃ karomi | I have lunch |\n| gṛham āgacchāmi | I come home |\n| sāyaṃ sandhyāvandanaṃ karomi | I do evening worship |\n| rātrau śayane tiṣṭhāmi | at night I lie on the bed |\n\n## Past Tense Quick Forms (Laṅ-lakāra)\n\n| Present | Past (3sg) | Meaning |\n|---------|-----------|---------|\n| gacchati | agacchat | went |\n| karoti | akarot | did |\n| vadati | avadat | said |\n| paśyati | apaśyat | saw |\n| bhavati | abhavat | became/was |\n| dadāti | adadāt | gave |\n| āsīt | (from √as) | was |\n", "workbook-questions": "# Stage 12: Vākya — Workbook (Questions)\n\n## Section A: Sentence Building (15 marks)\n\n**A1.** Form complete sentences from these elements (5 marks):\n1. aham / prātaḥ / uttiṣṭhāmi → ___\n2. bālaḥ / jalam / pibati → ___\n3. mātā / gṛhe / bhojanaṃ / pacati → ___\n4. aham / sāyam / mandiraṃ / gacchāmi → ___\n5. guruḥ / śiṣyān / pāṭhayati → ___\n\n**A2.** Add the given element to expand each sentence (5 marks):\n1. aham paṭhāmi (+where: gṛhe) → ___\n2. bhaktaḥ pūjayati (+with what: puṣpeṇa) → ___\n3. devī rakṣati (+whom: bhaktam) → ___\n4. aham gacchāmi (+when: prātaḥ, +where: mandiraṃ) → ___\n5. guruḥ kathayati (+what: kathāṃ, +to whom: śiṣyāya) → ___\n\n**A3.** Join the two sentences using the connector (5 marks):\n1. aham paṭhāmi + aham likhāmi (ca) → ___\n2. sūryaḥ udeti + tārakāḥ na dṛśyante (tadā) → ___\n3. tvam gacchasi + aham tiṣṭhāmi (tu) → ___\n4. saḥ bhaktaḥ + saḥ mucyate (yaḥ...saḥ) → ___\n5. prātaḥ uttiṣṭhāmi + snānam karomi (tataḥ) → ___\n\n---\n\n## Section B: Translation (15 marks)\n\n**B1.** Translate into Sanskrit (5 marks):\n1. Where do you live?\n2. I do not know.\n3. Mother cooks food at home.\n4. The sun rises in the morning.\n5. Who is coming?\n\n**B2.** Translate into English (5 marks):\n1. adya aham mandiram na gacchāmi\n2. mama guruḥ mahān jñānī asti\n3. kutra tava gṛham asti?\n4. sā pratidinṃ dhyānaṃ karoti\n5. yadi tvam bhajasi tadā muktiḥ bhavati\n\n**B3.** Describe your morning routine in 5 Sanskrit sentences (5 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n\n---\n\n## Section C: Paragraph Composition (20 marks)\n\n**C1.** Describe your home in 5 Sanskrit sentences (10 marks):\n\n**C2.** Tell Bhagavān about your day — write 10 sentences in Sanskrit, starting with \"he [deity name]!\" (10 marks):\n\n---\n\n## Section D: Spontaneous Expression (10 marks)\n\n**D1.** Answer in Sanskrit (5 marks):\n1. tava nāma kim? → ___\n2. tvam kutra vasasi? → ___\n3. tava iṣṭadevatā kaḥ/kā? → ___\n4. adya kim karoṣi? → ___\n5. kim tvam saṃskṛtam jānāsi? → ___\n\n**D2.** Write 5 sentences about anything — your feelings, observations, or thoughts — entirely in Sanskrit (5 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 12: Vākya — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **aham prātaḥ uttiṣṭhāmi** (I get up in the morning)\n2. **bālaḥ jalam pibati** (the child drinks water)\n3. **mātā gṛhe bhojanaṃ pacati** (mother cooks food at home)\n4. **aham sāyam mandiraṃ gacchāmi** (I go to the temple in the evening)\n5. **guruḥ śiṣyān pāṭhayati** (the guru teaches students)\n\n**A2.**\n1. **aham gṛhe paṭhāmi**\n2. **bhaktaḥ puṣpeṇa pūjayati**\n3. **devī bhaktam rakṣati**\n4. **aham prātaḥ mandiram gacchāmi**\n5. **guruḥ śiṣyāya kathāṃ kathayati**\n\n**A3.**\n1. **aham paṭhāmi likhāmi ca**\n2. **yadā sūryaḥ udeti tadā tārakāḥ na dṛśyante**\n3. **tvam gacchasi, aham tu tiṣṭhāmi**\n4. **yaḥ bhaktaḥ saḥ mucyate** (or yaḥ bhajati saḥ mucyate)\n5. **prātaḥ uttiṣṭhāmi, tataḥ snānam karomi**\n\n## Section B\n**B1.**\n1. **tvam kutra vasasi?**\n2. **aham na jānāmi**\n3. **mātā gṛhe bhojanaṃ pacati**\n4. **prātaḥ sūryaḥ udeti**\n5. **kaḥ āgacchati?**\n\n**B2.**\n1. Today I do not go to the temple\n2. My guru is a great knower/wise one\n3. Where is your house?\n4. She meditates every day\n5. If you worship, then liberation happens\n\n**B3.** Sample:\n1. **prātaḥ aham uttiṣṭhāmi**\n2. **mukhaṃ prakṣālayāmi**\n3. **snānam karomi**\n4. **devam namāmi**\n5. **prātarāśam karomi**\n\n## Section C\n**C1.** Sample:\n> mama gṛham sundaram asti. gṛhe pañca kakṣāḥ santi. ekā kakṣā mama pūjā-gṛham asti. tatra śivasya mūrtiḥ asti. pratidinṃ aham tatra pūjām karomi.\n\n**C2.** Sample:\n> he śiva! adya prātaḥ aham uttiṣṭhāmi. snānaṃ karomi. tava mandiraṃ gacchāmi. puṣpaṃ arpayāmi. mantram japāmi. tataḥ gṛham āgacchāmi. pustakam paṭhāmi. madhyāhne bhojanaṃ karomi. sāyam punaḥ tvāṃ smarāmi. rātrau śāntyā svapimi.\n\nAward marks for: variety of verbs (3), correct cases (3), flow/coherence (2), vocabulary range (2).\n\n## Section D\n**D1.** Sample:\n1. **mama nāma [name] iti**\n2. **aham [place] nagare vasāmi**\n3. **mama iṣṭadevatā śivaḥ (or devī, etc.)**\n4. **adya aham saṃskṛtam paṭhāmi**\n5. **āṃ, aham kiñcit saṃskṛtam jānāmi** (yes, I know a little Sanskrit)\n\n**D2.** Accept any 5 grammatically reasonable Sanskrit sentences expressing thoughts/observations.\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 12 Badge: Vākyakāra\n\n**Title:** Free Builder\n**Badge:** 🏅 Vākyakāra\n\n## Requirements\n\nSpeak for 2 minutes of spontaneous Sanskrit on any topic — no English, no pre-written script. Must use at least 3 different vibhaktis and 5 different verb forms.\n\n## How to Demonstrate\n\n**Format:** Voice recording in #badge-submissions\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 13 content and grants the **Vākyakāra** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "13-bhava", "number": 13, "title": "Bhava", "subtitle": "Emotional Vocabulary", "files": {"theory": "# Stage 13: Bhāva — Emotional Vocabulary\n\n## Goal\nExpress inner emotional states — gratitude, longing, surrender, wonder, friendship — in Sanskrit without falling back to English. Develop the vocabulary of the heart.\n\n## What is Bhāva?\n\n**Bhāva** (भाव) means \"feeling,\" \"state of being,\" or \"emotional disposition.\" In bhakti, the bhāva toward the deity determines everything — the words you choose, the tone of prayer, the quality of worship.\n\n## The Five Bhāvas of Bhakti\n\n| Bhāva | Meaning | Attitude | Tone |\n|-------|---------|----------|------|\n| **Śānta** | Peace | Quiet reverence | calm, meditative |\n| **Dāsya** | Service | Servant to master | humble, obedient |\n| **Sakhya** | Friendship | Friend to friend | intimate, playful |\n| **Vātsalya** | Parental love | Parent to child | tender, protective |\n| **Mādhurya** | Sweet love | Lover to beloved | passionate, longing |\n\n## Emotional Vocabulary\n\n### Gratitude (Kṛtajñatā)\n| Sanskrit | Meaning |\n|----------|---------|\n| kṛtajñaḥ asmi | I am grateful |\n| dhanyaḥ asmi | I am blessed/fortunate |\n| anugrahaḥ | grace, favor |\n| kṛpā | mercy, compassion |\n| prasādaḥ | grace, clarity |\n| anugrāhya me | I am the recipient of grace |\n| tava kṛpayā | by your grace |\n| dhanyavādaḥ | thanks |\n\n### Longing (Viraha / Utkaṇṭhā)\n| Sanskrit | Meaning |\n|----------|---------|\n| virahaḥ | separation |\n| utkaṇṭhā | intense longing |\n| tṛṣṇā / pipāsā | thirst |\n| kāṅkṣā | desire, yearning |\n| ākulaḥ / ākulā | agitated |\n| vyākulaḥ | distressed |\n| tvāṃ vinā na jīvāmi | without you I cannot live |\n| kadā darśanaṃ bhavati? | when will I have your darśana? |\n| hṛdayam tvāṃ smṛtvā kampate | my heart trembles remembering you |\n| tava virahāt dahyate me manaḥ | my mind burns from separation from you |\n\n### Surrender (Śaraṇāgati / Prapatti)\n| Sanskrit | Meaning |\n|----------|---------|\n| śaraṇam | refuge |\n| prapatti | surrender |\n| samarpayāmi | I offer/dedicate |\n| ātma-nivedanam | self-offering |\n| tavāsmi | I am yours |\n| tvam eva mama sarvasvam | you alone are my everything |\n| ananya-śaraṇaḥ | having no other refuge |\n| tvayy arpita-manaḥ | mind offered to you |\n| mama kiñcit nāsti | I have nothing (of my own) |\n| tvayi sarvam samarpayāmi | I offer everything in you |\n\n### Wonder (Vismaya / Adbhuta)\n| Sanskrit | Meaning |\n|----------|---------|\n| vismayaḥ | wonder, amazement |\n| adbhutam | wonderful |\n| āścaryam | astonishing |\n| aho! | oh! (exclamation of wonder) |\n| citraṃ | strange, wonderful |\n| apūrvam | unprecedented |\n| atīva sundaram | exceedingly beautiful |\n| ko'yam mahimā! | what is this glory! |\n| mahad āścaryam | great wonder |\n| na śakyam vaktum | cannot be expressed |\n\n### Friendship/Intimacy (Sakhya)\n| Sanskrit | Meaning |\n|----------|---------|\n| sakhe! | O friend! |\n| bandhuḥ | kinsman, friend |\n| priyaḥ / priyā | dear one |\n| snehaḥ | affection |\n| viśvāsaḥ | trust |\n| sahacaraḥ | companion |\n| tvam mama bandhuḥ | you are my friend |\n| tvayā saha sukham | happiness is with you |\n| tava hāsam paśyan ānandaḥ | seeing your smile brings joy |\n\n### Remorse/Humility (Dīnatā)\n| Sanskrit | Meaning |\n|----------|---------|\n| aparādhaḥ | offense |\n| doṣaḥ | fault |\n| pāpam | sin |\n| dīnaḥ | wretched, humble |\n| hīnaḥ | low, lacking |\n| kṣamasva | forgive |\n| mama aparādham kṣamasva | forgive my offenses |\n| aham pāpī | I am a sinner |\n| tava karuṇā eva mama āśrayaḥ | your mercy alone is my support |\n\n## The Game: \"One Deity, Five Bhāvas\"\n\nExpress the same devotion to Śiva through all five emotional lenses:\n\n**Śānta:** śivaḥ sarvam, sarvaṃ śivaḥ. śāntaṃ dhyāyāmi.\n(Śiva is all, all is Śiva. I meditate in peace.)\n\n**Dāsya:** he prabho! aham tava dāsaḥ. kiṃ karavāṇi? ājñāṃ dehi.\n(O Lord! I am your servant. What shall I do? Give the command.)\n\n**Sakhya:** he śiva! sakhe! adya kiṃ kurvāvaḥ? kailāse viharāvaḥ!\n(O Śiva! Friend! What shall we do today? Let's wander on Kailāsa!)\n\n**Vātsalya:** he bāla śambho! ehi, kṣīraṃ piba. tvāṃ rakṣāmi.\n(O child Śambhu! Come, drink milk. I will protect you.)\n\n**Mādhurya:** he prāṇanātha! tava vinā hṛdayam śūnyam. kadā āgacchasi?\n(O lord of my life! Without you my heart is empty. When will you come?)\n\n## Milestone Check\n\nCan you express your inner state — joy, sorrow, longing, gratitude, or wonder — entirely in Sanskrit, without reverting to English even in thought?\n", "reference": "# Stage 13: Bhāva — Reference Guide\n\n## Emotion Quick-Reference\n\n### Positive States\n| Sanskrit | Meaning | Usage |\n|----------|---------|-------|\n| ānandaḥ | bliss | ānando me bhavati |\n| sukham | happiness | sukham anubhavāmi |\n| harṣaḥ | joy | harṣeṇa pūrṇaḥ |\n| santoṣaḥ | contentment | santoṣaḥ asti |\n| śāntiḥ | peace | śāntiḥ mama hṛdaye |\n| tuṣṭiḥ | satisfaction | tuṣṭaḥ asmi |\n| premā | love | premṇā pūrṇam hṛdayam |\n| snehaḥ | affection | sneham anubhavāmi |\n| kṛtajñatā | gratitude | kṛtajñaḥ asmi |\n| dhanyatā | blessedness | dhanyaḥ asmi |\n\n### Painful States\n| Sanskrit | Meaning | Usage |\n|----------|---------|-------|\n| duḥkham | sorrow | duḥkham anubhavāmi |\n| śokaḥ | grief | śokena magnḥ |\n| virahaḥ | separation | viraha-vedanā |\n| utkaṇṭhā | longing | utkaṇṭhayā ākulaḥ |\n| bhayam | fear | bhayam asti |\n| cintā | worry | cintā mām bādhate |\n| krodhaḥ | anger | krodhaḥ na śobhate |\n| lajjā | shame | lajjayā adhomukhḥ |\n| glāniḥ | weariness | glānim anubhavāmi |\n| nirāśā | despair | nirāśā mā bhavatu |\n\n### Devotional States\n| Sanskrit | Meaning | Usage |\n|----------|---------|-------|\n| bhaktiḥ | devotion | bhaktiḥ vardhatām |\n| śraddhā | faith | śraddhayā pūjayāmi |\n| prapatti | surrender | prapattim karomi |\n| dāsyam | servitude | dāsyam svīkaromi |\n| vismayaḥ | wonder | vismayena pūrṇaḥ |\n| anugrahaḥ | grace | anugṛhāṇa mām |\n| karuṇā | compassion | karuṇayā paśya |\n| kṛpā | mercy | kṛpāṃ kuru |\n\n## Five Bhāvas — Expression Templates\n\n### Śānta (Peace)\n- oṃ śāntiḥ śāntiḥ śāntiḥ\n- sarvam brahmamayam jagat\n- śāntam hṛdayam mama\n- nityam ānanda-svarūpam asi tvam\n\n### Dāsya (Service)\n- he prabho! aham tava dāsaḥ\n- ājñāṃ dehi — kiṃ karavāṇi?\n- tava pādau mama śiraḥ\n- tava sevāyāṃ mama jīvitam\n\n### Sakhya (Friendship)\n- he sakhe! ehi, kathayāvaḥ\n- tava hāsena mama hṛdayaṃ pūrṇam\n- tvayā saha sarvaṃ sundaram\n- mā gaccha — tiṣṭha mayā saha\n\n### Vātsalya (Parental Love)\n- he bāla! ehi, mama krodaṃ āgaccha\n- mā bhaiṣīḥ — aham atra asmi\n- kṣīraṃ piba, modakaṃ khāda\n- tvāṃ rakṣāmi sadā\n\n### Mādhurya (Sweet Love)\n- he priyatame! kadā āgacchasi?\n- tava virahāt hṛdayaṃ dahyate\n- tava vadanam eva mama candra\n- tvāṃ vinā na kiñcit priyam\n\n## Exclamatory Particles\n\n| Particle | Use |\n|---------|-----|\n| aho! | wonder, amazement |\n| hā! | grief, loss |\n| dhik! | shame, disapproval |\n| sādhu! | well done! bravo! |\n| bhoḥ! | hey! (calling) |\n| he! | O! (vocative) |\n| kaṣṭam! | alas! how difficult! |\n| citraṃ! | how strange! |\n\n## Common Bhāva Expressions\n\n| Sanskrit | Meaning |\n|----------|---------|\n| hṛdayaṃ druti-bhūtam | heart is melted |\n| netrābhyāṃ aśrūṇi patanti | tears fall from the eyes |\n| romāñcaḥ jāyate | goosebumps arise |\n| kaṇṭhaḥ ruddhate | throat chokes |\n| manaḥ kampate | mind trembles |\n| prāṇāḥ utkaṇṭhitāḥ | life-breaths are agitated |\n| cittam ārdrī-bhūtam | mind is softened |\n| ātmā vilīyate | self dissolves |\n", "workbook-questions": "# Stage 13: Bhāva — Workbook (Questions)\n\n## Section A: Vocabulary (10 marks)\n**A1.** Give the Sanskrit for (5 marks):\n1. Longing: ___  2. Surrender: ___  3. Wonder: ___  4. Gratitude: ___  5. Peace: ___\n\n**A2.** Translate into English (5 marks):\n1. virahaḥ  2. anugrahaḥ  3. dāsyam  4. vismayaḥ  5. premā\n\n---\n\n## Section B: Emotional Expression (15 marks)\n**B1.** Express each feeling in a Sanskrit sentence (5 marks):\n1. Joy: ___\n2. Sorrow: ___\n3. Fear: ___\n4. Gratitude: ___\n5. Longing: ___\n\n**B2.** Write 2 sentences expressing wonder at the divine (5 marks):\n\n**B3.** Write 2 sentences expressing surrender to the divine (5 marks):\n\n---\n\n## Section C: Five Bhāvas Game (20 marks)\nChoose your iṣṭadevatā. Write a 2-line address in each bhāva:\n\n**C1.** Śānta (peaceful reverence) — 2 lines (4 marks):\n\n**C2.** Dāsya (servitude) — 2 lines (4 marks):\n\n**C3.** Sakhya (friendship) — 2 lines (4 marks):\n\n**C4.** Vātsalya (parental love) — 2 lines (4 marks):\n\n**C5.** Mādhurya (sweet love) — 2 lines (4 marks):\n\n---\n\n## Section D: Emotional Narrative (15 marks)\n**D1.** Write a 5-sentence passage about visiting your iṣṭadevatā's temple. Include at least 3 different bhāva-words (emotions) (10 marks):\n\n**D2.** Translate this emotional passage into English (5 marks):\n> he devi! tava darśanena mama hṛdayaṃ pūrṇam. netrābhyāṃ ānandasya aśrūṇi patanti. aho! kīdṛśī tava karuṇā! aham dīnaḥ, tvaṃ tu karuṇāmayī. tava pādayoḥ mama sarvaṃ samarpayāmi.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 13: Bhāva — Workbook (Answers)\n\n## Section A\n**A1.** 1. **utkaṇṭhā** (or virahaḥ)  2. **śaraṇāgatiḥ** (or prapatti)  3. **vismayaḥ** (or adbhutam)  4. **kṛtajñatā**  5. **śāntiḥ**\n\n**A2.** 1. separation/longing  2. grace/blessing  3. servitude  4. wonder/amazement  5. love\n\n## Section B\n**B1.** Samples:\n1. **ānando me hṛdaye bhavati** (joy arises in my heart)\n2. **duḥkham anubhavāmi** (I experience sorrow)\n3. **bhayam asti mama hṛdaye** (fear is in my heart)\n4. **dhanyaḥ asmi tava kṛpayā** (I am blessed by your grace)\n5. **tava darśanasya utkaṇṭhā mama asti** (I have longing for your vision)\n\n**B2.** Sample: **aho! kīdṛśaṃ tava rūpam! vismayena mama manaḥ pūrṇam.** (Oh! What is your form like! My mind is full of wonder.)\n\n**B3.** Sample: **he prabho! tvām eva śaraṇam prapadye. mama sarvaṃ tvayi samarpayāmi.** (O Lord, I take refuge in you alone. I offer everything to you.)\n\n## Section C\nSamples for Śiva:\n\n**C1.** Śānta: **oṃ namaḥ śivāya. sarvam śāntam, sarvam śivam.**\n**C2.** Dāsya: **he prabho! aham tava dāsaḥ. ājñāṃ dehi, kāryaṃ karomi.**\n**C3.** Sakhya: **he śiva sakhe! adya kailāse viharāvaḥ. tvayā saha ānandaḥ.**\n**C4.** Vātsalya: **he bāla śambho! ehi mama kroḍam. tvāṃ rakṣāmi sadā.**\n**C5.** Mādhurya: **he prāṇeśvara! tvāṃ vinā hṛdayaṃ śūnyam. kadā milāvaḥ?**\n\nAward 2 marks per bhāva: 1 for correct bhāva tone, 1 for grammatical correctness.\n\n## Section D\n**D1.** Sample:\n> adya aham devyāḥ mandiraṃ gacchāmi. dvāre sthitvā harṣeṇa pūrṇaḥ bhavāmi. garbhagṛhe devīṃ paśyāmi — aho! kīdṛśī śobhā! mama netrābhyāṃ ānandasya aśrūṇi patanti. kṛtajñaḥ asmi tava kṛpāyai he ambe!\n\n**D2.**\n> O Goddess! By your darśana my heart is full. Tears of joy fall from my eyes. Oh! What is your compassion like! I am wretched, but you are full of compassion. At your feet I offer everything of mine.\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 13 Badge: Bhāvavit\n\n**Title:** Emotion Speaker\n**Badge:** 🏅 Bhāvavit\n\n## Requirements\n\nExpress 5 distinct emotions (joy, sorrow, devotion, wonder, peace) in 2-3 Sanskrit sentences each — no English whatsoever.\n\n## How to Demonstrate\n\n**Format:** Text or voice post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 14 content and grants the **Bhāvavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "14-stotra-i", "number": 14, "title": "Stotra I", "subtitle": "Accusative Constructions", "files": {"theory": "# Stage 14: Stotra I — Accusative Constructions (Namāmi Challenge)\n\n## Goal\nCompose original praise verses using accusative (dvitīyā) constructions — the most natural structure for devotional poetry. Write a 4-line original stotra.\n\n## The Namāmi Construction\n\nThe simplest stotra pattern uses **namāmi** + accusative:\n> namāmi śivam — I bow to Śiva\n\nThis extends naturally into poetry:\n> namāmi śivaṃ śāntam — I bow to peaceful Śiva\n> namāmi śivaṃ divyam — I bow to divine Śiva\n> namāmi śivaṃ nityam — I bow to eternal Śiva\n\n## Classical Models\n\n### From Śiva-pañcākṣara-stotra (Ādi Śaṅkara):\n> nāgendrahārāya trilōcanāya\n> bhasmāṅgarāgāya maheśvarāya\n> nityāya śuddhāya digambarāya\n> tasmai \"na\"-kārāya namaḥ śivāya\n\nNotice: each line is a stack of **dative** attributes, but the same principle works with accusative.\n\n### From Acyutāṣṭakam:\n> acyutam keśavaṃ rāma-nārāyaṇam\n> kṛṣṇa-dāmodaraṃ vāsudevaṃ harim\n> śrīdharaṃ mādhavaṃ gopikā-vallabham\n> jānakī-nāyakaṃ rāmacandram bhaje\n\nHere **bhaje** (I adore) takes a series of accusative names.\n\n## Building Blocks for Stotra\n\n### Accusative Forms of Common Deity Names\n| Nominative | Accusative | Use in stotra |\n|-----------|-----------|---------------|\n| śivaḥ | śivam | namāmi śivam |\n| viṣṇuḥ | viṣṇum | bhajāmi viṣṇum |\n| devī | devīm | namāmi devīm |\n| kṛṣṇaḥ | kṛṣṇam | smarāmi kṛṣṇam |\n| rāmaḥ | rāmam | bhajāmi rāmam |\n| gaṇeśaḥ | gaṇeśam | namāmi gaṇeśam |\n| haraḥ | haram | smarāmi haram |\n| harim | — | bhaje harim |\n\n### Stotra Verbs (1st person singular)\n| Verb | Meaning | Takes |\n|------|---------|-------|\n| namāmi | I bow to | accusative |\n| bhajāmi | I adore | accusative |\n| smarāmi | I remember | accusative |\n| prapadye | I take refuge in | accusative |\n| staumi | I praise | accusative |\n| vandāmi | I salute | accusative |\n| sevāmi | I serve | accusative |\n| dhyāyāmi | I meditate on | accusative |\n| gāyāmi | I sing (about) | accusative |\n| āśraye | I resort to | accusative |\n\n## The Namāmi Challenge: 4-Line Composition\n\n### Step 1: Choose your deity and verb\n> namāmi ___\n\n### Step 2: Stack accusative descriptions\nEach line = adjective(s) in accusative + deity name in accusative + verb\n\n### Template:\n```\n[adj-acc] [adj-acc] [deity-acc] [verb]\n[adj-acc] [adj-acc] [deity-acc] [verb]\n[adj-acc] [adj-acc] [deity-acc] [verb]\n[adj-acc] [adj-acc] [deity-acc] [verb]\n```\n\n### Example for Śiva:\n```\nśāntam divyam mahādevam namāmi\nnīlakaṇṭham trilocanam namāmi\ngaṅgādharam umāpatim namāmi\nkailāsavāsam jagadīśam namāmi\n```\n\n### Example for Devī:\n```\nsundarīm karuṇāmayīm namāmi devīm\njagadambām mahāmāyām namāmi devīm\ndurgām bhayahāriṇīm namāmi devīm\nśaktim parameśvarīm namāmi devīm\n```\n\n## Techniques for Richer Stotras\n\n### 1. Epithet Stacking\n> padmanābham, sureshvaram, vanamālinam, garuḍadhvajam — namāmi viṣṇum\n\n### 2. Relative Clause (yaḥ/yā/yat)\n> yaḥ śūlapāṇiḥ yaḥ nīlakaṇṭhaḥ\n> yaḥ gaṅgādharo yaḥ umāpatiḥ\n> tam śaṅkaram... namāmi\n\n### 3. Action Description\n> yo nṛtyati yaḥ hasati yaḥ dahati yaḥ sṛjati\n> taṃ naṭarājaṃ namāmi\n\n### 4. Refrain (dhruva-pada)\nUse the same verb at the end of every line as a refrain.\n\n## Milestone Check\nCan you compose an original 4-line stotra using the namāmi/bhajāmi pattern with correct accusative forms?\n", "reference": "# Stage 14: Stotra I — Reference Guide\n\n## Accusative Forms Quick Table\n\n### Masculine -a stems\n| Nom. | Acc. | Example |\n|------|------|---------|\n| śivaḥ | śivam | namāmi śivam |\n| hariḥ | harim | bhajāmi harim |\n| viṣṇuḥ | viṣṇum | smarāmi viṣṇum |\n\n### Feminine stems\n| Nom. | Acc. | Example |\n|------|------|---------|\n| devī | devīm | vandāmi devīm |\n| durgā | durgām | namāmi durgām |\n| sarasvatī | sarasvatīm | staumi sarasvatīm |\n\n### Adjectives in Accusative (agreeing with deity)\n| Adj (M nom) | M acc | F acc | Usage |\n|-------------|-------|-------|-------|\n| śāntaḥ | śāntam | śāntām | namāmi śāntam śivam |\n| divyaḥ | divyam | divyām | bhajāmi divyām devīm |\n| nityaḥ | nityam | nityām | smarāmi nityam harim |\n| sundaraḥ | sundaram | sundarīm | vandāmi sundarīm devīm |\n| karuṇāmayaḥ | karuṇāmayam | karuṇāmayīm | namāmi karuṇāmayīm ambām |\n| anantaḥ | anantam | anantām | dhyāyāmi anantam viṣṇum |\n\n## Stotra Verbs with Accusative\n\n| Verb | 1P Sg | Meaning |\n|------|-------|---------|\n| namāmi | bow | most common |\n| bhajāmi | adore | intimate |\n| smarāmi | remember | meditative |\n| vandāmi | salute | formal |\n| staumi | praise | elevated |\n| dhyāyāmi | meditate on | contemplative |\n| prapadye | take refuge in | surrender |\n| āśraye | resort to | surrender |\n| gāyāmi | sing of | joyful |\n| sevāmi | serve | humble |\n\n## Stotra Templates\n\n### Template 1: Simple Namāmi (4 lines)\n```\n[epithet-acc] [epithet-acc] namāmi\n[epithet-acc] [epithet-acc] namāmi\n[epithet-acc] [epithet-acc] namāmi\n[epithet-acc] [epithet-acc] namāmi\n```\n\n### Template 2: Bhaje + Epithets (verse)\n```\n[name-acc] [name-acc] [name-acc] [name-acc]\n[name-acc] [name-acc] [name-acc] [name-acc]\n[name-acc] [name-acc] [name-acc] [name-acc]\n[name-acc] [name-acc] [name-acc] bhaje\n```\n\n### Template 3: Yaḥ/Yā Relative (who... him/her I bow to)\n```\nyaḥ [description] yaḥ [description]\nyaḥ [description] yaḥ [description]\ntaṃ [deity-acc] [verb]\n```\n\n### Template 4: Alternating epithets + refrain\n```\n[line of description]\ntaṃ/tāṃ praṇamāmi (refrain)\n[line of description]\ntaṃ/tāṃ praṇamāmi (refrain)\n```\n\n## 50 Useful Accusative Epithets for Stotras\n\n### For Śiva (masculine acc.)\nśāntam, divyam, nityam, śuddham, mahādevam, trilocanam, nīlakaṇṭham, gaṅgādharam, umāpatim, naṭarājam, paśupatim, digambaram, candraśekharam, vṛṣabhadhvajam, pinākapāṇim, kailāsavāsam, bhavaharam, yogīśvaram, viśvanātham, dakṣiṇāmūrtim\n\n### For Devī (feminine acc.)\ndevīm, ambām, durgām, pārvatīm, gaurīm, lalitām, jagadambām, mahāmāyām, bhavānīm, caṇḍikām, mahālakṣmīm, sarasvatīm, annapūrṇām, śāradām, tripurasundarīm, kāmākṣīm, rājarājeśvarīm, bhairāvīm, tārām, bālām\n\n### For Viṣṇu/Kṛṣṇa (masculine acc.)\nviṣṇum, harim, nārāyaṇam, keśavam, mādhavam, govindam, kṛṣṇam, rāmam, vāsudevam, puruṣottamam, acyutam, anantam, padmanābham, śrīdharam, lakṣmīpatim, garuḍadhvajam, vanamālinam, murārim, cakrapāṇim, dāmodaram\n", "workbook-questions": "# Stage 14: Stotra I — Workbook (Questions)\n\n## Section A: Accusative Forms (10 marks)\n**A1.** Convert to accusative for use in \"namāmi ___\" (10 marks):\n1. śivaḥ →  2. devī →  3. viṣṇuḥ →  4. rāmaḥ →  5. durgā →\n6. śāntaḥ (adj, M) →  7. divyā (adj, F) →  8. nityaḥ (adj, M) →  9. sundarī (adj, F) →  10. anantaḥ (adj, M) →\n\n## Section B: Line Composition (20 marks)\n**B1.** Complete each stotra line with appropriate accusative epithets (10 marks):\n1. ___ ___ namāmi śivam (2 adjectives for Śiva)\n2. ___ ___ namāmi devīm (2 adjectives for Devī)\n3. ___ ___ bhajāmi kṛṣṇam (2 epithets for Kṛṣṇa)\n4. ___ ___ smarāmi rāmam (2 epithets for Rāma)\n5. ___ ___ vandāmi gaṇeśam (2 adjectives for Gaṇeśa)\n\n**B2.** Write 4 lines of a stotra using \"namāmi\" as refrain, dedicated to your iṣṭadevatā (10 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n\n## Section C: Analysis (15 marks)\n**C1.** Identify all accusative words in this verse (5 marks):\n> acyutam keśavaṃ rāma-nārāyaṇam\n> kṛṣṇa-dāmodaraṃ vāsudevaṃ harim\n> śrīdharaṃ mādhavaṃ gopikā-vallabham\n> jānakī-nāyakaṃ rāmacandram bhaje\n\n**C2.** Rewrite this stotra changing the verb from namāmi to bhajāmi and the deity from Śiva to Devī (adjust all genders) (10 marks):\n> śāntam divyam mahādevam namāmi\n> nīlakaṇṭham trilocanam namāmi\n\nRewritten:\n1. ___\n2. ___\n\n## Section D: Original Composition (15 marks)\n**D1.** Compose a 4-line original stotra using the yaḥ/yā...tam/tām pattern (7 marks):\n\n**D2.** Compose a 4-line stotra using a different verb (bhajāmi, smarāmi, or dhyāyāmi) (8 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 14: Stotra I — Workbook (Answers)\n\n## Section A\n1. **śivam** 2. **devīm** 3. **viṣṇum** 4. **rāmam** 5. **durgām**\n6. **śāntam** 7. **divyām** 8. **nityam** 9. **sundarīm** 10. **anantam**\n\n## Section B\n**B1.** Samples:\n1. **śāntam divyam** namāmi śivam\n2. **sundarīm karuṇāmayīm** namāmi devīm\n3. **govindam vanamālinam** bhajāmi kṛṣṇam\n4. **dhīram dhārmikam** smarāmi rāmam\n5. **mahāntam siddhidāyakam** vandāmi gaṇeśam\n\n**B2.** Sample for Śiva:\n1. śāntam divyam trilocanam namāmi\n2. nīlakaṇṭham umāpatim namāmi\n3. gaṅgādharam naṭarājam namāmi\n4. kailāsavāsam viśvanātham namāmi\n\n## Section C\n**C1.** Accusative words: **acyutam, keśavam, rāma-nārāyaṇam, kṛṣṇa-dāmodaram, vāsudevam, harim, śrīdharam, mādhavam, gopikā-vallabham, jānakī-nāyakam, rāmacandram** — all 11 words are accusative, governed by **bhaje**.\n\n**C2.** Gender-shifted rewrite:\n1. **śāntām divyām mahādevīm bhajāmi**\n2. **karuṇāmayīm trilocanām bhajāmi**\n\n(Note: trilocanā as F bahuvrīhi is valid. Alternatively use a different epithet: sundarīm jagadambām bhajāmi)\n\n## Section D\n**D1.** Sample yaḥ...tam stotra:\n> yā sṛṣṭiṃ karoti yā pālayati\n> yā saṃhāraṃ kurute jagataḥ\n> yā sarvaśaktiḥ yā karuṇāmayī\n> tāṃ jagadambāṃ praṇamāmi sadā\n\n**D2.** Sample with smarāmi:\n> gaṅgādharam umāsahitam smarāmi\n> naṭarājam nṛtyapadam smarāmi\n> yogīśvaram dhyānaratam smarāmi\n> sadāśivam bhaktavadam smarāmi\n\nAward: correct accusatives (3), valid epithets (2), coherent praise (2), correct verb usage (1).\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 14 Badge: Stutikāra I\n\n**Title:** First Praise\n**Badge:** 🏅 Stutikāra I\n\n## Requirements\n\nCompose and post an original 4-line praise verse in Sanskrit for your iṣṭadevatā. Must use correct accusative (dvitīyā) constructions.\n\n## How to Demonstrate\n\n**Format:** Text post with Devanāgarī + IAST\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 15 content and grants the **Stutikāra I** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "15-stotra-ii", "number": 15, "title": "Stotra II", "subtitle": "Varied Cases", "files": {"theory": "# Stage 15: Stotra II — Varied Cases (Vibhakti Stotram)\n\n## Goal\nCompose stotras using intentionally varied vibhaktis. Move beyond the accusative to express devotion through all cases — dative, instrumental, genitive, locative, ablative.\n\n## Case-Centered Stotra Patterns\n\n### Caturthī (Dative) — \"To/For X\"\nThe **namaḥ** construction:\n> śivāya namaḥ — salutation to Śiva\n> viṣṇave namaḥ — salutation to Viṣṇu\n> devyai namaḥ — salutation to the Goddess\n> guruve namaḥ — salutation to the Guru\n\nExtended: stack dative epithets before namaḥ:\n> nīlakaṇṭhāya trilocanāya bhasmāṅgarāgāya maheśvarāya namaḥ\n\n### Tṛtīyā (Instrumental) — \"By/Through X\"\n> śivena rakṣitaḥ — protected by Śiva\n> bhaktyā muktaḥ — freed through devotion\n> tava kṛpayā jīvāmi — I live by your grace\n\nStotra pattern: describe the deity's power through instrumental:\n> yasya kṛpayā jagatī jayati\n> yasya tejasā timiraṃ naśyati\n\n### Pañcamī (Ablative) — \"From X\"\n> śivāt jñānam — knowledge from Śiva\n> bhayāt trāhi — save from fear\n> pāpāt mocaya — free from sin\n> saṃsārāt uddhara — lift from saṃsāra\n\n### Ṣaṣṭhī (Genitive) — \"Of X\"\n> śivasya kṛpā — Śiva's grace\n> devyāḥ mahimā — the Goddess's glory\n> tava rūpaṃ divyam — your form is divine\n> yasya smaraṇāt pāpaṃ naśyati — by remembrance of whom sin is destroyed\n\n### Saptamī (Locative) — \"In/On X\"\n> śive bhaktiḥ — devotion in Śiva\n> tvayi viśvāsaḥ — trust in you\n> hṛdaye tvaṃ vasasi — you dwell in my heart\n> padme lakṣmīḥ — Lakṣmī on the lotus\n\n## The Vibhakti Stotram Game\n\nCompose a stotra where each line deliberately showcases a different case:\n\n### Example: One Deity, Seven Cases\n```\nśivaḥ jagataḥ pālakaḥ            (1st - Śiva is protector)\nśivaṃ smarāmi satatam             (2nd - I remember Śiva)\nśivena sarvam rakṣitam             (3rd - by Śiva all is protected)\nśivāya sarvasvaṃ dadāmi            (4th - to Śiva I give everything)\nśivāt jñānaṃ labhāmahe             (5th - from Śiva we gain knowledge)\nśivasya māhātmyaṃ ko vā vaktuṃ śaknoti  (6th - who can tell Śiva's greatness?)\nśive mama bhaktiḥ sadā bhavatu     (7th - may my devotion in Śiva always be)\n```\n\n## Advanced Technique: Case as Theological Statement\n\nEach case implies a different relationship with the divine:\n\n| Case | Theological Meaning | Example |\n|------|-------------------|---------|\n| 1st | The divine IS (identity) | śivaḥ sarvam — Śiva is everything |\n| 2nd | I seek the divine (object of desire) | śivam bhajāmi |\n| 3rd | I am sustained BY the divine | śivena jīvāmi |\n| 4th | I dedicate TO the divine | śivāya sarvaṃ samarpayāmi |\n| 5th | I come FROM the divine | śivāt aham āgataḥ |\n| 6th | I belong to the divine | śivasya dāsaḥ asmi |\n| 7th | I rest IN the divine | śive mama viśrāntiḥ |\n\n## Milestone Check\nCan you compose a stotra of at least 4 lines, each line built around a different vibhakti?\n", "reference": "# Stage 15: Stotra II — Reference Guide\n\n## Deity Forms in All Cases (Singular)\n\n### Śiva (M, -a stem)\n| Case | Form | Stotra Phrase |\n|------|------|--------------|\n| 1st | śivaḥ | śivaḥ rakṣatu |\n| 2nd | śivam | namāmi śivam |\n| 3rd | śivena | śivena rakṣitāḥ |\n| 4th | śivāya | śivāya namaḥ |\n| 5th | śivāt | śivāt jñānam |\n| 6th | śivasya | śivasya kṛpā |\n| 7th | śive | śive bhaktiḥ |\n| Voc | he śiva! | he śiva prasīda! |\n\n### Devī (F, -ī stem)\n| Case | Form | Stotra Phrase |\n|------|------|--------------|\n| 1st | devī | devī rakṣatu |\n| 2nd | devīm | namāmi devīm |\n| 3rd | devyā | devyā anugrahaḥ |\n| 4th | devyai | devyai namaḥ |\n| 5th | devyāḥ | devyāḥ kṛpā āgacchatu |\n| 6th | devyāḥ | devyāḥ mahimā |\n| 7th | devyām | devyām viśvāsaḥ |\n| Voc | he devi! | he devi pāhi! |\n\n### Viṣṇu (M, -u stem)\n| Case | Form | Stotra Phrase |\n|------|------|--------------|\n| 1st | viṣṇuḥ | viṣṇuḥ pātu |\n| 2nd | viṣṇum | bhajāmi viṣṇum |\n| 3rd | viṣṇunā | viṣṇunā rakṣitam |\n| 4th | viṣṇave | viṣṇave namaḥ |\n| 5th | viṣṇoḥ | viṣṇoḥ prasādaḥ |\n| 6th | viṣṇoḥ | viṣṇoḥ līlā |\n| 7th | viṣṇau | viṣṇau bhaktiḥ |\n\n## Case-Based Stotra Formulas\n\n### Dative Stack (X-āya namaḥ)\n```\n[epithet-dat] [epithet-dat] [epithet-dat]\n[deity-dat] namaḥ\n```\n\n### Instrumental Praise (X-ena / X-ayā)\n```\nyasya/yasyāḥ [instrument-3rd] [result]\ntasmai/tasyai namaḥ\n```\n\n### Genitive Glory (X-asya / X-āyāḥ)\n```\n[deity-gen] [quality] [adjective]\n[deity-gen] [quality] [adjective]\n```\n\n### Locative Devotion (X-e / X-āyām)\n```\n[deity-loc] [my state/devotion]\nsarvadā [verb]\n```\n\n## Useful Phrases by Case\n\n### With Dative (4th)\n| Phrase | Meaning |\n|--------|---------|\n| śivāya namaḥ | salutation to Śiva |\n| gurave namaḥ | salutation to the guru |\n| sarvadevebhyo namaḥ | salutation to all gods |\n| namaḥ śivāya | (same, reversed) |\n\n### With Instrumental (3rd)\n| Phrase | Meaning |\n|--------|---------|\n| tava kṛpayā | by your grace |\n| tava tejasā | by your radiance |\n| tava icchayā | by your will |\n| bhaktyā muktaḥ | freed through devotion |\n\n### With Ablative (5th)\n| Phrase | Meaning |\n|--------|---------|\n| bhayāt rakṣa | protect from fear |\n| pāpāt mocaya | free from sin |\n| saṃsārāt uddhara | lift from saṃsāra |\n| duḥkhāt trāhi | save from sorrow |\n\n### With Genitive (6th)\n| Phrase | Meaning |\n|--------|---------|\n| tava rūpam | your form |\n| tava māhātmyam | your greatness |\n| tava kṛpā | your grace |\n| tava nāma | your name |\n| yasya smaraṇāt | by remembering whom |\n\n### With Locative (7th)\n| Phrase | Meaning |\n|--------|---------|\n| tvayi bhaktiḥ | devotion in you |\n| tvayi viśvāsaḥ | trust in you |\n| hṛdaye vasasi | you dwell in the heart |\n| sarveṣu bhūteṣu | in all beings |\n", "workbook-questions": "# Stage 15: Stotra II — Workbook (Questions)\n\n## Section A: Case Forms (10 marks)\n**A1.** Give the dative (4th) form and use in \"X namaḥ\" (5 marks):\n1. śiva →  2. devī →  3. viṣṇu →  4. gaṇeśa →  5. guru →\n\n**A2.** Give the genitive (6th) and use in \"X kṛpā\" (5 marks):\n1. śiva →  2. devī →  3. rāma →  4. guru →  5. bhagavān →\n\n## Section B: Case-Specific Composition (20 marks)\n**B1.** Write a 2-line stotra using only dative constructions (namaḥ pattern) (5 marks):\n**B2.** Write a 2-line stotra using instrumental (by whose grace/power...) (5 marks):\n**B3.** Write a 2-line stotra using ablative (save from X, free from Y) (5 marks):\n**B4.** Write a 2-line stotra using locative (devotion in X, trust in Y) (5 marks):\n\n## Section C: Vibhakti Stotram (20 marks)\n**C1.** Compose a 7-line stotra for your iṣṭadevatā — each line must feature a different vibhakti (1st through 7th). Label each line with the case used (14 marks):\n**C2.** Explain the theological significance of each case you used (6 marks):\n\n## Section D: Analysis (10 marks)\n**D1.** Identify the vibhakti and its role in each line (10 marks):\n1. nīlakaṇṭhāya namaḥ\n2. devyā anugraheṇa jīvāmi\n3. pāpāt trāhi māṃ prabho\n4. śivasya rūpaṃ divyam\n5. hṛdaye tvaṃ sadā vasasi\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 15: Stotra II — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **śivāya** namaḥ  2. **devyai** namaḥ  3. **viṣṇave** namaḥ  4. **gaṇeśāya** namaḥ  5. **gurave** namaḥ\n\n**A2.**\n1. **śivasya** kṛpā  2. **devyāḥ** kṛpā  3. **rāmasya** kṛpā  4. **guroḥ** kṛpā  5. **bhagavataḥ** kṛpā\n\n## Section B\n**B1.** Sample: nīlakaṇṭhāya trilocanāya namaḥ / gaṅgādharāya umāpataye namaḥ\n**B2.** Sample: yasya kṛpayā jagat jīvati / yasya tejasā timiraṃ naśyati\n**B3.** Sample: he devi! pāpāt mocaya mām / saṃsārāt uddhara mām prabho!\n**B4.** Sample: śive mama bhaktiḥ sadā bhavatu / tvayi mama viśvāso dṛḍhaḥ\n\n## Section C\n**C1.** Sample for Devī:\n1. (1st) devī mama māta, sarvasya rakṣikā\n2. (2nd) devīm smarāmi satatam hṛdaye\n3. (3rd) devyā kṛpayā mama jīvanaṃ dhanyam\n4. (4th) devyai mama sarvasvaṃ samarpayāmi\n5. (5th) devyāḥ caraṇāt amṛtaṃ patati\n6. (6th) devyāḥ mahimā vāṇyā na varṇanīyā\n7. (7th) devyām mama hṛdayaṃ sthiram tiṣṭhatu\n\n**C2.** Theological significance:\n- 1st: She IS the protector (identity/ontology)\n- 2nd: She is what I seek (object of devotion)\n- 3rd: I live BY her grace (sustaining power)\n- 4th: I dedicate TO her (offering/service)\n- 5th: From her comes nectar (source of grace)\n- 6th: Her glory is beyond words (transcendence)\n- 7th: My heart rests IN her (immanence/dwelling)\n\n## Section D\n1. nīlakaṇṭhāya namaḥ → **caturthī** (dative) — salutation TO the blue-throated one\n2. devyā anugraheṇa jīvāmi → **tṛtīyā** (instrumental) — I live BY the goddess's grace\n3. pāpāt trāhi mām → **pañcamī** (ablative) — save me FROM sin\n4. śivasya rūpaṃ divyam → **ṣaṣṭhī** (genitive) — Śiva's form is divine (OF Śiva)\n5. hṛdaye tvaṃ sadā vasasi → **saptamī** (locative) — you always dwell IN the heart\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 15 Badge: Stutikāra II\n\n**Title:** Case Artisan\n**Badge:** 🏅 Stutikāra II\n\n## Requirements\n\nCompose a stotra of 4+ lines where every line uses a specific vibhakti intentionally. State which vibhakti each line uses.\n\n## How to Demonstrate\n\n**Format:** Text post with annotation\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 16 content and grants the **Stutikāra II** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "16-prarthana", "number": 16, "title": "Prarthana", "subtitle": "Requests & Imperatives", "files": {"theory": "# Stage 16: Prārthanā — Requests and Imperatives\n\n## Goal\nCompose original prayers with imperatives, optatives, and benedictions. Master the grammar of asking gracefully — from urgent plea to gentle request.\n\n## Degrees of Request\n\n### 1. Direct Imperative (Loṭ) — Command/Urgent Plea\n> pāhi mām! — save me!\n> rakṣa mām! — protect me!\n> dehi me jñānam! — give me knowledge!\n\n### 2. Optative (Liṅ / Āśīrliṅ) — Wish/Gentle Request\n> bhūyāt — may it be\n> syāt — may there be\n> pātu — may [he/she] protect\n> jayatu — may [he/she] be victorious\n\n### 3. Potential (Vidhi-liṅ) — Should/Ought\n> kuryāt — one should do\n> bhajet — one should worship\n> paṭhet — one should recite\n\n### 4. First Person Optative — \"Let me...\"\n> bhavāni — let me be\n> karāṇi — let me do\n> seveyam — let me serve\n\n## Core Imperative Vocabulary (Expanded)\n\n| Root | 2P Sg (to deity) | 3P Sg (benediction) | Meaning |\n|------|-----------------|---------------------|---------|\n| pā | pāhi | pātu | protect |\n| rakṣ | rakṣa | rakṣatu | guard |\n| trā | trāhi | trātu | rescue |\n| dā | dehi | dadātu | give |\n| kṛ | kuru | karotu | do/make |\n| nī | naya | nayatu | lead |\n| darśay | darśaya | darśayatu | show |\n| kṣam | kṣamasva | kṣamatu | forgive |\n| pra-sad | prasīda | prasīdatu | be gracious |\n| śru | śṛṇu | śṛṇotu | hear |\n| bhū | bhava | bhavatu | be/become |\n| gam | gaccha | gacchatu | go |\n| ā-gam | āgaccha | āgacchatu | come |\n| dṛś (caus.) | darśaya | darśayatu | show |\n| muc | muñca | muñcatu | release |\n| ji | jaya | jayatu | conquer/be victorious |\n\n## Prayer Structures\n\n### Structure 1: Vocative + Imperative + Object\n> he devi! dehi me bhaktim\n> O Goddess, give me devotion\n\n### Structure 2: Vocative + Description + Imperative\n> he karuṇāsindho! mama duḥkhaṃ nāśaya\n> O ocean of compassion, destroy my suffering\n\n### Structure 3: Purpose Clause (yathā... tathā kuru)\n> yathā tvāṃ na vismarāmi tathā kuru\n> Make it so that I never forget you\n\n### Structure 4: Conditional Request (yadi... tadā)\n> yadi me doṣāḥ santi tadā kṣamasva\n> If I have faults, then forgive\n\n### Structure 5: Benedictive Chain\n> śivaḥ rakṣatu, devī pālayatu, guruḥ bodhayatu\n> May Śiva protect, may Devī preserve, may Guru enlighten\n\n## Complete Sample Prayer\n\n```\nhe jagadīśvara! he karuṇāsāgara!\nśṛṇu mama prārthanām!\n\nmama pāpaṃ kṣamasva,\nmama duḥkhaṃ nāśaya,\nmama ajñānaṃ dūrīkuru.\n\ndehi me jñānam,\ndehi me bhaktim,\ndehi me śāntim.\n\ntava pādayoḥ mama manaḥ sthāpaya.\ntava nāmni mama jihvāṃ niyojaya.\ntava rūpe mama cakṣuḥ sthirīkuru.\n\nsarvadā tvayi mama cittam bhavatu.\ntvām eva śaraṇaṃ prapadye.\n```\n\n## What to Ask For — Devotional Request Vocabulary\n\n| Sanskrit | Meaning |\n|----------|---------|\n| jñānam | knowledge |\n| bhaktim | devotion |\n| śāntim | peace |\n| muktim | liberation |\n| ārogyam | health |\n| āyuḥ | long life |\n| balam | strength |\n| dhairyam | courage |\n| kṣamām | patience |\n| vairāgyam | dispassion |\n| vivekam | discrimination |\n| sadbuddim | good understanding |\n\n## What to Ask Protection From\n\n| Sanskrit | Meaning |\n|----------|---------|\n| pāpāt | from sin |\n| bhayāt | from fear |\n| rogāt | from disease |\n| duḥkhāt | from sorrow |\n| saṃsārāt | from worldly cycle |\n| ajñānāt | from ignorance |\n| mohat | from delusion |\n| lobhāt | from greed |\n| krodhāt | from anger |\n| mṛtyoḥ | from death |\n\n## Milestone Check\nCan you compose an original 8-line Sanskrit prayer with vocatives, imperatives, and specific requests?\n", "reference": "# Stage 16: Prārthanā — Reference Guide\n\n## Imperative Forms Table\n\n### 2nd Person (Requesting the deity)\n| Root | Parasmai. | Ātmane. | Meaning |\n|------|----------|---------|---------|\n| pā | pāhi | — | protect |\n| rakṣ | rakṣa | — | guard |\n| trā | trāhi | — | rescue |\n| dā | dehi | — | give |\n| kṛ | kuru | kuruṣva | do |\n| nī | naya | — | lead |\n| gam | gaccha | — | go |\n| śru | śṛṇu | — | hear |\n| pra-sad | prasīda | — | be gracious |\n| kṣam | — | kṣamasva | forgive |\n| bhū | bhava | — | be |\n| darśay | darśaya | — | show |\n| muc | muñca | — | release |\n\n### 3rd Person (Benedictions — \"may X...\")\n| Root | Form | Meaning |\n|------|------|---------|\n| pā | pātu | may [he] protect |\n| rakṣ | rakṣatu | may [he] guard |\n| bhū | bhavatu | may it be |\n| ji | jayatu | may [he] conquer |\n| nī | nayatu | may [he] lead |\n| kṛ | karotu | may [he] do |\n| dā | dadātu | may [he] give |\n\n### 1st Person (Self-resolution — \"let me...\")\n| Root | Form | Meaning |\n|------|------|---------|\n| bhū | bhavāni | let me be |\n| kṛ | karāṇi | let me do |\n| nam | namāni | let me bow |\n| sev | seveyam | let me serve |\n\n## Prayer Template Library\n\n### Simple Plea\n```\nhe [deity-voc]!\n[imperative] mām!\n```\n\n### Extended Prayer\n```\nhe [deity-voc]! he [epithet-voc]!\nśṛṇu mama prārthanām.\n[request 1 — dehi/kuru + object]\n[request 2 — rakṣa/pāhi + mām + ablative]\n[request 3 — naya/darśaya]\ntava śaraṇam prapadye.\n```\n\n### Benedictive Chain\n```\n[deity] pātu [body part / quality]\n[deity] rakṣatu [situation]\n[deity] [benediction]\nsarve bhavantu sukhinaḥ.\n```\n\n## Request Objects (Accusative)\n\n| Request | Sanskrit |\n|---------|----------|\n| Give me knowledge | dehi me jñānam |\n| Give me devotion | dehi me bhaktim |\n| Give me peace | dehi me śāntim |\n| Give me strength | dehi me balam |\n| Give me courage | dehi me dhairyam |\n| Give me wisdom | dehi me prajñām |\n| Give me liberation | dehi me muktim |\n\n## Protection Requests (Ablative + Imperative)\n\n| Request | Sanskrit |\n|---------|----------|\n| Protect from fear | bhayāt rakṣa / bhayāt trāhi |\n| Free from sin | pāpāt mocaya |\n| Save from death | mṛtyoḥ trāhi |\n| Lift from saṃsāra | saṃsārāt uddhara |\n| Remove ignorance | ajñānaṃ nāśaya |\n| Destroy sorrow | duḥkhaṃ nāśaya |\n\n## Famous Prayer Phrases\n\n| Sanskrit | Source | Meaning |\n|----------|-------|---------|\n| asato mā sadgamaya | Bṛhadāraṇyaka | lead me from untruth to truth |\n| tamaso mā jyotirgamaya | Bṛhadāraṇyaka | lead me from darkness to light |\n| mṛtyor mā amṛtam gamaya | Bṛhadāraṇyaka | lead me from death to immortality |\n| sarve bhavantu sukhinaḥ | traditional | may all be happy |\n| sarve santu nirāmayāḥ | traditional | may all be free from illness |\n| oṃ śāntiḥ śāntiḥ śāntiḥ | Upaniṣads | om peace peace peace |\n| lokāḥ samastāḥ sukhino bhavantu | traditional | may all worlds be happy |\n", "workbook-questions": "# Stage 16: Prārthanā — Workbook (Questions)\n\n## Section A: Imperative Forms (10 marks)\n**A1.** Give the 2P sg imperative (5 marks): 1. pā →  2. dā →  3. kṛ →  4. kṣam →  5. śru →\n**A2.** Give the 3P sg benedictive (5 marks): 1. pā →  2. bhū →  3. ji →  4. rakṣ →  5. kṛ →\n\n## Section B: Prayer Lines (15 marks)\n**B1.** Complete these prayers (5 marks):\n1. he devi! ___ me bhaktim (give)\n2. he śiva! mama pāpam ___ (forgive)\n3. he prabho! bhayāt ___ mām (save)\n4. he guru! mām ___ (lead — nī)\n5. he bhagavan! ___ mama prārthanām (hear)\n\n**B2.** Write 5 prayer lines requesting specific things using \"dehi me ___\" (5 marks):\n**B3.** Write 5 prayer lines requesting protection using \"___āt rakṣa/trāhi mām\" (5 marks):\n\n## Section C: Full Prayer Composition (25 marks)\n**C1.** Compose an 8-line original prayer to your iṣṭadevatā (15 marks). Include: vocative, at least 3 different imperatives, a request for something positive, a request for protection from something negative, and a line of surrender.\n\n**C2.** Write a benedictive prayer (5 lines) — each line should use the 3P imperative (\"may X protect/bless/conquer...\") (10 marks):\n\n## Section D: Translation (10 marks)\n**D1.**
