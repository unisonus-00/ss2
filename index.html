n\nThe journey from nāma to avadhāna is complete as curriculum.\nAs practice, it is ananta — endless.\n\noṃ tat sat.\n\n---\n\niti saṃskṛta-vidyālayasya dvātriṃśat-sopāna-pāṭhakramaḥ samāptaḥ.\n", "badge": "# Stage 36 Badge: Avadhānī\n\n**Title:** Master Builder\n**Badge:** 🏅 Avadhānī\n\n## Requirements\n\nPerform a full Aṣṭāvadhāna before a live audience. This badge is granted by community consensus after a public performance.\n\n## How to Demonstrate\n\n**Format:** Live performance — community vote\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 37 content and grants the **Avadhānī** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}];

---------|\n| √dṛś | to see | dadarśa, dṛṣṭvā, dṛṣṭaḥ | DM 1.8, 6.8; VS passim |\n| √śru | to hear | śuśrāva, śrutvā, śruta | DM 6.20, 9.1; VS passim |\n| √vid | to know | veda, vetti, vidita | DM passim; VS passim |\n| √jñā | to know | jānāti, jñātaḥ, jñāna (n.) | DM passim; LS passim |\n| √man | to think | manyate, manvāna, mata | DM passim; VS passim |\n| √cint | to contemplate | cintayāmāsa, cintita | DM 1.9 |\n| √smṛ | to remember | smarati, smṛtā | LS passim; DM 12.14 |\n| √budh | to awaken, know | buddhā, bodhayāmāsa | DM 1.73 (Viṣṇu awakened) |\n\n## D. Speaking (see also 08-sound-speech.md)\n\n| Root | Meaning | Key Forms | Sources |\n|------|---------|-----------|---------|\n| √vac | to speak | uvāca, uktaḥ, vakti | DM throughout |\n| √brū | to say | abravīt, brūhi | DM passim |\n| √ah | to say | āha, prāha | DM 6.3 |\n| √gad | to speak | jagāda | DM 6.8 |\n| √kathay | to narrate | kathayāmāsa | DM 1.4 |\n\n## E. Giving and Taking\n\n| Root | Meaning | Key Forms | Sources |\n|------|---------|-----------|---------|\n| √dā | to give | dadau, dadāti, dattaḥ | DM 4.37 (abhayaṃ dadau); VS passim |\n| √grah / √gṛh | to seize, take | jagrāha, gṛhīta | DM 9.14; VS passim |\n| √labh | to obtain | lebhe, labdha, lābha | DM passim; VS passim |\n| √āp | to attain | āpa, prāpta | DM 13.20; VS passim |\n| √hṛ | to take, carry | jaghāra, āhṛta | DM passim; VS passim |\n\n## F. Creating and Destroying\n\n| Root | Meaning | Key Forms | Sources |\n|------|---------|-----------|---------|\n| √sṛj | to create, release | sasarja, sṛṣṭa, sṛṣṭi | LS 264; VS passim |\n| √naś | to perish | nāśa, naṣṭa, vināśa | DM 12.9; LS passim |\n| √han | to kill | jaghāna, hata | DM throughout |\n| √kṛ | to do, make | cakāra, karoti, kṛtaḥ, kartṛ | DM throughout; VS passim |\n| √jan | to be born | jajñe, jāta, janana | DM passim; LS passim; VS passim |\n| √mṛ | to die | mamāra, mṛta, maraṇa | DM passim |\n| √jīv | to live | jīvati, jīvana | DM passim |\n\n## G. Worship and Devotion\n\n| Root ūra", "m": "peacock"}, {"t": "mūṣaka", "m": "mouse"}, {"t": "gaja / hastin / ibha / kuñjara / karin / dvipa", "m": "elephant"}, {"t": "airāvata", "m": "Indra's elephant"}, {"t": "kumbha", "m": "forehead-dome of elephant"}, {"t": "mātaṅga", "m": "elephant (also: Mātaṅgī goddess)"}, {"t": "aśva / haya / turaga / vājin", "m": "horse"}, {"t": "sarpa / nāga / ahi / bhujaṅga", "m": "serpent"}, {"t": "ananta / śeṣa", "m": "the infinite serpent-bed"}, {"t": "nāgayajñopavīta", "m": "serpent as sacred thread"}, {"t": "mṛga", "m": "deer, wild animal"}, {"t": "kuraṅga / hariṇa", "m": "deer"}, {"t": "śvan / kukkura", "m": "dog"}, {"t": "go / dhenu", "m": "cow"}, {"t": "kūrma", "m": "tortoise"}, {"t": "varāha", "m": "boar"}, {"t": "vyāghra", "m": "tiger"}, {"t": "kokila", "m": "cuckoo"}, {"t": "kīra / śuka", "m": "parrot"}, {"t": "haṃsī", "m": "female swan"}, {"t": "cāmarī", "m": "yak"}, {"t": "mīna / matsya", "m": "fish"}, {"t": "śarabha", "m": "mythical eight-legged beast"}, {"t": "ratha", "m": "chariot"}, {"t": "sārathi", "m": "charioteer"}, {"t": "vāhana", "m": "mount, vehicle"}, {"t": "siṃhavāhinī", "m": "she whose vehicle is the lion"}, {"t": "vṛṣavāhinī", "m": "she whose vehicle is the bull"}, {"t": "siṃhavāhinī", "m": "lion-rider"}, {"t": "cakrarājaratha", "m": "chariot of Śrīcakra"}, {"t": "geyacakraratha", "m": "chariot of Geyacakra"}, {"t": "kiricakraratha", "m": "chariot of Kiricakra"}]}, {"id": "15-indeclinables", "title": "Indeclinables", "subtitle": "Particles, conjunctions, adverbs", "content": "# 15 — Indeclinables (Avyayas)\n\nThese particles, conjunctions, and adverbs appear constantly. Mastering them is essential for reading any of the five texts fluently.\n\nSource key: DM = Devī Māhātmyam, LS = Lalitā Sahasranāma, KKS = Kakārādi Kālī SN, KS = Kālī SN, VS = Viṣṇu SN\n\n---\n\n## A. Conjunctions\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| ca | and | all texts, highest frequency |\n| tu | but, however | DM passim |\n| vā | or | DM passim |\n| athavā | or else | DM passim |\n| api | also, even | DM passim |\n| atha | now, then (opening particle) | DM passim |\n| tathā | so, likewise | DM passim (paired with yathā) |\n\n## B. Emphasis and Affirmation\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| eva | indeed, only, precisely | DM throughout |\n| hi | indeed, for (causal) | DM passim |\n| khalu | indeed, certainly | DM passim |\n| nūnam | certainly, surely | DM passim |\n| sma | (emphatic past particle) | DM passim |\n| vai | truly, indeed | DM passim |\n\n## C. Negation\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| na | not | DM throughout |\n| mā | don't (prohibitive) | DM passim |\n| na... na | neither... nor | DM passim |\n\n## D. Comparison\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| iva | like, as if (simile marker) | DM 9.9; LS passim |\n| yathā | as, just as | DM passim |\n| tathā | so, likewise | paired with yathā |\n| samam | equally, like | DM passim |\n\n## E. Temporal Adverbs\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| tataḥ | then, thereupon | DM most frequent connector |\n| tadā | then, at that time | DM passim |\n| yadā | when | DM passim |\n| idānīm | now | DM passim |\n| purā | formerly | DM 2.3 |\n| pūrvam | before | DM passim |\n| paścāt | afterward | DM passim |\n| sadā / nityam / sarvadā | always | DM passim; KKS passim; KS passim |\n| muhur muhur | again and again | DM passim |\n| punar | again | DM passim |\n| śīghram / drutam / āśu / tvaritam / laghu | quickly | DM 6.7, 6.22 |\n| sahasā | suddenly | DM passim |\n| cirāt / ciram | for a long time | DM passim |\n\n## F. Spatial Adverbs\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| atra | here | DM passim |\n| tatra | there | DM passim |\n| yatra | where | DM passim |\n| sarvatra | everywhere | DM passim |\n| samantāt | all around | DM passim |\n| upari | above | DM passim |\n| adhaḥ | below | DM passim |\n| agrataḥ | in front | DM 9.7 |\n| pṛṣṭhataḥ | behind | DM 9.7 |\n| dūrāt / dūrataḥ | from afar | DM passim |\n| antare | within, between | DM passim |\n\n## G. Interrogatives\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| kim | what? why? | DM 1.31; DM 6.11 |\n| katham | how? | DM 1.31 |\n| kutaḥ | whence? why? | DM 1.31 |\n| kaḥ / kā / kim | who? which? what? | DM passim |\n| kvacit | somewhere, sometimes | DM passim |\n\n## H. Quotation and Manner\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| iti | thus (closes quotation/speech) | DM throughout |\n| evam | thus, in this way | DM passim |\n| tathā | in that way | DM passim |\n| svayam | by oneself | DM 5.88 (svayameva) |\n| balāt | forcibly | DM 6.4, 6.9 |\n| saṃkhye | in battle (loc. of saṃkhyā) | DM passim |\n\n## I. Miscellaneous\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| aho | ah! (exclamation) | DM passim |\n| hanta | alas! come! | DM passim |\n| param | but, however; beyond | DM passim |\n| prabhṛti | from (starting from) | DM passim |\n| prāyaḥ | mostly | DM passim |\n| kimu / kiṃ punar | how much more / what then | DM passim |\n| vinā | without | DM passim |\n| saha | with, together | DM passim |\n", "cards": [{"t": "ca", "m": "and"}, {"t": "tu", "m": "but, however"}, {"t": "vā", "m": "or"}, {"t": "athavā", "m": "or else"}, {"t": "api", "m": "also, even"}, {"t": "atha", "m": "now, then (opening particle)"}, {"t": "tathā", "m": "so, likewise"}, {"t": "eva", "m": "indeed, only, precisely"}, {"t": "hi", "m": "indeed, for (causal)"}, {"t": "khalu", "m": "indeed, certainly"}, {"t": "nūnam", "m": "certainly, surely"}, {"t": "sma", "m": "(emphatic past particle)"}, {"t": "vai", "m": "truly, indeed"}, {"t": "na", "m": "not"}, {"t": "mā", "m": "don't (prohibitive)"}, {"t": "na... na", "m": "neither... nor"}, {"t": "iva", "m": "like, as if (simile marker)"}, {"t": "yathā", "m": "as, just as"}, {"t": "tathā", "m": "so, likewise"}, {"t": "samam", "m": "equally, like"}, {"t": "tataḥ", "m": "then, thereupon"}, {"t": "tadā", "m": "then, at that time"}, {"t": "yadā", "m": "when"}, {"t": "idānīm", "m": "now"}, {"t": "purā", "m": "formerly"}, {"t": "pūrvam", "m": "before"}, {"t": "paścāt", "m": "afterward"}, {"t": "sadā / nityam / sarvadā", "m": "always"}, {"t": "muhur muhur", "m": "again and again"}, {"t": "punar", "m": "again"}, {"t": "śīghram / drutam / āśu / tvaritam / laghu", "m": "quickly"}, {"t": "sahasā", "m": "suddenly"}, {"t": "cirāt / ciram", "m": "for a long time"}, {"t": "atra", "m": "here"}, {"t": "tatra", "m": "there"}, {"t": "yatra", "m": "where"}, {"t": "sarvatra", "m": "everywhere"}, {"t": "samantāt", "m": "all around"}, {"t": "upari", "m": "above"}, {"t": "adhaḥ", "m": "below"}, {"t": "agrataḥ", "m": "in front"}, {"t": "pṛṣṭhataḥ", "m": "behind"}, {"t": "dūrāt / dūrataḥ", "m": "from afar"}, {"t": "antare", "m": "within, between"}, {"t": "kim", "m": "what? why?"}, {"t": "katham", "m": "how?"}, {"t": "kutaḥ", "m": "whence? why?"}, {"t": "kaḥ / kā / kim", "m": "who? which? what?"}, {"t": "kvacit", "m": "somewhere, sometimes"}, {"t": "iti", "m": "thus (closes quotation/speech)"}, {"t": "evam", "m": "thus, in this way"}, {"t": "tathā", "m": "in that way"}, {"t": "svayam", "m": "by oneself"}, {"t": "balāt", "m": "forcibly"}, {"t": "saṃkhye", "m": "in battle (loc. of saṃkhyā)"}, {"t": "aho", "m": "ah! (exclamation)"}, {"t": "hanta", "m": "alas! come!"}, {"t": "param", "m": "but, however; beyond"}, {"t": "prabhṛti", "m": "from (starting from)"}, {"t": "prāyaḥ", "m": "mostly"}, {"t": "kimu / kiṃ punar", "m": "how much more / what then"}, {"t": "vinā", "m": "without"}, {"t": "saha", "m": "with, together"}]}, {"id": "16-prefixes-suffixes", "title": "Prefixes & Suffixes", "subtitle": "Upasargas, taddhita, krt", "content": "# 16 — Prefixes (Upasargas) and Key Suffixes\n\nSource key: DM = Devī Māhātmyam, LS = Lalitā Sahasranāma, KKS = Kakārādi Kālī SN, KS = Kālī SN, VS = Viṣṇu SN\n\n---\n\n## A. Upasargas (Verbal Prefixes) — with Text Examples\n\n| Prefix | Meaning | Example | Source |\n|--------|---------|---------|--------|\n| pra- | forward, intensely, forth | prahāra (strike), praṇamya (prostrate), prabodhana (awakening) | DM 1.73, 3.24; VS passim |\n| vi- | apart, away, intensely | vicchinna (severed), vināśa (destruction), vimukta (freed) | DM 3.18; LS passim |\n| sam- | together, completely | saṃhāra (annihilation), saṃgrāma (battle), saṃpūjya (worshipping fully) | DM 3.26; LS passim |\n| upa- | near, toward, sub- | upāgamya (having approached), upāsana (worship) | DM passim; VS passim |\n| ā- | toward, until | āgata (arrived), ākarṇya (hearing), ākṛṣya (dragging) | DM 6.2, 6.4 |\n| ni- | down, into, completely | nipāta (downfall), nihata (slain), nilaya (abode) | DM passim; LS passim |\n| nis- / nir- | out, without, away | nirgata (gone out), nirghāta (thunder), nirañjana (unstained) | DM 9.26; LS 134 |\n| abhi- | toward, against, upon | abhyadhāvat (rushed toward), abhiṣeka (consecration) | DM 6.13; KS passim |\n| pari- | around, fully | parivṛta (surrounded), parikṣipta (encircled) | DM passim; LS passim |\n| anu- | after, along, according to | anugraha (grace), anucara (follower) | LS 272; DM passim |\n| ati- | beyond, exceedingly | ativīrya (of great valor), atimatta (extremely intoxicated) | DM 2.57; KS passim |\n| ud- / ut- | up, out | utthitā (risen), udgata (arisen), unmatta (mad) | DM passim; KS passim |\n| apa- | away, off | apavarga (liberation), apamṛtyu (untimely death) | DM 13.5, 12.19 |\n| dur- / duṣ- | bad, difficult | durgā (inaccessible), durlabha (hard to get), durjaya (hard to conquer) | DM 4.11; LS 188; KS passim |\n| su- | good, well, easy | sundara (beautiful), sulabha (easy to attain), sukha (happiness) | LS passim; KS passim |\n\n## B. Feminine Name-Forming Suffixes (common in sahasranāmas)\n\n| Suffix | Function | Examples | Sources |\n|--------|----------|----------|---------|\n| -ā | basic feminine | durgā, kālī, ambikā, śivā | all texts |\n| -inī | possessive feminine | yoginī, kāminī, vāsinī, dhāriṇī | LS/KKS/KS passim |\n| -ikā | diminutive/descriptive feminine | kālikā, caṇḍikā, nāyikā | DM passim; KS passim |\n| -iṇī | agent feminine | pāśinī, śūlinī, cakriṇī | KS passim |\n| -vatī | possessing (feminine) | kalavatī, bhagavatī, guṇavatī | KKS 6; DM passim; KS passim |\n| -mayī | made of, consisting of (f.) | cinmayī, sarvamayī, ānandamayī | LS 251; DM 11.23; KS passim |\n| -rūpiṇī | having the form of (f.) | caitanyarūpiṇī, kāmarūpiṇī | DM 5.14; KKS passim; KS passim |\n| -svarūpiṇī | whose essential nature is (f.) | mantrarūpiṇī, sarvasvarūpiṇī | KS passim; DM 11.6 |\n| -parāyaṇā | devoted to (f.) | kāmaparāyaṇā, dharmaparāyaṇā | KKS passim; KS passim |\n| -priyā | fond of (f.) | puṣpapriyā, madhupriyā | KKS passim; LS passim |\n| -sthā / -sthitā | situated in (f.) | bindumaṇḍalavāsinī, padmasthā | LS passim; KKS passim |\n| -dā / -dāyinī | giving (f.) | varadā, abhayapradā, siddhidāyinī | LS passim; KKS passim |\n\n## C. Key Kṛt Suffixes (participles/verbal adjectives)\n\n| Suffix | Function | Examples | Sources |\n|--------|----------|----------|---------|\n| -ta (pp.) | past passive participle | hata (slain), kṛta (done), stuta (praised) | all texts |\n| -tavat (past active pp.) | one who has done | kṛtavān, dṛṣṭavān | DM passim |\n| -māna (pres. middle pp.) | being done | stūyamāna (being praised) | DM 4.37 |\n| -at / -ant (pres. active pp.) | doing | gacchat, kurvat, jayat | DM passim |\n| -tṛ / -tr (agent) | doer | kartṛ, hartṛ, goptrī | LS 266; VS passim |\n| -tvā (absolutive) | having done | hatvā, dṛṣṭvā, śrutvā, gatvā | DM throughout |\n| -ya (absolutive with prefix) | having done (w/ prefix) | praṇamya, ākarṇya, samīkṣya | DM throughout |\n| -ana (action noun) | the act of | vandana, tarpaṇa, pūjana | KKS passim; VS passim |\n| -in (possessive) | having, possessing | tejasvín, tapasvin, yogin | VS passim; KS passim |\n\n## D. Key Taddhita Suffixes\n\n| Suffix | Function | Examples | Sources |\n|--------|----------|----------|---------|\n| -eya (patronymic) | son/descendant of | kauṇḍinya, kātyāyanī, kaunteya | KKS 985; DM 11.2 |\n| -ika (relating to) | belonging to, connected with | vaidika, tāntrika, sāttvikaḥ | LS passim |\n| -tva (abstract n.) | -ness, -ship | kavitva, devatva, mahattva | KKS 150+; VS passim |\n| -tā (abstract f.) | -ness | devatā, mahimatā | VS passim |\n", "cards": [{"t": "pra-", "m": "forward, intensely, forth"}, {"t": "vi-", "m": "apart, away, intensely"}, {"t": "sam-", "m": "together, completely"}, {"t": "upa-", "m": "near, toward, sub-"}, {"t": "ā-", "m": "toward, until"}, {"t": "ni-", "m": "down, into, completely"}, {"t": "nis- / nir-", "m": "out, without, away"}, {"t": "abhi-", "m": "toward, against, upon"}, {"t": "pari-", "m": "around, fully"}, {"t": "anu-", "m": "after, along, according to"}, {"t": "ati-", "m": "beyond, exceedingly"}, {"t": "ud- / ut-", "m": "up, out"}, {"t": "apa-", "m": "away, off"}, {"t": "dur- / duṣ-", "m": "bad, difficult"}, {"t": "su-", "m": "good, well, easy"}]}, {"id": "17-compounds", "title": "Compounds", "subtitle": "Key samasas broken down", "content": "# 17 — Key Compounds (Samāsas) Broken Down\n\nSource key: DM = Devī Māhātmyam, LS = Lalitā Sahasranāma, KKS = Kakārādi Kālī SN, KS = Kālī SN, VS = Viṣṇu SN\n\n---\n\n## A. Tatpuruṣa (Determinative) Compounds\n\n| Compound | Vigraha | Meaning | Sources |\n|----------|---------|---------|---------|\n| mahiṣāsura-mardanī | mahiṣāsuraṃ mardayati iti | crusher of the buffalo-demon | DM 3.44 |\n| durgārti-nāśinī | durgām ārtim nāśayati iti | destroyer of dire suffering | LS; DM 9.31 |\n| triśūla-dhāriṇī | triśūlaṃ dhārayati iti | wielder of the trident | DM passim |\n| siṃha-vāhinī | siṃho vāhanam yasyāḥ sā | she whose vehicle is the lion | DM 2.29 |\n| sarvadaitya-kulāntaka | sarveṣāṃ daityakulānāṃ antakaḥ | ender of all demon clans | DM 11.14 |\n| sarvadeva-śarīrajā | sarveṣāṃ devānāṃ śarīrebhyaḥ jātā | born from all gods' bodies | DM 2.10 |\n| keśa-ākarṣaṇa-vihvalā | keśānām ākarṣaṇena vihvalā | distraught from hair-dragging | DM 6.4 |\n| kapāla-mālyam | kapālānāṃ mālyam | garland of skulls | KS passim |\n| cintāmaṇi-gṛha | cintāmaṇeḥ gṛham | wish-jewel palace | LS 57 |\n| puṣpa-vṛṣṭi | puṣpāṇāṃ vṛṣṭiḥ | rain of flowers | DM 4.30 |\n| śara-vṛṣṭi | śarāṇāṃ vṛṣṭiḥ | rain of arrows | DM 3.7 |\n| phala-śruti | phalasya śrutiḥ | hearing of the fruit/merit | DM Ch.12 |\n\n## B. Karmadhāraya (Appositional) Compounds\n\n| Compound | Vigraha | Meaning | Sources |\n|----------|---------|---------|---------|\n| mahā-māyā | mahātī ca sā māyā ca | the great illusion | DM 1.40 |\n| mahā-devī | mahātī ca sā devī ca | the great goddess | DM passim |\n| mahā-vidyā | mahātī ca sā vidyā ca | the great knowledge | DM 1.55 |\n| mahā-kālī | mahātī ca sā kālī ca | the great Kālī | DM Ch.1 |\n| para-brahman | paraṃ ca tat brahma ca | the supreme absolute | LS passim |\n| sad-guru | sat ca asau guruḥ ca | the true teacher | LS passim |\n| nīla-sarasvatī | nīlā ca sā sarasvatī ca | the blue Sarasvatī | KS passim |\n\n## C. Bahuvrīhi (Possessive/Exocentric) Compounds\n\n| Compound | Vigraha | Meaning | Sources |\n|----------|---------|---------|---------|\n| raktabīja | raktaṃ bījaṃ yasya saḥ | he whose seed is blood | DM 8.40 |\n| dhūmra-locana | dhūmre locane yasya saḥ | he whose eyes are smoky | DM 6.3 |\n| aṣṭādaśa-bhujā | aṣṭādaśa bhujāḥ yasyāḥ sā | she of eighteen arms | DM 2.12 |\n| catur-bhujā | catvāraḥ bhujāḥ yasyāḥ sā | she of four arms | LS 7 |\n| tri-netrā / tri-locanā | trīṇi netrāṇi yasyāḥ sā | she of three eyes | DM 2.13; KS 83 |\n| padma-nayanā | padme iva nayane yasyāḥ sā | she whose eyes are like lotuses | LS 207 |\n| pīnonnata-stanī | pīnau unnatau stanau yasyāḥ sā | she of full upraised breasts | KS 127 |\n| mukta-keśī | muktāḥ keśāḥ yasyāḥ sā | she of loose/unbound hair | KS 101 |\n| digambarā | diśaḥ eva ambaraṃ yasyāḥ sā | she whose garment is the sky (naked) | KS 128 |\n| nṛmuṇḍa-sragviṇī | nṛmuṇḍānāṃ srak yasyāḥ sā | she garlanded with human heads | KS passim |\n| prasphuritādhara | prasphuritaḥ adharaḥ yasya saḥ | he whose lip quivers | DM 6.21 |\n\n## D. Dvandva (Copulative) Compounds\n\n| Compound | Vigraha | Meaning | Sources |\n|----------|---------|---------|---------|\n| devāsura | devāḥ ca asurāḥ ca | gods and demons | DM 2.3 |\n| śumbha-niśumbha | śumbhaḥ ca niśumbhaḥ ca | Śumbha and Niśumbha | DM 5.4+ |\n| caṇḍa-muṇḍa | caṇḍaḥ ca muṇḍaḥ ca | Caṇḍa and Muṇḍa | DM 7.1 |\n| madhu-kaiṭabha | madhuḥ ca kaiṭabhaḥ ca | Madhu and Kaiṭabha | DM 1.72 |\n| bhoga-svarga-apavarga | bhogaḥ ca svargaḥ ca apavargaḥ ca | enjoyment, heaven, and liberation | DM 13.5 |\n| icchā-jñāna-kriyā-śakti | icchā ca jñānaṃ ca kriyā ca | will, knowledge, and action powers | LS passim |\n\n## E. Avyayībhāva (Adverbial) Compounds\n\n| Compound | Meaning | Sources |\n|----------|---------|---------|\n| khaṇḍaśaḥ | into pieces | DM passim |\n| śataśaḥ | by hundreds | DM 9.27 |\n| sahasraśaḥ | by thousands | DM 8.45, 9.27 |\n| yathāvidhi | according to rule | DM passim |\n| samantataḥ | all around | DM passim |\n\n## F. Vocative Compounds (Sambodhana in Stutis)\n\n| Compound | Meaning | Sources |\n|----------|---------|---------|\n| sarvamaṅgalamāṅgalye | O auspicious of all auspicious things | DM 11.10 |\n| śive sarvārthasādhike | O auspicious one, accomplisher of all goals | DM 11.10 |\n| śaraṇye tryambake gauri | O refuge, three-eyed Gaurī | DM 11.10 |\n| nārāyaṇi namo'stu te | O Nārāyaṇī, salutations to you | DM 11.12+ (refrain) |\n", "cards": [{"t": "mahiṣāsura-mardanī", "m": "mahiṣāsuraṃ mardayati iti"}, {"t": "durgārti-nāśinī", "m": "durgām ārtim nāśayati iti"}, {"t": "triśūla-dhāriṇī", "m": "triśūlaṃ dhārayati iti"}, {"t": "siṃha-vāhinī", "m": "siṃho vāhanam yasyāḥ sā"}, {"t": "sarvadaitya-kulāntaka", "m": "sarveṣāṃ daityakulānāṃ antakaḥ"}, {"t": "sarvadeva-śarīrajā", "m": "sarveṣāṃ devānāṃ śarīrebhyaḥ jātā"}, {"t": "keśa-ākarṣaṇa-vihvalā", "m": "keśānām ākarṣaṇena vihvalā"}, {"t": "kapāla-mālyam", "m": "kapālānāṃ māl i namo'stu te", "m": "O Nārāyaṇī, salutations to you"}]}, {"id": "18-formulae", "title": "Formulae", "subtitle": "Recurring phrases, refrains", "content": "# 18 — Recurring Phrases, Refrains, and Colophons\n\nThese fixed expressions appear dozens or hundreds of times across the texts. Recognize them instantly.\n\nSource key: DM = Devī Māhātmyam, LS = Lalitā Sahasranāma, KKS = Kakārādi Kālī SN, KS = Kālī SN, VS = Viṣṇu SN\n\n---\n\n## A. DM Narrative Markers\n\n| Phrase | Meaning | Frequency |\n|--------|---------|-----------|\n| ṛṣir uvāca | the sage said | every chapter (narrator switch) |\n| rājovāca | the king said | DM 1.3, 9.1, 13.1 |\n| devyuvāca | the Goddess said | DM 5.116, 6.10, 12.1 |\n| devā ūcuḥ | the gods said | DM 4.1, 5.9 |\n| mārkaṇḍeya uvāca | Mārkaṇḍeya said | DM 13.6, 13.26 |\n\n## B. DM Transitional Phrases\n\n| Phrase | Meaning | Usage |\n|--------|---------|-------|\n| tataḥ | then, thereupon | most common connector (~100 times) |\n| ity uktvā | having said thus | speech→action transition |\n| iti śrutvā | having heard thus | hearing→response |\n| evaṃ stutvā | having praised thus | stuti→result |\n| tān/tāṃ dṛṣṭvā | having seen them/her | vision→action |\n| tato devī | then the Goddess | action pivot |\n\n## C. DM Emotional State Phrases\n\n| Phrase | Meaning | Sources |\n|--------|---------|---------|\n| kopāviṣṭā | seized by anger | DM 3.26 |\n| saṃkruddha | thoroughly enraged | DM 9.17 |\n| kopādhmatā | swollen with rage | DM 8.4 |\n| prasphuritādhara | with quivering lip | DM 6.21 |\n| amarṣapūritaḥ | filled with indignation | DM 6.2 |\n\n## D. DM Ch.5 — Yā Devī Refrain\n\n| Phrase | Meaning |\n|--------|---------|\n| yā devī sarvabhūteṣu X-rūpeṇa saṃsthitā | She who in all beings is established as X |\n| namaḥ tasyai namaḥ tasyai namaḥ tasyai namo namaḥ | Salutation to her, to her, to her — salutations! |\n\nX rotates through: viṣṇumāyā, cetanā, buddhi, nidrā, kṣudhā, chāyā, śakti, tṛṣṇā, kṣānti, jāti, lajjā, śānti, śraddhā, kānti, lakṣmī, vṛtti, smṛti, dayā, tuṣṭi, mātṛ, bhrānti (DM 5.14-78)\n\n## E. DM Ch.11 — Nārāyaṇī Stuti Refrain\n\n| Phrase | Meaning |\n|--------|---------|\n| nārāyaṇi namo'stu te | O Nārāyaṇī, salutations to you |\n\nAppears after nearly every verse in Ch.11 as a recurring refrain.\n\n## F. DM Ch.11 — Key Verse (11.10)\n\n| Pāda | Text | Meaning |\n|------|------|---------|\n| a | sarvamaṅgalamāṅgalye | O auspicious of all auspicious things |\n| b | śive sarvārthasādhike | O Śivā, accomplisher of all goals |\n| c | śaraṇye tryambake gauri | O refuge, three-eyed Gaurī |\n| d | nārāyaṇi namo'stu te | O Nārāyaṇī, salutations to you |\n\n## G. DM Colophon Formula\n\n| Phrase | Meaning |\n|--------|---------|\n| iti śrīmārkaṇḍeyapurāṇe sāvarṇike manvantare devīmāhātmye | Thus in the Śrī Mārkaṇḍeya Purāṇa, in the Sāvarṇika Manvantara, in the Devī Māhātmya |\n| X-vadho nāma Y-o'dhyāyaḥ | named \"the slaying of X\", the Y-th chapter |\n\n## H. Sahasranāma Opening/Closing Formulae\n\n### Namāvalī Format\n| Phrase | Meaning | Text |\n|--------|---------|------|\n| oṃ X-āya/ai namaḥ | Oṃ, salutation to X | VS/LS/KKS/KS throughout |\n| oṃ X-āya namaḥ | (masculine dative) | VS throughout |\n| oṃ X-yai namaḥ | (feminine dative) | LS/KKS/KS throughout |\n\n### VS Opening\n| Phrase | Meaning |\n|--------|---------|\n| śrī bhagavān uvāca | the blessed Lord said |\n| yaḥ sarvatrānavadyātmā | he who is the blameless self everywhere |\n\n### LS Opening (Pūrvabhāga)\n| Phrase | Meaning |\n|--------|---------|\n| hayagrīva uvāca | Hayagrīva said |\n| agastyāya varaṃ dattvā | having given a boon to Agastya |\n\n## I. Universal Sacred Phrases\n\n| Phrase | Meaning | Sources |\n|--------|---------|---------|\n| oṃ namaḥ śivāya | Oṃ, salutation to Śiva | KS/KKS contexts |\n| oṃ namo nārāyaṇāya | Oṃ, salutation to Nārāyaṇa | VS context |\n| oṃ aiṃ hrīṃ klīṃ | Bāla mantra seed | LS/KKS contexts |\n| jayatu jayatu devī | victory, victory to the Goddess | DM passim |\n| svasti | well-being, auspiciousnes s: devaḥ, śivaḥ, kṛṣṇaḥ, gaṇeśaḥ, sūryaḥ, candraḥ, and thousands more.\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | rāmaḥ | rāmau | rāmāḥ |\n| Dvitīyā | rāmam | rāmau | rāmān |\n| Tṛtīyā | rāmeṇa | rāmābhyām | rāmaiḥ |\n| Caturthī | rāmāya | rāmābhyām | rāmebhyaḥ |\n| Pañcamī | rāmāt | rāmābhyām | rāmebhyaḥ |\n| Ṣaṣṭhī | rāmasya | rāmayoḥ | rāmāṇām |\n| Saptamī | rāme | rāmayoḥ | rāmeṣu |\n| Sambodhana | he rāma! | he rāmau! | he rāmāḥ! |\n\n> **Mantra test:** rāmāya namaḥ (dative) — \"salutation to Rāma\"\n> **Build:** rāma + āya = rāmāya (snap the caturthī brick)\n\n---\n\n## 2. Durgā — ā-kārānta strīliṅga (feminine ā-stem)\n\nCovers: gaṅgā, sītā, rādhā, mālā, latā, pūjā, vidyā, and all feminine -ā nouns.\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | durgā | durge | durgāḥ |\n| Dvitīyā | durgām | durge | durgāḥ |\n| Tṛtīyā | durgayā | durgābhyām | durgābhiḥ |\n| Caturthī | durgāyai | durgābhyām | durgābhyaḥ |\n| Pañcamī | durgāyāḥ | durgābhyām | durgābhyaḥ |\n| Ṣaṣṭhī | durgāyāḥ | durgayoḥ | durgāṇām |\n| Saptamī | durgāyām | durgayoḥ | durgāsu |\n| Sambodhana | he durge! | he durge! | he durgāḥ! |\n\n> **Mantra test:** durgāyai namaḥ (dative) — \"salutation to Durgā\"\n> **Notice:** The ā-plate has unique feminine connectors: -āyai, -āyāḥ, -āyām\n\n---\n\n## 3. Hari — i-kārānta puṃliṅga (masculine i-stem)\n\nCovers: agniḥ, muniḥ, kaviḥ, ṛṣiḥ, rāśiḥ, and all masculine -i nouns.\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | hariḥ | harī | harayaḥ |\n| Dvitīyā | harim | harī | harīn |\n| Tṛtīyā | hariṇā | haribhyām | haribhiḥ |\n| Caturthī | haraye | haribhyām | haribhyaḥ |\n| Pañcamī | hareḥ | haribhyām | haribhyaḥ |\n| Ṣaṣṭhī | hareḥ | haryoḥ | harīṇām |\n| Saptamī | harau | haryoḥ | hariṣu |\n| Sambodhana | he hare! | he harī! | he harayaḥ! |\n\n> **Mantra test:** haraye namaḥ (dative) — \"salutation to Hari\"\n> **Notice:** Pañcamī and ṣaṣṭhī are identical (hareḥ). The -i plate has this quirk.\n\n---\n\n## 4. Lakṣmī — ī-kārānta strīliṅga (feminine ī-stem)\n\nCovers: devī, nadī, pārvatī, sarasvatī, gaurī, and all feminine -ī nouns.\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | lakṣmīḥ | lakṣmyau | lakṣmyaḥ |\n| Dvitīyā | lakṣmīm | lakṣmyau | lakṣmīḥ |\n| Tṛtīyā | lakṣmyā | lakṣmībhyām | lakṣmībhiḥ |\n| Caturthī | lakṣmyai | lakṣmībhyām | lakṣmībhyaḥ |\n| Pañcamī | lakṣmyāḥ | lakṣmībhyām | lakṣmībhyaḥ |\n| Ṣaṣṭhī | lakṣmyāḥ | lakṣmyoḥ | lakṣmīṇām |\n| Saptamī | lakṣmyām | lakṣmyoḥ | lakṣmīṣu |\n| Sambodhana | he lakṣmi! | he lakṣmyau! | he lakṣmyaḥ! |\n\n> **Mantra test:** lakṣmyai namaḥ (dative) — \"salutation to Lakṣmī\"\n> **Notice:** The ī shortens before consonant-initial endings (-bhyām), and becomes -y- before vowel-initial endings\n\n---\n\n## 5. Viṣṇu — u-kārānta puṃliṅga (masculine u-stem)\n\nCovers: guruḥ, śatruḥ, paśuḥ, vāyuḥ, śambhuḥ, bhānuḥ, and all masculine -u nouns.\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | viṣṇuḥ | viṣṇū | viṣṇavaḥ |\n| Dvitīyā | viṣṇum | viṣṇū | viṣṇūn |\n| Tṛtīyā | viṣṇunā | viṣṇubhyām | viṣṇubhiḥ |\n| Caturthī | viṣṇave | viṣṇubhyām | viṣṇubhyaḥ |\n| Pañcamī | viṣṇoḥ | viṣṇubhyām | viṣṇubhyaḥ |\n| Ṣaṣṭhī | viṣṇoḥ | viṣṇvoḥ | viṣṇūnām |\n| Saptamī | viṣṇau | viṣṇvoḥ | viṣṇuṣu |\n| Sambodhana | he viṣṇo! | he viṣṇū! | he viṣṇavaḥ! |\n\n> **Mantra test:** viṣṇave namaḥ (dative) — \"salutation to Viṣṇu\"\n> **Notice:** The u-plate mirrors the i-plate pattern. Pañcamī = ṣaṣṭhī (viṣṇoḥ). Sambodhana guṇa → viṣṇo!\n\n---\n\n## 6. Bhagavat — at-kārānta puṃliṅga (consonant stem, present participle type)\n\nCovers: mahāt, vidvat, and all -at/-mat/-vat stems (dhīmat, śrīmat, hanumāt).\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | bhagavān | bhagavantau | bhagavantaḥ |\n| Dvitīyā | bhagavantam | bhagavantau | bhagavataḥ |\n| Tṛtīyā | bhagavatā | bhagavadbhyām | bhagavadbhiḥ |\n| Caturthī | bhagavate | bhagavadbhyām | bhagavadbhyaḥ |\n| Pañcamī | bhagavataḥ | bhagavadbhyām | bhagavadbhyaḥ |\n| Ṣaṣṭhī | bhagavataḥ | bhagavatoḥ | bhagavatām |\n| Saptamī | bhagavati | bhagavatoḥ | bhagavatsu |\n| Sambodhana | he bhagavan! | he bhagavantau! | he bhagavantaḥ! |\n\n> **Mantra test:** bhagavate namaḥ (dative) — \"salutation to the Blessed One\"\n> **Notice:** Prathamā singular gets a special strong form: bhagavat → bhagavān (the -t drops and the vowel lengthens). This is the \"upgrade brick.\"\n\n---\n\n## 7. Ātman — an-kārānta puṃliṅga (n-stem)\n\nCovers: brahman, rājan, and all -an stems.\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | ātmā | ātmānau | ātmānaḥ |\n| Dvitīyā | ātmānam | ātmānau | ātmanaḥ |\n| Tṛtīyā | ātmanā | ātmabhyām | ātmabhiḥ |\n| Caturthī | ātmane | ātmabhyām | ātmabhyaḥ |\n| Pañcamī | ātmanaḥ | ātmabhyām | ātmabhyaḥ |\n| Ṣaṣṭhī | ātmanaḥ | ātmanoḥ | ātmanām |\n| Saptamī | ātmani | ātmanoḥ | ātmasu |\n| Sambodhana | he ātman! | he ātmānau! | he ātmānaḥ! |\n\n> **Mantra test:** ātmane namaḥ (dative) — \"salutation to the Self\"\n> **Notice:** The n-stem has three grades — strong (ātmān-), middle (ātman-), weak (ātma-). Prathamā/dvitīyā use strong, the rest use middle or weak.\n\n---\n\n## 8. Mātṛ — ṛ-kārānta strīliṅga (feminine ṛ-stem)\n\nCovers all -tṛ agent nouns and kinship terms: pitṛ (father), bhartṛ (husband/sustainer), kartṛ (doer), dātṛ (giver), dhātṛ (creator), svasṛ (sister). Mātṛ serves double duty — it is both a kinship term and, as a title of Devī, a sacred name.\n\nThe ṛ-stem is special: it has **three stem grades** like the n-stem:\n- **Strong** (vṛddhi): mātār- (prathamā/dvitīyā/sambodhana singular & dual)\n- **Middle** (guṇa): mātar- (before consonant endings in some forms)\n- **Weak** (zero): mātr- (before vowel-initial endings)\n\n### Feminine ṛ-stem (mātṛ)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | mātā | mātarau | mātaraḥ |\n| Dvitīyā | mātaram | mātarau | mātṝḥ |\n| Tṛtīyā | mātrā | mātṛbhyām | mātṛbhiḥ |\n| Caturthī | mātre | mātṛbhyām | mātṛbhyaḥ |\n| Pañcamī | mātuḥ | mātṛbhyām | mātṛbhyaḥ |\n| Ṣaṣṭhī | mātuḥ | mātroḥ | mātṝṇām |\n| Saptamī | mātari | mātroḥ | mātṛṣu |\n| Sambodhana | he mātaḥ! | he mātarau! | he mātaraḥ! |\n\n> **Mantra test:** mātre namaḥ (dative) — \"salutation to the Mother\"\n> **Notice:** Pañcamī = ṣaṣṭhī (mātuḥ) — same quirk as the i-plate and u-plate. The prathamā singular drops the -ṛ entirely → mātā (like ātmā on the n-plate). Bahuvacana dvitīyā uses the rare long ṝ: mātṝḥ.\n\n### Masculine ṛ-stem (pitṛ) — for comparison\n\nThe masculine ṛ-stem differs in prathamā/dvitīyā/tṛtīyā singular:\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | pitā | pitarau | pitaraḥ |\n| Dvitīyā | pitaram | pitarau | pitṝn |\n| Tṛtīyā | pitrā | pitṛbhyām | pitṛbhiḥ |\n| Caturthī | pitre | pitṛbhyām | pitṛbhyaḥ |\n| Pañcamī | pituḥ | pitṛbhyām | pitṛbhyaḥ |\n| Ṣaṣṭhī | pituḥ | pitroḥ | pitṝṇām |\n| Saptamī | pitari | pitroḥ | pitṛṣu |\n\n> **Build insight:** kartṛ (doer), dātṛ (giver), dhātṛ (creator) — all the -tṛ agent nouns from dhātu + tṛc pratyaya follow this same plate. So when you snap the -tṛ suffix onto any root, you already know every form it can take.\n\n---\n\n## The Pattern Across Baseplates\n\nAll eight baseplates share the same skeleton. The vibhakti *meaning* never changes — only the connector shape does:\n\n| Vibhakti | Meaning | a-plate | ā-plate | i-plate | ī-plate | u-plate | ṛ-plate |\n|----------|---------|---------|---------|---------|---------|---------|---------|\n| Prathamā | subject | -aḥ | -ā | -iḥ | -īḥ | -uḥ | -ā |\n| Dvitīyā | object | -am | -ām | -im | -īm | -um | -aram |\n| Tṛtīyā | by/with | -ena | -ayā | -iṇā | -yā | -unā | -rā |\n| Caturthī | for/to | -āya | -āyai | -aye | -yai | -ave | -re |\n| Pañcamī | from | -āt | -āyāḥ | -eḥ | -yāḥ | -oḥ | -uḥ |\n| Ṣaṣṭhī | of | -asya | -āyāḥ | -eḥ | -yāḥ | -oḥ | -uḥ |\n| Saptamī | in/on | -e | -āyām | -au | -yām | -au | -ari |\n\n> The function is fixed. The shape varies by baseplate. Learn the baseplate, apply it to any noun with that ending.\n\n---\n\n## Quick Test: Which Baseplate?\n\n| Word | Ending | Baseplate | Decline like... |\n|------|--------|-----------|----------------|\n| śivaḥ | -a | A-plate | Rāma |\n| gaṅgā | -ā | Ā-plate | Durgā |\n| agniḥ | -i | I-plate | Hari |\n| sarasvatī | -ī | Ī-plate | Lakṣmī |\n| guruḥ | -u | U-plate | Viṣṇu |\n| hanumān | -at | Consonant-plate | Bhagavat |\n| brahman | -an | N-plate | Ātman |\n| kartā | -ṛ | Ṛ-plate | Mātṛ / Pitṛ |\n", "cards": [{"t": "Vibhakti", "m": "Ekavacana"}, {"t": "Prathamā", "m": "rāmaḥ"}, {"t": "Dvitīyā", "m": "rāmam"}, {"t": "Tṛtīyā", "m": "rāmeṇa"}, {"t": "Caturthī", "m": "rāmāya"}, {"t": "Pañcamī", "m": "rāmāt"}, {"t": "Ṣaṣṭhī", "m": "rāmasya"}, {"t": "Saptamī", "m": "rāme"}, {"t": "Sambodhana", "m": "he rāma!"}, {"t": "Vibhakti", "m": "Ekavacana"}, {"t": "Prathamā", "m": "durgā"}, {"t": "Dvitīyā", "m": "durgām"}, {"t": "Tṛtīyā", "m": "durgayā"}, {"t": "Caturthī", "m": "durgāyai"}, {"t": "Pañcamī", "m": "durgāyāḥ"}, {"t": "Ṣaṣṭhī", "m": "durgāyāḥ"}, {"t": "Saptamī", "m": "durgāyām"}, {"t": "Sambodhana", "m": "he durge!"}, {"t": "Vibhakti", "m": "Ekavacana"}, {"t": "Prathamā", "m": "hariḥ"}, {"t": "Dvitīyā", "m": "harim"}, {"t": "Tṛtīyā", "m": "hariṇā"}, {"t": "Caturthī", "m": "haraye"}, {"t": "Pañcamī", "m": "hareḥ"}, {"t": "Ṣaṣṭhī", "m": "hareḥ"}, {"t": "Saptamī", "m": "harau"}, {"t": "Sambodhana", "m": "he hare!"}, {"t": "Vibhakti", "m": "Ekavacana"}, {"t": "Prathamā", "m": "lakṣmīḥ"}, {"t": "Dvitīyā", "m": "lakṣmīm"}, {"t": "Tṛtīyā", "m": "lakṣmyā"}, {"t const PHASES = [
  { label: "Phase 1: Language Acquisition", range: [1, 12] },
  { label: "Phase 2: Poetic Composition",   range: [13, 25] },
  { label: "Phase 3: Avadhana",             range: [26, 36] },
];

let currentSection = 'lessons';
let currentStage = null;
let currentTab = null;
let currentVocab = null;
let visitedStages = new Set();

// Load visited stages from localStorage
try {
  const saved = localStorage.getItem('ss-visited');
  if (saved) visitedStages = new Set(JSON.parse(saved));
} catch(e) {}

function saveVisited() {
  try {
    localStorage.setItem('ss-visited', JSON.stringify([...visitedStages]));
  } catch(e) {}
}

// ── Flashcard state ──
let fcCards = [];
let fcIdx = 0;
let fcRevealed = false;
let fcGood = 0;
let fcAgain = 0;
let fcBatchSize = 20;
let fcMissed = [];

// ── Scroll progress tracking ──
const contentWrap = document.getElementById('contentWrap');
contentWrap.addEventListener('scroll', function() {
  const el = this;
  const scrollTop = el.scrollTop;
  const scrollHeight = el.scrollHeight - el.clientHeight;
  const pct = scrollHeight > 0 ? Math.min(100, (scrollTop / scrollHeight) * 100) : 0;
  document.getElementById('scrollProgressFill').style.width = pct + '%';
});

// ══════════════════════════════════════════════
// SECTION SWITCHING
// ══════════════════════════════════════════════
function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.section-btn[onclick*="' + section + '"]').classList.add('active');
  document.getElementById('search').value = '';
  document.getElementById('search').placeholder = section === 'lessons' ? 'Search stages...' : 'Search vocabulary...';
  buildSidebar();
  if (section === 'lessons') {
    selectStage(0);
  } else {
    selectVocab(0);
  }
}

// ══════════════════════════════════════════════
// SIDEBAR BUILDER
// ══════════════════════════════════════════════
function buildSidebar() {
  const list = document.getElementById('stageList');
  let html = '';

  if (currentSection === 'lessons') {
    // Overview (stage 0) first, outside any phase
    const overviewIdx = STAGES.findIndex(s => s.number === 0);
    if (overviewIdx >= 0) {
      const s = STAGES[overviewIdx];
      const visited = visitedStages.has(s.id) ? ' visited' : '';
      html += '<div class="stage-item' + visited + '" data-idx="' + overviewIdx + '" data-section="lessons" onclick="selectStage(' + overviewIdx + ')">';
      html += '<span class="stage-num"></span>';
      html += '<div class="stage-info"><div class="stage-title">' + s.title + '</div>';
      html += '<div class="stage-subtitle">' + s.subtitle + '</div></div></div>';
    }

    // Phases
    PHASES.forEach((phase, pi) => {
      const stagesInPhase = STAGES.filter(s => s.number >= phase.range[0] && s.number <= phase.range[1]);
      if (stagesInPhase.length === 0) return;

      const count = stagesInPhase.length;
      html += '<div class="phase-header" id="phase-' + pi + '">';
      html += '<button class="phase-toggle" onclick="togglePhase(' + pi + ')">';
      html += '<span class="phase-arrow">&#9660;</span>';
      html += '<span class="phase-label">' + phase.label + '</span>';
      html += '<span class="phase-count">' + count + '</span>';
      html += '</button>';
      html += '<div class="phase-stages" style="max-height:' + (count * 60) + 'px">';

      stagesInPhase.forEach(s => {
        const i = STAGES.indexOf(s);
        const num = String(s.number).padStart(2, '0');
        const visited = visitedStages.has(s.id) ? ' visited' : '';
        html += '<div class="stage-item' + visited + '" data-idx="' + i + '" data-section="lessons" onclick="selectStage(' + i + ')">';
        html += '<span class="stage-num">' + num + '</span>';
        html += '<div class="stage-info"><div class="stage-title">' + s.title + '</div>';
        html += '<div class="stage-subtitle">' + s.subtitle + '</div></div></div>';
      });

      html += '</div></div>';
    });
  } else {
    // Vocab section
    html += '<div class="phase-header" id="phase-vocab">';
    html += '<button class="phase-toggle" onclick="togglePhase(&quot;vocab&quot;)">';
    html += '<span class="phase-arrow">&#9660;</span>';
    html += '<span class="phase-label">Vocabulary Bank</span>';
    html += '<span class="phase-count">' + VOCAB.length + '</span>';
    html += '</button>';
    html += '<div class="phase-stages" style="max-height:' + (VOCAB.length * 60) + 'px">';

    VOCAB.forEach((v, i) => {
      const num = v.id.split('-')[0];
      const cardCount = v.cards.length;
      const sub = v.subtitle + (cardCount > 0 ? ' &middot; ' + cardCount + ' cards' : '');
      html += '<div class="stage-item" data-idx="' + i + '" data-section="vocab" onclick="selectVocab(' + i + ')">';
      html += '<span class="stage-num">' + num + '</span>';
      html += '<div class="stage-info"><div class="stage-title">' + v.title + '</div>';
      html += '<div class="stage-subtitle">' + sub + '</div></div></div>';
    });

    html += '</div></div>';
  }

  list.innerHTML = html;
}

function togglePhase(id) {
  const el = document.getElementById('phase-' + id);
  if (el) el.classList.toggle('collapsed');
}

// ══════════════════════════════════════════════
// STAGE SELECTION
// ══════════════════════════════════════════════
function selectStage(idx) {
  currentStage = idx;
  currentVocab = null;
  const stage = STAGES[idx];

  // Mark visited
  visitedStages.add(stage.id);
  saveVisited();

  // Update sidebar active states
  document.querySelectorAll('.stage-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector('.stage-item[data-idx="' + idx + '"][data-section="lessons"]');
  if (item) {
    item.classList.add('active');
    item.classList.add('visited');
  }

  // Build tabs
  const tabBar = document.getElementById('tabBar');
  if (stage.number === 0) {
    tabBar.innerHTML = '<div class="tab active">Overview</div>';
    renderContent(stage.files.overview);
    currentTab = 'overview';
  } else {
    let tabHtml = '';
    stage.tabs.forEach((t, ti) => {
      const cls = ti === 0 ? 'active' : '';
      const label = FILE_LABELS[t] || t;
      tabHtml += '<div class="tab ' + cls + '" data-tab="' + t + '" onclick="selectTab(&quot;' + t + '&quot;)">' + label + '</div>';
    });
    tabBar.innerHTML = tabHtml;
    currentTab = stage.tabs[0];
    renderContent(stage.files[currentTab]);
  }

  closeMobileSidebar();
}

function selectVocab(idx) {
  currentVocab = idx;
  currentStage = null;
  const v = VOCAB[idx];

  document.querySelectorAll('.stage-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector('.stage-item[data-idx="' + idx + '"][data-section="vocab"]');
  if (item) item.classList.add('active');

  const tabBar = document.getElementById('tabBar');
  let tabHtml = '<div class="tab active" data-tab="browse" onclick="selectVocabTab(&quot;browse&quot;)">Browse</div>';
  if (v.cards.length > 0) {
    tabHtml += '<div class="tab" data-tab="flashcard" onclick="selectVocabTab(&quot;flashcard&quot;)">Flashcards</div>';
  }
  tabBar.innerHTML = tabHtml;
  currentTab = 'browse';
  renderContent(v.content);
  closeMobileSidebar();
}

function selectVocabTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.querySelector('.tab[data-tab="' + tab + '"]');
  if (tabEl) tabEl.classList.add('active');

  if (tab === 'browse') {
    renderContent(VOCAB[currentVocab].content);
  } else {
    startFlashcards(VOCAB[currentVocab].cards);
  }
}

function selectTab(tab) {
  if (currentStage === null) return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.querySelector('.tab[data-tab="' + tab + '"]');
  if (tabEl) tabEl.classList.add('active');
  renderContent(STAGES[currentStage].files[tab]);
}

// ══════════════════════════════════════════════
// CONTENT RENDERER
// ══════════════════════════════════════════════
function renderContent(md) {
  const el = document.getElementById('content');
  let html = marked.parse(md);

  // Wrap tables for horizontal scroll
  html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');

  // Add bottom nav for lessons
  if (currentSection === 'lessons' && currentStage !== null) {
    html += buildBottomNav();
  }

  el.innerHTML = html;
  document.getElementById('contentWrap').scrollTop = 0;
  document.getElementById('scrollProgressFill').style.width = '0%';
  updateProgress();
}

function buildBottomNav() {
  const stage = STAGES[currentStage];
  const tabs = stage.tabs || [];
  const tabIdx = tabs.indexOf(currentTab);
  let h = '<div class="bottom-nav">';

  if (tabIdx > 0) {
    const prevTab = tabs[tabIdx - 1];
    h += '<div class="nav-btn" onclick="selectTab(&quot;' + prevTab + '&quot;)"><span class="nav-label">Previous</span><span class="nav-title">' + (FILE_LABELS[prevTab] || prevTab) + '</span></div>';
  } else if (currentStage > 0) {
    const prevStage = STAGES[currentStage - 1];
    h += '<div class="nav-btn" onclick="selectStage(' + (currentStage - 1) + ')"><span class="nav-label">Previous Stage</span><span class="nav-title">' + prevStage.title + '</span></div>';
  } else {
    h += '<div class="nav-btn disabled"></div>';
  }

  if (tabIdx < tabs.length - 1) {
    const nextTab = tabs[tabIdx + 1];
    h += '<div class="nav-btn" onclick="selectTab(&quot;' + nextTab + '&quot;)"><span class="nav-label">Next</span><span class="nav-title">' + (FILE_LABELS[nextTab] || nextTab) + '</span></div>';
  } else if (currentStage < STAGES.length - 1) {
    const nextStage = STAGES[currentStage + 1];
    h += '<div class="nav-btn" onclick="selectStage(' + (currentStage + 1) + ')"><span class="nav-label">Next Stage</span><span class="nav-title">' + nextStage.title + '</span></div>';
  } else {
    h += '<div class="nav-btn disabled"></div>';
  }

  h += '</div>';
  return h;
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  if (currentSection === 'lessons' && currentStage !== null) {
    const stage = STAGES[currentStage];
    const tabs = stage.tabs || [];
    const tabIdx = Math.max(0, tabs.indexOf(currentTab));
    const stageProgress = currentStage / STAGES.length;
    const tabProgress = tabs.length > 1 ? (tabIdx / (tabs.length - 1)) / STAGES.length : 0;
    fill.style.width = Math.round((stageProgress + tabProgress) * 100) + '%';
  } else if (currentSection === 'vocab' && currentVocab !== null) {
    fill.style.width = Math.round(((currentVocab + 1) / VOCAB.length) * 100) + '%';
  }
}

// ══════════════════════════════════════════════
// FLASHCARDS
// ══════════════════════════════════════════════
function startFlashcards(cards, batchSize) {
  batchSize = batchSize || fcBatchSize;
  const deck = shuffle([...cards]);
  fcCards = deck.slice(0, Math.min(batchSize, deck.length));
  fcBatchSize = batchSize;
  fcIdx = 0;
  fcRevealed = false;
  fcGood = 0;
  fcAgain = 0;
  fcMissed = [];
  renderFlashcard();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderFlashcard() {
  const el = document.getElementById('content');
  const total = VOCAB[currentVocab].cards.length;

  if (fcIdx >= fcCards.length) {
    let h = '<div class="fc-done"><h2>Round Complete</h2>';
    h += '<p>' + fcGood + ' known &middot; ' + fcAgain + ' to review &middot; ' + fcCards.length + ' cards</p>';
    if (fcMissed.length > 0) {
      h += '<button class="fc-restart" onclick="startFlashcards(fcMissed, fcMissed.length)" style="margin-right:12px">Drill Missed (' + fcMissed.length + ')</button>';
    }
    h += '<button class="fc-restart" onclick="startFlashcards(VOCAB[currentVocab].cards, fcBatchSize)">New Round</button>';
    if (total > 20) {
      h += '<div style="margin-top:24px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">';
      [10, 20, 50, total].forEach(n => {
        const label = n === total ? 'All ' + total : n;
        const act = n === fcBatchSize ? 'color:var(--gold);border-color:var(--gold)' : '';
        h += '<button class="nav-btn" style="' + act + '" onclick="startFlashcards(VOCAB[currentVocab].cards,' + n + ')">' + label + '</button>';
      });
      h += '</div>';
    }
    h += '</div>';
    el.innerHTML = h;
    document.getElementById('contentWrap').scrollTop = 0;
    return;
  }

  const card = fcCards[fcIdx];
  const pct = Math.round((fcIdx / fcCards.length) * 100);

  let h = '<div class="flashcard-container">';
  h += '<div class="fc-progress">' + (fcIdx + 1) + ' / ' + fcCards.length;
  if (total > fcCards.length) h += ' (of ' + total + ')';
  h += '</div>';
  h += '<div class="fc-bar"><div class="fc-bar-fill" style="width:' + pct + '%"></div></div>';
  h += '<div class="fc-card" onclick="revealCard()">';
  h += '<div class="fc-term">' + escHtml(card.t) + '</div>';

  if (fcRevealed) {
    h += '<div class="fc-meaning">' + escHtml(card.m) + '</div>';
  } else {
    h += '<div class="fc-hint">tap or press space to reveal</div>';
  }

  h += '</div>';

  if (fcRevealed) {
    h += '<div class="fc-buttons">';
    h += '<button class="fc-btn again" onclick="fcAnswer(false)">&#8592; Again</button>';
    h += '<button class="fc-btn good" onclick="fcAnswer(true)">Good &#8594;</button>';
    h += '</div>';
  }

  h += '<div class="fc-score"><span class="g">good: ' + fcGood + '</span><span class="r">again: ' + fcAgain + '</span></div>';
  h += '</div>';

  el.innerHTML = h;
  document.getElementById('contentWrap').scrollTop = 0;
}

function revealCard() {
  if (!fcRevealed) {
    fcRevealed = true;
    renderFlashcard();
  }
}

function fcAnswer(good) {
  if (good) {
    fcGood++;
  } else {
    fcAgain++;
    fcMissed.push(fcCards[fcIdx]);
    const reinsert = Math.min(fcIdx + 3 + Math.floor(Math.random() * 4), fcCards.length);
    fcCards.splice(reinsert, 0, fcCards[fcIdx]);
  }
  fcIdx++;
  fcRevealed = false;
  renderFlashcard();
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ══════════════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════════════
function filterItems(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.stage-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    let text = '';
    if (currentSection === 'lessons') {
      const s = STAGES[idx];
      if (s) text = (s.title + ' ' + s.subtitle + ' ' + s.id).toLowerCase();
    } else {
      const v = VOCAB[idx];
      if (v) text = (v.title + ' ' + v.subtitle + ' ' + v.id).toLowerCase();
    }
    el.classList.toggle('hidden', q.length > 0 && !text.includes(q));
  });

  // Expand all phases when searching, collapse when cleared
  if (q.length > 0) {
    document.querySelectorAll('.phase-header').forEach(el => el.classList.remove('collapsed'));
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ══════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

  // Flashcard keys
  if (currentTab === 'flashcard' && currentVocab !== null) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealCard(); }
    else if (fcRevealed && (e.key === '1' || e.key === 'a' || e.key === 'ArrowLeft')) { e.preventDefault(); fcAnswer(false); }
    else if (fcRevealed && (e.key === '2' || e.key === 'g' || e.key === 'ArrowRight')) { e.preventDefault(); fcAnswer(true); }
    return;
  }

  // Tab shortcuts: 1-6 for lesson tabs
  if (currentSection === 'lessons' && currentStage !== null && STAGES[currentStage].number > 0) {
    const stage = STAGES[currentStage];
    const tabNum = parseInt(e.key);
    if (tabNum >= 1 && tabNum <= 6 && stage.tabs[tabNum - 1]) {
      selectTab(stage.tabs[tabNum - 1]);
      return;
    }
  }

  // Arrow navigation
  if (currentSection === 'lessons') {
    if (e.key === 'ArrowDown' && currentStage < STAGES.length - 1) {
      e.preventDefault();
      selectStage(currentStage + 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp' && currentStage > 0) {
      e.preventDefault();
      selectStage(currentStage - 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    }
  } else {
    if (e.key === 'ArrowDown' && currentVocab < VOCAB.length - 1) {
      e.preventDefault();
      selectVocab(currentVocab + 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp' && currentVocab > 0) {
      e.preventDefault();
      selectVocab(currentVocab - 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    }
  }

  // Focus search
  if (e.key === '/' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    document.getElementById('search').focus();
  }

  // Escape to blur search
  if (e.key === 'Escape') {
    document.getElementById('search').blur();
    closeMobileSidebar();
  }
});

// Search input: escape to blur
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.target.blur();
    e.target.value = '';
    filterItems('');
  }
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
buildSidebar();
</script>
