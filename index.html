eśa (4 marks)\n\n**C6.** Apply Sakārādeśa Sandhi, showing any further transformations (4 marks):\n1. rāmaḥ + tatra = ___\n2. namaḥ + te = ___\n3. rāmaḥ + ca = ___\n4. dhanuḥ + ṭaṅkāram = ___\n\n---\n\n### Visarga Sandhi -- Lopa and Jihvāmūlīya (3 marks)\n\n**C7.** Apply the correct visarga sandhi (3 marks):\n1. devāḥ + vadanti = ___\n2. narāḥ + gacchanti = ___\n3. rāmaḥ + karoti = ___ (state the optional forms)\n\n---\n\n### Mixed Visarga Sandhi Identification (3 marks)\n\n**C8.** Identify the visarga sandhi type and give the result (3 marks):\n1. hariḥ + racayati = ___ (sandhi: ___)\n2. bālakaḥ + tīkṣṇaḥ = ___ (sandhi: ___)\n3. bhavataḥ + dṛṣṭam = ___ (sandhi: ___)\n\n---\n\n## Section D: Comprehensive Sandhi Exercises (10 marks)\n\n**D1.** For each combined form, split it into its components and name ALL sandhis involved (5 marks):\n1. narendraḥ = ___ + ___ (sandhi: ___)\n2. sadaiva = ___ + ___ (sandhi: ___)\n3. pratyekam = ___ + ___ (sandhi: ___)\n4. rāmo'sti = ___ + ___ (sandhi: ___)\n5. anuccheda = ___ + ___ (sandhi: ___)\n\n**D2.** Apply ALL necessary sandhis in sequence to these combinations. Show each step (5 marks):\n1. jagat + nāṭyam = ___ (sandhis involved: ___)\n2. rāmaḥ + ca + lakṣmaṇaḥ + ca = ___ (sandhis involved: ___)\n3. tat + śrutvā = ___ (sandhis involved: ___)\n4. mahān + śūraḥ = ___ (sandhis involved: ___)\n5. kṛṣṇam + vande + jagat + gurum = ___ (sandhis involved: ___)\n\n---\n\n**Total: 100 marks**\n", "workbook-answers": "# Chapter 2: Sandhi -- Workbook (Answers)\n\n## Section A: Ac Sandhi (Svara / Vowel Sandhi)\n\n### Yan Sandhi\n\n**A1.**\n1. iti + āha = **ityāha** (i + ā → y + ā)\n2. madhu + ari = **madhvari** (u + a → v + a)\n3. pitṛ + anumatam = **pitranumatam** (ṛ + a → r + a)\n4. devī + āgatā = **devyāgatā** (ī + ā → y + ā)\n5. su + āgatam = **svāgatam** (u + ā → v + ā)\n\n---\n\n### Savarṇadīrgha Sandhi\n\n**A2.**\n1. mahā + ātmā = **mahātmā** (ā + ā → ā)\n2. giri + īśaḥ = **girīśaḥ** (i + ī → ī)\n3. bhānu + udayaḥ = **bhānūdayaḥ** (u + u → ū)\n4. vidyā + ālayaḥ = **vidyālayaḥ** (ā + ā → ā)\n5. kavi + indraḥ = **kavīndraḥ** (i + i → ī)\n\n---\n\n### Guṇa Sandhi\n\n**A3.**\n1. nara + indraḥ = **narendraḥ** (a + i → e, guṇa)\n2. mahā + utsavaḥ = **mahotsavaḥ** (ā + u → o, guṇa)\n3. deva + ṛṣiḥ = **devarṣiḥ** (a + ṛ → ar, guṇa)\n4. gaṅgā + udakam = **gaṅgodakam** (ā + u → o, guṇa)\n5. parama + īśvaraḥ = **parameśvaraḥ** (a + ī → e, guṇa)\n\n---\n\n### Vṛddhi Sandhi\n\n**A4.**\n1. sadā + eva = **sadaiva** (ā + e → ai, vṛddhi)\n2. mahā + aiśvaryam = **mahaiśvaryam** (ā + ai → ai, vṛddhi)\n3. jala + oghaḥ = **jalaughaḥ** (a + o → au, vṛddhi)\n4. tava + aikyam = **tavaikyam** (a + ai → ai, vṛddhi)\n5. mahā + oṣadhiḥ = **mahauṣadhiḥ** (ā + o → au, vṛddhi)\n\n---\n\n### Pūrvarūpa and Pararūpa Sandhi\n\n**A5.**\n1. hare + atra = **hare'tra** (e + a → e, avagraha for deleted a)\n2. viṣṇo + arpaṇam = **viṣṇo'rpaṇam** (o + a → o, avagraha)\n3. vane + asmin = **vane'smin** (e + a → e, avagraha)\n4. prabho + anugraham = **prabho'nugraham** (o + a → o, avagraha)\n\n**A6.**\n1. upa + ajati = **upajati** (sandhi name: **Pararūpa Sandhi** -- upasarga a + dhātu a → a, para form prevails)\n\n---\n\n### Mixed Ac Sandhi Identification\n\n**A7.**\n1. rāma + īśaḥ = **rāmeśaḥ** (sandhi: **Guṇa** -- a + ī → e)\n2. iti + uvāca = **ityuvāca** (sandhi: **Yan** -- i + u → y + u)\n3. sadā + eṣaḥ = **sadaiṣaḥ** (sandhi: **Vṛddhi** -- ā + e → ai)\n4. guru + upadeśaḥ = **gurūpadeśaḥ** (sandhi: **Savarṇadīrgha** -- u + u → ū)\n5. na + asti = **nāsti** (sandhi: **Savarṇadīrgha** -- a + a → ā)\n\n---\n\n## Section B: Hal Sandhi (Vyañjana / Consonant Sandhi)\n\n### Śchutva and Ṣṭutva Sandhi\n\n**B1.**\n1. sat + cit = **sac cit** (sandhi: **Śchutva** -- t → c before c)\n2. tat + śrutvā = **tac chrutvā** (sandhi: **Śchutva** -- t → c before ś, ś → ch)\n3. rāmas + śete = **rāmaś śete** (sandhi: **Śchutva** -- s → ś before ś)\n4. iṣ + taḥ = **iṣ ṭaḥ** (sandhi: **Ṣṭutva** -- t → ṭ after ṣ)\n5. tat + ṭīkā = **taṭ ṭīkā** (sandhi: **Ṣṭutva** -- t → ṭ before ṭ)\n6. ud + cinoti = **uc cinoti** (sandhi: **Śchutva** -- d → c before c; also jaśtva → chartva context)\n\n---\n\n### Jaśtva Sandhi\n\n**B2.**\n1. vāk + īśaḥ = **vāg īśaḥ** (k → g before vowel, 1st → 3rd)\n2. tat + eva = **tad eva** (t → d before vowel)\n3. jagat + nāthaḥ = **jagad nāthaḥ** (t → d before n, voiced nasal)\n4. samrāṭ + jayati = **samrāḍ jayati** (ṭ → ḍ before j, voiced)\n5. kakup + antam = **kakub antam** (p → b before vowel)\n\n---\n\n### Anunāsika Sandhi\n\n**B3.**\n1. jagat + nāṭyam: Step 1 (jaśtva): t → d → **jagad nāṭyam**; Step 2 (anunāsika): d → n → **jagan nāṭyam** (d is tavarga, nasal = n)\n2. vāk + mayam = **vāṅ mayam** (k is kavarga, nasal = ṅ)\n3. ṣaṭ + mukhaḥ = **ṣaṇ mukhaḥ** (ṭ is ṭavarga, nasal = ṇ)\n4. cit + mayaḥ = **cin mayaḥ** → **chinmayaḥ** (t is tavarga, nasal = n; mandatory since maya is pratyaya)\n\n---\n\n### Anusvāra Sandhi\n\n**B4.**\n1. kṛṣṇam + vande = **kṛṣṇaṁ vande** (m → ṁ before v)\n2. satyam + vada = **satyaṁ vada** (m → ṁ before v)\n3. dharmam + cara = **dharmaṁ cara** (m → ṁ before c)\n4. gurum + namati = **guruṁ namati** (m → ṁ before n)\n5. rāmam + jayati = **rāmaṁ jayati** (m → ṁ before j)\n\n---\n\n### Parasavarṇa Sandhi\n\n**B5.**\n1. saṁ + dhiḥ = **sandhiḥ** (case: **Case 1, padya/internal** -- ṁ → n before dh, tavarga pañcama; mandatory)\n2. alaṁ + cakāra = **alañcakāra** (case: **Case 2, pada-anta** -- ṁ → ñ before c, cavarga pañcama; optional)\n3. taṁ + daṇḍam = **tandaṇḍam** (case: **Case 2** -- ṁ → n before d, tavarga pañcama; optional)\n4. bhagavat + līlā = **bhagavallīlā** (case: **Case 3, torli** -- t → l before l)\n5. saṁ + gamaḥ = **saṅgamaḥ** (case: **Case 1/2** -- ṁ → ṅ before g, kavarga pañcama)\n\n---\n\n### Chartva Sandhi\n\n**B6.**\n1. samrāḍ + kṛtam = **samrāṭ kṛtam** (ḍ → ṭ before k, voiceless; 3rd → 1st of ṭavarga)\n2. jagad + phalam = **jagat phalam** (d → t before ph, voiceless; 3rd → 1st of tavarga)\n\n---\n\n### Mixed Hal Sandhi Identification\n\n**B7.**\n1. sac cidam = **sat** + **cidam** (sandhi: **Śchutva** -- t → c before c)\n2. jagan nāthaḥ = **jagat** + **nāthaḥ** (sandhi: **Jaśtva** t → d, then **Anunāsika** d → n)\n3. kṛṣṇaṁ vande = **kṛṣṇam** + **vande** (sandhi: **Anusvāra** -- m → ṁ before v)\n\n---\n\n## Section C: Viśeṣa Sandhi (Special / Visarga Sandhi)\n\n### Chatva / Tugāgama Sandhi\n\n**C1.**\n1. anu + cheda = **anuccheda** (t-āgama inserted before ch → tch → cch by śchutva)\n2. sva + chanda = **svacchanda** (t-āgama → cch)\n3. ā + chādayati = **ācchādayati** (t-āgama → cch)\n4. pra + channa = **pracchanna** (t-āgama → cch)\n\n---\n\n### Pūrvasavarṇa Sandhi\n\n**C2.**\n1. vāg + harati = **vāg gharati** (h → gh, 4th letter of kavarga; optional)\n2. dig + hīnaḥ = **dig ghīnaḥ** (h → gh, 4th letter of kavarga)\n3. ab + hrasaḥ = **ab bhrasaḥ** (h → bh, 4th letter of pavarga)\n4. etat + hi = **etad dhi** (h → dh, 4th letter of tavarga; first jaśtva t → d, then pūrvasavarṇa)\n\n---\n\n### Satva Sandhi\n\n**C3.**\n1. mahān + tapasvī: n → s, anusvāra added → **mahāṁs tapasvī** (satva: n → ṁs before t)\n2. tān + ca: n → s, anusvāra → ṁs, then s + c → ś (śchutva) → **tāṁś ca**\n3. asmin + ṭīkā: n → s, anusvāra → ṁs, then s + ṭ → ṣ (ṣṭutva) → **asmiṁṣ ṭīkā**\n4. tān + śūraḥ: n → s, anusvāra → ṁs, then s + ś → ś (śchutva) → **tāṁś śūraḥ**\n\n---\n\n### Visarga Sandhi -- Ukārādeśa\n\n**C4.**\n1. rāmaḥ + gacchati = **rāmo gacchati** (aḥ + voiced g → o)\n2. bālaḥ + hasati = **bālo hasati** (aḥ + voiced h → o)\n3. rāmaḥ + asti = **rāmo'sti** (aḥ + a → o, then a elided with avagraha)\n4. eṣaḥ + bālakaḥ = **eṣo bālakaḥ** (aḥ + voiced b → o)\n\n---\n\n### Visarga Sandhi -- Rephādeśa\n\n**C5.**\n1. muniḥ + āgataḥ = **munir āgataḥ** (iḥ + ā → r, non-a vowel before visarga)\n2. guruḥ + uvāca = **gurur uvāca** (uḥ + u → r)\n3. punaḥ + api = **punar api** (avyaya punaḥ + a → r, special case)\n4. aśīḥ + yuddham = **aśīr yuddham** (īḥ + y → r)\n\n---\n\n### Visarga Sandhi -- Sakārādeśa\n\n**C6.**\n1. rāmaḥ + tatra = **rāmas tatra** (ḥ → s before t, kharaḥ; no further change)\n2. namaḥ + te = **namas te** (ḥ → s before t)\n3. rāmaḥ + ca = **rāmaś ca** (ḥ → s before c; then s → ś by śchutva)\n4. dhanuḥ + ṭaṅkāram = **dhanuṣ ṭaṅkāram** (ḥ → s before ṭ; then s → ṣ by ṣṭutva)\n\n---\n\n### Visarga Sandhi -- Lopa and Jihvāmūlīya\n\n**C7.**\n1. devāḥ + vadanti = **devā vadanti** (āḥ + voiced v → ā, visarga lopa)\n2. narāḥ + gacchanti = **narā gacchanti** (āḥ + voiced g → ā, visarga lopa)\n3. rāmaḥ + karoti = **rāmaḥ karoti** or **rāmaḫ karoti** (visarga remains, or optionally becomes jihvāmūlīya before ka; both forms accepted)\n\n---\n\n### Mixed Visarga Sandhi Identification\n\n**C8.**\n1. hariḥ + racayati = **harir racayati** (sandhi: **Rephādeśa** -- iḥ + r (voiced) → r)\n2. bālakaḥ + tīkṣṇaḥ = **bālakas tīkṣṇaḥ** (sandhi: **Sakārādeśa** -- ḥ → s before t)\n3. bhavataḥ + dṛṣṭam = **bhavato dṛṣṭam** (sandhi: **Ukārādeśa** -- aḥ + voiced d → o)\n\n---\n\n## Section D: Comprehensive Sandhi Exercises\n\n**D1.**\n1. narendraḥ = **nara** + **indraḥ** (sandhi: **Guṇa** -- a + i → e)\n2. sadaiva = **sadā** + **eva** (sandhi: **Vṛddhi** -- ā + e → ai)\n3. pratyekam = **prati** + **ekam** (sandhi: **Yan** -- i + e → y + e)\n4. rāmo'sti = **rāmaḥ** + **asti** (sandhis: **Ukārādeśa** aḥ → o, then **Pūrvarūpa** o + a → o with avagraha)\n5. anuccheda = **anu** + **cheda** (sandhi: **Chatva/Tugāgama** -- t-āgama before ch → cch)\n\n**D2.**\n1. jagat + nāṭyam:\n   - Step 1 (Jaśtva): t → d → jagad nāṭyam\n   - Step 2 (Anunāsika): d → n → **jagan nāṭyam**\n   - (sandhis: **Jaśtva + Anunāsika**)\n\n2. rāmaḥ + ca + lakṣmaṇaḥ + ca:\n   - rāmaḥ + ca: ḥ → s (sakārādeśa), s + c → ś (śchutva) → rāmaś ca\n   - lakṣmaṇaḥ + ca: same process → lakṣmaṇaś ca\n   - Final: **rāmaś ca lakṣmaṇaś ca**\n   - (sandhis: **Sakārādeśa + Śchutva**, applied twice)\n\n3. tat + śrutvā:\n   - Step 1 (Śchutva): t + ś → c + ch → **tac chrutvā**\n   - (sandhi: **Śchutva**)\n\n4. mahān + śūraḥ:\n   - Step 1 (Satva): n → ṁs before ś\n   - Step 2 (Śchutva): s + ś → ś + ś\n   - Final: **mahāṁś śūraḥ**\n   - (sandhis: **Satva + Śchutva**)\n\n5. kṛṣṇam + vande + jagat + gurum:\n   - kṛṣṇam + vande: m → ṁ (anusvāra) → kṛṣṇaṁ vande\n   - jagat + gurum: t → d (jaśtva) → jagad gurum (or optionally jagan gurum with anunāsika, but g is not nasal, so jaśtva only) → jagad gurum\n   - Final: **kṛṣṇaṁ vande jagad gurum**\n   - (sandhis: **Anusvāra + Jaśtva**)\n\n---\n\n**Total: 100 marks**\n", "badge": "# Stage 3 Badge: Sandhikāra\n\n**Title:** Joint Master\n**Badge:** 🏅 Sandhikāra\n\n## Requirements\n\n1. Given 10 word-pairs, correctly apply the right sandhi rule and name it\n2. Given 5 combined forms, split them and identify the sandhi\n3. Explain the difference between ac, hal, and viśeṣa sandhi with one example each\n\n## How to Demonstrate\n\n**Format:** Live drill in voice channel or text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 4 content and grants the **Sandhikāra** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "04-guna", "number": 4, "title": "Guna", "subtitle": "Adjectives", "files": {"theory": "# Stage 4: Guṇa — Adjectives\n\n## Goal\nLearn to describe deities and sacred objects with qualities (guṇas). Generate 10 qualities for any deity spontaneously.\n\n## What is a Guṇa?\n\n**Guṇa** (गुण) means \"quality\" or \"attribute.\" In grammar, adjectives (viśeṣaṇa) describe nouns (viśeṣya). In Sanskrit, adjectives **agree** with their noun in gender, number, and case.\n\n## The Agreement Rule\n\nThe adjective takes the same gender, number, and case as the noun it describes.\n\n| Noun | Adjective \"beautiful\" | Why |\n|------|----------------------|-----|\n| sundaraḥ devaḥ | masculine -aḥ | devaḥ is masculine |\n| sundarī devī | feminine -ī | devī is feminine |\n| sundaram phalam | neuter -am | phalam is neuter |\n| divyaḥ agniḥ | masculine -aḥ | agniḥ is masculine |\n| pavitrā gaṅgā | feminine -ā | gaṅgā is feminine |\n\n## Core Adjective Vocabulary\n\n### Spiritual/Sacred Qualities\n| Sanskrit | Devanāgarī | Meaning | M / F / N |\n|----------|-----------|---------|-----------|\n| śāntaḥ | शान्तः | peaceful | śāntaḥ / śāntā / śāntam |\n| dayāluḥ | दयालुः | compassionate | dayāluḥ / dayālū / dayālu |\n| karuṇāmayaḥ | करुणामयः | full of compassion | -mayaḥ / -mayī / -mayam |\n| divyaḥ | दिव्यः | divine | divyaḥ / divyā / divyam |\n| pavitraḥ | पवित्रः | pure/sacred | pavitraḥ / pavitrā / pavitram |\n| pūjyaḥ | पूज्यः | worshipful | pūjyaḥ / pūjyā / pūjyam |\n| mahān | महान् | great | mahān / mahatī / mahat |\n| priyaḥ | प्रियः | dear/beloved | priyaḥ / priyā / priyam |\n| śubhaḥ | शुभः | auspicious | śubhaḥ / śubhā / śubham |\n| mangalaḥ | मङ्गलः | auspicious | mangalaḥ / maṅgalā / maṅgalam |\n\n### Physical Description\n| Sanskrit | Meaning | M / F / N |\n|----------|---------|-----------|\n| sundaraḥ | beautiful | sundaraḥ / sundarī / sundaram |\n| nīlaḥ | blue | nīlaḥ / nīlā / nīlam |\n| śvetaḥ | white | śvetaḥ / śvetā / śvetam |\n| raktaḥ | red | raktaḥ / raktā / raktam |\n| kṛṣṇaḥ | dark/black | kṛṣṇaḥ / kṛṣṇā / kṛṣṇam |\n| pītaḥ | yellow | pītaḥ / pītā / pītam |\n| bṛhat | large/vast | bṛhan / bṛhatī / bṛhat |\n| sūkṣmaḥ | subtle | sūkṣmaḥ / sūkṣmā / sūkṣmam |\n| tejasvin | radiant | tejasvī / tejasvinī / tejasvi |\n| prācīnaḥ | ancient | prācīnaḥ / prācīnā / prācīnam |\n\n### Emotional/Bhāva Qualities\n| Sanskrit | Meaning | M / F / N |\n|----------|---------|-----------|\n| premamayaḥ | full of love | -mayaḥ / -mayī / -mayam |\n| ānandamayaḥ | full of bliss | -mayaḥ / -mayī / -mayam |\n| kṛpāluḥ | gracious | kṛpāluḥ / kṛpālū / kṛpālu |\n| bhayaṅkaraḥ | fearsome | -karaḥ / -karā / -karam |\n| gambhīraḥ | profound | -raḥ / -rā / -ram |\n| udāraḥ | generous | -raḥ / -rā / -ram |\n| amṛtamayaḥ | nectarean | -mayaḥ / -mayī / -mayam |\n| sarvaśaktiḥ | all-powerful | (indeclinable in compounds) |\n| nityaḥ | eternal | nityaḥ / nityā / nityam |\n| sarvajñaḥ | omniscient | -jñaḥ / -jñā / -jñam |\n\n## Comparative and Superlative Forms (tara/tama)\n\nSanskrit forms comparatives and superlatives by adding **-tara** (more) and **-tama** (most) to the adjective stem:\n\n| Base | Comparative (-tara) | Superlative (-tama) | Meaning |\n|------|---------------------|---------------------|---------|\n| sundara | sundarataraḥ | sundaratamaḥ | beautiful → more beautiful → most beautiful |\n| priya | priyataraḥ | priyatamaḥ | dear → dearer → dearest |\n| mahān | mahattaraḥ | mahattamaḥ | great → greater → greatest |\n| śubha | śubhataraḥ | śubhatamaḥ | auspicious → more auspicious → most auspicious |\n| gambhīra | gambhīrataraḥ | gambhīratamaḥ | profound → more profound → most profound |\n\nThese forms decline like regular -a stem adjectives and must agree in gender/number/case:\n\n- **Masculine**: sundarataraḥ devaḥ — the more beautiful god\n- **Feminine**: sundaratarā devī — the more beautiful goddess\n- **Neuter**: sundarataram padmam — the more beautiful lotus\n\n**Devotional usage**: rāmaḥ sarveṣu priyatamaḥ — Rāma is the dearest among all.\n\nThe compared entity takes **pañcamī** (ablative) or appears with **sarveṣu** (among all, saptamī):\n- viṣṇuḥ śivāt sundarataraḥ — Viṣṇu is more beautiful than Śiva\n- devī sarveṣu tejasvitatamā — the Devī is the most radiant among all\n\n## Common Participial Adjectives (-at / -ant forms)\n\n**Present active participles** function as adjectives meaning \"one who is doing [verb].\" They are formed from the verb stem and decline like adjectives, agreeing with the noun they describe.\n\n### Formation (Parasmaipada present participle):\n\nThe suffix **-at** (strong stem **-ant**) is added to the present stem:\n\n| Dhātu | Present Stem | Participle (M nom. sg.) | Meaning |\n|-------|-------------|------------------------|---------|\n| rakṣ (protect) | rakṣa- | rakṣan / rakṣat | protecting |\n| nam (bow) | nama- | naman / namat | bowing |\n| gam (go) | gaccha- | gacchan / gacchat | going |\n| paṭh (recite) | paṭha- | paṭhan / paṭhat | reciting |\n| car (move) | cara- | caran / carat | moving, wandering |\n| bhaj (adore) | bhaja- | bhajan / bhajat | adoring |\n\n### Ātmanepada present participle (-māna):\n\n| Dhātu | Participle (M nom. sg.) | Meaning |\n|-------|------------------------|---------|\n| sev (serve) | sevamānaḥ | serving |\n| yaj (sacrifice) | yajamānaḥ | sacrificing |\n| man (think) | manyamānaḥ | thinking |\n\n### Gender agreement:\n\n| Gender | Example (rakṣ-) | Meaning |\n|--------|-----------------|---------|\n| Masculine | rakṣan devaḥ | the protecting god |\n| Feminine | rakṣantī devī | the protecting goddess |\n| Neuter | rakṣat kulam | the protecting family |\n\n**Devotional usage**:\n- rakṣan haraḥ bhaktam pāti — the protecting Hara guards the devotee\n- sevamānā bhaktā devīm arcati — the serving devotee worships the Devī\n- gacchan muniḥ mandiram paśyati — the walking sage sees the temple\n\n## The -maya Suffix\n\nOne of the most productive ways to form adjectives in devotional Sanskrit:\n\n**noun + maya = \"full of / made of\"**\n\n| Base | + maya | Meaning |\n|------|--------|---------|\n| karuṇā | karuṇāmayaḥ | full of compassion |\n| ānanda | ānandamayaḥ | full of bliss |\n| jyotis | jyotirmayaḥ | full of light |\n| amṛta | amṛtamayaḥ | nectarean |\n| prema | premamayaḥ | full of love |\n| tejas | tejomayaḥ | radiant |\n| vidyā | vidyāmayaḥ | full of knowledge |\n| līlā | līlāmayaḥ | full of divine play |\n\n## The Guṇa-Mālā Game\n\nString together adjective-noun pairs like beads on a garland:\n\n> śivaḥ śāntaḥ — Śiva is peaceful\n> devī sundarī — the goddess is beautiful\n> kṛṣṇaḥ nīlaḥ — Kṛṣṇa is blue/dark\n> gaṅgā pavitrā — Gaṅgā is sacred\n> agniḥ tejasvi — fire is radiant\n> hanumān vīraḥ — Hanumān is heroic\n> sarasvatī vidyāmayī — Sarasvatī is full of knowledge\n> rāmaḥ dhīraḥ — Rāma is steadfast\n\nPractice: pick a deity, generate a \"garland\" of 10 qualities.\n\n## Adjective Placement\n\nIn Sanskrit, the adjective can come before or after the noun. Both are correct:\n- **sundaraḥ devaḥ** = the beautiful god\n- **devaḥ sundaraḥ** = the god is beautiful (or: the beautiful god)\n\nContext determines whether it's attributive or predicative.\n\n## Milestone Check\n\nCan you spontaneously generate 10 qualities for your iṣṭadevatā?\nExample for Devī: sundarī, divyā, karuṇāmayī, mahatī, śāntā, tejasvinī, nityā, priyā, pavitrā, ānandamayī\n\n---\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| Qualifier brick (basic adjective) | sundaraḥ, divyā, nīlam | Noun bricks — must agree in gender, number, and case |\n| Suffix brick (-maya, -vat, -in) | ānandamayaḥ, balavān, tejasvī | Noun stems to form new qualifier bricks |\n| Comparative brick (-tara) | sundarataraḥ, priyatarā | Adjective stems; compared noun takes pañcamī (ablative) |\n| Superlative brick (-tama) | sundaratamaḥ, priyatamā | Adjective stems; used with sarveṣu (among all) |\n| Participial brick (-at/-māna) | rakṣan, sevamānaḥ | Verb stems to create adjective-like bricks describing ongoing action |\n\n**Try snapping**: Combine a participial brick with a noun brick and a qualifier brick: \"rakṣan divyaḥ devaḥ\" (the protecting, divine god). Now add a comparative: \"rakṣan sundarataraḥ devaḥ\" (the protecting, more-beautiful god).\n", "reference": "# Stage 4: Guṇa — Reference Guide\n\n## Adjective Agreement Quick Table\n\nFor -a stem adjectives (the most common type):\n\n| Gender | Singular | Example |\n|--------|----------|---------|\n| Masculine | -aḥ | sundaraḥ devaḥ |\n| Feminine | -ā or -ī | sundarī devī |\n| Neuter | -am | sundaram vanam |\n\n## Master Adjective List\n\n### Colors\n| Sanskrit | M | F | N | Meaning |\n|----------|---|---|---|---------|\n| nīlaḥ | nīlaḥ | nīlā | nīlam | blue/dark |\n| śvetaḥ | śvetaḥ | śvetā | śvetam | white |\n| raktaḥ | raktaḥ | raktā | raktam | red |\n| pītaḥ | pītaḥ | pītā | pītam | yellow |\n| kṛṣṇaḥ | kṛṣṇaḥ | kṛṣṇā | kṛṣṇam | black/dark |\n| haritaḥ | haritaḥ | haritā | haritam | green |\n| gauraḥ | gauraḥ | gaurī | gauram | fair/golden |\n\n### Size & Shape\n| Sanskrit | Meaning |\n|----------|---------|\n| bṛhat / mahān | great, large |\n| alpam | small |\n| sūkṣmaḥ | subtle |\n| viśālaḥ | vast, wide |\n| dīrghaḥ | long |\n| hrasvaḥ | short |\n\n### Sacred Qualities\n| Sanskrit | Meaning |\n|----------|---------|\n| śāntaḥ | peaceful |\n| divyaḥ | divine |\n| pavitraḥ | pure |\n| pūjyaḥ | venerable |\n| pūtaḥ | purified |\n| śubhaḥ | auspicious |\n| maṅgalaḥ | auspicious |\n| nityaḥ | eternal |\n| sanātanaḥ | primordial |\n| avyayaḥ | imperishable |\n\n### Emotional Qualities\n| Sanskrit | Meaning |\n|----------|---------|\n| dayāluḥ | compassionate |\n| kṛpāluḥ | gracious |\n| karuṇāmayaḥ | full of mercy |\n| premamayaḥ | full of love |\n| priyaḥ | beloved |\n| snigdhaḥ | tender |\n| udāraḥ | generous |\n| gambhīraḥ | profound |\n| dhīraḥ | steadfast |\n| vīraḥ | heroic |\n\n### Power & Radiance\n| Sanskrit | Meaning |\n|----------|---------|\n| tejasvin | radiant |\n| prabhāvān | powerful |\n| śaktimat | endowed with śakti |\n| sarvajñaḥ | omniscient |\n| sarvaśaktimat | omnipotent |\n| sarvavyāpin | omnipresent |\n| jyotirmayaḥ | luminous |\n| pratāpavān | glorious |\n| amitaḥ | immeasurable |\n| anantaḥ | infinite |\n\n## The -maya / -vat / -mat Suffixes\n\n| Suffix | Meaning | Example |\n|--------|---------|---------|\n| -maya | full of, made of | ānandamayaḥ (full of bliss) |\n| -vat / -mat | possessing | balavān (possessing strength) |\n| -in | having | tejasvī (having tejas) |\n\n## Deity-Quality Quick Pairs\n\n| Deity | Common Qualities |\n|-------|-----------------|\n| Śiva | śāntaḥ, bhayaṅkaraḥ, nīlakaṇṭhaḥ, mahān, yogī |\n| Viṣṇu | śāntaḥ, nīlaḥ, karuṇāmayaḥ, anantaḥ, divyaḥ |\n| Devī/Durgā | sundarī, bhayaṅkarā, tejasvinī, karuṇāmayī, divyā |\n| Kṛṣṇa | sundaraḥ, nīlaḥ, priyaḥ, līlāmayaḥ, ānandamayaḥ |\n| Sarasvatī | śvetā, śāntā, divyā, vidyāmayī, sundarī |\n| Gaṇeśa | mahān, udāraḥ, priyaḥ, gambhīraḥ, maṅgalaḥ |\n| Lakṣmī | sundarī, divyā, karuṇāmayī, maṅgalā, priyā |\n", "workbook-questions": "# Stage 4: Guṇa — Workbook (Questions)\n\n## Section A: Gender Agreement (15 marks)\n\n**A1.** Convert the adjective \"sundara\" to match each noun (5 marks):\n1. devaḥ (M) → ___ devaḥ\n2. devī (F) → ___ devī\n3. phalam (N) → ___ phalam\n4. nadī (F) → ___ nadī\n5. candraḥ (M) → ___ candraḥ\n\n**A2.** Convert \"divya\" to match each noun (5 marks):\n1. mūrtiḥ (F) → ___ mūrtiḥ\n2. mandiram (N) → ___ mandiram\n3. dīpaḥ (M) → ___ dīpaḥ\n4. mālā (F) → ___ mālā\n5. padmam (N) → ___ padmam\n\n**A3.** Correct any errors in these adjective-noun pairs (5 marks):\n1. śāntaḥ devī\n2. sundarī kṛṣṇaḥ\n3. nīlam ākāśaḥ\n4. divyā mandiram\n5. pavitraḥ gaṅgā\n\n---\n\n## Section B: -maya Suffix (10 marks)\n\n**B1.** Form the -maya adjective from each base and give its meaning (5 marks):\n1. karuṇā + maya = ___  (meaning: ___)\n2. ānanda + maya = ___  (meaning: ___)\n3. jyotis + maya = ___  (meaning: ___)\n4. amṛta + maya = ___  (meaning: ___)\n5. prema + maya = ___  (meaning: ___)\n\n**B2.** Give the feminine form (-mayī) for each (5 marks):\n1. karuṇāmayaḥ → ___\n2. ānandamayaḥ → ___\n3. jyotirmayaḥ → ___\n4. tejomayaḥ → ___\n5. premamayaḥ → ___\n\n---\n\n## Section C: Deity Description (15 marks)\n\n**C1.** Give 5 adjectives for Śiva (5 marks):\n1. ___  2. ___  3. ___  4. ___  5. ___\n\n**C2.** Give 5 adjectives for Lakṣmī (in correct feminine form) (5 marks):\n1. ___  2. ___  3. ___  4. ___  5. ___\n\n**C3.** Pair each adjective with an appropriate deity noun, ensuring gender agreement (5 marks):\n1. śāntaḥ + ___\n2. sundarī + ___\n3. nīlam + ___\n4. tejasvinī + ___\n5. gambhīraḥ + ___\n\n---\n\n## Section D: Translation (10 marks)\n\n**D1.** Translate into Sanskrit adjective-noun pairs (5 marks):\n1. The blue lotus\n2. The peaceful god\n3. The beautiful goddess\n4. The sacred river\n5. The radiant fire\n\n**D2.** Translate into English (5 marks):\n1. nīlaḥ kaṇṭhaḥ\n2. divyā mālā\n3. pavitraṃ jalam\n4. ānandamayaḥ kṛṣṇaḥ\n5. karuṇāmayī devī\n\n---\n\n## Section E: Guṇa-Mālā Game (10 marks)\n\n**E1.** Create a \"garland of qualities\" — 10 adjective-noun pairs for your iṣṭadevatā. Each pair must use a different adjective and show correct gender agreement.\n\n1. ___ ___\n2. ___ ___\n3. ___ ___\n4. ___ ___\n5. ___ ___\n6. ___ ___\n7. ___ ___\n8. ___ ___\n9. ___ ___\n10. ___ ___\n\n---\n\n## Section F: Composition (20 marks)\n\n**F1.** Describe your iṣṭadevatā using at least 3 adjectives in a complete sentence. Ensure all adjectives agree with the deity name in gender, number, and case. Write 2 such sentences. (6 marks)\n\n1. ___\n2. ___\n\n**F2.** Write 2 sentences comparing two deities using the **-tara** (comparative) form. Use the pañcamī (ablative) for the entity being compared against. (6 marks)\n\nExample: rāmaḥ rāvaṇāt dhīrataraḥ — Rāma is more steadfast than Rāvaṇa.\n\n1. ___\n2. ___\n\n**F3.** Write a sentence using the **-tama** (superlative) form to describe a deity as the greatest in some quality among all. (4 marks)\n\nExample: devī sarveṣu tejasvitatamā — The Devī is the most radiant among all.\n\n1. ___\n\n**F4.** Use a participial adjective (-at/-ant or -māna form) to describe a deity performing an action. Write 2 sentences. (4 marks)\n\nExample: rakṣan śivaḥ bhaktam pāti — The protecting Śiva guards the devotee.\n\n1. ___\n2. ___\n\n---\n\n**Total: 80 marks**\n", "workbook-answers": "# Stage 4: Guṇa — Workbook (Answers)\n\n## Section A: Gender Agreement\n\n**A1.**\n1. **sundaraḥ** devaḥ (M)\n2. **sundarī** devī (F)\n3. **sundaram** phalam (N)\n4. **sundarī** nadī (F)\n5. **sundaraḥ** candraḥ (M)\n\n**A2.**\n1. **divyā** mūrtiḥ (F)\n2. **divyam** mandiram (N)\n3. **divyaḥ** dīpaḥ (M)\n4. **divyā** mālā (F)\n5. **divyam** padmam (N)\n\n**A3.**\n1. śāntaḥ devī → **śāntā devī** (devī is F, needs F adjective)\n2. sundarī kṛṣṇaḥ → **sundaraḥ kṛṣṇaḥ** (kṛṣṇaḥ is M)\n3. nīlam ākāśaḥ → **nīlaḥ ākāśaḥ** (ākāśaḥ is M)\n4. divyā mandiram → **divyam mandiram** (mandiram is N)\n5. pavitraḥ gaṅgā → **pavitrā gaṅgā** (gaṅgā is F)\n\n---\n\n## Section B: -maya Suffix\n\n**B1.**\n1. karuṇā + maya = **karuṇāmayaḥ** (full of compassion)\n2. ānanda + maya = **ānandamayaḥ** (full of bliss)\n3. jyotis + maya = **jyotirmayaḥ** (full of light)\n4. amṛta + maya = **amṛtamayaḥ** (nectarean)\n5. prema + maya = **premamayaḥ** (full of love)\n\n**B2.**\n1. karuṇāmayaḥ → **karuṇāmayī**\n2. ānandamayaḥ → **ānandamayī**\n3. jyotirmayaḥ → **jyotirmayī**\n4. tejomayaḥ → **tejomayī**\n5. premamayaḥ → **premamayī**\n\n---\n\n## Section C: Deity Description\n\n**C1.** Śiva (masculine forms) — sample answers:\n1. **śāntaḥ** 2. **mahān** 3. **divyaḥ** 4. **bhayaṅkaraḥ** 5. **nityaḥ**\n(Accept any 5 valid masculine adjectives)\n\n**C2.** Lakṣmī (feminine forms) — sample answers:\n1. **sundarī** 2. **divyā** 3. **karuṇāmayī** 4. **maṅgalā** 5. **priyā**\n(Accept any 5 valid feminine adjectives)\n\n**C3.** Sample answers:\n1. śāntaḥ + **śivaḥ** (or any M noun)\n2. sundarī + **devī** (or any F noun)\n3. nīlam + **padmam** (or any N noun)\n4. tejasvinī + **durgā** (or any F noun)\n5. gambhīraḥ + **samudraḥ** (or any M noun)\n\n---\n\n## Section D: Translation\n\n**D1.**\n1. The blue lotus → **nīlam padmam**\n2. The peaceful god → **śāntaḥ devaḥ**\n3. The beautiful goddess → **sundarī devī**\n4. The sacred river → **pavitrā nadī**\n5. The radiant fire → **tejasvī agniḥ**\n\n**D2.**\n1. nīlaḥ kaṇṭhaḥ → **blue throat**\n2. divyā mālā → **divine garland**\n3. pavitraṃ jalam → **sacred/pure water**\n4. ānandamayaḥ kṛṣṇaḥ → **Kṛṣṇa who is full of bliss**\n5. karuṇāmayī devī → **the goddess full of compassion**\n\n---\n\n## Section E: Guṇa-Mālā Game\n\nSample for Śiva:\n1. śāntaḥ śivaḥ (peaceful Śiva)\n2. divyaḥ mahādevaḥ (divine Mahādeva)\n3. nīlaḥ kaṇṭhaḥ (blue throat)\n4. tejasvi netram (radiant eye)\n5. gambhīraḥ svāmī (profound lord)\n6. bhayaṅkaraḥ rudraḥ (fearsome Rudra)\n7. nityaḥ yogī (eternal yogī)\n8. karuṇāmayaḥ śambhuḥ (compassionate Śambhu)\n9. sundaraḥ naṭarājaḥ (beautiful Naṭarāja)\n10. anantaḥ īśvaraḥ (infinite Lord)\n\nAward 1 mark per correct pair (adjective agrees with noun in gender).\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 4 Badge: Guṇavit\n\n**Title:** Quality Weaver\n**Badge:** 🏅 Guṇavit\n\n## Requirements\n\n1. Given any deity name, spontaneously generate 10 adjectives with correct gender agreement\n2. Form 5 -maya compounds with correct masculine, feminine, and neuter forms\n\n## How to Demonstrate\n\n**Format:** Live in voice channel or text post\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 5 content and grants the **Guṇavit** role on Discord.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "05-rupa", "number": 5, "title": "Rupa", "subtitle": "Case / Number / Gender -- The Baseplates", "files": {"bricks": "# Chapter 3: Sarvānāmāni — Pronouns\n\n## Goal\nUnderstand what sarvānāmas (pronouns) are, learn the Pāṇinian list of pronominal words, master the declension of key pronouns (tad, etad, yad, kim, idam, asmad, yuṣmad, sarva), and use them correctly in sentences.\n\n## What is a Sarvānāma?\n\n**Sarvānāma** (सर्वनाम) literally means \"a name for all\" — a word that stands in place of a noun (nāma). Just as in English we say \"he\" instead of repeating \"Rāma,\" Sanskrit uses pronouns to replace nouns already known from context.\n\n> **Definition:** yasya nāmnaḥ sthāne yat padam upayujyate tat sarvānāma ityucyate\n> \"That word which is used in place of a noun is called a sarvānāma.\"\n\n### Pronouns vs. Nouns\n\nA noun (nāma-pada) is formed from a **prātipadika** (nominal stem) + **sup** (case suffix). A pronoun likewise takes case endings, but its declensional forms often differ significantly from regular noun paradigms. These special forms must be learned separately.\n\n## Pāṇini's List of Sarvānāmas\n\nPāṇini defines sarvānāmas by enumeration (Aṣṭādhyāyī 1.1.27: sarvādīni sarvānāmāni). He gives a list of **35 pronominal words**. The most important ones for daily use are:\n\n| # | Sarvānāma | Meaning |\n|---|-----------|---------|\n| 1 | sarva | all, every |\n| 2 | viśva | all, entire |\n| 3 | ubhaya | both |\n| 4 | tad | that, he/she/it |\n| 5 | etad | this (proximate) |\n| 6 | yad | which, who (relative) |\n| 7 | kim | who? what? (interrogative) |\n| 8 | idam | this |\n| 9 | adas | that (remote) |\n| 10 | eka | one |\n| 11 | anya | other |\n| 12 | anyatara | either |\n| 13 | itara | the other |\n| 14 | dvitaya | of two kinds |\n| 15 | tatva | -ness (pronominal in certain usages) |\n| 16 | pūrva | former, east |\n| 17 | para | other, subsequent |\n| 18 | avara | near, inferior |\n| 19 | dakṣiṇa | right, south |\n| 20 | uttara | upper, north |\n| 21 | apara | another |\n| 22 | adhara | lower |\n| 23 | sva | own, self |\n\nOf these, the most frequently encountered in sentences are: **tad, etad, yad, kim, idam, asmad, yuṣmad,** and **sarva**.\n\n## Key Concepts\n\n### Liṅga, Vacana, Vibhakti\n\nLike nouns, pronouns inflect for:\n- **Liṅga** (gender): puṃliṅga (masculine), strīliṅga (feminine), napuṃsakaliṅga (neuter)\n- **Vacana** (number): ekavacana (singular), dvivacana (dual), bahuvacana (plural)\n- **Vibhakti** (case): all 8 cases (prathamā through sambodhana)\n\n### Gender Independence of asmad and yuṣmad\n\nA critical point: **asmad** (I/we) and **yuṣmad** (you) do NOT change for gender. Whether the speaker is male, female, or referring to neuter objects, the forms remain the same.\n\n> aham chātraḥ (I am a student — male speaker)\n> aham chātrā (I am a student — female speaker)\n> The pronoun **aham** stays identical in both.\n\n### The Concept of Vivakṣā\n\n**Vivakṣā** (विवक्षा) means \"the desire/intent of the speaker.\" This is important for understanding when to use **sarva** vs. **sarve**:\n\n- **sarve sanskṛtam paṭhanti** = \"All (of them) study Sanskrit\" — here the speaker intends to show the individual members (avayava-vivakṣā), using the plural.\n- **sarvam jagat** = \"the entire world\" — here the speaker treats the collective as one unit (samudāya-vivakṣā), using the singular neuter.\n\nThe choice between singular/plural forms of sarva depends on whether you view the group as a collective whole or as individual members.\n\n## Declension of tad (that, he/she/it)\n\nThe pronoun **tad** is the most common. Its forms differ markedly from regular -a stem nouns.\n\n### Puṃliṅga (Masculine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | saḥ | tau | te |\n| Dvitīyā | tam | tau | tān |\n| Tṛtīyā | tena | tābhyām | taiḥ |\n| Caturthī | tasmai | tābhyām | tebhyaḥ |\n| Pañcamī | tasmāt | tābhyām | tebhyaḥ |\n| Ṣaṣṭhī | tasya | tayoḥ | teṣām |\n| Saptamī | tasmin | tayoḥ | teṣu |\n\n### Strīliṅga (Feminine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | sā | te | tāḥ |\n| Dvitīyā | tām | te | tāḥ |\n| Tṛtīyā | tayā | tābhyām | tābhiḥ |\n| Caturthī | tasyai | tābhyām | tābhyaḥ |\n| Pañcamī | tasyāḥ | tābhyām | tābhyaḥ |\n| Ṣaṣṭhī | tasyāḥ | tayoḥ | tāsām |\n| Saptamī | tasyām | tayoḥ | tāsu |\n\n### Napuṃsakaliṅga (Neuter)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | tat | te | tāni |\n| Dvitīyā | tat | te | tāni |\n| Tṛtīyā – Saptamī | (same as masculine) | (same as masculine) | (same as masculine) |\n\n**Note:** In neuter, only prathamā and dvitīyā differ from masculine. All other cases are identical to the masculine forms.\n\n## Declension of etad (this)\n\n**etad** follows the same pattern as tad, but with an **e-** prefix replacing the **t-** in prathamā forms, and **eta-** elsewhere.\n\n### Puṃliṅga (Masculine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | eṣaḥ | etau | ete |\n| Dvitīyā | etam / enam | etau | etān / enān |\n| Tṛtīyā | etena / anena | etābhyām | etaiḥ |\n| Caturthī | etasmai | etābhyām | etebhyaḥ |\n| Pañcamī | etasmāt | etābhyām | etebhyaḥ |\n| Ṣaṣṭhī | etasya | etayoḥ | eteṣām |\n| Saptamī | etasmin | etayoḥ | eteṣu |\n\n### Strīliṅga (Feminine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | eṣā | ete | etāḥ |\n| Dvitīyā | etām / enām | ete | etāḥ / enāḥ |\n| Tṛtīyā | etayā / anayā | etābhyām | etābhiḥ |\n| Caturthī | etasyai | etābhyām | etābhyaḥ |\n| Pañcamī | etasyāḥ | etābhyām | etābhyaḥ |\n| Ṣaṣṭhī | etasyāḥ | etayoḥ | etāsām |\n| Saptamī | etasyām | etayoḥ | etāsu |\n\n### Napuṃsakaliṅga (Neuter)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | etat | ete | etāni |\n| Dvitīyā | etat | ete | etāni |\n| Tṛtīyā – Saptamī | (same as masculine) | (same as masculine) | (same as masculine) |\n\n## Declension of yad (who, which — relative pronoun)\n\n### Puṃliṅga (Masculine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | yaḥ | yau | ye |\n| Dvitīyā | yam | yau | yān |\n| Tṛtīyā | yena | yābhyām | yaiḥ |\n| Caturthī | yasmai | yābhyām | yebhyaḥ |\n| Pañcamī | yasmāt | yābhyām | yebhyaḥ |\n| Ṣaṣṭhī | yasya | yayoḥ | yeṣām |\n| Saptamī | yasmin | yayoḥ | yeṣu |\n\n### Strīliṅga (Feminine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | yā | ye | yāḥ |\n| Dvitīyā | yām | ye | yāḥ |\n| Tṛtīyā | yayā | yābhyām | yābhiḥ |\n| Caturthī | yasyai | yābhyām | yābhyaḥ |\n| Pañcamī | yasyāḥ | yābhyām | yābhyaḥ |\n| Ṣaṣṭhī | yasyāḥ | yayoḥ | yāsām |\n| Saptamī | yasyām | yayoḥ | yāsu |\n\n### Napuṃsakaliṅga (Neuter)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | yat | ye | yāni |\n| Dvitīyā | yat | ye | yāni |\n| Tṛtīyā – Saptamī | (same as masculine) | (same as masculine) | (same as masculine) |\n\n## Declension of kim (who? what? — interrogative)\n\n### Puṃliṅga (Masculine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | kaḥ | kau | ke |\n| Dvitīyā | kam | kau | kān |\n| Tṛtīyā | kena | kābhyām | kaiḥ |\n| Caturthī | kasmai | kābhyām | kebhyaḥ |\n| Pañcamī | kasmāt | kābhyām | kebhyaḥ |\n| Ṣaṣṭhī | kasya | kayoḥ | keṣām |\n| Saptamī | kasmin | kayoḥ | keṣu |\n\n### Strīliṅga (Feminine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | kā | ke | kāḥ |\n| Dvitīyā | kām | ke | kāḥ |\n| Tṛtīyā | kayā | kābhyām | kābhiḥ |\n| Caturthī | kasyai | kābhyām | kābhyaḥ |\n| Pañcamī | kasyāḥ | kābhyām | kābhyaḥ |\n| Ṣaṣṭhī | kasyāḥ | kayoḥ | kāsām |\n| Saptamī | kasyām | kayoḥ | kāsu |\n\n### Napuṃsakaliṅga (Neuter)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | kim | ke | kāni |\n| Dvitīyā | kim | ke | kāni |\n| Tṛtīyā – Saptamī | (same as masculine) | (same as masculine) | (same as masculine) |\n\n## Declension of idam (this)\n\n### Puṃliṅga (Masculine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | ayam | imau | ime |\n| Dvitīyā | imam | imau | imān |\n| Tṛtīyā | anena | ābhyām | ebhiḥ |\n| Caturthī | asmai | ābhyām | ebhyaḥ |\n| Pañcamī | asmāt | ābhyām | ebhyaḥ |\n| Ṣaṣṭhī | asya | anayoḥ | eṣām |\n| Saptamī | asmin | anayoḥ | eṣu |\n\n### Strīliṅga (Feminine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | iyam | ime | imāḥ |\n| Dvitīyā | imām | ime | imāḥ |\n| Tṛtīyā | anayā | ābhyām | ābhiḥ |\n| Caturthī | asyai | ābhyām | ābhyaḥ |\n| Pañcamī | asyāḥ | ābhyām | ābhyaḥ |\n| Ṣaṣṭhī | asyāḥ | anayoḥ | āsām |\n| Saptamī | asyām | anayoḥ | āsu |\n\n### Napuṃsakaliṅga (Neuter)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | idam | ime | imāni |\n| Dvitīyā | idam | ime | imāni |\n| Tṛtīyā – Saptamī | (same as masculine) | (same as masculine) | (same as masculine) |\n\n## Declension of asmad (I, we) and yuṣmad (you)\n\nThese are **unique** — they have no gender distinction and use completely irregular stems.\n\n### asmad (first person)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | aham | āvām | vayam |\n| Dvitīyā | mām (mā) | āvām (nau) | asmān (naḥ) |\n| Tṛtīyā | mayā | āvābhyām | asmābhiḥ |\n| Caturthī | mahyam (me) | āvābhyām (nau) | asmabhyam (naḥ) |\n| Pañcamī | mat | āvābhyām | asmat |\n| Ṣaṣṭhī | mama (me) | āvayoḥ (nau) | asmākam (naḥ) |\n| Saptamī | mayi | āvayoḥ | asmāsu |\n\n### yuṣmad (second person)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | tvam | yuvām | yūyam |\n| Dvitīyā | tvām (tvā) | yuvām (vām) | yuṣmān (vaḥ) |\n| Tṛtīyā | tvayā | yuvābhyām | yuṣmābhiḥ |\n| Caturthī | tubhyam (te) | yuvābhyām (vām) | yuṣmabhyam (vaḥ) |\n| Pañcamī | tvat | yuvābhyām | yuṣmat |\n| Ṣaṣṭhī | tava (te) | yuvayoḥ (vām) | yuṣmākam (vaḥ) |\n| Saptamī | tvayi | yuvayoḥ | yuṣmāsu |\n\n**Note:** Forms in parentheses are enclitic (shortened) alternatives that cannot appear at the beginning of a sentence.\n\n## Declension of sarva (all, every)\n\n**sarva** follows the sarvānāma declension pattern, which differs from regular -a stem nouns in specific vibhaktis (notably prathamā neuter singular: **sarvam** not **sarvaḥ**, and saptamī singular: **sarvasmin** not **sarve**).\n\n### Puṃliṅga (Masculine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | sarvaḥ | sarvau | sarve |\n| Dvitīyā | sarvam | sarvau | sarvān |\n| Tṛtīyā | sarveṇa | sarvābhyām | sarvaiḥ |\n| Caturthī | sarvasmai | sarvābhyām | sarvebhyaḥ |\n| Pañcamī | sarvasmāt | sarvābhyām | sarvebhyaḥ |\n| Ṣaṣṭhī | sarvasya | sarvayoḥ | sarveṣām |\n| Saptamī | sarvasmin | sarvayoḥ | sarveṣu |\n\n### Strīliṅga (Feminine)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | sarvā | sarve | sarvāḥ |\n| Dvitīyā | sarvām | sarve | sarvāḥ |\n| Tṛtīyā | sarvayā | sarvābhyām | sarvābhiḥ |\n| Caturthī | sarvasyai | sarvābhyām | sarvābhyaḥ |\n| Pañcamī | sarvasyāḥ | sarvābhyām | sarvābhyaḥ |\n| Ṣaṣṭhī | sarvasyāḥ | sarvayoḥ | sarvāsām |\n| Saptamī | sarvasyām | sarvayoḥ | sarvāsu |\n\n### Napuṃsakaliṅga (Neuter)\n\n| Vibhakti | Ekavacana | Dvivacana | Bahuvacana |\n|----------|-----------|-----------|------------|\n| Prathamā | sarvam | sarve | sarvāṇi |\n| Dvitīyā | sarvam | sarve | sarvāṇi |\n| Tṛtīyā – Saptamī | (same as masculine) | (same as masculine) | (same as masculine) |\n\n## How Pronominal Declension Differs from Regular Nouns\n\nThe sarvānāma declension (sarvādi pattern) differs from regular -a stem nouns in these key vibhaktis:\n\n| Vibhakti | Regular -a noun (deva) | Sarvānāma (sarva) | Difference |\n|----------|----------------------|-------------------|------------|\n| Prathamā N. sg. | devam (not applicable — deva is M) | sarvam | N. sg. ends in -am (not -aḥ) |\n| Caturthī sg. | devāya | sarvasmai | -smai instead of -āya |\n| Pañcamī sg. | devāt | sarvasmāt | -smāt instead of -āt |\n| Saptamī sg. | deve | sarvasmin | -smin instead of -e |\n| Ṣaṣṭhī pl. | devānām | sarveṣām | -eṣām instead of -ānām |\n| Saptamī pl. | deveṣu | sarveṣu | (same in this case) |\n\nThe **-smai, -smāt, -smin** endings in caturthī, pañcamī, and saptamī singular are the hallmark of pronominal declension.\n\n## Usage in Sentences\n\n### Demonstrative pronouns (tad, etad, idam)\n\n| Sanskrit | Translation |\n|----------|-------------|\n| saḥ bālakaḥ paṭhati | That boy studies. |\n| sā bālikā gacchati | That girl goes. |\n| tat pustakam atra asti | That book is here. |\n| eṣaḥ mama mitraḥ | This is my friend. |\n| eṣā sundarī nagarī | This is a beautiful city. |\n| ayam bālakaḥ krīḍati | This boy plays. |\n| iyam bālikā hasati | This girl laughs. |\n| idam mandiram prācīnam | This temple is ancient. |\n\n### Relative-correlative (yad...tad)\n\n| Sanskrit | Translation |\n|----------|-------------|\n| yaḥ paṭhati saḥ jānāti | He who studies, he knows. |\n| yā sevāṃ karoti sā sukhaṃ labhate | She who serves, she obtains happiness. |\n\n### Interrogative (kim)\n\n| Sanskrit | Translation |\n|----------|-------------|\n| kaḥ atra āgacchati? | Who comes here? |\n| kā eṣā bālikā? | Who is this girl? |\n| kim etat? | What is this? |\n| kasya etat pustakam? | Whose book is this? |\n\n### Personal pronouns (asmad, yuṣmad)\n\n| Sanskrit | Translation |\n|----------|-------------|\n| aham chātraḥ asmi | I am a student. |\n| tvam krīḍā-pāṭavaḥ asi | You are a sportsperson. |\n| vayam sanskṛtam paṭhāmaḥ | We study Sanskrit. |\n| yūyam kutra gacchatha? | Where do you all go? |\n\n## Milestone Check\n\nCan you:\n1. Recite the prathamā vibhakti forms of tad in all three genders? (saḥ/sā/tat, tau/te/te, te/tāḥ/tāni)\n2. Decline asmad and yuṣmad from memory?\n3. Distinguish between sarvasmin (sarvānāma declension) and deve (regular declension) in saptamī?\n4. Frame a question using kim and answer it using tad?\n", "theory": "# Stage 5: Rūpa — Case, Number, and Gender (Declension)\n\n## Goal\nLearn to transform nouns through all cases (vibhaktis), numbers, and genders. Decline devotional vocabulary actively so that words become usable in sentences.\n\n## What is Rūpa?\n\n**Rūpa** (रूप) means \"form.\" In Sanskrit, nouns change their form (ending) depending on their role in a sentence. This system of changes is called **declension** (śabda-rūpa).\n\n## The Eight Cases (Vibhaktis)\n\n| # | Vibhakti | Name | Function | Question | Example |\n|---|---------|------|----------|----------|---------|\n| 1 | Prathamā | Nominative | Subject | Who/What? | śivaḥ (Śiva [does]) |\n| 2 | Dvitīyā | Accusative | Object | Whom/What? | śivam (Śiva [I worship]) |\n| 3 | Tṛtīyā | Instrumental | By/With | By whom? | śivena (by Śiva) |\n| 4 | Caturthī | Dative | For/To | For whom? | śivāya (for Śiva) |\n| 5 | Pañcamī | Ablative | From | From whom? | śivāt (from Śiva) |\n| 6 | Ṣaṣṭhī | Genitive | Of | Whose? | śivasya (of Śiva) |\n| 7 | Saptamī | Locative | In/On | Where? | śive (in Śiva) |\n| 8 | Sambodhana | Vocative | Address | O...! | he śiva! |\n\n## The Three Numbers\n\n| Vacana | Meaning | Example (prathamā of deva) |\n|--------|---------|---------------------------|\n| Ekavacana | Singular | devaḥ |\n| Dvivacana | Dual | devau |\n| Bahuvacana | Plural | devāḥ |\n\n## Model Paradigm: Masculine -a stem (deva)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | devaḥ | devau | devāḥ |\n| Dvitīyā | devam | devau | devān |\n| Tṛtīyā | devena | devābhyām | devaiḥ |\n| Caturthī | devāya | devābhyām | devebhyaḥ |\n| Pañcamī | devāt | devābhyām | devebhyaḥ |\n| Ṣaṣṭhī | devasya | devayoḥ | devānām |\n| Saptamī | deve | devayoḥ | deveṣu |\n| Sambodhana | he deva! | he devau! | he devāḥ! |\n\n## Model Paradigm: Neuter -a stem (phala)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | phalam | phale | phalāni |\n| Dvitīyā | phalam | phale | phalāni |\n| Tṛtīyā | phalena | phalābhyām | phalaiḥ |\n| Caturthī | phalāya | phalābhyām | phalebhyaḥ |\n| Pañcamī | phalāt | phalābhyām | phalebhyaḥ |\n| Ṣaṣṭhī | phalasya | phalayoḥ | phalānām |\n| Saptamī | phale | phalayoḥ | phaleṣu |\n\nNote: Neuter prathamā and dvitīyā are always identical.\n\n## Model Paradigm: Feminine -ā stem (mālā)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | mālā | māle | mālāḥ |\n| Dvitīyā | mālām | māle | mālāḥ |\n| Tṛtīyā | mālayā | mālābhyām | mālābhiḥ |\n| Caturthī | mālāyai | mālābhyām | mālābhyaḥ |\n| Pañcamī | mālāyāḥ | mālābhyām | mālābhyaḥ |\n| Ṣaṣṭhī | mālāyāḥ | mālayoḥ | mālānām |\n| Saptamī | mālāyām | mālayoḥ | mālāsu |\n\n## Model Paradigm: Feminine -ī stem (nadī)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | nadī | nadyau | nadyaḥ |\n| Dvitīyā | nadīm | nadyau | nadīḥ |\n| Tṛtīyā | nadyā | nadībhyām | nadībhiḥ |\n| Caturthī | nadyai | nadībhyām | nadībhyaḥ |\n| Pañcamī | nadyāḥ | nadībhyām | nadībhyaḥ |\n| Ṣaṣṭhī | nadyāḥ | nadyoḥ | nadīnām |\n| Saptamī | nadyām | nadyoḥ | nadīṣu |\n\n## Model Paradigm: Masculine -u stem (viṣṇu)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | viṣṇuḥ | viṣṇū | viṣṇavaḥ |\n| Dvitīyā | viṣṇum | viṣṇū | viṣṇūn |\n| Tṛtīyā | viṣṇunā | viṣṇubhyām | viṣṇubhiḥ |\n| Caturthī | viṣṇave | viṣṇubhyām | viṣṇubhyaḥ |\n| Pañcamī | viṣṇoḥ | viṣṇubhyām | viṣṇubhyaḥ |\n| Ṣaṣṭhī | viṣṇoḥ | viṣṇvoḥ | viṣṇūnām |\n| Saptamī | viṣṇau | viṣṇvoḥ | viṣṇuṣu |\n| Sambodhana | he viṣṇo! | he viṣṇū! | he viṣṇavaḥ! |\n\nOther -u stem masculines: guru, śambhu, bhānu, sādhu.\n\n## Model Paradigm: Ṛ-stem (mātṛ — mother)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | mātā | mātarau | mātaraḥ |\n| Dvitīyā | mātaram | mātarau | mātṝn |\n| Tṛtīyā | mātrā | mātṛbhyām | mātṛbhiḥ |\n| Caturthī | mātre | mātṛbhyām | mātṛbhyaḥ |\n| Pañcamī | mātuḥ | mātṛbhyām | mātṛbhyaḥ |\n| Ṣaṣṭhī | mātuḥ | mātroḥ | mātṝṇām |\n| Saptamī | mātari | mātroḥ | mātṛṣu |\n| Sambodhana | he mātaḥ! | he mātarau! | he mātaraḥ! |\n\nOther ṛ-stem nouns: pitṛ (father), bhrātṛ (brother), kartṛ (doer), dātṛ (giver).\n\nNote: The ṛ-stem is critical for understanding agent nouns and kinship terms, both frequent in devotional contexts (e.g., jagat-kartā — creator of the world).\n\n## Model Paradigm: Consonant stem -at (bhagavat — the Lord)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | bhagavān | bhagavantau | bhagavantaḥ |\n| Dvitīyā | bhagavantam | bhagavantau | bhagavataḥ |\n| Tṛtīyā | bhagavatā | bhagavadbhyām | bhagavadbhiḥ |\n| Caturthī | bhagavate | bhagavadbhyām | bhagavadbhyaḥ |\n| Pañcamī | bhagavataḥ | bhagavadbhyām | bhagavadbhyaḥ |\n| Ṣaṣṭhī | bhagavataḥ | bhagavatoḥ | bhagavatām |\n| Saptamī | bhagavati | bhagavatoḥ | bhagavatsu |\n| Sambodhana | he bhagavan! | he bhagavantau! | he bhagavantaḥ! |\n\nOther -at stem nouns: mahat (great), dhīmat (wise), śrīmat (glorious). These consonant stems appear constantly in stotras and sacred titles.\n\n## Sarvānāma — Pronoun Baseplates\n\nPronouns (sarvānāma) are among the most essential words in Sanskrit. They replace noun baseplates entirely with their own unique declension patterns.\n\n### First Person (asmad — I/we)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | aham | āvām | vayam |\n| Dvitīyā | mām (mā) | āvām (nau) | asmān (naḥ) |\n| Tṛtīyā | mayā | āvābhyām | asmābhiḥ |\n| Caturthī | mahyam (me) | āvābhyām (nau) | asmabhyam (naḥ) |\n| Pañcamī | mat | āvābhyām | asmat |\n| Ṣaṣṭhī | mama (me) | āvayoḥ (nau) | asmākam (naḥ) |\n| Saptamī | mayi | āvayoḥ | asmāsu |\n\nParenthetical forms (mā, me, nau, naḥ) are enclitic (shortened) forms used in everyday speech and poetry.\n\n### Second Person (yuṣmad — you)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | tvam | yuvām | yūyam |\n| Dvitīyā | tvām (tvā) | yuvām (vām) | yuṣmān (vaḥ) |\n| Tṛtīyā | tvayā | yuvābhyām | yuṣmābhiḥ |\n| Caturthī | tubhyam (te) | yuvābhyām (vām) | yuṣmabhyam (vaḥ) |\n| Pañcamī | tvat | yuvābhyām | yuṣmat |\n| Ṣaṣṭhī | tava (te) | yuvayoḥ (vām) | yuṣmākam (vaḥ) |\n| Saptamī | tvayi | yuvayoḥ | yuṣmāsu |\n\n### Third Person (tad — he/she/it)\n\n**Masculine (saḥ):**\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | saḥ | tau | te |\n| Dvitīyā | tam | tau | tān |\n| Tṛtīyā | tena | tābhyām | taiḥ |\n| Caturthī | tasmai | tābhyām | tebhyaḥ |\n| Pañcamī | tasmāt | tābhyām | tebhyaḥ |\n| Ṣaṣṭhī | tasya | tayoḥ | teṣām |\n| Saptamī | tasmin | tayoḥ | teṣu |\n\n**Feminine (sā):**\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | sā | te | tāḥ |\n| Dvitīyā | tām | te | tāḥ |\n| Tṛtīyā | tayā | tābhyām | tābhiḥ |\n| Caturthī | tasyai | tābhyām | tābhyaḥ |\n| Pañcamī | tasyāḥ | tābhyām | tābhyaḥ |\n| Ṣaṣṭhī | tasyāḥ | tayoḥ | tāsām |\n| Saptamī | tasyām | tayoḥ | tāsu |\n\n**Neuter (tat):**\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | tat | te | tāni |\n| Dvitīyā | tat | te | tāni |\n| Tṛtīyā–Saptamī | same as masculine | | |\n\n**Devotional examples with pronouns:**\n- aham devam namāmi — I bow to the deity\n- sā mām rakṣati — she protects me\n- tasya pādau praṇamāmi — I bow to his feet\n- tasyai namaḥ — salutation to her\n- mama prārthanām śṛṇu — hear my prayer\n- tvam eva mātā ca pitā tvam eva — you alone are mother and you alone are father\n\n## Devotional Context: \"Transform the Deity\"\n\nSee how a single name changes across cases:\n\n| Case | Form | Devotional Sentence |\n|------|------|-------------------|\n| Prathamā | śivaḥ | śivaḥ asti — Śiva exists |\n| Dvitīyā | śivam | śivam namāmi — I bow to Śiva |\n| Tṛtīyā | śivena | śivena rakṣitaḥ — protected by Śiva |\n| Caturthī | śivāya | śivāya namaḥ — salutation to Śiva |\n| Pañcamī | śivāt | śivāt āgataḥ — come from Śiva |\n| Ṣaṣṭhī | śivasya | śivasya kṛpā — Śiva's grace |\n| Saptamī | śive | śive bhaktiḥ — devotion in/to Śiva |\n| Sambodhana | he śiva! | he śiva! prasīda — O Śiva! be gracious |\n\n## Key Insight\n\nThe case system is what makes Sanskrit a free-word-order language. Since the function of each word is encoded in its ending, you can rearrange words freely:\n- śivāya puṣpam dadāmi\n- puṣpam śivāya dadāmi\n- dadāmi śivāya puṣpam\n\nAll three mean: \"I give a flower to Śiva.\"\n\n## Milestone Check\n\nCan you decline śiva, puṣpa, mālā, and nadī through all 8 cases in singular from memory?\n\nCan you also decline viṣṇu, mātṛ, and bhagavat? Can you use aham, tvam, and saḥ/sā in simple devotional sentences?\n\n---\n\n### 🧱 New Bricks Learned\n\n| Brick Type | Examples | Snaps onto... |\n|------------|----------|---------------|\n| -a stem baseplate (M/N) | deva, phala | All 8 case endings; the foundation brick |\n| -ā / -ī stem baseplate (F) | mālā, nadī | Feminine case endings |\n| -u stem baseplate (M) | viṣṇu, guru | -u class case endings |\n| Ṛ-stem baseplate | mātṛ, pitṛ | Kinship/agent case endings |\n| Consonant-stem baseplate (-at) | bhagavat, mahat | -at class endings; titles and adjective-nouns |\n| Pronoun bricks (1st/2nd/3rd) | aham/mām/mama, tvam, saḥ/sā/tat | Replace noun baseplates entirely; unique declension |\n\n**Try snapping**: Combine a pronoun brick with a verb brick from Stage 4: \"aham devam namāmi\" (I bow to the deity). Now swap the pronoun: \"saḥ devam namati\" (he bows to the deity). Now swap the noun baseplate to ṛ-stem: \"aham mātaram namāmi\" (I bow to the mother).\n", "reference": "# Stage 5: Rūpa — Reference Guide\n\n## Vibhakti Summary Card\n\n| # | Name | Meaning | Key Marker (M -a) |\n|---|------|---------|-------------------|\n| 1 | Prathamā | Subject | -aḥ |\n| 2 | Dvitīyā | Object | -am |\n| 3 | Tṛtīyā | By/With | -ena |\n| 4 | Caturthī | For/To | -āya |\n| 5 | Pañcamī | From | -āt |\n| 6 | Ṣaṣṭhī | Of | -asya |\n| 7 | Saptamī | In/On | -e |\n| 8 | Sambodhana | O...! | -a! |\n\n## Full Paradigm Tables\n\n### Masculine -a (deva, śiva, rāma)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -aḥ | -au | -āḥ |\n| 2 | -am | -au | -ān |\n| 3 | -ena | -ābhyām | -aiḥ |\n| 4 | -āya | -ābhyām | -ebhyaḥ |\n| 5 | -āt | -ābhyām | -ebhyaḥ |\n| 6 | -asya | -ayoḥ | -ānām |\n| 7 | -e | -ayoḥ | -eṣu |\n| 8 | -a! | -au! | -āḥ! |\n\n### Neuter -a (phala, puṣpa, jala)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -am | -e | -āni |\n| 2 | -am | -e | -āni |\n| 3–7 | same as masculine |\n| 8 | -a! | -e! | -āni! |\n\n### Feminine -ā (mālā, gaṅgā, latā)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -ā | -e | -āḥ |\n| 2 | -ām | -e | -āḥ |\n| 3 | -ayā | -ābhyām | -ābhiḥ |\n| 4 | -āyai | -ābhyām | -ābhyaḥ |\n| 5 | -āyāḥ | -ābhyām | -ābhyaḥ |\n| 6 | -āyāḥ | -ayoḥ | -ānām |\n| 7 | -āyām | -ayoḥ | -āsu |\n\n### Feminine -ī (nadī, devī, lakṣmī)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -ī | -yau | -yaḥ |\n| 2 | -īm | -yau | -īḥ |\n| 3 | -yā | -ībhyām | -ībhiḥ |\n| 4 | -yai | -ībhyām | -ībhyaḥ |\n| 5 | -yāḥ | -ībhyām | -ībhyaḥ |\n| 6 | -yāḥ | -yoḥ | -īnām |\n| 7 | -yām | -yoḥ | -īṣu |\n\n### Masculine -i (agni, muni)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -iḥ | -ī | -ayaḥ |\n| 2 | -im | -ī | -īn |\n| 3 | -inā | -ibhyām | -ibhiḥ |\n| 4 | -aye | -ibhyām | -ibhyaḥ |\n| 5 | -eḥ | -ibhyām | -ibhyaḥ |\n| 6 | -eḥ | -yoḥ | -īnām |\n| 7 | -au | -yoḥ | -iṣu |\n\n### Masculine -u (viṣṇu, guru)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -uḥ | -ū | -avaḥ |\n| 2 | -um | -ū | -ūn |\n| 3 | -unā | -ubhyām | -ubhiḥ |\n| 4 | -ave | -ubhyām | -ubhyaḥ |\n| 5 | -oḥ | -ubhyām | -ubhyaḥ |\n| 6 | -oḥ | -voḥ | -ūnām |\n| 7 | -au | -voḥ | -uṣu |\n\n### Ṛ-stem (mātṛ, pitṛ, kartṛ)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -ā | -arau | -araḥ |\n| 2 | -aram | -arau | -ṝn |\n| 3 | -rā | -ṛbhyām | -ṛbhiḥ |\n| 4 | -re | -ṛbhyām | -ṛbhyaḥ |\n| 5 | -uḥ | -ṛbhyām | -ṛbhyaḥ |\n| 6 | -uḥ | -roḥ | -ṝṇām |\n| 7 | -ari | -roḥ | -ṛṣu |\n\n### Consonant-stem -at (bhagavat, mahat)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -ān | -antau | -antaḥ |\n| 2 | -antam | -antau | -ataḥ |\n| 3 | -atā | -adbhyām | -adbhiḥ |\n| 4 | -ate | -adbhyām | -adbhyaḥ |\n| 5 | -ataḥ | -adbhyām | -adbhyaḥ |\n| 6 | -ataḥ | -atoḥ | -atām |\n| 7 | -ati | -atoḥ | -atsu |\n\n### Pronoun: asmad (1st person)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | aham | āvām | vayam |\n| 2 | mām | āvām | asmān |\n| 3 | mayā | āvābhyām | asmābhiḥ |\n| 4 | mahyam | āvābhyām | asmabhyam |\n| 5 | mat | āvābhyām | asmat |\n| 6 | mama | āvayoḥ | asmākam |\n| 7 | mayi | āvayoḥ | asmāsu |\n\n### Pronoun: yuṣmad (2nd person)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | tvam | yuvām | yūyam |\n| 2 | tvām | yuvām | yuṣmān |\n| 3 | tvayā | yuvābhyām | yuṣmābhiḥ |\n| 4 | tubhyam | yuvābhyām | yuṣmabhyam |\n| 5 | tvat | yuvābhyām | yuṣmat |\n| 6 | tava | yuvayoḥ | yuṣmākam |\n| 7 | tvayi | yuvayoḥ | yuṣmāsu |\n\n### Pronoun: tad (3rd person, masculine)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | saḥ | tau | te |\n| 2 | tam | tau | tān |\n| 3 | tena | tābhyām | taiḥ |\n| 4 | tasmai | tābhyām | tebhyaḥ |\n| 5 | tasmāt | tābhyām | tebhyaḥ |\n| 6 | tasya | tayoḥ | teṣām |\n| 7 | tasmin | tayoḥ | teṣu |\n\n### Pronoun: tad (3rd person, feminine)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | sā | te | tāḥ |\n| 2 | tām | te | tāḥ |\n| 3 | tayā | tābhyām | tābhiḥ |\n| 4 | tasyai | tābhyām | tābhyaḥ |\n| 5 | tasyāḥ | tābhyām | tābhyaḥ |\n| 6 | tasyāḥ | tayoḥ | tāsām |\n| 7 | tasyām | tayoḥ | tāsu |\n\n## Devotional Declension Examples\n\n### śiva (M, -a stem)\n| Vib. | Form | Usage |\n|------|------|-------|\n| 1 | śivaḥ | śivaḥ rakṣati (Śiva protects) |\n| 2 | śivam | śivam namāmi (I bow to Śiva) |\n| 3 | śivena | śivena saha (with Śiva) |\n| 4 | śivāya | śivāya namaḥ (salutation to Śiva) |\n| 5 | śivāt | śivāt jñānam (knowledge from Śiva) |\n| 6 | śivasya | śivasya kṛpā (Śiva's grace) |\n| 7 | śive | śive bhaktiḥ (devotion in Śiva) |\n| 8 | he śiva! | he śiva prasīda! (O Śiva, be gracious!) |\n\n### puṣpa (N, -a stem)\n| Vib. | Form | Usage |\n|------|------|-------|\n| 1 | puṣpam | puṣpam asti (there is a flower) |\n| 2 | puṣpam | puṣpam arpayāmi (I offer a flower) |\n| 3 | puṣpena | puṣpena pūjā (worship with a flower) |\n| 4 | puṣpāya | — |\n| 5 | puṣpāt | puṣpāt gandhaḥ (fragrance from a flower) |\n| 6 | puṣpasya | puṣpasya gandhaḥ (fragrance of a flower) |\n| 7 | puṣpe | puṣpe bhramaraḥ (a bee on a flower) |\n\n## Quick Case-Function Memory Aid\n\n> **Su**bject **A**ccuses **I**nstrument **For** **From** **Of** **In** — **O!**\n> Prathamā Dvitīyā Tṛtīyā Caturthī Pañcamī Ṣaṣṭhī Saptamī Sambodhana\n", "workbook-questions": "# Stage 5: Rūpa — Workbook (Questions)\n\n## Section A: Case Identification (10 marks)\n\n**A1.** Identify the vibhakti (case) and its function for each form (5 marks):\n1. śivam → Vibhakti: ___ Function: ___\n2. devāya → Vibhakti: ___ Function: ___\n3. gaṅgāyāḥ → Vibhakti: ___ Function: ___\n4. mandire → Vibhakti: ___ Function: ___\n5. puṣpena → Vibhakti: ___ Function: ___\n\n**A2.** Which vibhakti would you use in each situation? (5 marks):\n1. To say \"I worship ___\" (object of worship)\n2. To say \"___ protects\" (subject)\n3. To say \"of ___\" (possession)\n4. To say \"with/by ___\" (instrument)\n5. To say \"for ___\" (recipient)\n\n---\n\n## Section B: Declension (20 marks)\n\n**B1.** Decline \"rāma\" (M, -a stem) in ekavacana, all 8 vibhaktis (8 marks):\n1. Prathamā: ___\n2. Dvitīyā: ___\n3. Tṛtīyā: ___\n4. Caturthī: ___\n5. Pañcamī: ___\n6. Ṣaṣṭhī: ___\n7. Saptamī: ___\n8. Sambodhana: ___\n\n**B2.** Decline \"puṣpa\" (N, -a stem) in ekavacana (8 marks):\n1. Prathamā: ___\n2. Dvitīyā: ___\n3. Tṛtīyā: ___\n4. Caturthī: ___\n5. Pañcamī: ___\n6. Ṣaṣṭhī: ___\n7. Saptamī: ___\n8. Sambodhana: ___\n\n**B3.** Give the prathamā (nominative) in all three vacanas for (4 marks):\n1. deva: ___, ___, ___\n2. phala: ___, ___, ___\n\n---\n\n## Section C: Transformation (15 marks)\n\n**C1.** Transform the word as directed (10 marks):\n1. śivaḥ → accusative singular: ___\n2. devī → genitive singular: ___\n3. mandiram → locative singular: ___\n4. mālā → instrumental singular: ___\n5. agniḥ → dative singular: ___\n6. puṣpam → instrumental singular: ___\n7. nadī → locative singular: ___\n8. gaṅgā → accusative singular: ___\n9. viṣṇuḥ → genitive singular: ___\n10. padmam → locative singular: ___\n\n**C2.** Fill in the correct case form to complete each devotional phrase (5 marks):\n1. ___ namaḥ (salutation to Viṣṇu) [viṣṇu, caturthī]\n2. ___ namāmi (I bow to Rāma) [rāma, dvitīyā]\n3. ___ kṛpā (Devī's grace) [devī, ṣaṣṭhī]\n4. ___ pūjayāmi (I worship with a flower) [puṣpa, tṛtīyā]\n5. ___ bhaktiḥ (devotion in Kṛṣṇa) [kṛṣṇa, saptamī]\n\n---\n\n## Section D: Sentence Understanding (10 marks)\n\n**D1.** Identify the case and role of each underlined word (5 marks):\n1. **śivaḥ** jagat rakṣati (__ protects the world)\n2. bhaktaḥ **śivam** pūjayati (the devotee worships __)\n3. **śivena** saha tiṣṭhāmi (I stand with __)\n4. **śivāya** phalaṃ dadāti (he gives fruit to __)\n5. **śivasya** mandiraṃ sundaram (__ temple is beautiful)\n\n**D2.** Rearrange each set of words into a meaningful sentence (5 marks):\n1. puṣpam / dadāmi / devāya\n2. namaḥ / śivāya\n3. karuṇā / devasya / mahatī\n4. mandire / bhaktaḥ / tiṣṭhati\n5. devīm / namāmi / bhaktyā\n\n---\n\n## Section E: Free Declension (5 marks)\n\n**E1.** Choose one deity name and one pūjā item. Decline both fully in ekavacana (all 8 vibhaktis). Write a short devotional phrase using each form.\n\nDeity: ___\nPūjā item: ___\n\n---\n\n## Section F: Pronoun & New Stem Practice (15 marks)\n\n**F1.** Decline \"viṣṇu\" (M, -u stem) in ekavacana, all 8 vibhaktis (8 marks):\n1. Prathamā: ___\n2. Dvitīyā: ___\n3. Tṛtīyā: ___\n4. Caturthī: ___\n5. Pañcamī: ___\n6. Ṣaṣṭhī: ___\n7. Saptamī: ___\n8. Sambodhana: ___\n\n**F2.** Give the correct pronoun form for each blank (4 marks):\n1. ___ devam namāmi (I [subject]) [asmad, prathamā eka]\n2. devī ___ rakṣati (me [object]) [asmad, dvitīyā eka]\n3. ___ pādau praṇamāmi ([his] feet) [tad M, ṣaṣṭhī eka]\n4. ___ namaḥ ([to her]) [tad F, caturthī eka]\n\n**F3.** Fill in the correct case form of \"bhagavat\" (3 marks):\n1. ___ kṛpā asti (the Lord's grace) [ṣaṣṭhī eka]\n2. he ___! prasīda (O Lord! be gracious) [sambodhana eka]\n3. ___ saha gacchāmi (I go with the Lord) [tṛtīyā eka]\n\n---\n\n## Section G: Composition (15 marks)\n\n**G1.** Write 3 sentences using pronouns (5 marks each = 15 marks):\n\n1. \"I worship [deity]\" — Use aham + a deity name in dvitīyā + a worship verb:\n___\n\n2. \"She protects us\" — Use sā + asmān + rakṣati:\n___\n\n3. \"His lotus feet are sacred\" — Use tasya + a noun phrase + an adjective:\n___\n\n---\n\n**Total: 90 marks**\n", "workbook-answers": "# Stage 5: Rūpa — Workbook (Answers)\n\n## Section A: Case Identification\n\n**A1.**\n1. śivam → **Dvitīyā** (accusative) — object\n2. devāya → **Caturthī** (dative) — for/to\n3. gaṅgāyāḥ → **Ṣaṣṭhī** (genitive) or **Pañcamī** (ablative) — of / from\n4. mandire → **Saptamī** (locative) — in/on\n5. puṣpena → **Tṛtīyā** (instrumental) — by/with\n\n**A2.**\n1. Object of worship → **Dvitīyā** (accusative)\n2. Subject → **Prathamā** (nominative)\n3. Possession → **Ṣaṣṭhī** (genitive)\n4. Instrument → **Tṛtīyā** (instrumental)\n5. Recipient → **Caturthī** (dative)\n\n---\n\n## Section B: Declension\n\n**B1.** rāma (M, -a stem), ekavacana:\n1. Prathamā: **rāmaḥ**\n2. Dvitīyā: **rāmam**\n3. Tṛtīyā: **rāmeṇa**\n4. Caturthī: **rāmāya**\n5. Pañcamī: **rāmāt**\n6. Ṣaṣṭhī: **rāmasya**\n7. Saptamī: **rāme**\n8. Sambodhana: **he rāma!**\n\n**B2.** puṣpa (N, -a stem), ekavacana:\n1. Prathamā: **puṣpam**\n2. Dvitīyā: **puṣpam**\n3. Tṛtīyā: **puṣpeṇa**\n4. Caturthī: **puṣpāya**\n5. Pañcamī: **puṣpāt**\n6. Ṣaṣṭhī: **puṣpasya**\n7. Saptamī: **puṣpe**\n8. Sambodhana: **he puṣpa!**\n\n**B3.**\n1. deva: **devaḥ, devau, devāḥ**\n2. phala: **phalam, phale, phalāni**\n\n---\n\n## Section C: Transformation\n\n**C1.**\n1. śivaḥ → accusative: **śivam**\n2. devī → genitive: **devyāḥ**\n3. mandiram → locative: **mandire**\n4. mālā → instrumental: **mālayā**\n5. agniḥ → dative: **agnaye**\n6. puṣpam → instrumental: **puṣpeṇa**\n7. nadī → locative: **nadyām**\n8. gaṅgā → accusative: **gaṅgām**\n9. viṣṇuḥ → genitive: **viṣṇoḥ**\n10. padmam → locative: **padme**\n\n**C2.**\n1. **viṣṇave** namaḥ\n2. **rāmam** namāmi\n3. **devyāḥ** kṛpā\n4. **puṣpeṇa** pūjayāmi\n5. **kṛṣṇe** bhaktiḥ\n\n---\n\n## Section D: Sentence Understanding\n\n**D1.**\n1. śivaḥ → **Prathamā** (nominative) — subject: \"Śiva protects the world\"\n2. śivam → **Dvitīyā** (accusative) — object: \"worships Śiva\"\n3. śivena → **Tṛtīyā** (instrumental) — \"with Śiva\"\n4. śivāya → **Caturthī** (dative) — recipient: \"to Śiva\"\n5. śivasya → **Ṣaṣṭhī** (genitive) — possession: \"of Śiva / Śiva's\"\n\n**D2.**\n1. **devāya puṣpam dadāmi** (I give a flower to the god)\n2. **śivāya namaḥ** (salutation to Śiva)\n3. **devasya karuṇā mahatī** (the god's compassion is great)\n4. **bhaktaḥ mandire tiṣṭhati** (the devotee stands in the temple)\n5. **bhaktyā devīm namāmi** (with devotion I bow to the goddess)\n\n---\n\n## Section E: Free Declension\n\nSample — Deity: kṛṣṇa (M, -a stem), Pūjā item: dīpa (M, -a stem)\n\n**kṛṣṇa:**\n1. kṛṣṇaḥ — kṛṣṇaḥ hasati (Kṛṣṇa smiles)\n2. kṛṣṇam — kṛṣṇam bhajāmi (I adore Kṛṣṇa)\n3. kṛṣṇena — kṛṣṇena saha (with Kṛṣṇa)\n4. kṛṣṇāya — kṛṣṇāya namaḥ (salutation to Kṛṣṇa)\n5. kṛṣṇāt — kṛṣṇāt ānandam (bliss from Kṛṣṇa)\n6. kṛṣṇasya — kṛṣṇasya līlā (Kṛṣṇa's play)\n7. kṛṣṇe — kṛṣṇe bhaktiḥ (devotion in Kṛṣṇa)\n8. he kṛṣṇa! — he kṛṣṇa rakṣa mām! (O Kṛṣṇa, protect me!)\n\n**dīpa:**\n1. dīpaḥ — dīpaḥ jvalati (the lamp burns)\n2. dīpam — dīpam arpayāmi (I offer a lamp)\n3. dīpena — dīpena pūjā (worship with a lamp)\n4. dīpāya — —\n5. dīpāt — dīpāt jyotiḥ (light from the lamp)\n6. dīpasya — dīpasya jvālā (the lamp's flame)\n7. dīpe — dīpe agniḥ (fire in the lamp)\n8. he dīpa! — —\n\nAward full marks for any correctly declined pair with reasonable phrases.\n\n---\n\n**Total: 60 marks**\n", "badge": "# Stage 5 Badge: Rūpavit\n\n**Title:** Baseplate Master\n**Badge:** 🏅 Rūpavit\n\n## Requirements\n\n1. Decline one noun from 3 different baseplates (e.g., Rāma, Durgā, Viṣṇu) through all 8 vibhaktis × 3 vacanas\n2. Identify the baseplate for 5 given nouns\n3. Decline one sarvānāma (tad or kim) in all 3 genders\n\n## How to Demonstrate\n\n**Format:** Text post with tables\n\nPost your submission in **#badge-submissions** on Discord. A reviewer will verify and grant the badge.\n\n## Unlock\n\nCompleting this badge unlocks Stage 6 content and grants the **Rūpavit** role on Discord.\n"}, "tabs": ["bricks", "theory", "reference", "workbook-questions", "workbook-answers", "badge"]}, {"id": "06-kriya", "number": 6, "title": "Kriya", "subtitle": "Verbs -- The Action Bricks", "files": {"bricks": "# Chapter 4: Kriyāpada -- Verbs\n\n## Goal\n\nUnderstand how Sanskrit verbs are formed from roots (dhātus), learn the system of 10 verb classes (gaṇas), 10 tense/mood markers (lakāras), and the 18 personal endings (tiṅ pratyayas). Conjugate common dhātus in laṭ lakāra (present tense) and lṛṭ lakāra (simple future tense) in both parasmaipada and ātmanepada.\n\n---\n\n## 1. What is a Kriyāpada?\n\nA **kriyāpada** (क्रियापदम्) is a verb form -- a word that expresses an action (kriyā). In the sentence:\n\n> rāmaḥ pustakam **paṭhati**\n\n\"paṭhati\" (he reads) is the kriyāpada. Every kriyāpada is built from three components:\n\n1. **Dhātu** (धातु) -- the verb root\n2. **Vikaraṇa pratyaya** -- the class marker (inserted between root and ending)\n3. **Tiṅ pratyaya** -- the personal ending (encodes person, number, and pada)\n\n---\n\n## 2. Dhātu -- Verb Roots\n\nA **dhātu** is the irreducible seed of a verb. All Sanskrit verb forms ultimately derive from a dhātu. Examples:\n\n| Dhātu | Meaning |\n|-------|---------|\n| bhū | to be, to become |\n| gam | to go |\n| paṭh | to read, to recite |\n| kṛ | to do, to make |\n| likh | to write |\n| dṛś | to see |\n| krīḍ | to play |\n| bhuj | to eat |\n| pā (pib) | to drink |\n| nam | to salute, to bow |\n| rakṣ | to protect |\n| has | to laugh |\n| cal | to move, to walk |\n| nṛt | to dance |\n| viś | to enter |\n| vad | to speak |\n| dā | to give |\n| śru | to hear, to listen |\n| labh | to obtain |\n| vṛdh | to grow |\n\nPāṇini's Dhātupāṭha catalogues approximately **2000+** dhātus.\n\n---\n\n## 3. The 10 Gaṇas (Verb Classes)\n\nDhātus are classified into **10 gaṇas** (गण, \"groups\"). Each gaṇa has a characteristic **vikaraṇa pratyaya** (class marker) that is inserted between the dhātu and the tiṅ pratyaya. The gaṇa determines how the dhātu is modified before adding personal endings.\n\n| Gaṇa | Name | Vikaraṇa | Example Dhātu | Laṭ 3rd sg. |\n|------|------|----------|---------------|-------------|\n| 1 | Bhvādi | -a- (with guṇa) | bhū (to be) | bhavati |\n| 2 | Adādi | (none) | ad (to eat) | atti |\n| 3 | Juhotyādi | (reduplication) | hu (to sacrifice) | juhoti |\n| 4 | Divādi | -ya- | div (to play) | dīvyati |\n| 5 | Svādi | -nu- | su (to press) | sunoti |\n| 6 | Tudādi | -a- (no guṇa) | tud (to strike) | tudati |\n| 7 | Rudhādi | -na-/-n- (infix) | rudh (to obstruct) | ruṇaddhi |\n| 8 | Tanādi | -u- | tan (to stretch) | tanoti |\n| 9 | Kryādi | -nā-/-nī- | krī (to buy) | krīṇāti |\n| 10 | Curādi | -aya- | cur (to steal) | corayati |\n\n### Key Points\n\n- **Gaṇas 1, 4, 6, 10** are called **sarvadhātuka** classes with thematic vowel -a-.\n- **Gaṇa 1** applies guṇa to the root vowel (bhū -> bhav-); **gaṇa 6** does not.\n- **Gaṇa 10** (curādi) adds -aya- and applies vṛddhi to the root vowel. The 10th gaṇa forms are identical to causative (ṇijanta) forms.\n- **Gaṇa 2** (adādi) is athematic -- endings attach directly to the root with no vikaraṇa.\n- The gaṇa of a dhātu is fixed and must be learned from the Dhātupāṭha.\n\n---\n\n## 4. The 10 Lakāras (Tenses and Moods)\n\nSanskrit has **10 lakāras** -- markers for tense (kāla) and mood (artha). They are remembered by the mnemonic beginning with \"la\":\n\n| # | Lakāra | Name | Type | Meaning |\n|---|--------|------|------|---------|\n| 1 | **laṭ** | vartamāna | Tense | Present tense |\n| 2 | **laṅ** | anadyatana-bhūta | Tense | Past tense (not of today) |\n| 3 | **liṭ** | parokṣa-bhūta | Tense | Past not witnessed (perfect) |\n| 4 | **luṅ** | sāmānya-bhūta | Tense | General past (aorist) |\n| 5 | **lṛṭ** | sāmānya-bhaviṣyat | Tense | Simple future |\n| 6 | **luṭ** | anadyatana-bhaviṣyat | Tense | Periphrastic future |\n| 7 | **loṭ** | āśīḥ / vidhī | Mood | Imperative (command/request) |\n| 8 | **liṅ** (vidhiliṅ) | vidhi | Mood | Optative / potential |\n| 9 | **liṅ** (āśīrliṅ) | āśīḥ | Mood | Benedictive (blessing) |\n| 10 | **lṛṅ** | saṅketa | Mood | Conditional |\n\n### The Kāla Framework\n\nGrammarians define a concept called **anadyatana** (\"not of today\"). The \"current day\" (adyatana) runs from last midnight to tonight's midnight. Actions within this window use laṭ (present); actions before it use laṅ (past); actions after it use lṛṭ (future).\n\n| Time Frame | Lakāra | Example |\n|-----------|--------|---------|\n| Within today (present) | laṭ | paṭhati (he reads) |\n| Before today (general past) | laṅ | apaṭhat (he read) |\n| After today (simple future) | lṛṭ | paṭhiṣyati (he will read) |\n| Witnessed past (remote) | liṭ | papāṭha (he read [long ago]) |\n| Unwitnessed past (parokṣa) | liṭ | papāṭha (he had read) |\n\n**For this course**, we focus on **laṭ** (present) and **lṛṭ** (simple future).\n\n---\n\n## 5. Tiṅ Pratyaya -- The 18 Personal Endings\n\nEvery finite verb in Sanskrit carries a **tiṅ pratyaya** that encodes:\n- **Puruṣa** (person): prathama (3rd), madhyama (2nd), uttama (1st)\n- **Vacana** (number): ekavacana (singular), dvivacana (dual), bahuvacana (plural)\n- **Pada** (voice): parasmaipada (P) or ātmanepada (Ā)\n\nSanskrit counts persons differently from English:\n- **Prathama puruṣa** (3rd person) -- he/she/it/they (the one spoken about)\n- **Madhyama puruṣa** (2nd person) -- you (the one spoken to)\n- **Uttama puruṣa** (1st person) -- I/we (the speaker)\n\n### Laṭ Lakāra Tiṅ Pratyaya Table\n\n| Puruṣa | Vacana | Parasmaipada (P) | Ātmanepada (Ā) |\n|--------|--------|-----------------|----------------|\n| Prathama (3rd) | Eka. | -ti | -te |\n| Prathama (3rd) | Dvi. | -taḥ | -ete |\n| Prathama (3rd) | Bahu. | -anti | -ante |\n| Madhyama (2nd) | Eka. | -si | -se |\n| Madhyama (2nd) | Dvi. | -thaḥ | -ethe |\n| Madhyama (2nd) | Bahu. | -tha | -dhve |\n| Uttama (1st) | Eka. | -mi | -e |\n| Uttama (1st) | Dvi. | -vaḥ | -vahe |\n| Uttama (1st) | Bahu. | -maḥ | -mahe |\n\n### Parasmaipada vs. Ātmanepada\n\n- **Parasmaipada** (परस्मैपद): \"word for another\" -- the action benefits another. Most transitive verbs default here.\n- **Ātmanepada** (आत्मनेपद): \"word for oneself\" -- the action benefits the agent.\n- Some dhātus are **ubhayapadin** -- they can take either set of endings depending on context.\n\nThe pada of a dhātu is specified in the Dhātupāṭha and must be learned. Examples:\n- **paṭh** (to read) -- parasmaipadin\n- **labh** (to obtain) -- ātmanepadin\n- **kṛ** (to do) -- ubhayapadin\n- **bhū** (to be) -- parasmaipadin\n- **vṛdh** (to grow) -- ātmanepadin\n\n---\n\n## 6. Laṭ Lakāra -- Present Tense Conjugation\n\n### How a Verb Form is Built (Gaṇa 1 Example)\n\nTake **bhū** (to be), gaṇa 1:\n\n1. Start with dhātu: **bhū**\n2. Apply guṇa: bhū -> **bhav** (ū -> av by guṇa, characteristic of gaṇa 1)\n3. Add vikaraṇa -a-: **bhava**\n4. Add tiṅ pratyaya: **bhava + ti = bhavati**\n\n### Parasmaipada Conjugations in Laṭ\n\n#### bhū (to be/become) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | bhavati | bhavataḥ | bhavanti |\n| Madhyama (2nd) | bhavasi | bhavathaḥ | bhavatha |\n| Uttama (1st) | bhavāmi | bhavāvaḥ | bhavāmaḥ |\n\n#### paṭh (to read) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | paṭhati | paṭhataḥ | paṭhanti |\n| Madhyama (2nd) | paṭhasi | paṭhathaḥ | paṭhatha |\n| Uttama (1st) | paṭhāmi | paṭhāvaḥ | paṭhāmaḥ |\n\n#### gam (to go) -- Gaṇa 1, P\n\nNote: gam -> gacch- (by a special rule, gam takes the form gacch- before the vikaraṇa).\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | gacchati | gacchataḥ | gacchanti |\n| Madhyama (2nd) | gacchasi | gacchathaḥ | gacchatha |\n| Uttama (1st) | gacchāmi | gacchāvaḥ | gacchāmaḥ |\n\n#### krīḍ (to play) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | krīḍati | krīḍataḥ | krīḍanti |\n| Madhyama (2nd) | krīḍasi | krīḍathaḥ | krīḍatha |\n| Uttama (1st) | krīḍāmi | krīḍāvaḥ | krīḍāmaḥ |\n\n#### has (to laugh) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | hasati | hasataḥ | hasanti |\n| Madhyama (2nd) | hasasi | hasathaḥ | hasatha |\n| Uttama (1st) | hasāmi | hasāvaḥ | hasāmaḥ |\n\n#### nam (to bow/salute) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | namati | namataḥ | namanti |\n| Madhyama (2nd) | namasi | namathaḥ | namatha |\n| Uttama (1st) | namāmi | namāvaḥ | namāmaḥ |\n\n#### rakṣ (to protect) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | rakṣati | rakṣataḥ | rakṣanti |\n| Madhyama (2nd) | rakṣasi | rakṣathaḥ | rakṣatha |\n| Uttama (1st) | rakṣāmi | rakṣāvaḥ | rakṣāmaḥ |\n\n#### likh (to write) -- Gaṇa 6, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | likhati | likhataḥ | likhanti |\n| Madhyama (2nd) | likhasi | likhathaḥ | likhatha |\n| Uttama (1st) | likhāmi | likhāvaḥ | likhāmaḥ |\n\n#### nṛt (to dance) -- Gaṇa 4, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | nṛtyati | nṛtyataḥ | nṛtyanti |\n| Madhyama (2nd) | nṛtyasi | nṛtyathaḥ | nṛtyatha |\n| Uttama (1st) | nṛtyāmi | nṛtyāvaḥ | nṛtyāmaḥ |\n\n#### cal (to walk/move) -- Gaṇa 1, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | calati | calataḥ | calanti |\n| Madhyama (2nd) | calasi | calathaḥ | calatha |\n| Uttama (1st) | calāmi | calāvaḥ | calāmaḥ |\n\n#### viś (to enter) -- Gaṇa 6, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | viśati | viśataḥ | viśanti |\n| Madhyama (2nd) | viśasi | viśathaḥ | viśatha |\n| Uttama (1st) | viśāmi | viśāvaḥ | viśāmaḥ |\n\n#### dṛś (to see) -- Gaṇa 1, P\n\nNote: dṛś -> paśy- (special substitution in laṭ).\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | paśyati | paśyataḥ | paśyanti |\n| Madhyama (2nd) | paśyasi | paśyathaḥ | paśyatha |\n| Uttama (1st) | paśyāmi | paśyāvaḥ | paśyāmaḥ |\n\n#### pā/pib (to drink) -- Gaṇa 1, P\n\nNote: pā -> pib- (special substitution in laṭ).\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | pibati | pibataḥ | pibanti |\n| Madhyama (2nd) | pibasi | pibathaḥ | pibatha |\n| Uttama (1st) | pibāmi | pibāvaḥ | pibāmaḥ |\n\n#### kṛ (to do/make) -- Gaṇa 8, U (Parasmaipada forms)\n\nNote: kṛ is gaṇa 8 (tanādi), ubhayapadin. The stem becomes karo-/kuru-.\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | karoti | kurutaḥ | kurvanti |\n| Madhyama (2nd) | karoṣi | kuruthaḥ | kurutha |\n| Uttama (1st) | karomi | kurvaḥ | kurmaḥ |\n\n#### cur (to steal) -- Gaṇa 10, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | corayati | corayataḥ | corayanti |\n| Madhyama (2nd) | corayasi | corayathaḥ | corayatha |\n| Uttama (1st) | corayāmi | corayāvaḥ | corayāmaḥ |\n\n#### bhuj (to eat/enjoy) -- Gaṇa 7, P\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | bhuṅkte | -- | -- |\n\nNote: bhuj is ātmanepadin (see below).\n\n### Ātmanepada Conjugations in Laṭ\n\n#### vand (to salute/bow) -- Gaṇa 1, Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | vandate | vandate | vandante |\n| Madhyama (2nd) | vandase | vandethe | vandadhve |\n| Uttama (1st) | vande | vandāvahe | vandāmahe |\n\n#### labh (to obtain) -- Gaṇa 1, Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | labhate | labhete | labhante |\n| Madhyama (2nd) | labhase | labhethe | labhadhve |\n| Uttama (1st) | labhe | labhāvahe | labhāmahe |\n\n#### vṛdh (to grow) -- Gaṇa 1, Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | vardhate | vardhete | vardhante |\n| Madhyama (2nd) | vardhase | vardhethe | vardhadhve |\n| Uttama (1st) | vardhe | vardhāvahe | vardhāmahe |\n\n#### sev (to serve) -- Gaṇa 1, Ā\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | sevate | sevete | sevante |\n| Madhyama (2nd) | sevase | sevethe | sevadhve |\n| Uttama (1st) | seve | sevāvahe | sevāmahe |\n\n#### kṛ (to do/make) -- Gaṇa 8, U (Ātmanepada forms)\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | kurute | kurvāte | kurvate |\n| Madhyama (2nd) | kuruṣe | kurvāthe | kurudhve |\n| Uttama (1st) | kurve | kurvahe | kurmahe |\n\n#### dā (to give) -- Gaṇa 3, U (Ātmanepada forms)\n\n| Puruṣa | Ekavacana | Dvivacana | Bahuvacana |\n|--------|-----------|-----------|------------|\n| Prathama (3rd) | datte | dāte | date |\n| Madhyama (2nd) | datse | dāthe | daddhve |\n|
